<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}.intro{background:var(--accent-soft);border-radius:8px;padding:10px 14px;font-size:.98rem;margin:0}
.steps .why2{grid-column:2;font-family:var(--body);font-size:.93rem;color:var(--muted);border-left:3px solid var(--line);padding-left:10px}
.steps li.now .st{color:var(--ink)}
.tip{background:var(--kw-bg);color:var(--kw-ink);border-radius:8px;padding:10px 14px;font-size:.95rem;margin:0}
.tip mark.kw{background:transparent;padding:0;text-decoration:underline}
.wk-split{display:grid;grid-template-columns:minmax(0,1fr) minmax(250px,330px);grid-template-areas:"steps board";gap:18px;align-items:start}
.wk-split .steps{grid-area:steps}
.wk-split .board{grid-area:board;position:sticky;top:150px;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0;overflow-x:auto}
@media (max-width:700px){.wk-split{grid-template-columns:minmax(0,1fr);grid-template-areas:"board" "steps"}.wk-split .board{top:118px;z-index:2}}
.wb{border-collapse:collapse;font-size:.88rem;width:100%}
.wb th,.wb td{border:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top;background:var(--card)}
.wb th{color:var(--muted);font-weight:400;white-space:nowrap;width:1%}
.wb td{font-family:var(--mono);overflow-wrap:anywhere}
.wb td.q{color:var(--muted);font-weight:400}
.wb td.fill{background:var(--good-soft);color:var(--good);font-weight:700}
.wb tr.cur th,.wb tr.cur td{outline:2px solid var(--hot);outline-offset:-2px}
.bnote{font-size:.9rem;margin:0}
.tabwrap{display:flex;align-items:center;gap:6px;min-width:0}
.tabwrap .tabs{flex:1;min-width:0;scroll-behavior:smooth}
.tabarrow{flex:0 0 auto;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:1.3rem;line-height:1;display:grid;place-items:center;padding:0 0 3px;cursor:pointer}
.tabarrow:hover{border-color:var(--accent);color:var(--accent)}
.tabarrow[hidden]{display:none}
</style>
<title>Physics Term Exam Pack</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: lab-notebook study app — sticky chapter bar, one column of working cards on a faint graph-paper ground */
:root{
  --paper:#EEF3F6; --card:#FFFFFF; --ink:#132235; --muted:#56687C; --line:#D3DDE6; --grid:rgba(19,34,53,.045);
  --accent:#0A6C96; --accent-soft:#E1F0F7; --hot:#D2470E; --hot-soft:#FCE9E0;
  --kw-bg:#FFE45C; --kw-ink:#132235;
  --good:#2B8A3E; --good-soft:#E3F4E6; --bad:#C92A2A; --bad-soft:#FBE4E4;
  --water:#BFE0F0; --stone:#9AA6B2;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0E1620; --card:#16212D; --ink:#E5EDF4; --muted:#93A4B6; --line:#2A3949; --grid:rgba(229,237,244,.035);
  --accent:#5DB8E2; --accent-soft:#16344A; --hot:#FF8C55; --hot-soft:#3E2216;
  --kw-bg:#6B5A00; --kw-ink:#FFF3B0;
  --good:#69DB7C; --good-soft:#173322; --bad:#FF8787; --bad-soft:#3D1C1C;
  --water:#1E4B66; --stone:#6C7A88; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0E1620; --card:#16212D; --ink:#E5EDF4; --muted:#93A4B6; --line:#2A3949; --grid:rgba(229,237,244,.035);
  --accent:#5DB8E2; --accent-soft:#16344A; --hot:#FF8C55; --hot-soft:#3E2216;
  --kw-bg:#6B5A00; --kw-ink:#FFF3B0;
  --good:#69DB7C; --good-soft:#173322; --bad:#FF8787; --bad-soft:#3D1C1C;
  --water:#1E4B66; --stone:#6C7A88; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px}
.wrap{max-width:900px;margin:0 auto;padding-inline:16px;padding-block:0 64px}
h1,h2,h3{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0}
h2{font-size:1.6rem;font-weight:800}
h3{font-size:1.15rem;font-weight:600}
p{margin:0}
mark.kw{background:var(--kw-bg);color:var(--kw-ink);padding:0 .2em;border-radius:3px;font-weight:700;box-decoration-break:clone;-webkit-box-decoration-break:clone}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--paper);border-bottom:1px solid var(--line)}
.top .wrap{padding-block:12px 10px;display:flex;flex-direction:column;gap:10px}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand h1{font-size:1.35rem;font-weight:800;letter-spacing:-.01em}
.brand h1 span{color:var(--accent)}
.examdate{font-family:var(--mono);font-size:.78rem;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 16px;font-weight:700;font-size:.95rem}
.tab small{font-family:var(--mono);font-weight:400;color:var(--muted);margin-right:6px;font-size:.75rem}
.tab[aria-selected="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tab[aria-selected="true"] small{color:inherit;opacity:.7}

.sub{display:flex;gap:4px;flex-wrap:wrap;margin-block:20px 18px;border-bottom:2px solid var(--line)}
.subtab{border:0;background:none;padding:10px 12px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px}
.subtab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}

.chhead{display:flex;flex-direction:column;gap:6px;margin-top:22px}
.eyebrow{font-family:var(--mono);font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.lede{color:var(--muted);max-width:62ch}

.stack{display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px 20px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px}
.formula{font-family:var(--mono);font-size:1.15rem;font-weight:600;background:var(--accent-soft);color:var(--ink);border-radius:8px;padding:10px 14px;align-self:flex-start;max-width:100%;overflow-x:auto}
.mistakes{background:var(--hot-soft);border-color:transparent}
.mistakes h3{color:var(--hot)}
.legend{display:flex;gap:10px;align-items:center;font-size:.9rem;color:var(--muted);flex-wrap:wrap}

figure{margin:0;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px}
figure .svgbox{overflow-x:auto}
figure svg{display:block;width:100%;min-width:420px;height:auto}
figcaption{font-size:.95rem;color:var(--ink)}
svg .ln{stroke:var(--ink);stroke-width:2;fill:none}
svg .thin{stroke:var(--muted);stroke-width:1}
svg .tick{stroke:var(--muted);stroke-width:1.2}
svg .glass{stroke:var(--ink);stroke-width:2;fill:none}
svg .water{fill:var(--water)}
svg .stone{fill:var(--stone);stroke:var(--ink);stroke-width:1.5}
svg .acc{stroke:var(--accent);stroke-width:2.5;fill:none}
svg .hotl{stroke:var(--hot);stroke-width:2.5;fill:none}
svg .accf{fill:var(--accent)}
svg .hotf{fill:var(--hot)}
svg .inkf{fill:var(--ink)}
svg .cardf{fill:var(--card)}
svg .part{fill:var(--card);stroke:var(--ink);stroke-width:1.6}
svg .halo{fill:none;stroke:var(--hot);stroke-width:1;stroke-dasharray:2 3}
svg text{fill:var(--ink);font-family:var(--body);font-size:13px}
svg .lbl{font-weight:700}
svg .big{font-family:var(--display);font-size:42px;font-weight:800;text-anchor:middle}
svg .mid{text-anchor:middle}
svg .end{text-anchor:end}
svg .mut{fill:var(--muted)}
svg .acct{fill:var(--accent);font-weight:700}
svg .hott{fill:var(--hot);font-weight:700}
svg .scr{fill:var(--accent-soft);stroke:var(--line)}

/* worked examples */
.q{font-weight:700}
.steps{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px;counter-reset:s}
.steps li{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:baseline;counter-increment:s}
.steps li::before{content:counter(s);font-family:var(--mono);font-size:.8rem;font-weight:600;width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--card);display:grid;place-items:center;grid-row:span 2}
.steps .sl{font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.steps .st{font-family:var(--mono);font-size:1rem;min-width:0;overflow-wrap:anywhere}
.steps li.final .st{font-weight:700;color:var(--good)}
.steps .prose{font-family:var(--body)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:9px 16px;font-weight:700}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--card)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:default}

/* drill */
.drillq{font-size:1.1rem}
.answer{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.answer input{font:inherit;font-family:var(--mono);font-size:1.1rem;padding:9px 12px;border:2px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);width:11ch}
.unit{font-family:var(--mono);color:var(--muted)}
.fb{border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.fb.ok{background:var(--good-soft)}
.fb.no{background:var(--bad-soft)}
.fb .verdict{font-weight:700}
.fb.ok .verdict{color:var(--good)}
.fb.no .verdict{color:var(--bad)}
.stat{font-family:var(--mono);font-size:.85rem;color:var(--muted)}

/* quiz */
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:8px}
.opt{text-align:left;border:2px solid var(--line);background:var(--paper);border-radius:8px;padding:10px 14px;font-weight:400}
.opt.right{border-color:var(--good);background:var(--good-soft);font-weight:700}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.why{font-size:.95rem;border-left:3px solid var(--accent);padding-left:12px}
.scorebar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.big-score{font-family:var(--display);font-size:1.8rem;font-weight:800}

/* exam */
.qhead{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.marks{font-family:var(--mono);font-size:.85rem;color:var(--muted);white-space:nowrap}
.ms{display:flex;flex-direction:column;gap:6px}
.ms-intro{font-size:.9rem;color:var(--muted)}
.point{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:10px 12px;font-weight:400}
.point .box{width:24px;height:24px;border:2px solid var(--muted);border-radius:6px;display:grid;place-items:center;font-weight:700;color:var(--card)}
.point[aria-pressed="true"]{border-color:var(--good)}
.point[aria-pressed="true"] .box{background:var(--good);border-color:var(--good)}
.got{font-family:var(--mono);font-weight:600}
.note{font-size:.9rem;color:var(--muted)}

/* start */
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:14px}
.prog{display:flex;flex-direction:column;gap:8px}
.bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.bar > i{display:block;height:100%;background:var(--accent);border-radius:5px}
.pl{display:flex;justify-content:space-between;font-size:.9rem}
.pl span:last-child{font-family:var(--mono);color:var(--muted)}
.cw{display:grid;grid-template-columns:auto 1fr;gap:6px 14px}
.cw dt{font-weight:700;color:var(--accent)}
.cw dd{margin:0}
.plan{display:flex;flex-direction:column;gap:0;border-left:2px solid var(--line);margin-left:6px}
.plan div{position:relative;padding:0 0 12px 18px}
.plan div::before{content:"";position:absolute;left:-7px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--card);border:2px solid var(--accent)}
.plan b{font-family:var(--mono);font-size:.82rem;color:var(--muted);display:block;font-weight:600}

.timer{font-family:var(--mono);font-size:2.2rem;font-weight:600;font-variant-numeric:tabular-nums}
.timer.low{color:var(--hot)}
a{color:var(--accent)}
@media (prefers-reduced-motion: no-preference){.fadein{animation:fi .25s ease-out}@keyframes fi{from{transform:translateY(4px)}to{transform:none}}}
</style>

</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand">
      <h1>Physics <span>Term Exam</span> Pack</h1>
      <a href="./" class="examdate" style="text-decoration:none">← All subjects</a>
      <div class="examdate">Science exam · Mon 5 Oct · 1 h 30</div>
    </div>
    <div class="tabwrap"><button class="tabarrow" id="tabL" type="button" aria-label="Scroll chapters left" hidden>&#8249;</button><nav class="tabs" role="tablist" id="tabs"></nav><button class="tabarrow" id="tabR" type="button" aria-label="Scroll chapters right">&#8250;</button></div>
  </div>
</header>
<main class="wrap" id="view"></main>

<script>
/* ---------- helpers ---------- */
const fmt = s => String(s).replace(/==(.+?)==/g,'<mark class="kw">$1</mark>').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
const pick = a => a[Math.floor(Math.random()*a.length)];
const rint = (a,b) => a + Math.floor(Math.random()*(b-a+1));
const num = x => { const r = Math.round(x*100)/100; return String(r); };
let store = {};
try { store = JSON.parse(localStorage.getItem('physpack-v1') || '{}') || {}; } catch(e) { store = {}; }
store.ticks = store.ticks || {}; store.quiz = store.quiz || {}; store.drill = store.drill || {};
const save = () => { try { localStorage.setItem('physpack-v1', JSON.stringify(store)); } catch(e) {} };

/* ---------- diagrams ---------- */
function arrowDefs(id){
  return `<defs>
  <marker id="a-${id}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="inkf"/></marker>
  <marker id="b-${id}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="accf"/></marker>
  <marker id="h-${id}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="hotf"/></marker></defs>`;
}
function svgTriangle(){
  return `<svg viewBox="0 0 460 210" role="img" aria-label="Formula triangle for density">
  <polygon points="150,12 278,190 22,190" class="ln"/>
  <line x1="78" y1="112" x2="222" y2="112" class="ln"/><line x1="150" y1="112" x2="150" y2="190" class="ln"/>
  <text x="150" y="95" class="big">m</text><text x="104" y="172" class="big">ρ</text><text x="196" y="172" class="big">V</text>
  <text x="300" y="60" class="lbl">Cover what you want:</text>
  <text x="300" y="92" style="font-family:var(--mono)">ρ = m ÷ V</text>
  <text x="300" y="122" style="font-family:var(--mono)">m = ρ × V</text>
  <text x="300" y="152" style="font-family:var(--mono)">V = m ÷ ρ</text></svg>`;
}
function svgDisplacement(){
  const cyl = (x, level, stone) => {
    let s = `<rect x="${x+2}" y="${level}" width="66" height="${226-level}" class="water"/>`;
    s += `<path d="M${x+2} ${level-5} Q${x+35} ${level+7} ${x+68} ${level-5}" class="acc"/>`;
    for (let y = 56; y <= 216; y += 16) s += `<line x1="${x}" y1="${y}" x2="${x+(y%32===24?18:10)}" y2="${y}" class="tick"/>`;
    s += `<path d="M${x} 40 V228 Q${x} 232 ${x+4} 232 H${x+66} Q${x+70} 232 ${x+70} 228 V40" class="glass"/>`;
    if (stone) s += `<line x1="${x+35}" y1="20" x2="${x+35}" y2="206" class="thin"/><path d="M${x+16} 224 q4 -24 22 -20 q18 4 12 20 z" class="stone"/>`;
    return s;
  };
  return `<svg viewBox="0 0 470 300" role="img" aria-label="Displacement method with a measuring cylinder">${arrowDefs('d')}
  ${cyl(70,130,false)}${cyl(300,96,true)}
  <line x1="152" y1="130" x2="200" y2="130" stroke-dasharray="4 4" class="thin"/>
  <text x="156" y="152" class="mut">eye level with</text><text x="156" y="168" class="mut">bottom of meniscus</text>
  <path d="M170 70 C 220 40, 260 40, 290 64" class="ln" marker-end="url(#a-d)"/>
  <text x="230" y="36" class="mid lbl">lower stone in gently</text>
  <text x="105" y="256" class="mid lbl">Initial</text><text x="105" y="274" class="mid" style="font-family:var(--mono)">50 cm³</text>
  <text x="335" y="256" class="mid lbl">Final</text><text x="335" y="274" class="mid" style="font-family:var(--mono)">72 cm³</text>
  <text x="235" y="296" class="mid acct">Volume of stone = 72 − 50 = 22 cm³</text></svg>`;
}
function svgEureka(){
  return `<svg viewBox="0 0 570 250" role="img" aria-label="Displacement can">${arrowDefs('e')}
  <rect x="62" y="90" width="136" height="128" class="water"/>
  <path d="M60 50 V220 H200 V50" class="glass"/>
  <path d="M200 88 L262 108" class="glass"/><path d="M200 98 L258 116" class="glass"/>
  <path d="M262 112 Q 268 140 272 168" class="acc" stroke-dasharray="3 5"/>
  <rect x="250" y="${168+14}" width="48" height="${226-182}" class="water"/>
  <path d="M248 160 V226 H300 V160" class="glass"/>
  <line x1="130" y1="10" x2="130" y2="160" class="thin"/><path d="M110 178 q4 -24 22 -20 q18 4 12 20 z" class="stone"/>
  <text x="130" y="244" class="mid lbl">displacement (eureka) can</text>
  <text x="318" y="190">overflow water</text><text x="318" y="206">collected and measured</text>
  <text x="318" y="236" class="acct">volume of water = volume of object</text></svg>`;
}
function svgConduction(){
  let s = `<svg viewBox="0 0 480 230" role="img" aria-label="Conduction in a metal bar">${arrowDefs('c')}
  <rect x="60" y="40" width="380" height="120" rx="6" class="ln"/>`;
  for (let r = 0; r < 3; r++) for (let c = 0; c < 10; c++) {
    const x = 84 + c*37, y = 68 + r*32;
    if (c < 5) s += `<circle cx="${x}" cy="${y}" r="${10 + (5-c)*1.6}" class="halo"/>`;
    s += `<circle cx="${x}" cy="${y}" r="8" class="part"/>`;
  }
  [[110,84],[190,116],[260,84],[330,116],[400,84]].forEach(([x,y]) => {
    s += `<line x1="${x-16}" y1="${y}" x2="${x+10}" y2="${y}" class="acc" marker-end="url(#b-c)"/><circle cx="${x-18}" cy="${y}" r="3.5" class="accf"/>`;
  });
  s += `<path d="M20 175 q10 -30 20 -40 q-2 18 8 22 q4 -12 2 -22 q14 14 12 40 q-6 14 -22 14 q-20 0 -20 -14z" class="hotf"/>
  <text x="60" y="28" class="hott">HOT end</text><text x="440" y="28" class="end acct">cold end</text>
  <text x="60" y="186">dashed rings: particles vibrate more, pass energy on by collisions</text>
  <circle cx="66" cy="208" r="3.5" class="accf"/><text x="76" y="212">free electrons carry energy along fast (metals only)</text></svg>`;
  return s;
}
function svgConvection(){
  return `<svg viewBox="0 0 480 300" role="img" aria-label="Convection current in a beaker">${arrowDefs('v')}
  <rect x="142" y="70" width="196" height="178" class="water"/>
  <path d="M140 40 V250 H340 V40" class="glass"/>
  <path d="M175 226 C 165 180, 165 140, 180 108" class="hotl" marker-end="url(#h-v)"/>
  <path d="M195 92 C 230 82, 270 82, 296 96" class="hotl" marker-end="url(#h-v)"/>
  <path d="M310 112 C 322 150, 322 190, 306 220" class="acc" marker-end="url(#b-v)"/>

function svgWave(){

  [[110,'C'],[290,'C'],[470,'C']].forEach(([x,t]) => s += `<text x="${x}" y="30" class="mid acct">${t}</text>`);

function svgScope(){
  const panel = (x, y, amp, cyc, label) => {
    let s = `<rect x="${x}" y="${y}" width="250" height="130" rx="6" class="scr"/>`;
    for (let i = 1; i < 10; i++) s += `<line x1="${x+i*25}" y1="${y}" x2="${x+i*25}" y2="${y+130}" class="thin" opacity=".35"/>`;
    for (let j = 1; j < 6; j++) s += `<line x1="${x}" y1="${y+j*21.67}" x2="${x+250}" y2="${y+j*21.67}" class="thin" opacity=".35"/>`;
    let d = ''; for (let k = 0; k <= 250; k += 2) { const yy = y + 65 - amp*Math.sin(2*Math.PI*cyc*k/250); d += (k ? 'L' : 'M') + (x+k) + ' ' + yy.toFixed(1); }
    s += `<path d="${d}" class="acc"/><text x="${x+125}" y="${y+152}" class="mid lbl">${label}</text>`;
    return s;
  };
  return `<svg viewBox="0 0 560 370" role="img" aria-label="Oscilloscope traces">
  ${panel(20,10,20,2,'Quiet + low pitch')}${panel(290,10,52,2,'Loud + low pitch')}
  ${panel(20,190,20,5,'Quiet + high pitch')}${panel(290,190,52,5,'Loud + high pitch')}</svg>`;
}

  { intro: 'Convection is a ==chain==: heated, ==expands==, ==less dense==, ==rises==, then cooler ==denser== fluid ==sinks==. Learn the order.', f: 'Keep the chain in order.',
    r: [['1','air heated and expands',0],['2','less dense, so it rises',1],['3','cooler, denser air sinks',2],['Result','convection current',3]],
    why: ['Start where the heat is. The air particles move faster and spread out.','Spread-out air is less dense than the air around it, so it rises.','Cooler air is denser. It sinks and takes the place of the rising air.','Name the process. Examiners want the words ==convection current==.'],
    tip: 'Never write "heat rises". Write that ==hot air is less dense so it rises==.' },
  { intro: 'A vacuum flask is built to stop ==all three== transfers: ==conduction==, ==convection== and ==radiation==. Match each part to one transfer.', f: 'One feature + one reason each time.',
    r: [['Vacuum','no particles: no conduction or convection',0],['Silvered walls','reflect IR: less radiation',1],['Stopper','insulator, stops convection',2],['Case / support','poor conductors',3]],
    why: ['Conduction and convection both need particles. A vacuum has none.','A vacuum cannot stop radiation, so shiny walls reflect the infrared back.','The top is the weak point. The stopper is an insulator and blocks air moving out.','Parts that touch the flask are poor conductors, so little energy leaks through them.'],
    tip: 'Write the feature and ==its reason== together: "silvered walls ==reflect infrared=="' },
  { intro: '==Light, shiny== surfaces ==reflect== infrared. ==Dull black== surfaces ==absorb== (and emit) it well.', f: 'Use the word infrared.',
    r: [['White surface','poor absorber, good reflector of IR',0],['Walls','absorb less energy from the Sun',1],['Inside','stays cooler',2]],
    why: ['Use the exact words: poor absorber, good reflector.','Link it to the Sun. Less infrared radiation is taken in by the walls.','End by answering the question that was asked.'],
    tip: 'Say ==infrared radiation==, not just "heat" or "light".' }
],
sound: [
  { intro: 'An echo is sound that ==travels there and back==. So the distance the sound travels is ==2 × the distance to the wall==.', f: 'v = d ÷ t',
    r: [['Distance to wall','170 m',-1],['Time','1.0 s',-1],['Total distance','2 × 170 = 340 m',0],['Speed v','340 ÷ 1.0 = 340 m/s',3]],
    why: ['The sound goes to the wall and comes back, so it travels twice the distance.','Speed is distance divided by time.','Use the total 340 m, not 170 m.','340 ÷ 1.0 = 340. Metres divided by seconds gives m/s.'],
    tip: 'Underline "echo" in the question. It is the signal to ==double (or halve)== the distance.' },
  { intro: 'Sonar is an echo, so the pulse goes ==down and back==. The distance you calculate is ==twice== the depth.', f: 'd = v × t',
    r: [['Speed v','1500 m/s',-1],['Time t','0.40 s',-1],['Total distance','1500 × 0.40 = 600 m',1],['Depth','600 ÷ 2 = 300 m',2]],
    why: ['We know speed and time and want distance, so d = v × t.','1500 × 0.40 = 600. But that is the whole journey.','The pulse went down AND back up. The sea depth is one way only, so divide by 2.','State the unit: metres.'],
    tip: 'This is the most common lost mark in the chapter. Always ==halve== for an echo.' },
  { intro: 'We ==see== lightning almost instantly but ==hear== thunder later. The delay is the time the ==sound== takes.', f: 'd = v × t',
    r: [['Speed of sound','340 m/s',-1],['Time','3.0 s',-1],['Distance','340 × 3.0 = 1020 m',3]],
    why: ['Light is nearly a million times faster than sound, so the time you measure is just the sound.','We want distance from speed and time.','340 × 3.0 = 1020.','1020 m is about 1 km. The storm is quite far away.'],
    tip: 'Do not halve here. There is ==no echo==, so the sound travels one way only.' },
  { intro: 'The ==wave equation== links three things: ==v = f × λ==. Speed (m/s), frequency (Hz), wavelength (m).', f: 'λ = v ÷ f',
    r: [['Speed v','340 m/s',-1],['Frequency f','680 Hz',-1],['Wavelength λ','340 ÷ 680 = 0.50 m',2]],
    why: ['v = f × λ. To get λ on its own, divide both sides by f.','Speed on top, frequency underneath.','340 ÷ 680 = 0.5. The unit is metres.'],
    tip: 'Write the rearranged formula ==λ = v ÷ f== before substituting.' },
  { intro: 'The ==period== T is the time for ==one== complete wave. The frequency is ==f = 1 ÷ T==.', f: 'f = 1 ÷ T',
    r: [['Squares per wave','4',-1],['Time-base','1 ms per square',-1],['Period T','4 × 1 = 4 ms = 0.004 s',0],['Frequency f','1 ÷ 0.004 = 250 Hz',2]],
    why: ['Time for one wave = squares × time per square. Change ms to s by dividing by 1000.','Frequency is waves per second, which is 1 divided by the time for one wave.','1 ÷ 0.004 = 250. The unit is hertz.'],
    tip: 'Convert ==ms to s== before you divide.' },
  { intro: 'Humans hear ==20 Hz to 20 000 Hz==. Anything above that is ==ultrasound==.', f: '1 kHz = 1000 Hz',
    r: [['Whistle','25 kHz',-1],['In hertz','25 × 1000 = 25 000 Hz',0],['Hearing range','20 Hz to 20 000 Hz',-1],['Verdict','above range: cannot hear',2]],
    why: ['1 kHz = 1000 Hz. Multiply by 1000 so the units match the hearing range.','Now both numbers are in hertz, so compare them. 25 000 is bigger than 20 000.','Name it: sound above 20 000 Hz is ultrasound.'],
    tip: 'Use the word ==ultrasound== in your answer.' }
]
});

function renderChapter(k){
  const c = CH[k];
  const subs = [['learn','Learn'],['diagrams','Diagrams'],['worked','Worked'],...(c.drill?[['drill','Drill']]:[]),['quiz','Quiz'],['exam','Exam Qs']];
  if (!subs.some(s => s[0] === sub)) sub = 'learn';
  let body = '';
  if (sub === 'learn') body = c.learn.map(card => `<div class="card"><h3>${card.h}</h3>${(card.p||[]).map(p=>`<p>${fmt(p)}</p>`).join('')}${card.list?`<ul>${card.list.map(l=>`<li>${fmt(l)}</li>`).join('')}</ul>`:''}${card.f?`<div class="formula">${card.f}</div>`:''}</div>`).join('')
      + `<div class="card mistakes"><h3>Mistakes that lose marks</h3><ul>${c.mistakes.map(l=>`<li>${fmt(l)}</li>`).join('')}</ul></div>`;
  if (sub === 'diagrams') body = c.diagrams.map(d => `<figure><div class="svgbox">${d.svg()}</div><figcaption>${fmt(d.cap)}</figcaption></figure>`).join('');
  if (sub === 'worked') body = `<div class="card"><h3>How to use these</h3><p class="note">Read the question and try it on paper. Then tap <b>Next step</b>. Each step shows the working, and the line underneath explains <b>why</b>. The table beside it fills in as you go. The exam tip appears at the end.</p></div>` + c.worked.map((w,i) => `<div class="card" data-worked="${i}"><span class="eyebrow">Example ${i+1}</span><p class="q">${w.q}</p>${w.intro ? `<p class="intro"><b>Key idea:</b> ${fmt(w.intro)}</p>` : ''}
      ${w.board0 ? '<div class="wk-split"><div class="board"><span class="eyebrow">Working table</span><div class="board-in">' + w.board0() + '</div></div>' : ''}<ol class="steps">${w.s.map((st,j) => `<li ${j===w.s.length-1?'class="final"':''} hidden><span class="sl">${st[0]}</span><span class="st${w.prose?' prose':''}">${fmt(st[1])}</span>${st[2] ? `<span class="why2">${fmt(st[2])}</span>` : ''}</li>`).join('')}</ol>${w.board0 ? '</div>' : ''}
      ${w.tip ? `<p class="tip" hidden><b>Exam tip:</b> ${fmt(w.tip)}</p>` : ''}
      <div class="row"><button class="btn primary" data-next>Next step</button><button class="btn ghost" data-all>Show all</button><button class="btn ghost" data-hide>Hide</button></div></div>`).join('');
  if (sub === 'drill') body = `<div class="card" id="drill"></div>`;
  if (sub === 'quiz') body = renderQuiz(k);
  if (sub === 'exam') { const [g,t] = examScore(k, c.exam);
    body = `<div class="card"><div class="scorebar"><div><h3>Exam-style questions</h3><p class="note">Answer on paper first. Then open the mark scheme and tick each point you wrote. Each tick = 1 mark.</p></div><div class="big-score" id="exscore">${g}/${t}</div></div></div>`
      + c.exam.map((q,i) => examCard(k+'-'+i, q, i)).join(''); }
  return `<div class="chhead fadein"><span class="eyebrow">${c.code} · Physics</span><h2>${c.name}</h2><p class="lede">${c.lede}</p></div>
  <nav class="sub" role="tablist">${subs.map(([s,n]) => `<button class="subtab" role="tab" aria-selected="${s===sub}" data-sub="${s}">${n}</button>`).join('')}</nav>
  <div class="stack fadein">${body}</div>`;
}

function examCard(key, q, i){
  const ticks = store.ticks[key] || [];
  const open = store.ticks['open-'+key];
  return `<div class="card" data-exam="${key}" data-max="${q.m}"><div class="qhead"><span class="eyebrow">Question ${i+1}</span><span class="marks">[${q.m} mark${q.m>1?'s':''}]</span></div>
    <p class="q">${q.q}</p>
    <div class="row"><button class="btn primary" data-ms>${open?'Hide mark scheme':'Show mark scheme'}</button><span class="got">${ticks.length?Math.min(ticks.length,q.m)+'/'+q.m:''}</span></div>
    <div class="ms" ${open?'':'hidden'}><p class="ms-intro">Tap each point you included${q.p.length>q.m?` (any ${q.m} of these ${q.p.length} points)`:''}:</p>
    ${q.p.map((p,j) => `<button class="point" aria-pressed="${ticks.includes(j)}" data-pt="${j}"><span class="box">✓</span><span>${fmt(p)}</span></button>`).join('')}</div></div>`;
}

function renderQuiz(k){
  const c = CH[k];
  return `<div class="card"><div class="scorebar"><div><h3>Quick quiz</h3><p class="note">Tap an answer. Best score is saved.</p></div><div class="big-score"><span id="qs">0</span>/${c.quiz.length}</div></div><div class="row"><button class="btn ghost" data-reset>Start again</button></div></div>`
    + c.quiz.map((q,i) => `<div class="card" data-quiz="${i}"><span class="eyebrow">Q${i+1}</span><p class="q">${q.q}</p>
      <div class="opts">${q.o.map((o,j) => `<button class="opt" data-o="${j}">${o}</button>`).join('')}</div><p class="why" hidden>${fmt(q.w)}</p></div>`).join('');
}

/* mock */
let timer = null, left = 35*60;
function renderMock(){
  const list = MOCK.map(([k,i]) => CH[k].exam[i]);
  const [g,t] = examScore('mock', list);
  return `<div class="chhead fadein"><span class="eyebrow">All three chapters</span><h2>Mini mock</h2>
    <p class="lede">${t} marks of structured questions, like your school paper. Set the timer, answer on paper, then mark yourself with the mark schemes.</p></div>
    <div class="stack" style="margin-top:20px">
    <div class="card"><div class="scorebar"><div class="timer" id="clock">${fmtTime(left)}</div><div class="big-score" id="exscore">${g}/${t}</div></div>
      <div class="row"><button class="btn primary" id="tgo">${timer?'Pause':'Start timer'}</button><button class="btn ghost" id="treset">Reset timer</button><button class="btn ghost" id="mnew">New mock (different questions)</button><button class="btn ghost" id="mclear">Clear my marks</button></div>
      <p class="note">35 minutes. About 1 minute per mark, plus time to check.</p></div>
    ${list.map((q,i) => examCard('mock-'+i, q, i)).join('')}</div>`;
}
const fmtTime = s => String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0');

/* ---------- binding ---------- */
let quizScore = 0;
function bindView(){
  const v = document.getElementById('view');
  quizScore = 0;
  if (cur !== 'start' && cur !== 'mock' && sub === 'drill') newDrill();
  if (cur === 'mock') {
    document.getElementById('tgo').onclick = () => {
      if (timer) { clearInterval(timer); timer = null; document.getElementById('tgo').textContent = 'Resume'; return; }
      document.getElementById('tgo').textContent = 'Pause';
      timer = setInterval(() => { left = Math.max(0, left-1); const c = document.getElementById('clock');
        if (c) { c.textContent = left ? fmtTime(left) : 'Time up'; c.classList.toggle('low', left < 300); }
        if (!left) { clearInterval(timer); timer = null; } }, 1000);
    };
    document.getElementById('treset').onclick = () => { clearInterval(timer); timer = null; left = 35*60; render(); };
    document.getElementById('mnew').onclick = () => { clearInterval(timer); timer = null; Object.keys(store.ticks).forEach(k => { if (k.includes('mock-')) delete store.ticks[k]; }); drawMock(); render(); };
    document.getElementById('mclear').onclick = () => { Object.keys(store.ticks).forEach(k => { if (k.includes('mock-')) delete store.ticks[k]; }); save(); render(); };
  }
}

document.getElementById('view').addEventListener('click', e => {
  const t = e.target;
  const st = t.closest('[data-sub]'); if (st) { sub = st.dataset.sub; render(); return; }

  const wk = t.closest('[data-worked]');
  if (wk) {
    const items = [...wk.querySelectorAll('.steps li')];
    if (t.closest('[data-next]')) { const n = items.find(li => li.hidden); if (n) n.hidden = false; }
    if (t.closest('[data-all]')) items.forEach(li => li.hidden = false);
    if (t.closest('[data-hide]')) items.forEach(li => li.hidden = true);
    const nb = wk.querySelector('[data-next]'); nb.disabled = !items.some(li => li.hidden); const tp = wk.querySelector('.tip'); if (tp) tp.hidden = items.some(li => li.hidden); updateBoard(wk, items);
    return;
  }

  const qz = t.closest('[data-quiz]');
  if (qz && t.closest('[data-o]') && !qz.dataset.done) {
    const q = CH[cur].quiz[+qz.dataset.quiz]; const j = +t.closest('[data-o]').dataset.o;
    qz.dataset.done = '1';
    qz.querySelectorAll('.opt').forEach((b,bi) => { b.disabled = true; if (bi === q.a) b.classList.add('right'); else if (bi === j) b.classList.add('wrong'); });
    qz.querySelector('.why').hidden = false;
    if (j === q.a) quizScore++;
    document.getElementById('qs').textContent = quizScore;
    if (quizScore > (store.quiz[cur] || 0)) { store.quiz[cur] = quizScore; save(); }
    return;
  }
  if (t.closest('[data-reset]')) { render(); return; }

  const ex = t.closest('[data-exam]');
  if (ex) {
    const key = ex.dataset.exam, max = +ex.dataset.max;
    if (t.closest('[data-ms]')) { const ms = ex.querySelector('.ms'); ms.hidden = !ms.hidden; store.ticks['open-'+key] = !ms.hidden; save(); t.closest('[data-ms]').textContent = ms.hidden ? 'Show mark scheme' : 'Hide mark scheme'; return; }
    const pt = t.closest('[data-pt]');
    if (pt) {
      const j = +pt.dataset.pt; let arr = store.ticks[key] || [];
      arr = arr.includes(j) ? arr.filter(x => x !== j) : [...arr, j];
      store.ticks[key] = arr; save();
      pt.setAttribute('aria-pressed', arr.includes(j));
      ex.querySelector('.got').textContent = arr.length ? Math.min(arr.length, max) + '/' + max : '';
      const list = cur === 'mock' ? MOCK.map(([k,i]) => CH[k].exam[i]) : CH[cur].exam;
      const [g,tt] = examScore(cur === 'mock' ? 'mock' : cur, list);
      const sc = document.getElementById('exscore'); if (sc) sc.textContent = g + '/' + tt;
    }
  }
});

/* drill */
let drillCur = null, streak = 0;
function newDrill(){
  const box = document.getElementById('drill'); if (!box) return;
  const gens = DRILLS[CH[cur].drill];
  drillCur = pick(gens)();
  const best = store.drill[cur] || 0;
  box.innerHTML = `<div class="scorebar"><span class="eyebrow">Calculation drill</span><span class="stat">streak ${streak} · best ${best}</span></div>
    <p class="drillq">${drillCur.q}</p>
    <form class="answer" id="dform"><label for="dans" class="note">Your answer</label><input id="dans" inputmode="decimal" autocomplete="off" placeholder="number"><span class="unit">${drillCur.unit}</span>
    <button class="btn primary" type="submit">Check</button><button class="btn ghost" type="button" id="dskip">New question</button></form>
    <div id="dfb"></div>
    <p class="note">Work it out on paper with all three steps, then type just the number. Answers within 2% count as correct.</p>`;
  document.getElementById('dform').onsubmit = ev => {
    ev.preventDefault();
    const raw = document.getElementById('dans').value.replace(',', '.').trim();
    const x = parseFloat(raw); if (isNaN(x)) { document.getElementById('dfb').innerHTML = `<div class="fb no"><span class="verdict">Type a number first.</span></div>`; return; }
    const ok = Math.abs(x - drillCur.ans) <= Math.abs(drillCur.ans)*0.02 + 1e-9;
    streak = ok ? streak + 1 : 0;
    if (streak > (store.drill[cur] || 0)) { store.drill[cur] = streak; save(); }
    document.getElementById('dfb').innerHTML = `<div class="fb ${ok?'ok':'no'}"><span class="verdict">${ok ? 'Correct!' : 'Not quite. The answer is ' + num(drillCur.ans) + ' ' + drillCur.unit + '.'}</span>
      <ol class="steps">${drillCur.s.map((s,j)=>`<li ${j===drillCur.s.length-1?'class="final"':''}><span class="sl">${s[0]}</span><span class="st">${s[1]}</span></li>`).join('')}</ol>
      <div class="row"><button class="btn primary" type="button" id="dnext">Next question</button></div></div>`;
    document.getElementById('dnext').onclick = newDrill;
    box.querySelector('.stat').textContent = `streak ${streak} · best ${store.drill[cur] || 0}`;
  };
  document.getElementById('dskip').onclick = () => { streak = 0; newDrill(); };
}

renderTabs(); render();

/* chapter tabs: arrow buttons, mouse wheel and keep the selected tab in view (for screens without touch) */
(function(){
  const nav = document.getElementById('tabs'), L = document.getElementById('tabL'), R = document.getElementById('tabR');
  const upd = () => { const m = nav.scrollWidth - nav.clientWidth; L.hidden = nav.scrollLeft <= 2; R.hidden = nav.scrollLeft >= m - 2; };
  L.onclick = () => nav.scrollBy({ left: -nav.clientWidth * .7, behavior: 'smooth' });
  R.onclick = () => nav.scrollBy({ left: nav.clientWidth * .7, behavior: 'smooth' });
  nav.addEventListener('scroll', upd); window.addEventListener('resize', upd);
  nav.addEventListener('wheel', e => { if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) { nav.scrollLeft += e.deltaY; e.preventDefault(); } }, { passive: false });
  new MutationObserver(() => { const a = nav.querySelector('[aria-selected="true"]'); if (a) a.scrollIntoView({ inline: 'center', block: 'nearest' }); upd(); }).observe(nav, { childList: true });
  const a = nav.querySelector('[aria-selected="true"]'); if (a) a.scrollIntoView({ inline: 'center', block: 'nearest' }); upd();
})();
</script>
