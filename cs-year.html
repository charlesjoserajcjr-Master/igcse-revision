<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Computer Science Full-Year Pack</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: lab-notebook study app — sticky chapter bar, one column of working cards on a faint graph-paper ground (shared with the Physics pack) */
:root{
  --paper:#EEF3F6; --card:#FFFFFF; --ink:#132235; --muted:#56687C; --line:#D3DDE6; --grid:rgba(19,34,53,.045);
  --accent:#0A6C96; --accent-soft:#E1F0F7; --hot:#D2470E; --hot-soft:#FCE9E0;
  --kw-bg:#FFE45C; --kw-ink:#132235;
  --good:#2B8A3E; --good-soft:#E3F4E6; --bad:#C92A2A; --bad-soft:#FBE4E4;
  --water:#DCEEF6; --cu:#4A9BD8; --copper:#B4602B; --zinc:#A3ADB8; --ppt:#F2E6A0; --noble:#E6F2E0;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root{
  --paper:#0E1620; --card:#16212D; --ink:#E5EDF4; --muted:#93A4B6; --line:#2A3949; --grid:rgba(229,237,244,.035);
  --accent:#5DB8E2; --accent-soft:#16344A; --hot:#FF8C55; --hot-soft:#3E2216;
  --kw-bg:#6B5A00; --kw-ink:#FFF3B0;
  --good:#69DB7C; --good-soft:#173322; --bad:#FF8787; --bad-soft:#3D1C1C;
  --water:#1B3A4D; --cu:#2F7DBA; --copper:#D07A40; --zinc:#6C7884; --ppt:#6B6232; --noble:#1D3322; color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px}
.wrap{max-width:900px;margin:0 auto;padding-inline:16px;padding-block:0 64px}
h1,h2,h3{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0}
h2{font-size:1.6rem;font-weight:800}
h3{font-size:1.15rem;font-weight:600}
p{margin:0}
mark.kw{background:var(--kw-bg);color:var(--kw-ink);padding:0 .2em;border-radius:3px;font-weight:700;box-decoration-break:clone;-webkit-box-decoration-break:clone}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.top{position:sticky;top:0;z-index:10;background:var(--paper);border-bottom:1px solid var(--line)}
.top .wrap{padding-block:12px 10px;display:flex;flex-direction:column;gap:10px}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand h1{font-size:1.35rem;font-weight:800;letter-spacing:-.01em}
.brand h1 span{color:var(--accent)}
.examdate{font-family:var(--mono);font-size:.78rem;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;text-decoration:none}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 16px;font-weight:700;font-size:.95rem}
.tab small{font-family:var(--mono);font-weight:400;color:var(--muted);margin-right:6px;font-size:.75rem}
.tab[aria-selected="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tab[aria-selected="true"] small{color:inherit;opacity:.7}
.sub{display:flex;gap:4px;flex-wrap:wrap;margin-block:20px 18px;border-bottom:2px solid var(--line)}
.subtab{border:0;background:none;padding:10px 12px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px}
.subtab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.chhead{display:flex;flex-direction:column;gap:6px;margin-top:22px}
.eyebrow{font-family:var(--mono);font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.lede{color:var(--muted);max-width:62ch}
.stack{display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px 20px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px}
.formula{font-family:var(--mono);font-size:1.05rem;font-weight:600;background:var(--accent-soft);color:var(--ink);border-radius:8px;padding:10px 14px;align-self:flex-start;max-width:100%;overflow-x:auto;display:flex;flex-direction:column;gap:4px}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;font-size:.95rem;min-width:100%}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:7px 12px 7px 0;text-align:left;vertical-align:top}
.tbl th{font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.mistakes{background:var(--hot-soft);border-color:transparent}
.mistakes h3{color:var(--hot)}
figure{margin:0;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px}
figure .svgbox{overflow-x:auto}
figure svg{display:block;width:100%;min-width:440px;height:auto}
figcaption{font-size:.95rem}
svg .ln{stroke:var(--ink);stroke-width:2;fill:none}
svg .thin{stroke:var(--muted);stroke-width:1;fill:none}
svg .glass{stroke:var(--ink);stroke-width:2;fill:none}
svg .acc{stroke:var(--accent);stroke-width:2.5;fill:none}
svg .hotl{stroke:var(--hot);stroke-width:2.5;fill:none}
svg .accf{fill:var(--accent)}
svg .hotf{fill:var(--hot)}
svg .inkf{fill:var(--ink)}
svg .cardf{fill:var(--card)}
svg .shell{fill:none;stroke:var(--muted);stroke-width:1.4}
svg .atom{fill:var(--card);stroke:var(--ink);stroke-width:1.8}
svg .nuc{fill:var(--accent-soft);stroke:var(--ink);stroke-width:1.4}
svg .cross{stroke:var(--hot);stroke-width:2.4}
svg .metal{fill:var(--accent-soft);stroke:var(--line)}
svg .nonmetal{fill:var(--card);stroke:var(--line)}
svg .noble{fill:var(--noble);stroke:var(--line)}
svg .cuf{fill:var(--cu)}
svg .waterf{fill:var(--water)}
svg .copperf{fill:var(--copper)}
svg .zincf{fill:var(--zinc);stroke:var(--ink);stroke-width:1.2}
svg .pptf{fill:var(--ppt);stroke:var(--ink);stroke-width:1}
svg text{fill:var(--ink);font-family:var(--body);font-size:13px}
svg .lbl{font-weight:700}
svg .sym{font-family:var(--display);font-weight:800;font-size:22px;text-anchor:middle}
svg .mid{text-anchor:middle}
svg .end{text-anchor:end}
svg .mut{fill:var(--muted)}
svg .acct{fill:var(--accent);font-weight:700}
svg .hott{fill:var(--hot);font-weight:700}
svg .mono{font-family:var(--mono)}
.q{font-weight:700}
.steps{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px;counter-reset:s}
.steps li{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:baseline;counter-increment:s}
.steps li::before{content:counter(s);font-family:var(--mono);font-size:.8rem;font-weight:600;width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--card);display:grid;place-items:center;grid-row:span 2}
.steps .sl{font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.steps .st{font-family:var(--mono);font-size:1rem;min-width:0;overflow-wrap:anywhere}
.steps li.final .st{font-weight:700;color:var(--good)}
.steps .prose{font-family:var(--body)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:9px 16px;font-weight:700}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--card)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:default}
.drillq{font-size:1.1rem}
.answer{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.answer input{font:inherit;font-family:var(--mono);font-size:1.1rem;padding:9px 12px;border:2px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);width:12ch}
.unit{font-family:var(--mono);color:var(--muted)}
.fb{border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.fb.ok{background:var(--good-soft)}
.fb.no{background:var(--bad-soft)}
.fb .verdict{font-weight:700}
.fb.ok .verdict{color:var(--good)}
.fb.no .verdict{color:var(--bad)}
.stat{font-family:var(--mono);font-size:.85rem;color:var(--muted)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:8px}
.opt{text-align:left;border:2px solid var(--line);background:var(--paper);border-radius:8px;padding:10px 14px;font-weight:400}
.opt.right{border-color:var(--good);background:var(--good-soft);font-weight:700}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.why{font-size:.95rem;border-left:3px solid var(--accent);padding-left:12px}
.scorebar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.big-score{font-family:var(--display);font-size:1.8rem;font-weight:800}
.qhead{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.marks{font-family:var(--mono);font-size:.85rem;color:var(--muted);white-space:nowrap}
.ms{display:flex;flex-direction:column;gap:6px}
.ms-intro{font-size:.9rem;color:var(--muted)}
.point{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:10px 12px;font-weight:400}
.point .box{width:24px;height:24px;border:2px solid var(--muted);border-radius:6px;display:grid;place-items:center;font-weight:700;color:var(--card)}
.point[aria-pressed="true"]{border-color:var(--good)}
.point[aria-pressed="true"] .box{background:var(--good);border-color:var(--good)}
.got{font-family:var(--mono);font-weight:600}
.note{font-size:.9rem;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:14px}
.prog{display:flex;flex-direction:column;gap:6px}
.bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.bar > i{display:block;height:100%;background:var(--accent);border-radius:5px}
.pl{display:flex;justify-content:space-between;font-size:.9rem;gap:8px}
.pl span:last-child{font-family:var(--mono);color:var(--muted);white-space:nowrap}
.cw{display:grid;grid-template-columns:auto 1fr;gap:6px 14px}
.cw dt{font-weight:700;color:var(--accent)}
.cw dd{margin:0}
.plan{display:flex;flex-direction:column;border-left:2px solid var(--line);margin-left:6px}
.plan div{position:relative;padding:0 0 12px 18px}
.plan div::before{content:"";position:absolute;left:-7px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--card);border:2px solid var(--accent)}
.plan b{font-family:var(--mono);font-size:.82rem;color:var(--muted);display:block;font-weight:600}
.timer{font-family:var(--mono);font-size:2.2rem;font-weight:600;font-variant-numeric:tabular-nums}
.timer.low{color:var(--hot)}
svg .gatebody{fill:var(--card);stroke:var(--ink);stroke-width:2}
svg .won{stroke:var(--accent);stroke-width:4;fill:none}
svg .woff{stroke:var(--muted);stroke-width:2;fill:none;stroke-dasharray:5 4}
svg .lampon{fill:var(--kw-bg)}
svg .hotsoft{fill:var(--hot-soft)}
svg .grn{stroke:var(--good);stroke-width:2.5;fill:none}
svg .grnt{fill:var(--good);font-weight:700}
.tt td,.tt th{font-family:var(--mono);text-align:center;padding:6px 12px}
.tt th{font-size:.8rem}
.tt .xcol{font-weight:700;color:var(--accent)}
.tt tr.hl td{background:var(--kw-bg);color:var(--kw-ink)}
.tcell{width:48px;height:38px;border:2px solid var(--line);border-radius:6px;background:var(--paper);font-family:var(--mono);font-weight:700;font-size:1.05rem}
.tcell.set{border-color:var(--accent)}
.tcell.right{border-color:var(--good);background:var(--good-soft)}
.tcell.wrong{border-color:var(--bad);background:var(--bad-soft)}
.btn.on{background:var(--kw-bg);color:var(--kw-ink);border-color:var(--kw-bg)}
.gtt{overflow-x:auto}
#gsvg svg{display:block;width:100%;max-width:540px;height:auto}
#csvg svg{display:block;width:100%;max-width:680px;height:auto}
#gsvg,#csvg{overflow-x:auto}
.intro{background:var(--accent-soft);border-radius:8px;padding:10px 14px;font-size:.98rem}
.steps .why2{grid-column:2;font-family:var(--body);font-size:.93rem;color:var(--muted);border-left:3px solid var(--line);padding-left:10px}
.steps li.final .st .tbl,.steps .st .tbl{margin-block:6px;color:var(--ink);font-weight:400}
.tip{background:var(--kw-bg);color:var(--kw-ink);border-radius:8px;padding:10px 14px;font-size:.95rem}
.tip mark.kw{background:transparent;padding:0;text-decoration:underline}
.tt.pv td,.tt.pv th{border:1px solid var(--line);min-width:2.6em}
.tt.pv td.one{background:var(--accent-soft);font-weight:700}
.tt td.lost{background:var(--hot-soft);color:var(--hot);font-weight:700}
.tt td.fill{background:var(--good-soft);color:var(--good);font-weight:700}
.tt.add th{color:var(--muted);font-weight:400;text-align:right}
.tt.add tr.carry td{color:var(--hot);font-size:.8rem;font-weight:700}
.tt.add tr.sum td{border-top:2px solid var(--ink);font-weight:700;color:var(--good)}
.tt.add td{padding:4px 9px}
.wk-split{display:grid;grid-template-columns:minmax(0,1fr) minmax(270px,340px);grid-template-areas:"steps board";gap:18px;align-items:start}
.wk-split .steps{grid-area:steps}
.wk-split .board{grid-area:board;position:sticky;top:150px;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0;overflow-x:auto}
@media (max-width:700px){.wk-split{grid-template-columns:minmax(0,1fr);grid-template-areas:"board" "steps"}.wk-split .board{top:118px;z-index:2}}
.bt{font-size:.82rem}
.bt td,.bt th{padding:4px 6px!important;min-width:1.9em!important}
.bt th.cur,.bt td.cur{outline:2px solid var(--hot);outline-offset:-2px}
.bt th.rl{text-align:left;color:var(--muted);font-weight:400;white-space:nowrap;border:0}
.bt td.par{box-shadow:inset 0 -3px 0 var(--hot)}
.bnote{font-size:.9rem;margin:0}
.nibs{display:flex;gap:8px;flex-wrap:wrap}
.nibs .curt{outline:2px solid var(--hot);border-radius:4px}
.hexd{font-weight:700;color:var(--accent)}
.units td{text-align:left!important;font-family:var(--mono)}
.units .how{color:var(--muted)}
.units tr.hl2 td,.units tr.hl2 th{background:var(--kw-bg);color:var(--kw-ink)}
.runs{display:flex;gap:6px;flex-wrap:wrap}
.run{display:flex;flex-direction:column;align-items:center;gap:2px;border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:var(--card)}
.run.done{background:var(--accent-soft)}
.run.curr{outline:2px solid var(--hot)}
.steps li.now .st{background:var(--kw-bg);color:var(--kw-ink);border-radius:4px;padding:0 4px}
a{color:var(--accent)}
@media (prefers-reduced-motion: no-preference){.fadein{animation:fi .25s ease-out}@keyframes fi{from{transform:translateY(4px)}to{transform:none}}}
.tabwrap{display:flex;align-items:center;gap:6px;min-width:0}
.tabwrap .tabs{flex:1;min-width:0;scroll-behavior:smooth}
.tabarrow{flex:0 0 auto;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:1.3rem;line-height:1;display:grid;place-items:center;padding:0 0 3px;cursor:pointer}
.tabarrow:hover{border-color:var(--accent);color:var(--accent)}
.tabarrow[hidden]{display:none}
.wb{border-collapse:collapse;font-size:.88rem;width:100%}
.wb th,.wb td{border:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top;background:var(--card)}
.wb th{color:var(--muted);font-weight:400;white-space:nowrap;width:1%}
.wb td{font-family:var(--mono);overflow-wrap:anywhere}
.wb td.q{color:var(--muted);font-weight:400}
.wb td.fill{background:var(--good-soft);color:var(--good);font-weight:700}
.wb tr.cur th,.wb tr.cur td{outline:2px solid var(--hot);outline-offset:-2px}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand">
      <h1>Computer Science <span>Full-Year</span> Pack</h1>
      <a href="./" class="examdate">← All subjects</a>
      <div class="examdate">Grade 8 · Whole syllabus</div>
    </div>
    <div class="tabwrap"><button class="tabarrow" id="tabL" type="button" aria-label="Scroll chapters left" hidden>&#8249;</button><nav class="tabs" role="tablist" id="tabs"></nav><button class="tabarrow" id="tabR" type="button" aria-label="Scroll chapters right">&#8250;</button></div>
  </div>
</header>
<main class="wrap" id="view"></main>

<script>
/* ---------- helpers ---------- */
const fmt = s => String(s).replace(/==(.+?)==/g,'<mark class="kw">$1</mark>').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
const pick = a => a[Math.floor(Math.random()*a.length)];
const rint = (a,b) => a + Math.floor(Math.random()*(b-a+1));
const shuffle = a => { const b = a.slice(); for (let i = b.length-1; i > 0; i--) { const j = Math.floor(Math.random()*(i+1)); [b[i],b[j]] = [b[j],b[i]]; } return b; };
const num = x => String(Math.round(x*100)/100);
const SUBS = '₀₁₂₃₄₅₆₇₈₉';
const sub = f => f.replace(/\d/g, d => SUBS[d]);
const unsub = f => f.replace(/[₀-₉]/g, d => String(d.charCodeAt(0) - 8320));
let store = {};
try { store = JSON.parse(localStorage.getItem('csyear-v1') || '{}') || {}; } catch(e) { store = {}; }
store.ticks = store.ticks || {}; store.quiz = store.quiz || {}; store.drill = store.drill || {};
const save = () => { try { localStorage.setItem('csyear-v1', JSON.stringify(store)); } catch(e) {} };

/* ---------- CS helpers ---------- */
const bin8 = n => (n & 255).toString(2).padStart(8, '0');
const nib = b => b.slice(0,4) + ' ' + b.slice(4);
const hex2 = n => n.toString(16).toUpperCase().padStart(2, '0');
const PV = [128,64,32,16,8,4,2,1];
const placeSum = n => PV.filter(p => n & p).join(' + ');
const G = { AND:(a,b)=>a&b, OR:(a,b)=>a|b, NOT:a=>1-a, NAND:(a,b)=>1-(a&b), NOR:(a,b)=>1-(a|b), XOR:(a,b)=>a^b };
const GDESC = { AND:'1 only when both inputs are 1', OR:'1 when at least one input is 1', NOT:'the opposite of the input', NAND:'0 only when both inputs are 1', NOR:'1 only when both inputs are 0', XOR:'1 when the inputs are different' };

/* ---------- diagram helpers ---------- */
function arrowDefs(id){
  return `<defs><marker id="a-${id}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="inkf"/></marker>
  <marker id="b-${id}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="accf"/></marker>
  <marker id="h-${id}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="hotf"/></marker></defs>`;
}
const cell = (x, y, w, h, t, cls = 'nonmetal', tcls = 'mono lbl') => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="4" class="${cls}" style="stroke:var(--muted)"/><text x="${x+w/2}" y="${y+h/2+5}" class="mid ${tcls}">${t}</text>`;
function gateShape(t, x, y){
  let s = '', ox, ins;
  if (t === 'AND' || t === 'NAND') { s = `<path d="M${x} ${y} H${x+28} A20 20 0 0 1 ${x+28} ${y+40} H${x} Z" class="gatebody"/>`; ox = x+48; ins = [[x,y+10],[x,y+30]]; }
  if (t === 'OR' || t === 'NOR' || t === 'XOR') { s = `<path d="M${x} ${y} Q${x+14} ${y+20} ${x} ${y+40} Q${x+36} ${y+40} ${x+52} ${y+20} Q${x+36} ${y} ${x} ${y} Z" class="gatebody"/>`; ox = x+52; ins = [[x+6,y+10],[x+6,y+30]];

function wkBoard(e, k){
  const rows = e.r.map(([lab, val, at]) => { const on = at <= k;
    return `<tr class="${at === k && k >= 0 ? 'cur' : ''}"><th>${lab}</th><td class="${on ? (at >= 0 ? 'fill' : '') : 'q'}">${on ? fmt(val) : '?'}</td></tr>`; }).join('');
  return `<table class="wb">${rows}</table>${e.f ? `<p class="bnote">${fmt(e.f)}</p>` : ''}`;

trans: {
  code: 'Ch 2', name: 'Data transmission',
  lede: 'Mostly describe-and-explain questions. Learn the packet parts, the transmission types and how each error check works, step by step.',
  learn: [
    { h: 'Packets', p: ['Data is ==broken into packets== before it is sent across a network.'],
      table: [['Part','Contains'],['header','==destination IP address==, ==source IP address==, ==packet number== (and packet size)'],['payload','the ==actual data=='],['trailer','an ==error check== (e.g. checksum / CRC) and an ==end-of-packet marker==']] },
    { h: 'Packet switching', list: ['Each packet is sent ==independently==.', '==Routers== choose the best route for each packet, so packets can take ==different routes==.', 'Packets may ==arrive out of order==.', 'At the destination they are ==reassembled in order using the packet numbers==.', 'Missing packets are ==requested again==.', 'Benefit: if one route is busy or broken, packets go another way.'] },
    { h: 'Direction of transmission', list: ['==Simplex==: data travels in ==one direction only==. e.g. computer → printer, TV broadcast.', '==Half-duplex==: ==both directions, but only one at a time==. e.g. walkie-talkie.', '==Full-duplex==: ==both directions at the same time==. e.g. phone call, broadband.'] },
    { h: 'Serial and parallel', list: ['==Serial==: bits sent ==one at a time== along a ==single wire==. ==Reliable over long distances==; ==no skewing==; cheaper cable. e.g. ==USB==.', '==Parallel==: ==several bits sent at the same time== along ==several wires==. ==Faster over short distances==; but bits can arrive at different times (==skewing==) over long cables. e.g. inside a computer.'] },
    { h: 'USB (Universal Serial Bus)', list: ['Uses ==serial== transmission.', 'Benefits: a ==universal standard== used by many devices; devices are ==detected automatically== and drivers installed; ==supplies power== to the device; backwards compatible.', 'Drawbacks: ==limited cable length== (about 5 m); older versions are slow.'] },
    { h: 'Why errors happen', list: ['==Interference== (e.g. electrical) can cause data to be ==lost==, ==gained== or ==changed== during transmission.'] },
    { h: 'Parity check', list: ['A ==parity bit== is added to each byte.', '==Even parity==: total number of 1s must be ==even==. ==Odd parity==: it must be ==odd==.', 'The receiver ==counts the 1s==. If the parity is wrong, an ==error is detected== and the data is resent.', 'Limitation: if ==two bits change== the count stays correct, so the error is ==not detected==. A single parity bit cannot show ==which== bit is wrong.', 'A ==parity block== (parity byte) can find the exact bit that changed.'] },
    { h: 'Checksum', list: ['The sender ==calculates a value from the data== using an algorithm and ==sends it with the data==.', 'The receiver ==recalculates== the value and ==compares== the two.', 'If they ==do not match==, there is an error and the data is ==resent==.'] },
    { h: 'Echo check', list: ['The receiver ==sends the data back== to the sender.', 'The sender ==compares== it with the original.', 'If different, the data is ==resent==.', 'Drawback: doubles the traffic, and you cannot tell if the error happened ==on the way there or back==.'] },
    { h: 'ARQ (Automatic Repeat reQuest)', list: ['The receiver sends a positive ==acknowledgement== when data arrives with no error.', 'The sender waits a set time: a ==timeout==.', 'If no acknowledgement arrives in time, the sender ==resends== the data automatically.'] },
    { h: 'Check digit', list: ['An extra digit ==calculated from the other digits== and added to the end of a number, e.g. ==barcodes== and ==ISBNs==.', 'Detects ==data entry errors== such as a wrong digit or two digits swapped (==transposed==).'] },
    { h: 'Encryption', list: ['Encryption ==scrambles data== (plaintext → ==ciphertext==) so if it is ==intercepted== it ==cannot be understood==.', 'It ==does not stop== the data being intercepted.', '==Symmetric==: the ==same key== encrypts and decrypts. The key must be ==shared securely==; if the key is intercepted, the data can be read.', '==Asymmetric==: a ==public key== (anyone can have it) encrypts; only the matching ==private key== (kept secret by the receiver) can decrypt.'] }
  ],
  mistakes: ['Saying the ==trailer== holds the IP addresses. They are in the ==header==.', 'Saying packets always arrive in order. They can ==arrive out of order==.', 'Mixing up half-duplex (==one at a time==) and full-duplex (==same time==).', 'Saying parity finds every error. It misses ==two-bit errors==.', 'Saying encryption “stops hackers getting the data”. It makes intercepted data ==meaningless==.', 'Mixing up echo check (==data sent back==) and ARQ (==acknowledgement + timeout==).'],
  diagrams: [
    { svg: svgPacket, cap: 'The three parts of a packet.' },
    { svg: svgSwitch, cap: 'Packet switching: three packets of the same file take three different routes.' },
    { svg: svgSerPar, cap: 'Serial vs parallel transmission.' },
    { svg: svgDuplex, cap: 'Simplex, half-duplex and full-duplex.' },
    { svg: svgParity, cap: 'An even parity check detecting a changed bit.' },
    { svg: svgEncrypt, cap: 'Symmetric and asymmetric encryption.' }
  ],
  worked: WK_TRANS,
  drill: 'trans',
  quiz: [
    { q: 'Which part of a packet holds the destination IP address?', o: ['header', 'payload', 'trailer', 'checksum'], a: 0, w: 'IP addresses and the packet number are in the ==header==.' },
    { q: 'What does the trailer contain?', o: ['the actual data', 'the source address', 'an error check and end-of-packet marker', 'the packet number'], a: 2, w: 'Trailer = ==error check== (checksum/CRC) + ==end of packet==.' },
    { q: 'Packets can arrive out of order because…', o: ['they are encrypted', 'they take different routes', 'they are too big', 'of parity errors'], a: 1, w: 'Routers send each packet the best way, so they take ==different routes==.' },
    { q: 'USB uses…', o: ['parallel transmission', 'serial transmission', 'simplex only', 'wireless'], a: 1, w: 'Universal ==Serial== Bus.' },
    { q: 'A walkie-talkie is an example of…', o: ['simplex', 'half-duplex', 'full-duplex', 'parallel'], a: 1, w: 'Both directions, ==one at a time==: half-duplex.' },
    { q: 'The main problem with parallel transmission over long distances is…', o: ['skewing', 'encryption', 'too few wires', 'no error checks'], a: 0, w: 'Bits arrive at different times: ==skewing==.' },
    { q: 'A parity check cannot detect…', o: ['a single changed bit', 'two bits that have changed', 'a lost bit', 'an odd count'], a: 1, w: 'Two changes keep the count even/odd, so ==two-bit errors== are missed.' },
    { q: 'In an echo check…', o: ['an acknowledgement is sent', 'the data is sent back to the sender to compare', 'a check digit is added', 'a key is used'], a: 1, w: 'The receiver ==sends the data back==; the sender compares.' },
    { q: 'ARQ uses…', o: ['a parity bit', 'an acknowledgement and a timeout', 'a public key', 'a check digit'], a: 1, w: '==Acknowledgement + timeout==; resend if no acknowledgement.' },
    { q: 'In asymmetric encryption, data is decrypted with…', o: ['the public key', 'the private key', 'the same key used to encrypt', 'a checksum'], a: 1, w: 'Encrypt with the ==public== key; decrypt with the ==private== key.' },
    { q: 'Encryption…', o: ['stops data being intercepted', 'makes intercepted data meaningless', 'detects errors', 'compresses data'], a: 1, w: 'It does ==not stop interception==; it makes the data ==unreadable==.' }
  ],
  exam: [
    { q: 'Describe the structure of a data packet.', m: 4, p: ['==Header== contains ==destination== and ==source IP addresses==.', 'Header also has the ==packet number==.', '==Payload== holds the ==actual data==.', '==Trailer== holds an ==error check== (checksum) / ==end-of-packet marker=='] },
    { q: 'Describe how data is sent across the internet using packet switching.', m: 4, p: ['Data is ==broken into packets==.', 'Each packet can take a ==different route==, chosen by ==routers==.', 'Packets may ==arrive out of order==.', 'They are ==reassembled using packet numbers== at the destination.', 'Missing packets are ==requested again==.'] },
    { q: 'Describe the difference between serial and parallel transmission, and explain why serial is used over long distances.', m: 3, p: ['Serial sends ==one bit at a time== down ==one wire==.', 'Parallel sends ==several bits at the same time== down ==several wires==.', 'Serial is used for long distances because there is ==no skewing== / bits arrive in order / less interference.'] },
    { q: 'Give three benefits of using a USB connection.', m: 3, p: ['==Universal standard== / works with many devices.', 'Device is ==detected automatically== / drivers installed automatically.', 'Can ==supply power== to the device.', 'Connector only fits ==one way== (cannot be connected wrongly) / backwards compatible.'] },
    { q: 'Explain how an odd parity check detects an error. State one limitation.', m: 4, p: ['The sender adds a ==parity bit== so the number of 1s is ==odd==.', 'The receiver ==counts the 1s== in each byte.', 'If the count is ==even==, an ==error is detected== and data is resent.', 'Limitation: it ==cannot detect two bits changing== / cannot find which bit is wrong.'] },
    { q: 'Describe how a checksum is used to detect errors.', m: 3, p: ['The sender ==calculates a value from the data== and sends it ==with the data==.', 'The receiver ==recalculates== the checksum.', 'If the two ==do not match==, there is an error and the data is ==resent==.'] },
    { q: 'Describe how Automatic Repeat reQuest (ARQ) works.', m: 3, p: ['The receiver sends an ==acknowledgement== when data is received correctly.', 'The sender waits for a ==timeout==.', 'If ==no acknowledgement== is received in time, the data is ==resent==.'] },
    { q: 'Explain the difference between symmetric and asymmetric encryption.', m: 4, p: ['Symmetric uses the ==same key== to encrypt and decrypt.', 'The key must be ==shared==, so it could be ==intercepted==.', 'Asymmetric uses a ==public key== to encrypt…', '…and a ==private key== (never shared) to decrypt.'] },
    { q: 'A system uses odd parity. The byte 11010110 is received. Has an error occurred? Explain your answer.', m: 2, p: ['The byte has ==five 1s==.', 'Five is ==odd==, so ==no error is detected==.'] }
  ]
},

logic: {

    { h: 'Truth tables', list: ['List ==every combination== of inputs. 2 inputs → ==4 rows==. 3 inputs → ==8 rows==.', 'Count up in binary down the rows: 000, 001, 010, 011, 100, 101, 110, 111.', 'Add a ==working column== for each part of the expression, then the final output X.'] },
    { h: 'Logic expressions', list: ['Cambridge writes expressions with words: X = (A AND B) OR NOT C.', 'Work out the ==brackets first==.', '==NOT== applies to the input or bracket ==straight after it==.'] },

hw: {
  code: 'Topic 3', name: 'Hardware',
  lede: 'What is inside a computer and how the CPU runs a program. Learn the fetch–decode–execute cycle in order.',
  learn: [
    { h: 'The CPU and the fetch–decode–execute cycle', list: ['The ==CPU (central processing unit)== runs program instructions. It has a ==control unit (CU)==, an ==arithmetic logic unit (ALU)== and ==registers==.', '==CU==: controls and ==decodes== instructions. ==ALU==: does ==calculations and logic==. ==Registers==: tiny, very fast storage inside the CPU.', '==PC== (program counter): address of the ==next instruction==. ==MAR==: address being used. ==MDR==: data being used. ==CIR==: the ==current instruction==. ==ACC==: ==results== of calculations.', '==Fetch==: PC → MAR; the instruction goes from ==RAM== to MDR and then to CIR; PC increases by 1. ==Decode==: the CU works out what to do. ==Execute==: the instruction is carried out.', 'Buses: ==address bus== (one way, CPU to memory), ==data bus== (two way), ==control bus==.'] },
    { h: 'CPU performance, cores and embedded systems', list: ['Performance depends on ==clock speed== (GHz, more cycles per second), ==number of cores== (more instructions at once) and ==cache size== (faster memory close to the CPU).', 'An ==embedded system== is a computer ==inside a device== with one dedicated job (washing machine, microwave, car engine control, central heating).', 'A ==general-purpose== computer can do many different jobs (laptop, tablet).'] },
    { h: 'Memory, storage and devices', table: [['Type', 'Examples', 'Key points'], ['RAM', 'main memory', 'volatile (loses data when off); read and write; holds running programs and data'], ['ROM', 'BIOS / boot instructions', 'non-volatile; read only; holds the start-up program'], ['Magnetic storage', 'hard disk drive (HDD)', 'large and cheap; has moving parts; slower; can be damaged by shock'], ['Optical storage', 'CD, DVD, Blu-ray', 'laser reads pits and lands; cheap, portable; low capacity; scratches'], ['Solid-state storage', 'SSD, USB flash, SD card', 'no moving parts; fast, quiet, durable; costs more per GB']] },
    { h: 'Input, output and sensors', list: ['==Input devices==: keyboard, mouse, touch screen, scanner, microphone, camera, ==sensors==.', '==Output devices==: monitor, printer, speaker, actuator, projector.', '==Sensors== measure physical quantities and send data to the computer: ==temperature, pressure, light, moisture, infrared (motion), magnetic field, sound==.', '==Virtual memory==: part of the hard drive or SSD used as extra RAM when RAM is full. It is ==slower== than real RAM.', '==Cloud storage== is data stored on remote servers over the internet: accessible anywhere, easy to share, but ==needs an internet connection== and has ==security and cost== concerns.'] }
  ],
  mistakes: ['Saying ==RAM is non-volatile== or ROM is volatile.', 'Saying the ==CPU stores== files. It processes; storage is separate.', 'Mixing up the ==order== of the cycle: fetch, decode, execute.', 'Saying ==more cores always doubles== the speed. It depends on the software.', 'Calling the ==hard drive RAM==. Primary memory is RAM and ROM.'],
  diagrams: [
    { svg: svgCPU, cap: 'Inside the CPU: ==CU, ALU and registers== connected to ==RAM== by buses.' },
    { svg: svgFDE, cap: 'The ==fetch–decode–execute== cycle repeats for every instruction.' }
  ],
  worked: [
    W('An instruction is stored at address 100. Describe what happens during the FETCH stage.', 'The ==PC== holds the address of the next instruction. Follow it through the ==registers==.', 'Learn the order: PC, MAR, MDR, CIR.', 'PC → MAR → (RAM) → MDR → CIR',
      [['PC holds the address', 'PC = 100', 'The program counter says which instruction comes next.'], ['Address copied to MAR', 'MAR = 100', 'The memory address register tells RAM where to look.'], ['Instruction fetched from RAM', 'MDR = the instruction', 'The data is copied from address 100 into the memory data register.'], ['Instruction copied to CIR', 'CIR = the instruction', 'The current instruction register holds it for decoding.'], ['PC incremented', 'PC = 101', 'It now points to the next instruction.']],
      [['PC', '100', 0], ['MAR', '100', 1], ['MDR', 'the instruction', 2], ['CIR', 'the instruction', 3], ['PC after', '101', 4]]),
    W('Compare RAM and ROM.', 'Compare ==volatile==, ==read/write== and ==contents==.', 'Give a comparison for each, not just a description.', 'Volatile v non-volatile',
      [['Volatility', 'RAM is volatile (loses data when the power is off). ROM is non-volatile.', ''], ['Read and write', 'RAM can be read and written. ROM can only be read.', ''], ['What each holds', 'RAM holds the programs and data currently in use. ROM holds the boot-up (start-up) instructions.', ''], ['Size', 'RAM is larger and can be added. ROM is small.', '']],
      [['Volatility', 'RAM yes, ROM no', 0], ['Read/write', 'RAM both, ROM read only', 1], ['Contents', 'running programs v boot-up', 2]], true),
    W('A photographer needs to take thousands of photos on a mountain. Choose the best storage device and explain why.', 'Think: ==durable==, ==portable==, ==large capacity==, ==no moving parts==.', 'Give at least two reasons and compare with another type.', 'Solid-state',
      [['Choice', 'SD card (solid-state storage)', ''], ['Why: no moving parts', 'It is not damaged by knocks or vibration', 'A hard disk could be damaged.'], ['Why: portable', 'It is small and light', ''], ['Why: capacity', 'It can hold thousands of photos', 'Cards can be swapped when full.']],
      [['Choice', 'SD card', 0], ['No moving parts', 'durable', 1], ['Portable', 'small, light', 2], ['Capacity', 'thousands of photos', 3]], true),
    W('Name a suitable sensor for (a) an automatic door (b) a greenhouse heater (c) a burglar alarm.', 'Match the ==quantity measured== to the ==sensor==.', 'Use the sensor list.', 'Quantity to sensor',
      [['(a) Automatic door', 'Infrared (motion) sensor or pressure sensor', 'Detects a person approaching.'], ['(b) Greenhouse heater', 'Temperature sensor', 'Switches the heater on when it is too cold.'], ['(c) Burglar alarm', 'Infrared (motion) sensor, or a magnetic sensor on doors and windows', 'Detects movement or opening.']],
      [['Door', 'infrared / pressure', 0], ['Greenhouse', 'temperature', 1], ['Alarm', 'infrared / magnetic', 2]], true),

      [['Core', 'runs the cycle', 0], ['More cores', 'more instructions at once', 1], ['Limit', 'software must use them', 2]], true),
    W('Give two differences between an embedded system and a general-purpose computer.', 'Think about the ==job== and ==where it is==.', 'Give an example of each.', 'One job v many jobs',
      [['Purpose', 'An embedded system does one dedicated job. A general-purpose computer does many jobs.', ''], ['Where', 'An embedded system is built into another device. A general-purpose computer is a stand-alone device.', ''], ['Examples', 'Washing machine controller v a laptop', '']],
      [['Purpose', 'one job v many', 0], ['Where', 'inside a device v stand-alone', 1], ['Examples', 'washing machine v laptop', 2]], true)
  ],
  drill: 'hw',
  quiz: [
    { q: 'Which register holds the address of the next instruction?', o: ['MAR', 'MDR', 'PC', 'CIR'], a: 2, w: 'The ==program counter (PC)==.' },
    { q: 'Which type of memory is volatile?', o: ['ROM', 'RAM', 'SSD', 'BIOS'], a: 1, w: '==RAM== loses its data when the power is off.' },
    { q: 'The ALU…', o: ['stores files', 'does calculations and logic', 'controls the buses', 'displays output'], a: 1, w: 'It does ==arithmetic and logic==.' },
    { q: 'Which storage has no moving parts?', o: ['HDD', 'DVD', 'SSD', 'floppy disk'], a: 2, w: '==SSD== (solid state).' },
    { q: 'Which is the correct order?', o: ['execute, fetch, decode', 'fetch, decode, execute', 'decode, fetch, execute', 'fetch, execute, decode'], a: 1, w: '==Fetch, decode, execute==.' },
    { q: 'An embedded system…', o: ['does many jobs', 'is built into a device for one job', 'is a laptop', 'is a server'], a: 1, w: '==One dedicated job== inside a device.' }
  ],
  exam: [
    { q: 'Describe the purpose of the control unit and the ALU in a CPU.', m: 2,
      p: ['The ==control unit== controls the processing and decodes instructions (sends signals)', 'The ==ALU== carries out arithmetic calculations and logical (comparison) operations'] },
    { q: 'Describe the fetch stage of the fetch–decode–execute cycle.', m: 4,
      p: ['The address of the next instruction in the ==PC== is copied to the ==MAR==', 'The instruction at that address is copied from ==RAM to the MDR==', 'The instruction is copied to the ==CIR==', 'The ==PC is incremented== (increased by 1)'] },
    { q: 'Give three differences between a hard disk drive and a solid-state drive.', m: 3,
      p: ['An HDD has ==moving parts==; an SSD has none', 'An SSD is ==faster== / more durable / quieter / uses less power', 'An HDD is ==cheaper per GB== (more capacity for the price)'] }
  ]
},
sw: {
  code: 'Topic 4', name: 'Software',
  lede: 'System and application software, translators and what an operating system does.',
  learn: [
    { h: 'System software and the operating system', list: ['==System software== runs the computer: the ==operating system (OS)== and ==utility programs==. ==Application software== does tasks for the user (word processor, browser, game).', 'The OS ==manages== the ==hardware and software==. Functions: ==managing files==, ==managing memory==, ==multitasking== (running several programs), ==controlling peripherals== (using device drivers), ==providing a user interface==, ==security== (user accounts, passwords) and ==error handling==.', 'A ==device driver== lets the OS communicate with a hardware device.', 'A ==user interface== can be a ==GUI== (windows, icons, menus, pointer) or a ==command line (CLI)== (typed commands).'] },
    { h: 'Utility software', table: [['Utility', 'What it does'], ['antivirus', 'finds and removes malware; scans files'], ['firewall', 'checks network traffic and blocks unauthorised access'], ['disk defragmenter', 'puts the parts of files together on an HDD for faster access (not needed for SSD)'], ['backup', 'copies files so they can be restored if lost'], ['compression', 'makes files smaller to save space or send faster'], ['disk formatter / cleanup', 'prepares a disk for use; deletes unwanted files']] },
    { h: 'Programming languages and translators', list: ['==High-level language== (Python, Java): ==English-like==, easy to read and debug, ==portable== (works on different computers), but must be ==translated==.', '==Low-level language==: ==machine code== (binary, runs directly) and ==assembly language== (mnemonics like ADD). ==Fast==, can control hardware directly, but ==hard to write== and ==specific to one type of CPU==.', '==Compiler==: translates the ==whole program at once== into an ==executable file==. Runs fast; errors are reported ==after== translation; source code is hidden.', '==Interpreter==: translates and runs the program ==one line at a time==. Stops at the first error (easy to debug) but runs ==slower== and needs the source code.', '==Assembler==: translates ==assembly language== into machine code.', 'An ==IDE== (integrated development environment) has a ==code editor==, ==translator==, ==error diagnostics==, ==debugging tools== (breakpoints, stepping, variable watch) and ==auto-complete==.'] }
  ],
  mistakes: ['Saying a ==compiler runs line by line==. That is an interpreter.', 'Saying ==low-level== languages are easier. They are harder.', 'Saying ==the OS is application software==.', 'Listing ==a function of the OS== that is really a utility (such as antivirus).', 'Saying ==defragmentation speeds up an SSD==. It is for hard disk drives.'],
  diagrams: [{ svg: svgLayers, cap: 'The ==operating system== sits between ==application software== and the ==hardware==.' }],
  worked: [
    W('Describe four functions of an operating system.', 'Think about what the OS ==manages==.', 'Give a short description of each, not just a name.', 'Files, memory, peripherals, security',
      [['Managing files', 'Creates, names, moves, copies and deletes files and folders', ''], ['Managing memory', 'Decides which programs use which part of RAM and stops them interfering', ''], ['Controlling peripherals', 'Uses device drivers to communicate with printers, keyboards and other devices', ''], ['Security', 'Provides user accounts and passwords so only authorised users can use the computer', 'Other functions: multitasking and the user interface.']],
      [['1', 'manages files', 0], ['2', 'manages memory', 1], ['3', 'controls peripherals', 2], ['4', 'security', 3]], true),
    W('Compare a compiler and an interpreter.', 'Compare ==how much== is translated at a time, ==speed== and ==errors==.', 'Give a point for each, with a comparison.', 'Whole program v one line',
      [['How they translate', 'A compiler translates the whole program at once. An interpreter translates one line at a time.', ''], ['Output', 'A compiler produces an executable file. An interpreter produces no file; it runs the code directly.', ''], ['Speed', 'Compiled programs run faster. Interpreted programs run slower.', ''], ['Errors', 'A compiler lists the errors after translating. An interpreter stops at the first error, which helps debugging.', '']],
      [['Translation', 'whole v one line', 0], ['Output', 'executable v none', 1], ['Speed', 'faster v slower', 2], ['Errors', 'list v first error', 3]], true),
    W('Give two advantages and one disadvantage of using a high-level language instead of machine code.', 'Compare ==ease== and ==portability==.', 'Remember: high-level programs need translating.', 'Easy, portable, needs a translator',
      [['Advantage 1', 'Easier to read, write and debug (English-like)', ''], ['Advantage 2', 'Portable: can run on different types of computer', 'Machine code is specific to one type of CPU.'], ['Disadvantage', 'It must be translated, so it can run slower and cannot control the hardware as directly', '']],
      [['Advantage 1', 'easy to read and debug', 0], ['Advantage 2', 'portable', 1], ['Disadvantage', 'needs translating', 2]], true),

/* ---------- live side boards for worked examples ---------- */
const bnote = n => n ? `<p class="bnote">${n}</p>` : '';
function pvBoard(bits, cur, note, heads){
  heads = heads || PV;
  return `<table class="tt pv bt"><tr>${heads.map((p,i) => `<th class="${i === cur ? 'cur' : ''}">${p}</th>`).join('')}</tr><tr>${bits.map((x,i) => `<td class="${i === cur ? 'cur' : ''} ${x === '1' ? 'one' : ''}">${x === '' ? '&nbsp;' : x}</td>`).join('')}</tr></table>${bnote(note)}`;
}
const partial = (b, n) => b.slice(0, n).split('').concat(Array(8 - n).fill(''));
function nibBoard(b, show, note, reverse){
  const half = (bits, i) => { const v = parseInt(bits, 2), h = v.toString(16).toUpperCase(); const on = show > i;
    const bitCells = [...bits].map(x => `<td class="${(!reverse || on) && x === '1' ? 'one' : ''}">${reverse && !on ? '?' : x}</td>`).join('');
    const hexCell = reverse ? `${h} = ${v}` : on ? `${v} → ${h}` : '?';
    return `<table class="tt pv bt ${show === i + 1 ? 'curt' : ''}"><tr>${[8,4,2,1].map(p => `<th>${p}</th>`).join('')}</tr><tr>${bitCells}</tr><tr><td colspan="4" class="hexd">${hexCell}</td></tr></table>`; };
  return `<div class="nibs">${half(b.slice(0,4), 0)}${half(b.slice(4), 1)}</div>${bnote(note)}`;
}
function gridBoard(heads, rows, note, cur){
  return `<table class="tt pv bt"><tr><th></th>${heads.map((h,i) => `<th class="${i === cur ? 'cur' : ''}">${h}</th>`).join('')}</tr>${rows.map(([lab, cells]) => `<tr><th class="rl">${lab}</th>${cells.map((c,i) => `<td class="${i === cur ? 'cur' : ''} ${c === '1' ? 'one' : ''}">${c === '' ? '&nbsp;' : c}</td>`).join('')}</tr>`).join('')}</table>${bnote(note)}`;
}
function addBoard(a, b, k, note){
  const A = bin8(a), B = bin8(b); const cr = Array(9).fill(''), res = Array(8).fill(''); let carry = 0;
  for (let i = 7; i >= 0; i--) { const t = +A[i] + +B[i] + carry; carry = t >> 1; if (i >= 8 - k) { res[i] = String(t % 2); if (carry) cr[i] = '1'; } }
  const curCol = k >= 1 && k <= 8 ? 8 - k + 1 : -1;
  const row = (lab, cells, cls) => `<tr class="${cls||''}"><th class="rl">${lab}</th>${cells.map((c,i) => `<td class="${i === curCol && k < 8 ? 'cur' : ''}">${c === '' ? '&nbsp;' : c}</td>`).join('')}</tr>`;
  const over = k >= 8 && carry ? '1' : '';
  return `<table class="tt add bt">${row('carry', cr, 'carry')}${row('', [''].concat([...A]))}${row('+', [''].concat([...B]))}${row('=', [over].concat(res), 'sum')}</table>${bnote(note)}`;
}
function unitBoard(rows, k, note){
  return `<table class="tt bt units">${rows.map(([u, v, how], i) => `<tr class="${i === k - 1 ? 'hl2' : ''}"><th class="rl">${u}</th><td>${i < k ? v : '?'}</td><td class="how">${i < k ? how : ''}</td></tr>`).join('')}</table>${bnote(note)}`;
}
function byteBoard(bits, note, parityFirst){
  return `<table class="tt pv bt"><tr>${[...bits].map((x,i) => `<td class="${x === '1' ? 'one' : ''} ${parityFirst && i === 0 ? 'par' : ''}">${x}</td>`).join('')}</tr></table>${bnote(note)}`;
}
function ttBoard(ex, cols, note){
  const rows = rowsFor(ex.n); const heads = (ex.n === 3 ? ['A','B','C'] : ['A','B']).concat(ex.parts.map(p => p[0]), ['X']); const nIn = ex.n;
  return `<table class="tt bt"><tr>${heads.map((h,i) => `<th class="${i === cols - 1 && i >= nIn ? 'cur' : ''}">${h}</th>`).join('')}</tr>${rows.map(r => `<tr>${r.map(v => `<td>${v}</td>`).join('')}${ex.parts.map((p,j) => `<td class="${nIn + j === cols - 1 ? 'cur' : ''}">${nIn + j < cols ? p[1](...r) : ''}</td>`).join('')}<td class="xcol ${heads.length === cols ? 'cur' : ''}">${heads.length <= cols ? ex.f(...r) : ''}</td></tr>`).join('')}</table>${bnote(note)}`;
}
function runBoard(runs, k, note){
  return `<div class="runs">${runs.map(([c, n], i) => `<div class="run ${i < k ? 'done' : ''} ${i === k - 1 ? 'curr' : ''}"><span class="mono">${c.repeat(n)}</span><b>${i < k ? n + c : '?'}</b></div>`).join('')}</div>${bnote(note)}`;
}
const attach = (w, b0, boards) => { w.board0 = b0; w.s.forEach((st, j) => { if (boards[j]) st[3] = boards[j]; }); };

function judge(raw){
  const d = drillCur;
  if (d.kind === 'num') { const x = parseFloat(raw.replace(',', '.')); if (isNaN(x)) return null; return { ok: Math.abs(x - d.ans) <= (d.tol != null ? d.tol : Math.abs(d.ans)*0.02) + 1e-9 }; }
  if (d.kind === 'bits') { const r = raw.replace(/\s+/g, ''); if (!r) return null; if (!/^[01]+$/.test(r)) return { ok:false };
    if (r === d.ans) return { ok:true }; if (r.length < 8 && r.padStart(8,'0') === d.ans) return { ok:true, note:'In the exam, write all 8 bits: ' + nib(d.ans) + '.' }; return { ok:false }; }
  if (d.kind === 'text') { const r = raw.replace(/\s+/g, '').toUpperCase(); if (!r) return null; return { ok: r === d.ans.toUpperCase() }; }
  if (d.kind === 'config') { const m = raw.match(/\d+/g); if (!m) return null; return { ok: m.join(',') === d.ans }; }
  if (d.kind === 'formula') { const r = unsub(raw.replace(/\s+/g, '')); if (!r) return null;
    if (r === d.ans) return { ok:true }; if (r.toLowerCase() === d.ans.toLowerCase()) return { ok:true, note:`Watch the capital letters: ${sub(d.ans)}` }; return { ok:false }; }
  return null;
}

  } else if (d.kind === 'choice') {
    document.getElementById('dch').onclick = ev => { const b = ev.target.closest('[data-dc]'); if (!b || d.done) return; d.done = true; const j = +b.dataset.dc;
      document.querySelectorAll('#dch .opt').forEach((o,oi) => { o.disabled = true; if (oi === d.ans) o.classList.add('right'); else if (oi === j) o.classList.add('wrong'); });
      showResult(j === d.ans); };
  } else {
    document.getElementById('dform').onsubmit = ev => { ev.preventDefault(); if (d.done) return;
      const r = judge(document.getElementById('dans').value.trim());
      if (!r) { document.getElementById('dfb').innerHTML = `<div class="fb no"><span class="verdict">Type an answer first.</span></div>`; return; }
      d.done = true; showResult(r.ok, r.note); };
  }
  document.getElementById('dskip').onclick = () => { streak = 0; newDrill(); };
}


function updateBoard(wk, items){
  const bi = wk.querySelector('.board-in'); if (!bi) return;
  const w = CH[cur].worked[+wk.dataset.worked]; let html = w.board0();
  items.forEach((li, j) => { if (!li.hidden && w.s[j][3]) html = w.s[j][3](); });
  bi.innerHTML = html;
  items.forEach(li => li.classList.remove('now')); const vis = items.filter(li => !li.hidden); if (vis.length) vis[vis.length-1].classList.add('now');
}
/* ---------- Try it: logic lab ---------- */
let LG = 'AND', LA = 0, LB = 1, CA = 1, CB = 0, CC = 0;
function renderLab(){
  return `<div class="card" id="lab"><h3>Gate explorer</h3><p class="note">Pick a gate, then tap A and B to switch the inputs. Watch the output lamp and the highlighted truth-table row.</p>
    <div class="row" id="gpick">${['NOT','AND','OR','NAND','NOR','XOR'].map(t => `<button class="btn" type="button" data-g="${t}">${t}</button>`).join('')}</div>
    <div class="row"><button class="btn" type="button" data-li="A" id="tA"></button><button class="btn" type="button" data-li="B" id="tB"></button></div>
    <div class="svgbox" id="gsvg"></div><div class="gtt" id="gtt"></div><p class="why" id="gdesc"></p></div>
  <div class="card"><h3>Circuit simulator: X = (A AND B) OR NOT C</h3><p class="note">Tap the inputs. P and Q are the working columns; X is the output.</p>
    <div class="row"><button class="btn" type="button" data-ci="A" id="cA"></button><button class="btn" type="button" data-ci="B" id="cB"></button><button class="btn" type="button" data-ci="C" id="cC"></button></div>
    <div class="svgbox" id="csvg"></div><div class="tbl" id="ctt"></div></div>`;
}
function drawLab(){
  document.querySelectorAll('[data-g]').forEach(b => b.classList.toggle('primary', b.dataset.g === LG));
  const tB = document.getElementById('tB'); tB.hidden = LG === 'NOT';
  document.getElementById('tA').textContent = 'A = ' + LA; tB.textContent = 'B = ' + LB;
  document.getElementById('tA').classList.toggle('on', !!LA); tB.classList.toggle('on', !!LB);
  document.getElementById('gsvg').innerHTML = gateLiveSVG(LG, LA, LB);
  const rows = LG === 'NOT' ? [[0],[1]] : [[0,0],[0,1],[1,0],[1,1]];
  document.getElementById('gtt').innerHTML = `<table class="tt"><thead><tr><th>A</th>${LG === 'NOT' ? '' : '<th>B</th>'}<th>X</th></tr></thead><tbody>${rows.map(r => { const cur = r[0] === LA && (LG === 'NOT' || r[1] === LB); return `<tr class="${cur ? 'hl' : ''}">${r.map(v => `<td>${v}</td>`).join('')}<td class="xcol">${LG === 'NOT' ? G.NOT(r[0]) : G[LG](...r)}</td></tr>`; }).join('')}</tbody></table>`;
  document.getElementById('gdesc').innerHTML = fmt(`${LG}: output is ==${GDESC[LG]}==.`);
  ['A','B','C'].forEach(k => { const v = { A:CA, B:CB, C:CC }[k]; const el = document.getElementById('c' + k); el.textContent = k + ' = ' + v; el.classList.toggle('on', !!v); });
  document.getElementById('csvg').innerHTML = circuitSVG(CA, CB, CC, true);
  const ex = EXPR[9];
  document.getElementById('ctt').innerHTML = workingTable({ ...ex, parts:[['P = A AND B',(a,b)=>a&b],['Q = NOT C',(a,b,c)=>1-c]] }, rowsFor(3)).replace(/<div class="tbl">|<\/div>$/g, '')
    .replace(new RegExp(`<tr><td>${CA}</td><td>${CB}</td><td>${CC}</td>`), `<tr class="hl"><td>${CA}</td><td>${CB}</td><td>${CC}</td>`);
}
document.getElementById('view').addEventListener('click', e => {
  const g = e.target.closest('[data-g]'); if (g) { LG = g.dataset.g; drawLab(); return; }
  const li = e.target.closest('[data-li]'); if (li) { if (li.dataset.li === 'A') LA = 1 - LA; else LB = 1 - LB; drawLab(); return; }
  const ci = e.target.closest('[data-ci]'); if (ci) { const k = ci.dataset.ci; if (k === 'A') CA = 1 - CA; if (k === 'B') CB = 1 - CB; if (k === 'C') CC = 1 - CC; drawLab(); }
});
renderTabs(); render();

/* chapter tabs: arrow buttons, mouse wheel and keep the selected tab in view (for screens without touch) */
(function(){
  const nav = document.getElementById('tabs'), L = document.getElementById('tabL'), R = document.getElementById('tabR');
  const upd = () => { const m = nav.scrollWidth - nav.clientWidth; L.hidden = nav.scrollLeft <= 2; R.hidden = nav.scrollLeft >= m - 2; };
  L.onclick = () => nav.scrollBy({ left: -nav.clientWidth * .7, behavior: 'smooth' });
  R.onclick = () => nav.scrollBy({ left: nav.clientWidth * .7, behavior: 'smooth' });
  nav.addEventListener('scroll', upd); window.addEventListener('resize', upd);
  nav.addEventListener('wheel', e => { if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) { nav.scrollLeft += e.deltaY; e.preventDefault(); } }, { passive: false });
  new MutationObserver(() => { const a = nav.querySelector('[aria-selected="true"]'); if (a) a.scrollIntoView({ inline: 'center', block: 'nearest' }); upd(); }).observe(nav, { childList: true });
  const a = nav.querySelector('[aria-selected="true"]'); if (a) a.scrollIntoView({ inline: 'center', block: 'nearest' }); upd();
})();
</script>
