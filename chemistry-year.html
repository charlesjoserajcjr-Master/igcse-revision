<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chemistry Full-Year Pack</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: lab-notebook study app — sticky chapter bar, one column of working cards on a faint graph-paper ground (shared with the Physics pack) */
:root{
  --paper:#EEF3F6; --card:#FFFFFF; --ink:#132235; --muted:#56687C; --line:#D3DDE6; --grid:rgba(19,34,53,.045);
  --accent:#0A6C96; --accent-soft:#E1F0F7; --hot:#D2470E; --hot-soft:#FCE9E0;
  --kw-bg:#FFE45C; --kw-ink:#132235;
  --good:#2B8A3E; --good-soft:#E3F4E6; --bad:#C92A2A; --bad-soft:#FBE4E4;
  --water:#DCEEF6; --cu:#4A9BD8; --copper:#B4602B; --zinc:#A3ADB8; --ppt:#F2E6A0; --noble:#E6F2E0;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root{
  --paper:#0E1620; --card:#16212D; --ink:#E5EDF4; --muted:#93A4B6; --line:#2A3949; --grid:rgba(229,237,244,.035);
  --accent:#5DB8E2; --accent-soft:#16344A; --hot:#FF8C55; --hot-soft:#3E2216;
  --kw-bg:#6B5A00; --kw-ink:#FFF3B0;
  --good:#69DB7C; --good-soft:#173322; --bad:#FF8787; --bad-soft:#3D1C1C;
  --water:#1B3A4D; --cu:#2F7DBA; --copper:#D07A40; --zinc:#6C7884; --ppt:#6B6232; --noble:#1D3322; color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px}
.wrap{max-width:900px;margin:0 auto;padding-inline:16px;padding-block:0 64px}
h1,h2,h3{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0}
h2{font-size:1.6rem;font-weight:800}
h3{font-size:1.15rem;font-weight:600}
p{margin:0}
mark.kw{background:var(--kw-bg);color:var(--kw-ink);padding:0 .2em;border-radius:3px;font-weight:700;box-decoration-break:clone;-webkit-box-decoration-break:clone}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.top{position:sticky;top:0;z-index:10;background:var(--paper);border-bottom:1px solid var(--line)}
.top .wrap{padding-block:12px 10px;display:flex;flex-direction:column;gap:10px}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand h1{font-size:1.35rem;font-weight:800;letter-spacing:-.01em}
.brand h1 span{color:var(--accent)}
.examdate{font-family:var(--mono);font-size:.78rem;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;text-decoration:none}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 16px;font-weight:700;font-size:.95rem}
.tab small{font-family:var(--mono);font-weight:400;color:var(--muted);margin-right:6px;font-size:.75rem}
.tab[aria-selected="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tab[aria-selected="true"] small{color:inherit;opacity:.7}
.sub{display:flex;gap:4px;flex-wrap:wrap;margin-block:20px 18px;border-bottom:2px solid var(--line)}
.subtab{border:0;background:none;padding:10px 12px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px}
.subtab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.chhead{display:flex;flex-direction:column;gap:6px;margin-top:22px}
.eyebrow{font-family:var(--mono);font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.lede{color:var(--muted);max-width:62ch}
.stack{display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px 20px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px}
.formula{font-family:var(--mono);font-size:1.05rem;font-weight:600;background:var(--accent-soft);color:var(--ink);border-radius:8px;padding:10px 14px;align-self:flex-start;max-width:100%;overflow-x:auto;display:flex;flex-direction:column;gap:4px}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;font-size:.95rem;min-width:100%}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:7px 12px 7px 0;text-align:left;vertical-align:top}
.tbl th{font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.mistakes{background:var(--hot-soft);border-color:transparent}
.mistakes h3{color:var(--hot)}
figure{margin:0;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px}
figure .svgbox{overflow-x:auto}
figure svg{display:block;width:100%;min-width:440px;height:auto}
figcaption{font-size:.95rem}
svg .ln{stroke:var(--ink);stroke-width:2;fill:none}
svg .thin{stroke:var(--muted);stroke-width:1;fill:none}
svg .glass{stroke:var(--ink);stroke-width:2;fill:none}
svg .acc{stroke:var(--accent);stroke-width:2.5;fill:none}
svg .hotl{stroke:var(--hot);stroke-width:2.5;fill:none}
svg .accf{fill:var(--accent)}
svg .hotf{fill:var(--hot)}
svg .inkf{fill:var(--ink)}
svg .cardf{fill:var(--card)}
svg .shell{fill:none;stroke:var(--muted);stroke-width:1.4}
svg .atom{fill:var(--card);stroke:var(--ink);stroke-width:1.8}
svg .nuc{fill:var(--accent-soft);stroke:var(--ink);stroke-width:1.4}
svg .cross{stroke:var(--hot);stroke-width:2.4}
svg .metal{fill:var(--accent-soft);stroke:var(--line)}
svg .nonmetal{fill:var(--card);stroke:var(--line)}
svg .noble{fill:var(--noble);stroke:var(--line)}
svg .cuf{fill:var(--cu)}
svg .waterf{fill:var(--water)}
svg .copperf{fill:var(--copper)}
svg .zincf{fill:var(--zinc);stroke:var(--ink);stroke-width:1.2}
svg .pptf{fill:var(--ppt);stroke:var(--ink);stroke-width:1}
svg text{fill:var(--ink);font-family:var(--body);font-size:13px}
svg .lbl{font-weight:700}
svg .sym{font-family:var(--display);font-weight:800;font-size:22px;text-anchor:middle}
svg .mid{text-anchor:middle}
svg .end{text-anchor:end}
svg .mut{fill:var(--muted)}
svg .acct{fill:var(--accent);font-weight:700}
svg .hott{fill:var(--hot);font-weight:700}
svg .mono{font-family:var(--mono)}
.q{font-weight:700}
.steps{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px;counter-reset:s}
.steps li{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:baseline;counter-increment:s}
.steps li::before{content:counter(s);font-family:var(--mono);font-size:.8rem;font-weight:600;width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--card);display:grid;place-items:center;grid-row:span 2}
.steps .sl{font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.steps .st{font-family:var(--mono);font-size:1rem;min-width:0;overflow-wrap:anywhere}
.steps li.final .st{font-weight:700;color:var(--good)}
.steps .prose{font-family:var(--body)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:9px 16px;font-weight:700}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--card)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:default}
.drillq{font-size:1.1rem}
.answer{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.answer input{font:inherit;font-family:var(--mono);font-size:1.1rem;padding:9px 12px;border:2px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);width:12ch}
.unit{font-family:var(--mono);color:var(--muted)}
.fb{border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.fb.ok{background:var(--good-soft)}
.fb.no{background:var(--bad-soft)}
.fb .verdict{font-weight:700}
.fb.ok .verdict{color:var(--good)}
.fb.no .verdict{color:var(--bad)}
.stat{font-family:var(--mono);font-size:.85rem;color:var(--muted)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:8px}
.opt{text-align:left;border:2px solid var(--line);background:var(--paper);border-radius:8px;padding:10px 14px;font-weight:400}
.opt.sel{border-color:var(--accent);background:var(--accent-soft);font-weight:700}
.opt.right{border-color:var(--good);background:var(--good-soft);font-weight:700}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.why{font-size:.95rem;border-left:3px solid var(--accent);padding-left:12px}
.scorebar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.big-score{font-family:var(--display);font-size:1.8rem;font-weight:800}
.qhead{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.marks{font-family:var(--mono);font-size:.85rem;color:var(--muted);white-space:nowrap}
.ms{display:flex;flex-direction:column;gap:6px}
.ms-intro{font-size:.9rem;color:var(--muted)}
.point{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:10px 12px;font-weight:400}
.point .box{width:24px;height:24px;border:2px solid var(--muted);border-radius:6px;display:grid;place-items:center;font-weight:700;color:var(--card)}
.point[aria-pressed="true"]{border-color:var(--good)}
.point[aria-pressed="true"] .box{background:var(--good);border-color:var(--good)}
.got{font-family:var(--mono);font-weight:600}
.note{font-size:.9rem;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:14px}
.prog{display:flex;flex-direction:column;gap:6px}
.bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.bar > i{display:block;height:100%;background:var(--accent);border-radius:5px}
.pl{display:flex;justify-content:space-between;font-size:.9rem;gap:8px}
.pl span:last-child{font-family:var(--mono);color:var(--muted);white-space:nowrap}
.cw{display:grid;grid-template-columns:auto 1fr;gap:6px 14px}
.cw dt{font-weight:700;color:var(--accent)}
.cw dd{margin:0}
.plan{display:flex;flex-direction:column;border-left:2px solid var(--line);margin-left:6px}
.plan div{position:relative;padding:0 0 12px 18px}
.plan div::before{content:"";position:absolute;left:-7px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--card);border:2px solid var(--accent)}
.plan b{font-family:var(--mono);font-size:.82rem;color:var(--muted);display:block;font-weight:600}
.timer{font-family:var(--mono);font-size:2.2rem;font-weight:600;font-variant-numeric:tabular-nums}
.timer.low{color:var(--hot)}
a{color:var(--accent)}
@media (prefers-reduced-motion: no-preference){.fadein{animation:fi .25s ease-out}@keyframes fi{from{transform:translateY(4px)}to{transform:none}}}
.intro{background:var(--accent-soft);border-radius:8px;padding:10px 14px;font-size:.98rem;margin:0}
.steps .why2{grid-column:2;font-family:var(--body);font-size:.93rem;color:var(--muted);border-left:3px solid var(--line);padding-left:10px}
.steps li.now .st{color:var(--ink)}
.tip{background:var(--kw-bg);color:var(--kw-ink);border-radius:8px;padding:10px 14px;font-size:.95rem;margin:0}
.tip mark.kw{background:transparent;padding:0;text-decoration:underline}
.wk-split{display:grid;grid-template-columns:minmax(0,1fr) minmax(250px,330px);grid-template-areas:"steps board";gap:18px;align-items:start}
.wk-split .steps{grid-area:steps}
.wk-split .board{grid-area:board;position:sticky;top:150px;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0;overflow-x:auto}
@media (max-width:700px){.wk-split{grid-template-columns:minmax(0,1fr);grid-template-areas:"board" "steps"}.wk-split .board{top:118px;z-index:2}}
.wb{border-collapse:collapse;font-size:.88rem;width:100%}
.wb th,.wb td{border:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top;background:var(--card)}
.wb th{color:var(--muted);font-weight:400;white-space:nowrap;width:1%}
.wb td{font-family:var(--mono);overflow-wrap:anywhere}
.wb td.q{color:var(--muted);font-weight:400}
.wb td.fill{background:var(--good-soft);color:var(--good);font-weight:700}
.wb tr.cur th,.wb tr.cur td{outline:2px solid var(--hot);outline-offset:-2px}
.bnote{font-size:.9rem;margin:0}
.tabwrap{display:flex;align-items:center;gap:6px;min-width:0}
.tabwrap .tabs{flex:1;min-width:0;scroll-behavior:smooth}
.tabarrow{flex:0 0 auto;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:1.3rem;line-height:1;display:grid;place-items:center;padding:0 0 3px;cursor:pointer}
.tabarrow:hover{border-color:var(--accent);color:var(--accent)}
.tabarrow[hidden]{display:none}
.pm{color:var(--muted);font-family:var(--mono);font-size:.85em;white-space:nowrap}
.qgroup{margin:18px 0 -6px;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline}
.qgroup small{color:var(--muted);font-family:var(--body);font-weight:400;font-size:.85rem}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand">
      <h1>Chemistry <span>Full-Year</span> Pack</h1>
      <a href="./" class="examdate">← All subjects</a>
      <div class="examdate">Grade 8 · Whole syllabus</div>
    </div>
    <div class="tabwrap"><button class="tabarrow" id="tabL" type="button" aria-label="Scroll chapters left" hidden>&#8249;</button><nav class="tabs" role="tablist" id="tabs"></nav><button class="tabarrow" id="tabR" type="button" aria-label="Scroll chapters right">&#8250;</button></div>
  </div>
</header>
<main class="wrap" id="view"></main>

<script>
/* ---------- helpers ---------- */
const fmt = s => String(s).replace(/==(.+?)==/g,'<mark class="kw">$1</mark>').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
const pick = a => a[Math.floor(Math.random()*a.length)];
const rint = (a,b) => a + Math.floor(Math.random()*(b-a+1));
const shuffle = a => { const b = a.slice(); for (let i = b.length-1; i > 0; i--) { const j = Math.floor(Math.random()*(i+1)); [b[i],b[j]] = [b[j],b[i]]; } return b; };
const num = x => String(Math.round(x*100)/100);
const SUBS = '₀₁₂₃₄₅₆₇₈₉';
const sub = f => f.replace(/\d/g, d => SUBS[d]);
const unsub = f => f.replace(/[₀-₉]/g, d => String(d.charCodeAt(0) - 8320));
let store = {};
try { store = JSON.parse(localStorage.getItem('chemyear-v1') || '{}') || {}; } catch(e) { store = {}; }
store.ticks = store.ticks || {}; store.quiz = store.quiz || {}; store.drill = store.drill || {};
const save = () => { try { localStorage.setItem('chemyear-v1', JSON.stringify(store)); } catch(e) {} };

/* ---------- element data ---------- */
const EL = [[1,'H','hydrogen',1],[2,'He','helium',4],[3,'Li','lithium',7],[4,'Be','beryllium',9],[5,'B','boron',11],[6,'C','carbon',12],[7,'N','nitrogen',14],[8,'O','oxygen',16],[9,'F','fluorine',19],[10,'Ne','neon',20],[11,'Na','sodium',23],[12,'Mg','magnesium',24],[13,'Al','aluminium',27],[14,'Si','silicon',28],[15,'P','phosphorus',31],[16,'S','sulfur',32],[17,'Cl','chlorine',35],[18,'Ar','argon',40],[19,'K','potassium',39],[20,'Ca','calcium',40]];
const config = Z => { const r = []; let n = Z; for (const cap of [2,8,8,8]) { if (n <= 0) break; const t = Math.min(cap, n); r.push(t); n -= t; } return r; };
const ROMAN = ['','I','II','III','IV','V','VI','VII','VIII'];

/* ---------- diagram helpers ---------- */
function eDot(x, y){ return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.6" class="accf"/>`; }
function eCross(x, y){ const d = 3.6; return `<path d="M${(x-d).toFixed(1)} ${(y-d).toFixed(1)}L${(x+d).toFixed(1)} ${(y+d).toFixed(1)}M${(x-d).toFixed(1)} ${(y+d).toFixed(1)}L${(x+d).toFixed(1)} ${(y-d).toFixed(1)}" class="cross"/>`; }
const mark = (m, x, y) => m === 'x' ? eCross(x, y) : eDot(x, y);
/* Bohr diagram: conf like [2,8,1]; marks(k,i) returns 'x' or 'o' */
function bohr(cx, cy, conf, sym, marks, r0 = 24, dr = 20){
  let s = `<circle cx="${cx}" cy="${cy}" r="14" class="nuc"/><text x="${cx}" y="${cy+5}" class="mid lbl" style="font-size:12px">${sym}</text>`;
  conf.forEach((n, k) => {
    const r = r0 + k*dr; s += `<circle cx="${cx}" cy="${cy}" r="${r}" class="shell"/>`;
    for (let i = 0; i < n; i++) {
      let a;
      if (n <= 2) a = i === 0 ? 180 : 0;
      else { const pair = Math.floor(i/2), side = i % 2; a = -90 + pair*90 + (side ? 12 : -12); if (n % 2 && i === n-1) a = -90 + pair*90; }
      const rad = a*Math.PI/180; s += mark(marks(k,i), cx + r*Math.cos(rad), cy + r*Math.sin(rad));
    }
  });
  return s;
}
/* covalent outer-shell diagram */
function covalent(cx, cy, c, others){
  const P = (x,y,a,r) => [x + r*Math.cos(a*Math.PI/180), y + r*Math.sin(a*Math.PI/180)];
  let s = '';
  others.forEach(o => { const [ox,oy] = P(cx,cy,o.ang,o.d); s += `<circle cx="${ox.toFixed(1)}" cy="${oy.toFixed(1)}" r="${o.r}" class="atom" fill-opacity=".85"/>`; o._x = ox; o._y = oy; });
  s += `<circle cx="${cx}" cy="${cy}" r="${c.r}" class="atom" fill-opacity=".85"/>`;
  others.forEach(o => { s += `<circle cx="${o._x.toFixed(1)}" cy="${o._y.toFixed(1)}" r="${o.r}" fill="none" class="ln" stroke-width="1.8"/>`; });
  const pair = (x,y,a,r,m1,m2) => { const [px,py] = P(x,y,a,r); const t = (a+90)*Math.PI/180; return mark(m1, px+6*Math.cos(t), py+6*Math.sin(t)) + mark(m2, px-6*Math.cos(t), py-6*Math.sin(t)); };
  others.forEach(o => {
    const overlap = c.r + o.r - o.d; const m = c.r - overlap/2;
    s += pair(cx, cy, o.ang, m, c.mark, o.mark);
    (o.lone || []).forEach(a => s += pair(o._x, o._y, a, o.r, o.mark, o.mark));
    s += `<text x="${o._x.toFixed(1)}" y="${(o._y+7).toFixed(1)}" class="sym" style="font-size:18px">${o.sym}</text>`;
  });
  (c.lone || []).forEach(a => s += pair(cx, cy, a, c.r, c.mark, c.mark));
  s += `<text x="${cx}" y="${cy+8}" class="sym">${c.sym}</text>`;
  return s;
}
const legendDX = (x, y, a, b) => `${eCross(x, y-4)}<text x="${x+10}" y="${y}">${a}</text>${eDot(x+190, y-4)}<text x="${x+200}" y="${y}">${b}</text>`;
function arrowDefs(id){
  return `<defs><marker id="a-${id}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="inkf"/></marker>
  <marker id="b-${id}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="accf"/></marker>
  <marker id="h-${id}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="hotf"/></marker></defs>`;
}

/* ---------- diagrams ---------- */
function svgNotation(){
  return `<svg viewBox="0 0 480 190" role="img" aria-label="Nuclide notation">${arrowDefs('n')}
  <text x="200" y="66" class="end mono" style="font-size:26px;font-weight:600">23</text>

function periodicFull(){
  const cw = 44, ch = 50, x0 = 30, y0 = 28; const pos = z => { if (z === 1) return [1, 1]; if (z === 2) return [1, 18]; if (z <= 4) return [2, z - 2]; if (z <= 10) return [2, z + 8]; if (z <= 12) return [3, z - 10]; if (z <= 18) return [3, z]; if (z <= 36) return [4, z - 18]; if (z <= 54) return [5, z - 36]; if (z <= 56) return [6, z - 54]; if (z === 57) return [6, 3]; if (z <= 86) return [6, z - 68]; return [7, z - 86]; };
  const noble = [2, 10, 18, 36, 54, 86], nonm = [1, 6, 7, 8, 9, 15, 16, 17, 34, 35, 53, 85];
  let s = `<svg viewBox="0 0 ${x0 + 18 * cw + 10} ${y0 + 7 * ch + 40}" role="img" aria-label="The Periodic Table with proton numbers, symbols and relative atomic masses" style="min-width:640px">`;
  for (let g = 1; g <= 18; g++) s += `<text x="${x0 + (g - 1) * cw + cw / 2}" y="18" class="mid mut" style="font-size:10px">${g}</text>`;
  for (let z = 1; z <= 88; z++) { if (z > 57 && z < 72) continue; const [p, g] = pos(z); const x = x0 + (g - 1) * cw, y = y0 + (p - 1) * ch, cls = noble.includes(z) ? 'noble' : nonm.includes(z) ? 'nonmetal' : 'metal';
    s += `<rect x="${x + 1}" y="${y + 1}" width="${cw - 2}" height="${ch - 2}" rx="3" class="${cls}" style="stroke:var(--line)"/><text x="${x + 5}" y="${y + 12}" class="mut" style="font-size:9px">${z}</text><text x="${x + cw / 2}" y="${y + 30}" class="mid lbl" style="font-size:14px">${PT_SYM[z]}</text>${PT_AR[z] ? `<text x="${x + cw / 2}" y="${y + 44}" class="mid mut" style="font-size:9px">${PT_AR[z]}</text>` : ''}`; }
  s += `<text x="${x0}" y="${y0 + 7 * ch + 28}" class="mut" style="font-size:11px">Top number: proton number. Middle: symbol. Bottom: relative atomic mass. Lanthanoids and actinoids are not shown.</text></svg>`;
  return s;
}

salts: {
  code: 'Ch 7', name: 'Salts',
  lede: 'Learn the four general equations, the solubility rules and the two preparation methods. Method questions carry big marks.',
  learn: [
    { h: 'Acids, bases and alkalis', list: ['==Acids== have ==pH below 7== and produce ==H⁺ ions== in water.', '==Alkalis== have ==pH above 7== and produce ==OH⁻ ions== in water. pH 7 is ==neutral==.', 'A ==base== is a metal oxide or hydroxide that reacts with an acid. An ==alkali is a soluble base==.', 'Indicators: ==litmus== red in acid, blue in alkali. ==Methyl orange== red in acid, yellow in alkali. ==Phenolphthalein== colourless in acid, pink in alkali.'] },
    { h: 'What is a salt?', list: ['A salt forms when the ==hydrogen of an acid== is ==replaced by a metal== (or ammonium).', 'The first part of the name comes from the metal; the second from the acid:'],
      table: [['Acid','Formula','Salt name'],['hydrochloric acid','HCl','…chloride'],['sulfuric acid','H₂SO₄','…sulfate'],['nitric acid','HNO₃','…nitrate']] },
    { h: 'The four general equations', f: ['acid + metal → salt + hydrogen', 'acid + base → salt + water', 'acid + alkali → salt + water', 'acid + carbonate → salt + water + carbon dioxide'], list: ['Neutralisation as an ionic equation: ==H⁺ + OH⁻ → H₂O==.'] },
    { h: 'Gas tests', list: ['==Hydrogen==: a ==lighted splint== gives a ==squeaky pop==.', '==Carbon dioxide==: bubble through ==limewater==, which turns ==milky (cloudy)==.'] },
    { h: 'Solubility rules', table: [['Type of salt','Soluble?'],['sodium, potassium, ammonium salts','all soluble'],['nitrates','all soluble'],['chlorides','soluble, except silver and lead'],['sulfates','soluble, except barium, calcium and lead'],['carbonates','insoluble, except sodium, potassium, ammonium'],['hydroxides','insoluble, except sodium, potassium, ammonium (calcium slightly)']] },
    { h: 'Method A: soluble salt from an insoluble solid', p: ['Use when the solid is a ==metal, insoluble base or carbonate== (e.g. copper(II) oxide + sulfuric acid → copper(II) sulfate).'],

    { h: 'Method B: soluble salt from acid + alkali (titration)', p: ['Use for ==sodium, potassium and ammonium== salts, where both reactants are ==solutions==. An excess cannot be filtered off.'],
      list: ['Put a measured volume of alkali in a ==conical flask== with an ==indicator==.', 'Add acid from a ==burette== until the indicator ==just changes colour==. Record the volume.', 'Repeat with the ==same volumes without the indicator==.', '==Evaporate and crystallise== as in Method A.'] },
    { h: 'Method C: insoluble salt by precipitation', list: ['==Mix solutions of two soluble salts== that contain the ions you need.', 'The insoluble salt forms as a ==precipitate==.', '==Filter==, ==wash== the residue with ==distilled water==, then ==dry== it.', 'Example: silver nitrate + sodium chloride → ==silver chloride== (white precipitate) + sodium nitrate.', 'Example: barium chloride + sodium sulfate → ==barium sulfate== (white precipitate) + sodium chloride.'] },
    { h: 'Hydrated salts', list: ['Crystals contain ==water of crystallisation== (e.g. CuSO₄·5H₂O).', 'Heating ==blue hydrated copper(II) sulfate== gives ==white anhydrous copper(II) sulfate== + water.', 'Adding water turns it ==blue again==: this is a ==test for water==.'] }
  ],
  mistakes: ['Not adding the solid ==in excess==, so acid is left in the salt.', '==Heating to dryness==. Stop when crystals start to form, then cool.', 'Mixing up ==filtrate== (liquid through the paper) and ==residue== (solid left on it).', 'Naming the salt wrongly: sulfuric acid gives a ==sulfate== (not a sulfide).', 'Forgetting ==carbon dioxide== in acid + carbonate reactions.', 'Using the limewater test for hydrogen. Hydrogen = ==squeaky pop==.'],
  diagrams: [

    { svg: svgSoluble, cap: 'Method A: making copper(II) sulfate crystals from copper(II) oxide and sulfuric acid.' },
    { svg: svgPrecip, cap: 'Method C: making an insoluble salt by precipitation.' }

  worked: [

      s: [['Type','acid + metal → salt + hydrogen'],['Salt name','hydrochloric → chloride: zinc chloride'],['Word equation','zinc + hydrochloric acid → zinc chloride + hydrogen'],['Gas test','lighted splint → squeaky pop']] },

    { q: 'Calcium carbonate reacts with nitric acid. Write the balanced equation and describe what is seen.',

    { q: 'Describe how to make pure, dry crystals of copper(II) sulfate from copper(II) oxide and dilute sulfuric acid.', prose: true,

    { q: 'Lead(II) iodide is insoluble in water. Describe how you would make a dry sample of it.', m: 4,

sepn: {
  code: 'Topic 1', name: 'Separating mixtures and purity',
  lede: 'Choose the right separation method for the mixture, and know how to test whether a substance is pure.',
  learn: [
    { h: 'Pure substances and mixtures', list: ['A ==pure substance== is a ==single element or compound==. It has a ==sharp, fixed melting point== and boiling point.', 'A ==mixture== has ==different substances not chemically joined==. It melts over a ==range== of temperatures.', 'The substances in a mixture keep their own properties and can be ==separated by physical methods==.', 'An ==impurity== ==lowers the melting point== and ==raises the boiling point== of a substance.', 'A ==solvent== dissolves a ==solute== to make a ==solution==. A substance that does not dissolve is ==insoluble==.'] },
    { h: 'Separation methods', table: [['Method', 'Separates', 'Idea'], ['Filtration', 'insoluble solid from a liquid', 'the solid stays on the filter paper (residue); the liquid passes through (filtrate)'], ['Evaporation / crystallisation', 'a dissolved solid from its solution', 'heat to remove some solvent, cool so crystals form'], ['Simple distillation', 'a solvent from a solution', 'evaporate, then condense the pure liquid'], ['Fractional distillation', 'liquids with different boiling points', 'the lowest boiling point comes off first (e.g. ethanol from water, crude oil)'], ['Chromatography', 'substances with different solubilities', 'they move different distances up the paper']] },
    { h: 'Chromatography and Rf', list: ['Draw the ==baseline in pencil== (ink would run). Put a ==spot== on it. The ==solvent level must be below the baseline==.', 'The solvent rises and carries the substances. ==More soluble substances move further==.', 'Each ==spot== is one substance. A ==pure substance gives one spot==.', '==Rf = distance moved by the substance ÷ distance moved by the solvent==. Measure both from the baseline.', '==Same Rf in the same solvent== means the ==same substance==.'], f: ['Rf = distance moved by spot ÷ distance moved by solvent front'] }
  ],
  mistakes: ['Drawing the baseline in ==ink==.', 'Letting the ==solvent level above the baseline==.', 'Measuring the distance from the ==bottom of the paper== instead of the baseline.', 'Using ==distillation== to separate an insoluble solid. Use filtration.', 'Saying a pure substance ==melts over a range==. It melts at one temperature.'],
  diagrams: [
    { svg: svgChromato, cap: 'Chromatography: ==Rf = spot distance ÷ solvent distance==.' },
    { svg: svgDistill, cap: '==Simple distillation== separates a solvent from a solution.' }
  ],
  worked: [
    W('Describe how to separate sand from a mixture of sand and salt water.', 'Sand is ==insoluble==, so use ==filtration==.', 'Name the residue and the filtrate.', 'Filtration',
      [['Pour the mixture through filter paper', 'in a funnel', 'The paper has tiny holes. Only dissolved particles pass through.'], ['The sand stays behind', 'This is the residue', 'It is insoluble.'], ['Wash and dry the sand', 'with distilled water, then dry it', 'This removes any salt.'], ['The filtrate', 'Salt solution passes through', 'To get the salt, heat the filtrate to evaporate the water.']],
      [['Method', 'filtration', 0], ['Residue', 'sand', 1], ['Wash and dry', 'sand', 2], ['Filtrate', 'salt solution', 3]], true),
    W('Describe how to obtain pure water from salt water.', 'Use ==simple distillation==.', 'The water evaporates and condenses; the salt stays behind.', 'Evaporate then condense',
      [['Heat the salt solution', 'in a flask', 'The water boils.'], ['The water vapour', 'passes into the condenser', 'The salt does not evaporate, so it stays in the flask.'], ['Cold water around the condenser', 'turns the vapour back into liquid water', 'This is condensation.'], ['Collect it', 'in a beaker as pure distilled water', 'Check: it boils at exactly 100 °C.']],
      [['Heat', 'the solution boils', 0], ['Vapour', 'water only', 1], ['Condenser', 'vapour turns to liquid', 2], ['Collect', 'pure water', 3]], true),
    W('In a chromatogram, the solvent front moved 8.0 cm and a spot moved 5.2 cm. Calculate the Rf value.', '==Rf = distance moved by the spot ÷ distance moved by the solvent==.', 'Rf has no unit and is always less than 1.', 'Rf = spot ÷ solvent',
      [['Write the formula', 'Rf = distance moved by spot ÷ distance moved by solvent', ''], ['Substitute', 'Rf = 5.2 ÷ 8.0', 'Both measured from the baseline.'], ['Answer', 'Rf = 0.65', 'No unit.']],
      [['Spot', '5.2 cm', -1], ['Solvent', '8.0 cm', -1], ['Rf', '0.65', 2]]),
    W('A student tests a colouring from a sweet. It gives two spots. A known dye E102 gives one spot at the same height as the lower spot. What can you conclude?', 'Compare ==heights== (Rf values) of the spots.', 'Use the keywords: mixture, same Rf.', 'Same height, same substance',
      [['Number of spots', 'Two spots', 'Each spot is a different substance.'], ['Conclusion about the colouring', 'It is a mixture of at least two dyes', 'A pure substance gives one spot.'], ['Compare with E102', 'The lower spot is at the same height', 'Same Rf in the same solvent.'], ['Conclusion', 'The colouring contains E102', 'But not every spot is E102.']],
      [['Spots', '2', 0], ['Colouring', 'a mixture', 1], ['Lower spot', 'same Rf as E102', 2], ['Conclusion', 'contains E102', 3]], true),
    W('Pure ice melts at 0 °C. A sample of ice with salt dissolved in it melts at −3 °C over a range. What does this show?', 'Use the fixed melting point idea to test purity.', 'Impurities lower the melting point.', 'Pure = sharp melting point',
      [['A pure substance', 'melts at one sharp temperature', ''], ['This sample', 'melts over a range, below 0 °C', ''], ['Conclusion', 'The sample is impure (a mixture)', 'The impurity (salt) lowers the melting point.']],
      [['Pure', 'sharp m.p.', 0], ['Sample', 'range, lower', 1], ['Conclusion', 'impure', 2]], true),
    W('Which method would you use to separate ethanol (boiling point 78 °C) from water (100 °C)?', 'The liquids have ==different boiling points==, so use ==fractional distillation==.', 'Say which liquid comes off first.', 'Fractional distillation',
      [['The liquids are miscible', 'They mix completely, so filtration will not work', ''], ['Different boiling points', '78 °C and 100 °C', ''], ['Method', 'Fractional distillation', 'Heat the mixture in a fractionating column.'], ['First fraction', 'Ethanol comes off first', 'It has the lower boiling point.']],
      [['Boiling points', '78 °C v 100 °C', 1], ['Method', 'fractional distillation', 2], ['First off', 'ethanol', 3]], true)
  ],
  drill: 'sepn',
  quiz: [
    { q: 'A pure substance has…', o: ['a melting range', 'a sharp, fixed melting point', 'no melting point', 'a changing boiling point'], a: 1, w: 'A ==sharp, fixed melting point==.' },
    { q: 'Sand and water can be separated by…', o: ['distillation', 'filtration', 'chromatography', 'crystallisation'], a: 1, w: '==Filtration==: sand is insoluble.' },
    { q: 'In chromatography the baseline is drawn in…', o: ['pen', 'pencil', 'marker', 'any'], a: 1, w: '==Pencil==. Ink would dissolve and run.' },
    { q: 'Rf is calculated as…', o: ['solvent ÷ spot', 'spot ÷ solvent', 'spot × solvent', 'spot − solvent'], a: 1, w: '==Spot ÷ solvent==.' },
    { q: 'Which method separates liquids with different boiling points?', o: ['filtration', 'evaporation', 'fractional distillation', 'decanting'], a: 2, w: '==Fractional distillation==.' },
    { q: 'An impurity makes the melting point…', o: ['higher', 'lower', 'sharper', 'unchanged'], a: 1, w: '==Lower== (and spread out).' }
  ],
  exam: [
    { q: 'Describe how to obtain dry crystals of salt from a mixture of salt and sand.', m: 4,
      p: ['==Add water== and stir to dissolve the salt', '==Filter== to remove the sand', '==Heat the filtrate== to evaporate some of the water', 'Leave to ==crystallise==, then filter and dry the crystals'] },
    { q: 'A chromatogram has a solvent front 10.0 cm from the baseline. A spot is 4.0 cm from the baseline. Calculate the Rf value.', m: 2,
      p: ['Rf = ==spot distance ÷ solvent distance== = 4.0 ÷ 10.0', '==0.40=='] },
    { q: 'Explain why the baseline in chromatography is drawn in pencil and must be above the solvent level.', m: 2,
      p: ['Pencil is ==insoluble== so it does not run (ink would dissolve and interfere)', 'If the baseline were below the solvent the ==spots would dissolve into the solvent=='] }
  ]
},
eqn: {
  code: 'Topic 3', name: 'Formulae, Mr and equations',
  lede: 'Balance equations by counting atoms, and calculate relative formula masses.',
  learn: [
    { h: 'Relative masses', list: ['==Relative atomic mass (Ar)== is the ==average mass of an atom compared with 1/12 of a carbon-12 atom==.', '==Relative formula mass (Mr)== = the ==sum of the Ar values== of all the atoms in the formula.', 'Useful Ar values: ==H 1, C 12, N 14, O 16, Na 23, Mg 24, Al 27, S 32, Cl 35.5, K 39, Ca 40, Fe 56, Cu 64, Zn 65==.', 'For brackets, ==multiply everything inside== the bracket by the number outside.'], f: ['Mr of Mg(OH)₂ = 24 + 2 × (16 + 1) = 58'] },
    { h: 'Writing and balancing equations', list: ['A ==word equation== names the substances. A ==symbol equation== uses formulae.', '==Reactants → products==. Atoms are ==never lost or made==, so each element must have the ==same number of atoms on each side==.', 'Balance by writing ==big numbers in front== of formulae. ==Never change the small numbers== in a formula.', 'Work on one element at a time. Leave ==oxygen or hydrogen== until last if they appear in several places.', '==State symbols==: (s) solid, (l) liquid, (g) gas, (aq) dissolved in water.'] }
  ],
  mistakes: ['Changing the ==small numbers== (H₂O to H₂O₂) to balance.', 'Forgetting to ==multiply the whole bracket==.', 'Using ==mass number== instead of ==Ar==.', 'Forgetting to ==count atoms on both sides== at the end.', 'Writing ==Cl== instead of ==Cl₂== for the chlorine molecule. H₂, N₂, O₂, F₂, Cl₂, Br₂, I₂ are diatomic.'],
  diagrams: [{ svg: svgAtomCount, cap: 'Balancing: count the atoms of each element on both sides.' }],
  worked: [
    W('Calculate the relative formula mass (Mr) of calcium carbonate, CaCO₃. (Ar: Ca 40, C 12, O 16)', 'Add up the ==Ar== of every atom in the formula.', 'Write how many of each atom there are.', 'Mr = sum of Ar',
      [['List the atoms', '1 Ca, 1 C, 3 O', ''], ['Add the Ar values', '40 + 12 + (3 × 16)', 'Three oxygens, so 3 × 16.'], ['Work out', '40 + 12 + 48', ''], ['Answer', 'Mr = 100', 'No unit.']],
      [['Ca', '40', 0], ['C', '12', 0], ['3 O', '48', 1], ['Mr', '100', 3]]),
    W('Calculate the Mr of magnesium hydroxide, Mg(OH)₂, and of ammonium sulfate, (NH₄)₂SO₄. (Ar: Mg 24, O 16, H 1, N 14, S 32)', 'Multiply ==everything in the bracket== by the number outside.', 'Check each atom count before adding.', 'Brackets multiply',
      [['Mg(OH)₂: atoms', '1 Mg, 2 O, 2 H', 'The 2 outside the bracket doubles both O and H.'], ['Mg(OH)₂: add', '24 + (2 × 16) + (2 × 1) = 24 + 32 + 2 = 58', ''], ['(NH₄)₂SO₄: atoms', '2 N, 8 H, 1 S, 4 O', '2 × NH₄ gives 2 N and 8 H.'], ['(NH₄)₂SO₄: add', '28 + 8 + 32 + 64 = 132', '2 × 14 = 28, 8 × 1 = 8, 32, 4 × 16 = 64.']],
      [['Mg(OH)₂', 'Mr = 58', 1], ['(NH₄)₂SO₄ atoms', '2N 8H 1S 4O', 2], ['(NH₄)₂SO₄', 'Mr = 132', 3]]),
    W('Balance: H₂ + O₂ → H₂O', 'Count the atoms of ==each element== on both sides, then add ==big numbers== in front.', 'Never change H₂O into H₂O₂.', 'Balance O first, then H',
      [['Count the atoms', 'Left: 2 H, 2 O.   Right: 2 H, 1 O', 'Oxygen does not balance.'], ['Balance the O', 'Put 2 in front of H₂O: H₂ + O₂ → 2H₂O', 'Now 2 O on each side. But H is now 4 on the right.'], ['Balance the H', 'Put 2 in front of H₂: 2H₂ + O₂ → 2H₂O', 'Now 4 H on each side.'], ['Check', 'Left: 4 H, 2 O.   Right: 4 H, 2 O ✓', 'Balanced.']],
      [['Unbalanced', 'O is 2 v 1', 0], ['After step 2', 'H₂ + O₂ → 2H₂O', 1], ['Balanced', '2H₂ + O₂ → 2H₂O', 2], ['Check', '4H 2O both sides ✓', 3]]),
    W('Balance: Fe + O₂ → Fe₂O₃', 'Oxygen is the awkward one: ==2 on the left, 3 on the right==. Find the ==lowest common multiple== (6).', 'Use the LCM of 2 and 3.', 'LCM of 2 and 3 is 6',

    { h: 'Predicting the products', table: [['Electrolyte', 'Cathode (−)', 'Anode (+)'], ['molten lead(II) bromide', 'lead', 'bromine'], ['molten sodium chloride', 'sodium', 'chlorine'], ['concentrated NaCl(aq) (brine)', 'hydrogen', 'chlorine (NaOH is left)'], ['CuSO₄(aq), graphite electrodes', 'copper', 'oxygen'], ['dilute H₂SO₄(aq)', 'hydrogen', 'oxygen']] },
    { h: 'Rules and uses', list: ['In a ==solution==: at the cathode, if the metal is ==more reactive than hydrogen==, ==hydrogen== forms. If the metal is ==less reactive== (like copper or silver), the ==metal== forms.', 'At the anode: ==halide ions (Cl⁻, Br⁻, I⁻) form the halogen==. Otherwise ==oxygen== forms from hydroxide ions or water.', '==Copper electrodes in copper(II) sulfate==: the anode ==dissolves==, copper is ==deposited== on the cathode. Used to ==purify copper== and for ==electroplating==.', '==Aluminium== is extracted by electrolysing ==aluminium oxide dissolved in molten cryolite== (lowers the melting point). Oxygen at the carbon anodes burns them away, so they must be replaced.', 'Tests: ==H₂ squeaky pop==, ==Cl₂ bleaches damp litmus==, ==O₂ relights a glowing splint==.'] }
  ],
  mistakes: ['Saying ==electrons flow through the electrolyte==. Ions carry the charge in the liquid; electrons flow in the wires.', 'Mixing up ==anode== and ==cathode==. Positive Anode, Negative Is Cathode (PANIC).', 'Forgetting ==hydrogen== forms at the cathode for reactive metals in solution.', 'Writing the ==wrong charge== on the electrons: they are on the ==left== for reduction, ==right== for oxidation.', 'Saying ==solid== ionic compounds conduct. The ions cannot move.'],
  diagrams: [{ svg: svgElectrolysis, cap: '==Cations → cathode (−)==, ==anions → anode (+)==.' }],
  worked: [
    W('Molten lead(II) bromide, PbBr₂, is electrolysed using graphite electrodes. State the products and write the half-equations.', 'Positive ions go to the ==cathode==, negative ions to the ==anode==.', 'The electrons go on the left for reduction and on the right for oxidation.', 'Cathode: gain electrons. Anode: lose electrons.',

      [['Ions', 'Pb²⁺, Br⁻', 0], ['Cathode', 'lead', 1], ['Anode', 'bromine', 2]]),

      [['Cathode', 'hydrogen', 1], ['Anode', 'chlorine', 2], ['Left', 'NaOH(aq)', 3]]),
    W('Copper(II) sulfate solution is electrolysed. Compare the products using (a) graphite electrodes (b) copper electrodes.', 'Look at ==what the anode is made of==.', 'Copper is below hydrogen, so copper forms at the cathode either way.', 'Inert anode v copper anode',
      [['Cathode (both cases)', 'Copper is deposited', 'Cu²⁺ + 2e⁻ → Cu. Copper is less reactive than hydrogen.'], ['(a) Graphite anode', 'Oxygen is given off', 'There is no halide, so OH⁻ forms oxygen. The blue colour fades as Cu²⁺ is used up.'], ['(b) Copper anode', 'The anode dissolves: Cu → Cu²⁺ + 2e⁻', 'The anode gets smaller.'], ['(b) Result', 'Copper moves from the anode to the cathode; the solution stays blue', 'This is how copper is purified.']],
      [['Cathode', 'copper', 0], ['(a) Anode', 'oxygen', 1], ['(b) Anode', 'dissolves', 2], ['(b) Result', 'copper transferred', 3]]),
    W('Describe how a metal spoon can be electroplated with silver.', 'The object to be plated is the ==cathode==. The ==plating metal is the anode==.', 'Use a solution containing ions of the plating metal.', 'Spoon at cathode',
      [['Cathode', 'The spoon', 'It must be connected to the negative terminal.'], ['Anode', 'A piece of silver', 'It dissolves: Ag → Ag⁺ + e⁻.'], ['Electrolyte', 'A solution of silver nitrate', 'It contains Ag⁺ ions.'], ['Result', 'Silver ions are reduced to a layer of silver on the spoon', 'Ag⁺ + e⁻ → Ag.']],
      [['Cathode', 'the spoon', 0], ['Anode', 'silver', 1], ['Solution', 'silver nitrate', 2], ['Result', 'silver layer', 3]], true),
    W('Explain how aluminium is extracted from aluminium oxide.', 'Mention ==molten cryolite==, ==graphite electrodes== and the products.', 'Aluminium is too reactive to be reduced by carbon.', 'Electrolysis of Al₂O₃ in cryolite',
      [['Why electrolysis', 'Aluminium is more reactive than carbon', 'Carbon cannot reduce its oxide.'], ['The electrolyte', 'Aluminium oxide dissolved in molten cryolite', 'Cryolite lowers the melting point, saving energy.'], ['Cathode', 'Aluminium forms: Al³⁺ + 3e⁻ → Al', 'It collects as molten metal at the bottom.'], ['Anode', 'Oxygen forms and burns the carbon anodes to CO₂', 'The anodes wear away and are replaced.']],

metals: {
  code: 'Topic 9', name: 'Metals and extraction',
  lede: 'The reactivity series decides how a metal is extracted, how it reacts and how it is protected.',
  learn: [
    { h: 'The reactivity series', list: ['In order: ==potassium, sodium, calcium, magnesium, aluminium, (carbon), zinc, iron, (hydrogen), copper, silver, gold==.', 'Metals above ==hydrogen== react with ==dilute acids== to give ==hydrogen==. Those above ==calcium== react with cold water; magnesium reacts with steam.', 'A more reactive metal ==displaces== a less reactive one from its compound.', '==Reactivity series check==: the more reactive the metal, the more easily it forms a ==positive ion== (loses electrons).'] },
    { h: 'Extraction of metals', list: ['Most metals are found as ==ores== (compounds). ==Gold== is found as the ==element==.', 'Metals ==below carbon== (zinc, iron, copper) are extracted by ==reduction with carbon==.', 'Metals ==above carbon== (aluminium, magnesium, sodium) are extracted by ==electrolysis==.', '==Blast furnace (iron)==: coke burns to give CO₂; CO₂ + C → 2CO; ==Fe₂O₃ + 3CO → 2Fe + 3CO₂==. Limestone removes ==sand (SiO₂)== as ==slag (CaSiO₃)==.'], f: ['Fe₂O₃ + 3CO → 2Fe + 3CO₂'] },
    { h: 'Alloys, uses and rusting', list: ['An ==alloy== is a ==mixture of a metal with another element==. Alloys are ==harder== than pure metals because the different-sized atoms ==distort the layers==, so they cannot slide.', '==Steel==: iron + carbon. ==Brass==: copper + zinc. ==Bronze==: copper + tin.', '==Aluminium==: low density, does not corrode (oxide layer): aircraft, cans. ==Copper==: good conductor, malleable: wires, pipes.', '==Rusting== needs ==oxygen and water==. Prevent with ==painting, oiling, plating, galvanising==.', '==Sacrificial protection==: zinc is more reactive than iron, so the zinc corrodes instead of the iron.'] }
  ],
  mistakes: ['Saying ==iron is extracted by electrolysis==. It is reduced by carbon.', 'Saying ==rusting needs only water==. It needs oxygen as well.', 'Saying ==carbon is more reactive than iron and all metals==. It sits between aluminium and zinc.', 'Forgetting that ==limestone removes impurities== (slag), it does not make iron.', 'Saying alloys are ==pure metals==. They are mixtures.'],
  diagrams: [{ svg: svgBlast, cap: 'The blast furnace: ==carbon monoxide reduces iron(III) oxide==.' }],
  worked: [
    W('Choose a method of extraction for (a) iron (b) aluminium (c) gold. Explain your choices.', 'Use the position relative to ==carbon== in the reactivity series.', 'Gold is so unreactive it is found as the metal.', 'Below carbon: reduce. Above: electrolyse.',
      [['(a) Iron', 'Reduction with carbon (or carbon monoxide)', 'Iron is below carbon in the series.'], ['(b) Aluminium', 'Electrolysis of molten aluminium oxide', 'Aluminium is above carbon, so carbon cannot reduce its oxide.'], ['(c) Gold', 'It is found as the uncombined metal', 'Gold is very unreactive.']],
      [['Iron', 'reduction with carbon', 0], ['Aluminium', 'electrolysis', 1], ['Gold', 'found native', 2]], true),
    W('Write the equation for the reduction of iron(III) oxide by carbon monoxide in the blast furnace. State what is oxidised and what is reduced.', '==Reduction is loss of oxygen==. Write the equation, then say which substance loses oxygen.', 'Iron(III) oxide loses oxygen; carbon monoxide gains oxygen.', 'Reduction = loss of oxygen',
      [['Equation', 'Fe₂O₃ + 3CO → 2Fe + 3CO₂', 'Check: 2 Fe, 3 C, 6 O on each side ✓.'], ['Reduced', 'Iron(III) oxide', 'It loses oxygen to become iron.'], ['Oxidised', 'Carbon monoxide', 'It gains oxygen to become carbon dioxide.']],
      [['Equation', 'Fe₂O₃ + 3CO → 2Fe + 3CO₂', 0], ['Reduced', 'Fe₂O₃', 1], ['Oxidised', 'CO', 2]]),
    W('Explain why limestone is added to the blast furnace.', 'Limestone removes the ==silica (sand)== impurity as ==slag==.', 'Give the two equations.', 'Limestone makes slag',
      [['Thermal decomposition', 'CaCO₃ → CaO + CO₂', 'The limestone breaks down in the heat.'], ['Calcium oxide reacts with sand', 'CaO + SiO₂ → CaSiO₃', 'Sand is an acidic impurity, CaO is a base.'], ['The product', 'Calcium silicate is slag', 'It melts, floats on the iron and is run off.']],
      [['Decomposition', 'CaCO₃ → CaO + CO₂', 0], ['Reaction', 'CaO + SiO₂ → CaSiO₃', 1], ['Product', 'slag', 2]], true),
    W('State the conditions needed for iron to rust and give two methods of preventing rusting.', 'Rusting needs ==oxygen== (air) and ==water==.', 'Prevention keeps air or water away, or uses a more reactive metal.', 'Oxygen + water',
      [['Conditions', 'Oxygen and water', 'Both are needed.'], ['Method 1: barrier', 'Painting, oiling or plastic coating', 'Keeps air and water away from the iron.'], ['Method 2: galvanising', 'Coating with zinc', 'Zinc is more reactive, so it corrodes first (sacrificial protection).']],
      [['Conditions', 'oxygen and water', 0], ['Barrier', 'paint or oil', 1], ['Galvanising', 'zinc coating', 2]], true),
    W('Explain why steel is harder than pure iron.', 'Link the ==atoms== to the ==layers== and how they ==slide==.', 'Name the added element.', 'Different-sized atoms distort the layers',
      [['Steel', 'An alloy of iron with a little carbon', ''], ['Pure iron', 'Layers of identical atoms can slide over each other easily', 'This makes it soft.'], ['In steel', 'The carbon atoms are a different size and distort the layers', ''], ['Result', 'The layers cannot slide, so steel is harder', '']],
      [['Steel', 'iron + carbon', 0], ['Pure iron', 'layers slide', 1], ['In steel', 'distorted layers', 2], ['Result', 'harder', 3]], true),
    W('A magnesium ribbon is placed in dilute hydrochloric acid and a copper strip in another tube. Predict what happens in each.', 'Magnesium is ==above hydrogen==, copper is ==below==.', 'Name the gas and the salt.', 'Above hydrogen reacts with acid',
      [['Magnesium', 'Fizzes and dissolves, hydrogen is given off', 'Mg + 2HCl → MgCl₂ + H₂'], ['Copper', 'No reaction', 'Copper is below hydrogen in the reactivity series.'], ['Test', 'The gas from the magnesium gives a squeaky pop with a lighted splint', 'This confirms hydrogen.']],
      [['Mg', 'fizzes, H₂', 0], ['Cu', 'no reaction', 1], ['Test', 'squeaky pop', 2]], true)

organics: {

    { h: 'Carboxylic acids', list: ['Ethanoic acid is ==CH₃COOH==. It is a ==weak acid== (only partly ionised in water).', 'It reacts like other acids: with ==metals== (hydrogen), ==carbonates== (carbon dioxide) and ==bases== (a salt: ethanoates).', 'Ethanol can be ==oxidised== to ethanoic acid (vinegar forms when wine goes sour).', 'A carboxylic acid reacts with an alcohol to make an ==ester== (sweet smell), used as flavourings and perfumes.'] },
    { h: 'Polymers', list: ['A ==polymer== is a ==long chain molecule== made by joining many small ==monomers==.', '==Addition polymerisation==: ==unsaturated monomers (with C=C)== join. The double bond opens. Only the polymer is made. Examples: ==poly(ethene)==, ==poly(propene)==, ==PVC==.', 'Many plastics are ==not biodegradable==: they stay in ==landfill== and harm ==wildlife== (animals eat or get trapped in them, litter in oceans).', '==Burning== plastics gives ==carbon dioxide== and ==toxic gases== (PVC gives hydrogen chloride). ==Recycling== saves crude oil.', '==Condensation polymers== (nylon, polyesters like PET) form with ==a small molecule (water) lost== each time two monomers join.'] }
  ],
  mistakes: ['Writing ==fermentation== needs oxygen. It is anaerobic.', 'Saying the monomer is the ==polymer==.', 'Forgetting the ==double bond opens== in addition polymerisation.', 'Saying plastics ==rot away==. Most are not biodegradable.', 'Saying ethanoic acid is a ==strong== acid.'],

      [['Sugar', 'glucose', 0], ['Catalyst', 'yeast', 1], ['Conditions', '25–35 °C, no oxygen', 2], ['Equation', 'C₆H₁₂O₆ → 2C₂H₅OH + 2CO₂', 3]], true),

      [['Anion', 'carbonate', 0], ['Cation', 'potassium', 1], ['Solid', 'K₂CO₃', 2]], true),

states: {
  code: 'Topic 1', name: 'States of matter and diffusion',
  lede: 'How particles are arranged and move in solids, liquids and gases, what happens at melting and boiling, why gases have pressure, and how diffusion works.',
  learn: [
    { h: 'Solids, liquids and gases', table: [['', 'Solid', 'Liquid', 'Gas'], ['arrangement', '==close together, regular pattern==', '==close together, random==', '==far apart, random=='], ['movement', '==vibrate about fixed positions==', '==slide past each other==', '==move fast in all directions=='], ['shape', 'fixed', 'takes the shape of the container', 'fills the container'], ['volume', 'fixed', 'fixed', 'not fixed'], ['compressed?', 'no', 'no (almost)', '==yes== (big gaps between particles)']], list: ['The ==kinetic particle theory== says all matter is made of ==tiny particles that are always moving==.', 'When the temperature rises, the particles gain ==kinetic energy== and move ==faster==.'] },
    { h: 'Changes of state', list: ['==Melting==: solid → liquid at the ==melting point==. ==Freezing==: liquid → solid.', '==Boiling==: liquid → gas ==throughout the liquid== at the ==boiling point==. ==Evaporation==: liquid → gas at the ==surface== at any temperature below the boiling point. ==Condensation==: gas → liquid.', '==Sublimation==: solid → gas without becoming a liquid (iodine, dry ice).', 'On a ==heating curve== the temperature stays ==constant== (flat part) while a substance melts or boils. The energy is used to ==break the forces between particles==, not to raise the temperature.', 'A ==pure substance== melts at a ==sharp melting point==. An ==impure substance== melts over a ==range of temperatures== and at a ==lower temperature==.'] },
    { h: 'Gas pressure', list: ['Gas particles move randomly and ==collide with the walls of the container==. These collisions cause ==gas pressure==.', '==Higher temperature==: particles move ==faster==, hit the walls ==harder and more often==, so the pressure ==increases== (volume fixed).', '==Smaller volume==: the same particles hit the walls ==more often==, so the pressure ==increases== (temperature fixed).', 'A gas can be ==compressed== because there are ==large spaces== between its particles.'] },
    { h: 'Diffusion', list: ['==Diffusion== is the ==net movement of particles from a region of higher concentration to a region of lower concentration==, because of their ==random movement==.', 'Diffusion is ==faster== at a ==higher temperature==.', 'Gases with a ==smaller relative molecular mass== (==lighter particles==) diffuse ==faster==. Hydrogen diffuses faster than oxygen.', 'Evidence: a drop of ink spreads out in water; brown ==bromine== vapour spreads through a jar of air.', 'Ammonia (Mr 17) and hydrogen chloride (Mr 36.5) in a tube: a ==white ring of ammonium chloride== forms ==closer to the hydrogen chloride end==, because the ==lighter ammonia diffuses faster==.'] }
  ],
  mistakes: ['Saying ==particles expand== when heated. They move faster and spread out; the particles themselves do not expand.', 'Saying the ==temperature rises== during melting. It stays constant.', 'Saying ==gas particles are lighter than liquid particles==. The particles are the same; only the arrangement and energy differ.', 'Mixing up ==evaporation== (surface, any temperature) and ==boiling== (throughout, at the boiling point).', 'Saying ==diffusion needs a force==. It happens because of random movement.'],

redox: {
  code: 'Topic 7', name: 'Redox, reversible reactions and industry',
  lede: 'Oxidation and reduction as electron transfer, how to spot oxidising and reducing agents, reversible reactions, the Haber and Contact processes, and hydrogen fuel cells.',
  learn: [
    { h: 'Oxidation and reduction', list: ['==Oxidation== is the ==gain of oxygen== or the ==loss of electrons==. ==Reduction== is the ==loss of oxygen== or the ==gain of electrons==. Remember ==OIL RIG==: Oxidation Is Loss, Reduction Is Gain (of electrons).', 'They always happen ==together==: a ==redox reaction==.', 'Example: ' + 'CuO' + ' + H₂ → Cu + H₂O. Copper oxide ==loses oxygen== (it is ==reduced==). Hydrogen ==gains oxygen== (it is ==oxidised==).', 'Example with electrons: Mg + Cu²⁺ → Mg²⁺ + Cu. Mg ==loses== 2 electrons (oxidised). Cu²⁺ ==gains== 2 electrons (reduced).'] },
    { h: 'Oxidising and reducing agents', list: ['An ==oxidising agent== ==oxidises== another substance. It is ==itself reduced== (it gains electrons).', 'A ==reducing agent== ==reduces== another substance. It is ==itself oxidised== (it loses electrons).', 'In the blast furnace, ==carbon monoxide== is the reducing agent: it reduces iron(III) oxide to iron.', '==Test for a reducing agent==: acidified ==potassium manganate(VII)== changes from ==purple to colourless==.', '==Test for an oxidising agent==: ==potassium iodide== solution changes from ==colourless to brown==.'] },
    { h: 'Reversible reactions', list: ['In a ==reversible reaction== the products can react to form the reactants again. The sign is ==⇌==.', 'Example: ==hydrated copper(II) sulfate (blue) ⇌ anhydrous copper(II) sulfate (white) + water==. Heating drives it one way; adding water drives it back.', 'Example: ammonium chloride ⇌ ammonia + hydrogen chloride.', 'In a ==closed system== the reaction reaches ==equilibrium==: the ==forward and reverse reactions happen at the same rate==, so the ==concentrations stay constant==.'] },
    { h: 'The Haber process and the Contact process', table: [['', 'Haber process', 'Contact process'], ['makes', '==ammonia (NH₃)==', '==sulfuric acid (H₂SO₄)=='], ['reaction', 'N₂ + 3H₂ ⇌ 2NH₃', '2SO₂ + O₂ ⇌ 2SO₃'], ['temperature', '==450 °C==', '==450 °C=='], ['pressure', '==200 atm==', '==2 atm== (low)'], ['catalyst', '==iron==', '==vanadium(V) oxide==']], list: ['Haber: nitrogen from the ==air==, hydrogen from ==natural gas==. ==Unreacted gases are recycled==. Ammonia is ==cooled and liquefied==.', 'Contact: sulfur (or sulfide ores) is burned to make ==sulfur dioxide==. After the reaction, SO₃ is dissolved in ==concentrated sulfuric acid== to make ==oleum==, which is then diluted with water.', '(Extended) A ==higher pressure== gives more ammonia, but is expensive. A ==higher temperature== is ==faster== but gives ==less ammonia== because the forward reaction is exothermic: 450 °C is a ==compromise==.', 'Uses: ammonia for ==fertilisers==; sulfuric acid for ==fertilisers, detergents, paints and batteries==.'] },
    { h: 'Hydrogen–oxygen fuel cells', list: ['A ==fuel cell== uses the reaction between ==hydrogen and oxygen== to make ==electricity==: 2H₂ + O₂ → 2H₂O.', 'The ==only product is water==, so there is no carbon dioxide or air pollution at the point of use.', '==Advantages==: efficient, ==no pollutants==, quiet. ==Disadvantages==: hydrogen is ==flammable== and ==hard to store==, and making hydrogen needs energy.'] }
  ],
  mistakes: ['Saying ==oxidation is gain of electrons==. Remember OIL RIG: Oxidation Is ==Loss==.', 'Saying the ==oxidising agent is oxidised==. It is ==reduced==.', 'Saying ==the reaction stops at equilibrium==. Both reactions continue at the same rate.', 'Mixing up the ==catalysts==: Haber = iron; Contact = vanadium(V) oxide.', 'Saying a fuel cell ==burns== hydrogen. It reacts hydrogen with oxygen to give electricity.'],
  diagrams: [
    { svg: svgRedox, cap: '==Oxidation is loss== of electrons. ==Reduction is gain==.' },
    { svg: svgHaber, cap: 'The ==Haber process==: the reaction is ==reversible== and ==unreacted gases are recycled==.' }
  ],
  worked: [
    W('In the reaction Fe₂O₃ + 3CO → 2Fe + 3CO₂, state which substance is oxidised and which is reduced. Name the reducing agent.', 'Follow the ==oxygen==. Which substance ==loses== it, which ==gains== it?', 'The reducing agent is the one that is oxidised.', 'lose oxygen = reduced',
      [['Iron(III) oxide', 'Fe₂O₃ loses oxygen to become Fe.', 'Loss of oxygen is reduction.'], ['Carbon monoxide', 'CO gains oxygen to become CO₂.', 'Gain of oxygen is oxidation.'], ['Reduced', 'Fe₂O₃ is reduced.', ''], ['Oxidised', 'CO is oxidised.', ''], ['Reducing agent', 'CO, because it is oxidised and reduces the iron oxide.', '']],
      [['Fe₂O₃', 'reduced', 2], ['CO', 'oxidised', 3], ['Reducing agent', 'CO', 4]], true),
    W('Magnesium is added to aqueous copper(II) sulfate. The ionic equation is Mg + Cu²⁺ → Mg²⁺ + Cu. Use electrons to explain which species is oxidised and which is reduced.', 'Write the ==half-equations== and count electrons.', 'Loss of electrons = oxidation.', 'OIL RIG',
      [['Magnesium', 'Mg → Mg²⁺ + 2e⁻. Mg loses two electrons.', 'Loss of electrons: oxidation.'], ['Copper ions', 'Cu²⁺ + 2e⁻ → Cu. Cu²⁺ gains two electrons.', 'Gain of electrons: reduction.'], ['Conclusion', 'Mg is oxidised. Cu²⁺ is reduced.', ''], ['Agents', 'Mg is the reducing agent. Cu²⁺ is the oxidising agent.', '']],
      [['Mg', 'loses 2e⁻, oxidised', 0], ['Cu²⁺', 'gains 2e⁻, reduced', 1], ['Reducing agent', 'Mg', 3]], true),
    W('Acidified potassium manganate(VII) is added to a solution of substance X. The purple colour disappears. What does this show?', 'The change is ==purple → colourless==.', 'Say what kind of agent X is.', 'purple → colourless = reducing agent',
      [['Observation', 'Purple changes to colourless.', ''], ['Meaning', 'Manganate(VII) is reduced (it gains electrons).', ''], ['Conclusion', 'X is a reducing agent: it is oxidised.', 'It gave electrons to the manganate(VII).']],
      [['Colour', 'purple → colourless', 0], ['MnO₄⁻', 'reduced', 1], ['X', 'reducing agent', 2]], true),
    W('State the conditions used in the Haber process and give a reason for each.', 'Give ==temperature, pressure and catalyst== and say why.', 'Mention recycling.', 'N₂ + 3H₂ ⇌ 2NH₃',
      [['Temperature', '450 °C. A high temperature gives a fast rate, but too high gives less ammonia.', 'A compromise.'], ['Pressure', '200 atm. High pressure gives more ammonia and a faster rate.', 'Very high pressure is too expensive.'], ['Catalyst', 'Iron. It speeds up the reaction without being used up.', ''], ['Recycling', 'Unreacted nitrogen and hydrogen are recycled to save raw materials.', '']],
      [['Temperature', '450 °C', 0], ['Pressure', '200 atm', 1], ['Catalyst', 'iron', 2], ['Recycle', 'unreacted gases', 3]], true),
    W('Give two advantages and one disadvantage of a hydrogen–oxygen fuel cell car compared with a petrol car.', 'Think about ==pollution==, ==efficiency== and ==storing hydrogen==.', 'Each point needs a reason.', 'water only',
      [['Advantage 1', 'The only product is water, so no carbon dioxide or pollutants are made by the car.', ''], ['Advantage 2', 'Fuel cells are more efficient / quieter than a petrol engine.', ''], ['Disadvantage', 'Hydrogen is flammable and difficult to store, and it takes energy to make.', '']],
      [['Advantage 1', 'no CO₂', 0], ['Advantage 2', 'efficient', 1], ['Disadvantage', 'hydrogen storage', 2]], true)
  ],
  drill: 'redox',
  quiz: [
    { q: 'Oxidation is…', o: ['gain of electrons', 'loss of electrons', 'loss of oxygen', 'gain of hydrogen'], a: 1, w: 'OIL RIG: Oxidation Is ==Loss== of electrons.' },
    { q: 'In CuO + H₂ → Cu + H₂O, which substance is reduced?', o: ['CuO', 'H₂', 'Cu', 'H₂O'], a: 0, w: 'CuO ==loses oxygen==: reduced.' },
    { q: 'Acidified potassium manganate(VII) turns from purple to colourless. This shows a…', o: ['oxidising agent', 'reducing agent', 'base', 'catalyst'], a: 1, w: 'A ==reducing agent== is present.' },
    { q: 'The catalyst in the Haber process is…', o: ['vanadium(V) oxide', 'iron', 'platinum', 'nickel'], a: 1, w: '==Iron==.' },
    { q: 'The symbol ⇌ shows that a reaction is…', o: ['very fast', 'reversible', 'exothermic', 'complete'], a: 1, w: '==Reversible==.' },
    { q: 'The only product of a hydrogen–oxygen fuel cell is…', o: ['carbon dioxide', 'water', 'ammonia', 'hydrogen peroxide'], a: 1, w: '==Water==.' },
    { q: 'At equilibrium in a closed system…', o: ['the reactions stop', 'the forward and reverse rates are equal', 'only the forward reaction happens', 'the reactants are used up'], a: 1, w: 'The ==rates are equal==.' },
    { q: 'Sulfuric acid is made in the…', o: ['Haber process', 'Contact process', 'Blast furnace', 'Cracking process'], a: 1, w: 'The ==Contact process==.' }
  ],
  exam: [
    { q: 'Define oxidation and reduction in terms of electrons. Give a reaction that shows both.', m: 4,
      p: ['oxidation is ==loss of electrons==', 'reduction is ==gain of electrons==', 'an example such as Mg + Cu²⁺ → Mg²⁺ + Cu', 'identifies which species is oxidised and which is reduced'] },
    { q: 'Describe the manufacture of ammonia by the Haber process. Include the conditions and what happens to unreacted gases.', m: 5,
      p: ['==nitrogen and hydrogen== are the reactants', '==iron catalyst==', '==450 °C==', '==200 atm== / high pressure', '==unreacted gases are recycled== and ammonia is liquefied by cooling'] },
    { q: 'Explain what is meant by a reversible reaction and give one example.', m: 3,
      p: ['the products can ==react to form the reactants== again', 'the reaction can go in ==both directions== (⇌)', 'example: hydrated copper(II) sulfate ⇌ anhydrous copper(II) sulfate + water (or ammonium chloride ⇌ ammonia + hydrogen chloride)'] }
  ]
},
emp: {
  code: 'Topic 3', name: 'Empirical formulae and percentage calculations',
  lede: 'Find the percentage of an element in a compound, work out an empirical formula from masses or percentages, find the molecular formula, and calculate percentage yield and purity. (Extended)',
  learn: [
    { h: 'Percentage by mass of an element', f: ['% of an element = (Ar × number of atoms) ÷ Mr × 100'], list: ['First work out the ==relative formula mass (Mr)== by adding the Ar values.', 'Example: ammonium nitrate NH₄NO₃: Mr = 14 + 4 + 14 + 48 = ==80==. Nitrogen: (14 × 2) ÷ 80 × 100 = ==35 %==.', 'Check: the percentages of all the elements ==add up to 100 %==.', 'Mass of an element in a sample = ==percentage × mass of sample==.'] },
    { h: 'Empirical formula', list: ['The ==empirical formula== is the ==simplest whole-number ratio of atoms== of each element in a compound.', 'Method: 1. Write the ==masses== (or percentages). 2. ==Divide each by its Ar== to get moles. 3. ==Divide all by the smallest== number. 4. If needed, ==multiply== to get whole numbers (1.5 → ×2).', 'The ==molecular formula== is the ==actual number of atoms== in one molecule. ==molecular formula = n × empirical formula==, where ==n = Mr ÷ empirical formula mass==.', 'Example: empirical formula CH₂ (mass 14) and Mr 56: n = 56 ÷ 14 = 4, so the molecular formula is ==C₄H₈==.'] },
    { h: 'Percentage yield and purity', f: ['% yield = actual yield ÷ theoretical yield × 100', '% purity = mass of pure substance ÷ mass of sample × 100'], list: ['The ==theoretical yield== is the maximum mass possible from the equation. The ==actual yield== is what you really get.', 'The yield is always ==less than 100 %== in practice: the reaction may be ==reversible==, some product is ==lost== in transfers, or there are ==side reactions==.', '==Purity== tells you how much of a sample is the wanted substance.'] }
  ],
  mistakes: ['Dividing by ==Mr instead of Ar== when finding moles of each element.', 'Forgetting to ==divide by the smallest== number.', 'Writing ==1.5 : 1== as the answer instead of ==3 : 2==.', 'Using the ==empirical formula mass== as Mr.', 'Writing a ==yield over 100 %== without checking.'],
  diagrams: [{ svg: svgEmpirical, cap: '==Empirical formula== in four steps.' }],
  worked: [
    W('Calculate the percentage by mass of nitrogen in ammonium nitrate, NH₄NO₃. (Ar: H = 1, N = 14, O = 16)', 'Work out ==Mr== first, then use the formula.', 'There are two N atoms in the formula.', '% = Ar × atoms ÷ Mr × 100',
      [['Mr', '14 + (4 × 1) + 14 + (3 × 16) = 80', 'NH₄NO₃ has 2 N, 4 H and 3 O.'], ['N in the formula', '2 × 14 = 28', ''], ['Fraction', '28 ÷ 80', ''], ['Percentage', '28 ÷ 80 × 100 = 35 %', '']],
      [['Mr', '80', 0], ['Mass of N', '28', 1], ['% N', '35 %', 3]]),
    W('A compound contains 40.0 % carbon, 6.7 % hydrogen and 53.3 % oxygen by mass. Find its empirical formula. (Ar: H = 1, C = 12, O = 16)', '==Divide by Ar==, then ==divide by the smallest==.', 'Treat each percentage as a mass in 100 g.', 'ratio of moles',
      [['Moles of C', '40.0 ÷ 12 = 3.33', ''], ['Moles of H', '6.7 ÷ 1 = 6.7', ''], ['Moles of O', '53.3 ÷ 16 = 3.33', ''], ['Divide by the smallest (3.33)', 'C : H : O = 1 : 2 : 1', ''], ['Empirical formula', 'CH₂O', '']],
      [['C', '3.33', 0], ['H', '6.7', 1], ['O', '3.33', 2], ['Ratio', '1 : 2 : 1', 3], ['Formula', 'CH₂O', 4]]),
    W('A sample of an iron oxide contains 70 % iron and 30 % oxygen by mass. Find its empirical formula. (Ar: Fe = 56, O = 16)', 'The ratio is not whole numbers after dividing, so ==multiply==.', 'Look for 1.5 and multiply by 2.', '1 : 1.5 → 2 : 3',
      [['Moles of Fe', '70 ÷ 56 = 1.25', ''], ['Moles of O', '30 ÷ 16 = 1.875', ''], ['Divide by 1.25', 'Fe : O = 1 : 1.5', ''], ['Multiply by 2', 'Fe : O = 2 : 3', 'Whole numbers.'], ['Formula', 'Fe₂O₃', '']],
      [['Fe', '1.25', 0], ['O', '1.875', 1], ['Ratio', '1 : 1.5', 2], ['×2', '2 : 3', 3], ['Formula', 'Fe₂O₃', 4]]),
    W('A hydrocarbon has the empirical formula CH₂ and a relative molecular mass of 56. Find its molecular formula.', 'Find ==n== = Mr ÷ mass of the empirical formula.', 'Then multiply every number in the formula by n.', 'n = Mr ÷ empirical mass',
      [['Empirical formula mass', 'CH₂: 12 + 2 = 14', ''], ['n', '56 ÷ 14 = 4', ''], ['Molecular formula', '4 × CH₂ = C₄H₈', '']],
      [['Empirical mass', '14', 0], ['n', '4', 1], ['Formula', 'C₄H₈', 2]]),
    W('In an experiment, the theoretical yield of a product is 25.0 g. The actual yield is 20.0 g. Calculate the percentage yield. Give one reason it is less than 100 %.', 'Use ==actual ÷ theoretical × 100==.', 'Give a reason.', '% yield = actual ÷ theoretical × 100',
      [['Formula', '% yield = actual yield ÷ theoretical yield × 100', ''], ['Substitute', '20.0 ÷ 25.0 × 100', ''], ['Answer', '80 %', ''], ['Reason', 'Some product was lost during filtering and transfers (or the reaction is reversible).', '']],
      [['Actual', '20.0 g', -1], ['Theoretical', '25.0 g', -1], ['% yield', '80 %', 2]]),
    W('What mass of magnesium is in 15 g of magnesium oxide, MgO? (Ar: Mg = 24, O = 16)', 'Find the ==percentage== of Mg first.', 'Then take that percentage of the sample.', '% × mass',
      [['Mr of MgO', '24 + 16 = 40', ''], ['% Mg', '24 ÷ 40 × 100 = 60 %', ''], ['Mass of Mg', '60 % × 15 g = 0.60 × 15', ''], ['Answer', '9.0 g', '']],
      [['Mr', '40', 0], ['% Mg', '60 %', 1], ['Mass of Mg', '9.0 g', 3]])
  ],

},
fert: {
  code: 'Topic 10', name: 'Fertilisers and the environment',
  lede: 'Why plants need nitrogen, phosphorus and potassium, how fertilisers are made, and the damage they cause to rivers when too much is used.',
  learn: [
    { h: 'NPK fertilisers', list: ['Plants need ==nitrogen (N)==, ==phosphorus (P)== and ==potassium (K)== to grow well. Fertilisers supply them. A fertiliser containing all three is an ==NPK fertiliser==.', '==Nitrogen== makes ==proteins== and leaf growth. ==Phosphorus== helps ==root growth== and energy. ==Potassium== helps ==flowers, fruit== and resistance to disease.', 'Common fertilisers: ==ammonium nitrate NH₄NO₃== (35 % N), ==ammonium sulfate (NH₄)₂SO₄==, ==urea CO(NH₂)₂==, ==potassium nitrate KNO₃== (N and K), ==ammonium phosphate== (N and P), ==potassium chloride KCl== (K).', 'Soluble compounds are needed so that the nutrients ==dissolve in water in the soil== and can be absorbed by roots.'] },
    { h: 'Making fertilisers', list: ['Ammonium salts are made by ==neutralising== ammonia (an alkali) with an acid.', '==ammonia + nitric acid → ammonium nitrate==: NH₃ + HNO₃ → NH₄NO₃.', '==ammonia + sulfuric acid → ammonium sulfate==: 2NH₃ + H₂SO₄ → (NH₄)₂SO₄.', 'The ammonia is made in the ==Haber process==.', '==Do not mix ammonium fertilisers with lime== (calcium oxide or hydroxide). The alkali ==releases ammonia gas==, so ==nitrogen is lost== from the soil.'] },
    { h: 'Eutrophication', list: ['==Too much fertiliser== is washed (==runoff==) into rivers and lakes. ==Nitrates and phosphates== make ==algae== grow very fast (an ==algal bloom==).', 'The algae ==block the light==, so plants under the surface ==die==. ==Bacteria decompose== the dead plants and algae and ==use up the oxygen== in the water.', 'Fish and other animals ==die from lack of oxygen==. This is ==eutrophication==.', 'Reducing the problem: use ==less fertiliser==, apply it ==at the right time==, avoid spreading near water.'] }
  ],
  mistakes: ['Saying ==fertilisers kill fish directly==. The oxygen shortage kills them.', 'Mixing up the ==roles== of N, P and K.', 'Forgetting to say ==bacteria use up oxygen== in eutrophication.', 'Writing ==ammonium nitrate is made by adding nitrogen to ammonia==. It is made by neutralisation.', 'Saying ==ammonium fertiliser can be mixed with lime==.'],
  diagrams: [{ svg: svgEutroChem, cap: '==Eutrophication==: from fertiliser to dead fish.' }],
  worked: [
    W('State why plants need nitrogen, phosphorus and potassium.', 'Give one ==use== of each.', 'Use the memory N for leaves, P for roots, K for flowers.', 'N, P, K',
      [['Nitrogen', 'To make proteins and for healthy leaf growth.', ''], ['Phosphorus', 'For root growth and energy transfer.', ''], ['Potassium', 'For flowers and fruit and to resist disease.', '']],
      [['N', 'proteins, leaves', 0], ['P', 'roots, energy', 1], ['K', 'flowers, fruit', 2]], true),
    W('Write the equation for the formation of ammonium nitrate from ammonia and nitric acid. Name the type of reaction.', 'Ammonia is an ==alkali==, nitric acid is an ==acid==.', 'Balance it: 1 NH₃ with 1 HNO₃.', 'alkali + acid → salt',
      [['Reactants', 'NH₃ and HNO₃', ''], ['Product', 'The salt ammonium nitrate, NH₄NO₃', ''], ['Equation', 'NH₃ + HNO₃ → NH₄NO₃', 'Already balanced.'], ['Type', 'Neutralisation', 'Acid + alkali → salt.']],
      [['Reactants', 'NH₃ + HNO₃', 0], ['Equation', 'NH₃ + HNO₃ → NH₄NO₃', 2], ['Type', 'neutralisation', 3]], true),
    W('Explain why a farmer should not add lime and ammonium sulfate to the soil at the same time.', 'Lime is a ==base==. Ammonium salts react with ==bases==.', 'Say what is lost.', 'base + ammonium salt → ammonia',
      [['Lime', 'Lime (calcium oxide or hydroxide) is a base.', ''], ['Reaction', 'Ammonium salts react with a base to release ammonia gas.', ''], ['Result', 'The ammonia escapes into the air, so the nitrogen is lost from the soil.', 'The fertiliser is wasted.']],
      [['Lime', 'a base', 0], ['Reaction', 'releases NH₃', 1], ['Result', 'nitrogen lost', 2]], true),
    W('Explain how too much fertiliser in a river can kill fish.', 'Follow the ==chain==: nutrients → algae → light → decay → oxygen.', 'Use the words bacteria and oxygen.', 'eutrophication',
      [['Runoff', 'Fertiliser is washed into the river.', ''], ['Algae', 'Nitrates and phosphates make algae grow very fast.', ''], ['Light', 'The algae block light, so plants below die.', ''], ['Decay', 'Bacteria decompose the dead plants and use up the oxygen.', ''], ['Fish', 'Fish die because of the lack of oxygen.', '']],
      [['Runoff', 'fertiliser', 0], ['Algae', 'bloom', 1], ['Plants', 'die', 2], ['Oxygen', 'used by bacteria', 3], ['Fish', 'die', 4]], true),
    W('Calculate the percentage by mass of nitrogen in urea, CO(NH₂)₂. (Ar: H = 1, C = 12, N = 14, O = 16)', 'Count the ==two N atoms== in the formula.', 'Mr first.', '% N = 28 ÷ Mr × 100',
      [['Mr', '12 + 16 + 2 × (14 + 2) = 60', 'CO(NH₂)₂ has 1 C, 1 O, 2 N, 4 H.'], ['N', '2 × 14 = 28', ''], ['Percentage', '28 ÷ 60 × 100 = 46.7 %', '3 s.f.']],
      [['Mr', '60', 0], ['N', '28', 1], ['% N', '46.7 %', 2]])
  ],
  drill: 'fert',
  quiz: [
    { q: 'Which element in fertilisers helps root growth?', o: ['nitrogen', 'phosphorus', 'potassium', 'sulfur'], a: 1, w: '==Phosphorus==.' },
    { q: 'Which fertiliser contains both nitrogen and potassium?', o: ['ammonium nitrate', 'potassium chloride', 'potassium nitrate', 'ammonium sulfate'], a: 2, w: '==Potassium nitrate== (KNO₃).' },
    { q: 'Ammonium nitrate is made by reacting ammonia with…', o: ['nitric acid', 'sulfuric acid', 'hydrochloric acid', 'sodium hydroxide'], a: 0, w: '==Nitric acid==.' },
    { q: 'What causes the oxygen level in a river to fall in eutrophication?', o: ['fish breathing', 'bacteria decomposing dead plants and algae', 'algae making oxygen', 'rain'], a: 1, w: '==Bacteria== decomposing dead material use up oxygen.' },
    { q: 'Why should ammonium fertilisers not be mixed with lime?', o: ['they form a precipitate', 'ammonia gas is released, so nitrogen is lost', 'they explode', 'lime is not soluble'], a: 1, w: 'Ammonia gas is released: ==nitrogen is lost==.' },

  exam: [

    { q: 'Write the equation for the reaction of ammonia with sulfuric acid to make ammonium sulfate.', m: 2,
