<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chemistry Full-Year Pack</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: lab-notebook study app — sticky chapter bar, one column of working cards on a faint graph-paper ground (shared with the Physics pack) */
:root{
  --paper:#EEF3F6; --card:#FFFFFF; --ink:#132235; --muted:#56687C; --line:#D3DDE6; --grid:rgba(19,34,53,.045);
  --accent:#0A6C96; --accent-soft:#E1F0F7; --hot:#D2470E; --hot-soft:#FCE9E0;
  --kw-bg:#FFE45C; --kw-ink:#132235;
  --good:#2B8A3E; --good-soft:#E3F4E6; --bad:#C92A2A; --bad-soft:#FBE4E4;
  --water:#DCEEF6; --cu:#4A9BD8; --copper:#B4602B; --zinc:#A3ADB8; --ppt:#F2E6A0; --noble:#E6F2E0;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root{
  --paper:#0E1620; --card:#16212D; --ink:#E5EDF4; --muted:#93A4B6; --line:#2A3949; --grid:rgba(229,237,244,.035);
  --accent:#5DB8E2; --accent-soft:#16344A; --hot:#FF8C55; --hot-soft:#3E2216;
  --kw-bg:#6B5A00; --kw-ink:#FFF3B0;
  --good:#69DB7C; --good-soft:#173322; --bad:#FF8787; --bad-soft:#3D1C1C;
  --water:#1B3A4D; --cu:#2F7DBA; --copper:#D07A40; --zinc:#6C7884; --ppt:#6B6232; --noble:#1D3322; color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px}
.wrap{max-width:900px;margin:0 auto;padding-inline:16px;padding-block:0 64px}
h1,h2,h3{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0}
h2{font-size:1.6rem;font-weight:800}
h3{font-size:1.15rem;font-weight:600}
p{margin:0}
mark.kw{background:var(--kw-bg);color:var(--kw-ink);padding:0 .2em;border-radius:3px;font-weight:700;box-decoration-break:clone;-webkit-box-decoration-break:clone}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.top{position:sticky;top:0;z-index:10;background:var(--paper);border-bottom:1px solid var(--line)}
.top .wrap{padding-block:12px 10px;display:flex;flex-direction:column;gap:10px}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand h1{font-size:1.35rem;font-weight:800;letter-spacing:-.01em}
.brand h1 span{color:var(--accent)}
.examdate{font-family:var(--mono);font-size:.78rem;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;text-decoration:none}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 16px;font-weight:700;font-size:.95rem}
.tab small{font-family:var(--mono);font-weight:400;color:var(--muted);margin-right:6px;font-size:.75rem}
.tab[aria-selected="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tab[aria-selected="true"] small{color:inherit;opacity:.7}
.sub{display:flex;gap:4px;flex-wrap:wrap;margin-block:20px 18px;border-bottom:2px solid var(--line)}
.subtab{border:0;background:none;padding:10px 12px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px}
.subtab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.chhead{display:flex;flex-direction:column;gap:6px;margin-top:22px}
.eyebrow{font-family:var(--mono);font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.lede{color:var(--muted);max-width:62ch}
.stack{display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px 20px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px}
.formula{font-family:var(--mono);font-size:1.05rem;font-weight:600;background:var(--accent-soft);color:var(--ink);border-radius:8px;padding:10px 14px;align-self:flex-start;max-width:100%;overflow-x:auto;display:flex;flex-direction:column;gap:4px}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;font-size:.95rem;min-width:100%}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:7px 12px 7px 0;text-align:left;vertical-align:top}
.tbl th{font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.mistakes{background:var(--hot-soft);border-color:transparent}
.mistakes h3{color:var(--hot)}
figure{margin:0;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px}
figure .svgbox{overflow-x:auto}
figure svg{display:block;width:100%;min-width:440px;height:auto}
figcaption{font-size:.95rem}
svg .ln{stroke:var(--ink);stroke-width:2;fill:none}
svg .thin{stroke:var(--muted);stroke-width:1;fill:none}
svg .glass{stroke:var(--ink);stroke-width:2;fill:none}
svg .acc{stroke:var(--accent);stroke-width:2.5;fill:none}
svg .hotl{stroke:var(--hot);stroke-width:2.5;fill:none}
svg .accf{fill:var(--accent)}
svg .hotf{fill:var(--hot)}
svg .inkf{fill:var(--ink)}
svg .cardf{fill:var(--card)}
svg .shell{fill:none;stroke:var(--muted);stroke-width:1.4}
svg .atom{fill:var(--card);stroke:var(--ink);stroke-width:1.8}
svg .nuc{fill:var(--accent-soft);stroke:var(--ink);stroke-width:1.4}
svg .cross{stroke:var(--hot);stroke-width:2.4}
svg .metal{fill:var(--accent-soft);stroke:var(--line)}
svg .nonmetal{fill:var(--card);stroke:var(--line)}
svg .noble{fill:var(--noble);stroke:var(--line)}
svg .cuf{fill:var(--cu)}
svg .waterf{fill:var(--water)}
svg .copperf{fill:var(--copper)}
svg .zincf{fill:var(--zinc);stroke:var(--ink);stroke-width:1.2}
svg .pptf{fill:var(--ppt);stroke:var(--ink);stroke-width:1}
svg text{fill:var(--ink);font-family:var(--body);font-size:13px}
svg .lbl{font-weight:700}
svg .sym{font-family:var(--display);font-weight:800;font-size:22px;text-anchor:middle}
svg .mid{text-anchor:middle}
svg .end{text-anchor:end}
svg .mut{fill:var(--muted)}
svg .acct{fill:var(--accent);font-weight:700}
svg .hott{fill:var(--hot);font-weight:700}
svg .mono{font-family:var(--mono)}
.q{font-weight:700}
.steps{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px;counter-reset:s}
.steps li{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:baseline;counter-increment:s}
.steps li::before{content:counter(s);font-family:var(--mono);font-size:.8rem;font-weight:600;width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--card);display:grid;place-items:center;grid-row:span 2}
.steps .sl{font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.steps .st{font-family:var(--mono);font-size:1rem;min-width:0;overflow-wrap:anywhere}
.steps li.final .st{font-weight:700;color:var(--good)}
.steps .prose{font-family:var(--body)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:9px 16px;font-weight:700}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--card)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:default}
.drillq{font-size:1.1rem}
.answer{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.answer input{font:inherit;font-family:var(--mono);font-size:1.1rem;padding:9px 12px;border:2px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);width:12ch}
.unit{font-family:var(--mono);color:var(--muted)}
.fb{border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.fb.ok{background:var(--good-soft)}
.fb.no{background:var(--bad-soft)}
.fb .verdict{font-weight:700}
.fb.ok .verdict{color:var(--good)}
.fb.no .verdict{color:var(--bad)}
.stat{font-family:var(--mono);font-size:.85rem;color:var(--muted)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:8px}
.opt{text-align:left;border:2px solid var(--line);background:var(--paper);border-radius:8px;padding:10px 14px;font-weight:400}
.opt.right{border-color:var(--good);background:var(--good-soft);font-weight:700}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.why{font-size:.95rem;border-left:3px solid var(--accent);padding-left:12px}
.scorebar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.big-score{font-family:var(--display);font-size:1.8rem;font-weight:800}
.qhead{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.marks{font-family:var(--mono);font-size:.85rem;color:var(--muted);white-space:nowrap}
.ms{display:flex;flex-direction:column;gap:6px}
.ms-intro{font-size:.9rem;color:var(--muted)}
.point{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:10px 12px;font-weight:400}
.point .box{width:24px;height:24px;border:2px solid var(--muted);border-radius:6px;display:grid;place-items:center;font-weight:700;color:var(--card)}
.point[aria-pressed="true"]{border-color:var(--good)}
.point[aria-pressed="true"] .box{background:var(--good);border-color:var(--good)}
.got{font-family:var(--mono);font-weight:600}
.note{font-size:.9rem;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:14px}
.prog{display:flex;flex-direction:column;gap:6px}
.bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.bar > i{display:block;height:100%;background:var(--accent);border-radius:5px}
.pl{display:flex;justify-content:space-between;font-size:.9rem;gap:8px}
.pl span:last-child{font-family:var(--mono);color:var(--muted);white-space:nowrap}
.cw{display:grid;grid-template-columns:auto 1fr;gap:6px 14px}
.cw dt{font-weight:700;color:var(--accent)}
.cw dd{margin:0}
.plan{display:flex;flex-direction:column;border-left:2px solid var(--line);margin-left:6px}
.plan div{position:relative;padding:0 0 12px 18px}
.plan div::before{content:"";position:absolute;left:-7px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--card);border:2px solid var(--accent)}
.plan b{font-family:var(--mono);font-size:.82rem;color:var(--muted);display:block;font-weight:600}
.timer{font-family:var(--mono);font-size:2.2rem;font-weight:600;font-variant-numeric:tabular-nums}
.timer.low{color:var(--hot)}
a{color:var(--accent)}
@media (prefers-reduced-motion: no-preference){.fadein{animation:fi .25s ease-out}@keyframes fi{from{transform:translateY(4px)}to{transform:none}}}
.intro{background:var(--accent-soft);border-radius:8px;padding:10px 14px;font-size:.98rem;margin:0}
.steps .why2{grid-column:2;font-family:var(--body);font-size:.93rem;color:var(--muted);border-left:3px solid var(--line);padding-left:10px}
.steps li.now .st{color:var(--ink)}
.tip{background:var(--kw-bg);color:var(--kw-ink);border-radius:8px;padding:10px 14px;font-size:.95rem;margin:0}
.tip mark.kw{background:transparent;padding:0;text-decoration:underline}
.wk-split{display:grid;grid-template-columns:minmax(0,1fr) minmax(250px,330px);grid-template-areas:"steps board";gap:18px;align-items:start}
.wk-split .steps{grid-area:steps}
.wk-split .board{grid-area:board;position:sticky;top:150px;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0;overflow-x:auto}
@media (max-width:700px){.wk-split{grid-template-columns:minmax(0,1fr);grid-template-areas:"board" "steps"}.wk-split .board{top:118px;z-index:2}}
.wb{border-collapse:collapse;font-size:.88rem;width:100%}
.wb th,.wb td{border:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top;background:var(--card)}
.wb th{color:var(--muted);font-weight:400;white-space:nowrap;width:1%}
.wb td{font-family:var(--mono);overflow-wrap:anywhere}
.wb td.q{color:var(--muted);font-weight:400}
.wb td.fill{background:var(--good-soft);color:var(--good);font-weight:700}
.wb tr.cur th,.wb tr.cur td{outline:2px solid var(--hot);outline-offset:-2px}
.bnote{font-size:.9rem;margin:0}
.tabwrap{display:flex;align-items:center;gap:6px;min-width:0}
.tabwrap .tabs{flex:1;min-width:0;scroll-behavior:smooth}
.tabarrow{flex:0 0 auto;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:1.3rem;line-height:1;display:grid;place-items:center;padding:0 0 3px;cursor:pointer}
.tabarrow:hover{border-color:var(--accent);color:var(--accent)}
.tabarrow[hidden]{display:none}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand">
      <h1>Chemistry <span>Full-Year</span> Pack</h1>
      <a href="./" class="examdate">← All subjects</a>
      <div class="examdate">Grade 8 · Whole syllabus</div>
    </div>
    <div class="tabwrap"><button class="tabarrow" id="tabL" type="button" aria-label="Scroll chapters left" hidden>&#8249;</button><nav class="tabs" role="tablist" id="tabs"></nav><button class="tabarrow" id="tabR" type="button" aria-label="Scroll chapters right">&#8250;</button></div>
  </div>
</header>
<main class="wrap" id="view"></main>

<script>
/* ---------- helpers ---------- */
const fmt = s => String(s).replace(/==(.+?)==/g,'<mark class="kw">$1</mark>').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
const pick = a => a[Math.floor(Math.random()*a.length)];
const rint = (a,b) => a + Math.floor(Math.random()*(b-a+1));
const shuffle = a => { const b = a.slice(); for (let i = b.length-1; i > 0; i--) { const j = Math.floor(Math.random()*(i+1)); [b[i],b[j]] = [b[j],b[i]]; } return b; };
const num = x => String(Math.round(x*100)/100);
const SUBS = '₀₁₂₃₄₅₆₇₈₉';
const sub = f => f.replace(/\d/g, d => SUBS[d]);
const unsub = f => f.replace(/[₀-₉]/g, d => String(d.charCodeAt(0) - 8320));
let store = {};
try { store = JSON.parse(localStorage.getItem('chemyear-v1') || '{}') || {}; } catch(e) { store = {}; }
store.ticks = store.ticks || {}; store.quiz = store.quiz || {}; store.drill = store.drill || {};
const save = () => { try { localStorage.setItem('chemyear-v1', JSON.stringify(store)); } catch(e) {} };

/* ---------- element data ---------- */
const EL = [[1,'H','hydrogen',1],[2,'He','helium',4],[3,'Li','lithium',7],[4,'Be','beryllium',9],[5,'B','boron',11],[6,'C','carbon',12],[7,'N','nitrogen',14],[8,'O','oxygen',16],[9,'F','fluorine',19],[10,'Ne','neon',20],[11,'Na','sodium',23],[12,'Mg','magnesium',24],[13,'Al','aluminium',27],[14,'Si','silicon',28],[15,'P','phosphorus',31],[16,'S','sulfur',32],[17,'Cl','chlorine',35],[18,'Ar','argon',40],[19,'K','potassium',39],[20,'Ca','calcium',40]];
const config = Z => { const r = []; let n = Z; for (const cap of [2,8,8,8]) { if (n <= 0) break; const t = Math.min(cap, n); r.push(t); n -= t; } return r; };
const ROMAN = ['','I','II','III','IV','V','VI','VII','VIII'];

/* ---------- diagram helpers ---------- */
function eDot(x, y){ return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.6" class="accf"/>`; }
function eCross(x, y){ const d = 3.6; return `<path d="M${(x-d).toFixed(1)} ${(y-d).toFixed(1)}L${(x+d).toFixed(1)} ${(y+d).toFixed(1)}M${(x-d).toFixed(1)} ${(y+d).toFixed(1)}L${(x+d).toFixed(1)} ${(y-d).toFixed(1)}" class="cross"/>`; }
const mark = (m, x, y) => m === 'x' ? eCross(x, y) : eDot(x, y);
/* Bohr diagram: conf like [2,8,1]; marks(k,i) returns 'x' or 'o' */
function bohr(cx, cy, conf, sym, marks, r0 = 24, dr = 20){
  let s = `<circle cx="${cx}" cy="${cy}" r="14" class="nuc"/><text x="${cx}" y="${cy+5}" class="mid lbl" style="font-size:12px">${sym}</text>`;
  conf.forEach((n, k) => {
    const r = r0 + k*dr; s += `<circle cx="${cx}" cy="${cy}" r="${r}" class="shell"/>`;
    for (let i = 0; i < n; i++) {
      let a;
      if (n <= 2) a = i === 0 ? 180 : 0;
      else { const pair = Math.floor(i/2), side = i % 2; a = -90 + pair*90 + (side ? 12 : -12); if (n % 2 && i === n-1) a = -90 + pair*90; }
      const rad = a*Math.PI/180; s += mark(marks(k,i), cx + r*Math.cos(rad), cy + r*Math.sin(rad));
    }
  });
  return s;
}
/* covalent outer-shell diagram */
function covalent(cx, cy, c, others){
  const P = (x,y,a,r) => [x + r*Math.cos(a*Math.PI/180), y + r*Math.sin(a*Math.PI/180)];
  let s = '';
  others.forEach(o => { const [ox,oy] = P(cx,cy,o.ang,o.d); s += `<circle cx="${ox.toFixed(1)}" cy="${oy.toFixed(1)}" r="${o.r}" class="atom" fill-opacity=".85"/>`; o._x = ox; o._y = oy; });
  s += `<circle cx="${cx}" cy="${cy}" r="${c.r}" class="atom" fill-opacity=".85"/>`;
  others.forEach(o => { s += `<circle cx="${o._x.toFixed(1)}" cy="${o._y.toFixed(1)}" r="${o.r}" fill="none" class="ln" stroke-width="1.8"/>`; });
  const pair = (x,y,a,r,m1,m2) => { const [px,py] = P(x,y,a,r); const t = (a+90)*Math.PI/180; return mark(m1, px+6*Math.cos(t), py+6*Math.sin(t)) + mark(m2, px-6*Math.cos(t), py-6*Math.sin(t)); };
  others.forEach(o => {
    const overlap = c.r + o.r - o.d; const m = c.r - overlap/2;
    s += pair(cx, cy, o.ang, m, c.mark, o.mark);
    (o.lone || []).forEach(a => s += pair(o._x, o._y, a, o.r, o.mark, o.mark));
    s += `<text x="${o._x.toFixed(1)}" y="${(o._y+7).toFixed(1)}" class="sym" style="font-size:18px">${o.sym}</text>`;
  });
  (c.lone || []).forEach(a => s += pair(cx, cy, a, c.r, c.mark, c.mark));
  s += `<text x="${cx}" y="${cy+8}" class="sym">${c.sym}</text>`;
  return s;
}
const legendDX = (x, y, a, b) => `${eCross(x, y-4)}<text x="${x+10}" y="${y}">${a}</text>${eDot(x+190, y-4)}<text x="${x+200}" y="${y}">${b}</text>`;
function arrowDefs(id){
  return `<defs><marker id="a-${id}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="inkf"/></marker>
  <marker id="b-${id}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="accf"/></marker></defs>`;
}

/* ---------- diagrams ---------- */
function svgNotation(){
  return `<svg viewBox="0 0 480 190" role="img" aria-label="Nuclide notation">${arrowDefs('n')}
  <text x="200" y="66" class="end mono" style="font-size:26px;font-weight:600">23</text>
  <text x="200" y="150" class="end mono" style="font-size:26px;font-weight:600">11</text>
  <text x="206" y="124" style="font-family:var(--display);font-size:80px;font-weight:800">Na</text>
  <line x1="160" y1="56" x2="70" y2="40" class="thin"/><text x="66" y="30" class="end lbl">nucleon number</text><text x="66" y="46" class="end mut">(mass number) = protons + neutrons</text>
  <line x1="160" y1="142" x2="70" y2="160" class="thin"/><text x="66" y="160" class="end lbl">proton number</text><text x="66" y="176" class="end mut">(atomic number)</text>
  <text x="330" y="60" class="lbl">Sodium-23</text>

salts: {

  learn: [
    { h: 'Acids, bases and alkalis', list: ['==Acids== have ==pH below 7== and produce ==H⁺ ions== in water.', '==Alkalis== have ==pH above 7== and produce ==OH⁻ ions== in water. pH 7 is ==neutral==.', 'A ==base== is a metal oxide or hydroxide that reacts with an acid. An ==alkali is a soluble base==.', 'Indicators: ==litmus== red in acid, blue in alkali. ==Methyl orange== red in acid, yellow in alkali. ==Phenolphthalein== colourless in acid, pink in alkali.'] },
    { h: 'What is a salt?', list: ['A salt forms when the ==hydrogen of an acid== is ==replaced by a metal== (or ammonium).', 'The first part of the name comes from the metal; the second from the acid:'],
      table: [['Acid','Formula','Salt name'],['hydrochloric acid','HCl','…chloride'],['sulfuric acid','H₂SO₄','…sulfate'],['nitric acid','HNO₃','…nitrate']] },
    { h: 'The four general equations', f: ['acid + metal → salt + hydrogen', 'acid + base → salt + water', 'acid + alkali → salt + water', 'acid + carbonate → salt + water + carbon dioxide'], list: ['Neutralisation as an ionic equation: ==H⁺ + OH⁻ → H₂O==.'] },
    { h: 'Gas tests', list: ['==Hydrogen==: a ==lighted splint== gives a ==squeaky pop==.', '==Carbon dioxide==: bubble through ==limewater==, which turns ==milky (cloudy)==.'] },

    { h: 'Method A: soluble salt from an insoluble solid', p: ['Use when the solid is a ==metal, insoluble base or carbonate== (e.g. copper(II) oxide + sulfuric acid → copper(II) sulfate).'],

    { h: 'Method B: soluble salt from acid + alkali (titration)', p: ['Use for ==sodium, potassium and ammonium== salts, where both reactants are ==solutions==. An excess cannot be filtered off.'],

    { h: 'Hydrated salts', list: ['Crystals contain ==water of crystallisation== (e.g. CuSO₄·5H₂O).', 'Heating ==blue hydrated copper(II) sulfate== gives ==white anhydrous copper(II) sulfate== + water.', 'Adding water turns it ==blue again==: this is a ==test for water==.'] }

sepn: {
  code: 'Topic 1', name: 'Separating mixtures and purity',
  lede: 'Choose the right separation method for the mixture, and know how to test whether a substance is pure.',
  learn: [
    { h: 'Pure substances and mixtures', list: ['A ==pure substance== is a ==single element or compound==. It has a ==sharp, fixed melting point== and boiling point.', 'A ==mixture== has ==different substances not chemically joined==. It melts over a ==range== of temperatures.', 'The substances in a mixture keep their own properties and can be ==separated by physical methods==.', 'An ==impurity== ==lowers the melting point== and ==raises the boiling point== of a substance.', 'A ==solvent== dissolves a ==solute== to make a ==solution==. A substance that does not dissolve is ==insoluble==.'] },
    { h: 'Separation methods', table: [['Method', 'Separates', 'Idea'], ['Filtration', 'insoluble solid from a liquid', 'the solid stays on the filter paper (residue); the liquid passes through (filtrate)'], ['Evaporation / crystallisation', 'a dissolved solid from its solution', 'heat to remove some solvent, cool so crystals form'], ['Simple distillation', 'a solvent from a solution', 'evaporate, then condense the pure liquid'], ['Fractional distillation', 'liquids with different boiling points', 'the lowest boiling point comes off first (e.g. ethanol from water, crude oil)'], ['Chromatography', 'substances with different solubilities', 'they move different distances up the paper']] },
    { h: 'Chromatography and Rf', list: ['Draw the ==baseline in pencil== (ink would run). Put a ==spot== on it. The ==solvent level must be below the baseline==.', 'The solvent rises and carries the substances. ==More soluble substances move further==.', 'Each ==spot== is one substance. A ==pure substance gives one spot==.', '==Rf = distance moved by the substance ÷ distance moved by the solvent==. Measure both from the baseline.', '==Same Rf in the same solvent== means the ==same substance==.'], f: ['Rf = distance moved by spot ÷ distance moved by solvent front'] }
  ],
  mistakes: ['Drawing the baseline in ==ink==.', 'Letting the ==solvent level above the baseline==.', 'Measuring the distance from the ==bottom of the paper== instead of the baseline.', 'Using ==distillation== to separate an insoluble solid. Use filtration.', 'Saying a pure substance ==melts over a range==. It melts at one temperature.'],
  diagrams: [
    { svg: svgChromato, cap: 'Chromatography: ==Rf = spot distance ÷ solvent distance==.' },
    { svg: svgDistill, cap: '==Simple distillation== separates a solvent from a solution.' }
  ],
  worked: [
    W('Describe how to separate sand from a mixture of sand and salt water.', 'Sand is ==insoluble==, so use ==filtration==.', 'Name the residue and the filtrate.', 'Filtration',
      [['Pour the mixture through filter paper', 'in a funnel', 'The paper has tiny holes. Only dissolved particles pass through.'], ['The sand stays behind', 'This is the residue', 'It is insoluble.'], ['Wash and dry the sand', 'with distilled water, then dry it', 'This removes any salt.'], ['The filtrate', 'Salt solution passes through', 'To get the salt, heat the filtrate to evaporate the water.']],
      [['Method', 'filtration', 0], ['Residue', 'sand', 1], ['Wash and dry', 'sand', 2], ['Filtrate', 'salt solution', 3]], true),
    W('Describe how to obtain pure water from salt water.', 'Use ==simple distillation==.', 'The water evaporates and condenses; the salt stays behind.', 'Evaporate then condense',
      [['Heat the salt solution', 'in a flask', 'The water boils.'], ['The water vapour', 'passes into the condenser', 'The salt does not evaporate, so it stays in the flask.'], ['Cold water around the condenser', 'turns the vapour back into liquid water', 'This is condensation.'], ['Collect it', 'in a beaker as pure distilled water', 'Check: it boils at exactly 100 °C.']],
      [['Heat', 'the solution boils', 0], ['Vapour', 'water only', 1], ['Condenser', 'vapour turns to liquid', 2], ['Collect', 'pure water', 3]], true),
    W('In a chromatogram, the solvent front moved 8.0 cm and a spot moved 5.2 cm. Calculate the Rf value.', '==Rf = distance moved by the spot ÷ distance moved by the solvent==.', 'Rf has no unit and is always less than 1.', 'Rf = spot ÷ solvent',
      [['Write the formula', 'Rf = distance moved by spot ÷ distance moved by solvent', ''], ['Substitute', 'Rf = 5.2 ÷ 8.0', 'Both measured from the baseline.'], ['Answer', 'Rf = 0.65', 'No unit.']],
      [['Spot', '5.2 cm', -1], ['Solvent', '8.0 cm', -1], ['Rf', '0.65', 2]]),
    W('A student tests a colouring from a sweet. It gives two spots. A known dye E102 gives one spot at the same height as the lower spot. What can you conclude?', 'Compare ==heights== (Rf values) of the spots.', 'Use the keywords: mixture, same Rf.', 'Same height, same substance',
      [['Number of spots', 'Two spots', 'Each spot is a different substance.'], ['Conclusion about the colouring', 'It is a mixture of at least two dyes', 'A pure substance gives one spot.'], ['Compare with E102', 'The lower spot is at the same height', 'Same Rf in the same solvent.'], ['Conclusion', 'The colouring contains E102', 'But not every spot is E102.']],
      [['Spots', '2', 0], ['Colouring', 'a mixture', 1], ['Lower spot', 'same Rf as E102', 2], ['Conclusion', 'contains E102', 3]], true),
    W('Pure ice melts at 0 °C. A sample of ice with salt dissolved in it melts at −3 °C over a range. What does this show?', 'Use the fixed melting point idea to test purity.', 'Impurities lower the melting point.', 'Pure = sharp melting point',
      [['A pure substance', 'melts at one sharp temperature', ''], ['This sample', 'melts over a range, below 0 °C', ''], ['Conclusion', 'The sample is impure (a mixture)', 'The impurity (salt) lowers the melting point.']],
      [['Pure', 'sharp m.p.', 0], ['Sample', 'range, lower', 1], ['Conclusion', 'impure', 2]], true),
    W('Which method would you use to separate ethanol (boiling point 78 °C) from water (100 °C)?', 'The liquids have ==different boiling points==, so use ==fractional distillation==.', 'Say which liquid comes off first.', 'Fractional distillation',
      [['The liquids are miscible', 'They mix completely, so filtration will not work', ''], ['Different boiling points', '78 °C and 100 °C', ''], ['Method', 'Fractional distillation', 'Heat the mixture in a fractionating column.'], ['First fraction', 'Ethanol comes off first', 'It has the lower boiling point.']],
      [['Boiling points', '78 °C v 100 °C', 1], ['Method', 'fractional distillation', 2], ['First off', 'ethanol', 3]], true)
  ],

eqn: {
  code: 'Topic 3', name: 'Formulae, Mr and equations',
  lede: 'Balance equations by counting atoms, and calculate relative formula masses.',
  learn: [
    { h: 'Relative masses', list: ['==Relative atomic mass (Ar)== is the ==average mass of an atom compared with 1/12 of a carbon-12 atom==.', '==Relative formula mass (Mr)== = the ==sum of the Ar values== of all the atoms in the formula.', 'Useful Ar values: ==H 1, C 12, N 14, O 16, Na 23, Mg 24, Al 27, S 32, Cl 35.5, K 39, Ca 40, Fe 56, Cu 64, Zn 65==.', 'For brackets, ==multiply everything inside== the bracket by the number outside.'], f: ['Mr of Mg(OH)₂ = 24 + 2 × (16 + 1) = 58'] },
    { h: 'Writing and balancing equations', list: ['A ==word equation== names the substances. A ==symbol equation== uses formulae.', '==Reactants → products==. Atoms are ==never lost or made==, so each element must have the ==same number of atoms on each side==.', 'Balance by writing ==big numbers in front== of formulae. ==Never change the small numbers== in a formula.', 'Work on one element at a time. Leave ==oxygen or hydrogen== until last if they appear in several places.', '==State symbols==: (s) solid, (l) liquid, (g) gas, (aq) dissolved in water.'] }
  ],
  mistakes: ['Changing the ==small numbers== (H₂O to H₂O₂) to balance.', 'Forgetting to ==multiply the whole bracket==.', 'Using ==mass number== instead of ==Ar==.', 'Forgetting to ==count atoms on both sides== at the end.', 'Writing ==Cl== instead of ==Cl₂== for the chlorine molecule. H₂, N₂, O₂, F₂, Cl₂, Br₂, I₂ are diatomic.'],
  diagrams: [{ svg: svgAtomCount, cap: 'Balancing: count the atoms of each element on both sides.' }],
  worked: [
    W('Calculate the relative formula mass (Mr) of calcium carbonate, CaCO₃. (Ar: Ca 40, C 12, O 16)', 'Add up the ==Ar== of every atom in the formula.', 'Write how many of each atom there are.', 'Mr = sum of Ar',
      [['List the atoms', '1 Ca, 1 C, 3 O', ''], ['Add the Ar values', '40 + 12 + (3 × 16)', 'Three oxygens, so 3 × 16.'], ['Work out', '40 + 12 + 48', ''], ['Answer', 'Mr = 100', 'No unit.']],
      [['Ca', '40', 0], ['C', '12', 0], ['3 O', '48', 1], ['Mr', '100', 3]]),
    W('Calculate the Mr of magnesium hydroxide, Mg(OH)₂, and of ammonium sulfate, (NH₄)₂SO₄. (Ar: Mg 24, O 16, H 1, N 14, S 32)', 'Multiply ==everything in the bracket== by the number outside.', 'Check each atom count before adding.', 'Brackets multiply',

    r: [['Type','acid + metal',0],['Salt','zinc chloride',1],['Products','zinc chloride + hydrogen',2],['Gas test','lighted splint: squeaky pop',3]],
    why: ['Learn the pattern: acid + metal gives a salt and hydrogen.','The salt name is the metal name plus the acid ending. Hydrochloric acid gives chlorides.','Put the pattern together with the real names.','Hold a lighted splint at the mouth of the tube. Hydrogen burns with a squeaky pop.'],
    tip: '==Hydrochloric → chloride, sulfuric → sulfate, nitric → nitrate.==' },
  { intro: '==Metal oxides== and ==hydroxides== are ==bases==. ==acid + base → salt + water==.', f: 'acid + base → salt + water',
    r: [['Type','acid + base',0],['Products','copper(II) sulfate + water',1],['Symbols','CuO + H₂SO₄ → CuSO₄ + H₂O',2]],
    why: ['A metal oxide is a base. Acid + base gives salt + water only. No gas.','Sulfuric acid gives a sulfate. Copper oxide gives the copper part.','Check it balances: Cu 1/1, S 1/1, O 5/5, H 2/2.'],
    tip: 'Copper(II) sulfate is ==blue==. Mention the colour if the question asks what you see.' },
  { intro: 'Carbonates make ==carbon dioxide== as well. You see ==fizzing== (effervescence).', f: 'acid + carbonate → salt + water + CO₂',
    r: [['Type','acid + carbonate',0],['Products','calcium nitrate + water + CO₂',1],['Balanced','CaCO₃ + 2HNO₃ → Ca(NO₃)₂ + H₂O + CO₂',2],['Seen','fizzing; solid disappears',3]],
    why: ['Carbonates give a third product: carbon dioxide.','Nitric acid gives a nitrate. Calcium carbonate gives calcium.','Ca(NO₃)₂ has two nitrates, so we need 2HNO₃. Count: H 2/2, N 2/2, O 9/9, C 1/1.','The gas escapes as bubbles. Through limewater it turns milky.'],
    tip: 'Test for CO₂: ==limewater turns milky (cloudy)==.' },
  { intro: 'To make a ==soluble salt== from an ==insoluble base==, use ==excess solid==, then ==filter==, ==evaporate== and let it ==crystallise==.', f: 'Excess, filter, heat, cool, dry.',
    r: [['1 Add','oxide in excess to warm acid',0],['2 Filter','removes excess oxide',1],['3 Heat','filtrate until crystals start',2],['4 Cool','filter off crystals; dry',3]],
    why: ['Excess means some solid is left over, so all the acid has reacted. Warming speeds it up.','The excess oxide is insoluble, so it stays on the filter paper. The filtrate is the salt solution.','Evaporate some water so the solution is saturated. Stop when crystals begin to form.','Cooling lets crystals grow. Pat them dry between filter papers.'],
    tip: 'Do not boil to dryness. ==Stop when crystals start to form== and leave to cool.' },
  { intro: 'To make an ==insoluble salt==, mix two ==solutions==. The salt forms as a ==precipitate==.', f: 'Precipitation',
    r: [['Solubility','BaSO₄ is insoluble',0],['Method','precipitation',1],['Reactants','BaCl₂(aq) + Na₂SO₄(aq)',2],['Then','filter, wash, dry',3]],
    why: ['Check the solubility rules: sulfates are soluble except barium, calcium and lead.','An insoluble salt appears as a solid when two solutions are mixed. This is precipitation.','Choose one soluble barium salt and one soluble sulfate. The ions swap partners.','Filter to collect the solid, wash off the soluble salt with distilled water, then dry.'],
    tip: 'The solid is collected by ==filtering==, not by evaporating.' },
  { intro: 'When both reactants are ==soluble==, you cannot use ==excess and filter==. Use a ==titration==.', f: 'Titration finds the exact volumes.',
    r: [['Reactants','both are solutions',0],['Problem','excess cannot be filtered off',1],['Method','titration: exact volumes',2]],
    why: ['Sodium hydroxide dissolves in water, and so does hydrochloric acid.','Filtering removes only solids. A dissolved excess cannot be taken out.','Use an indicator to find the exact volumes that just neutralise. Repeat without the indicator, then crystallise.'],
    tip: 'Give the reason: ==an excess soluble reactant cannot be removed by filtering==.' }
]
});

for (const key in CH) CH[key].worked.forEach(w => { if (w.r && !w.board0) { w.board0 = () => wkBoard(w, -1); w.s.forEach((st, j) => { st[3] = () => wkBoard(w, j); }); } });

function renderChapter(k){
  const c = CH[k];
  const subs = [['learn','Learn'],['diagrams','Diagrams'],['worked','Worked'],['drill','Drill'],['quiz','Quiz'],['exam','Exam Qs']];
  let body = '';
  if (sub_ === 'learn') body = c.learn.map(cardHTML).join('') + `<div class="card mistakes"><h3>Mistakes that lose marks</h3><ul>${c.mistakes.map(l=>`<li>${fmt(l)}</li>`).join('')}</ul></div>`;
  if (sub_ === 'diagrams') body = c.diagrams.map(d => `<figure><div class="svgbox">${d.svg()}</div><figcaption>${fmt(d.cap)}</figcaption></figure>`).join('');
  if (sub_ === 'worked') body = `<div class="card"><h3>How to use these</h3><p class="note">Read the question and try it on paper. Then tap <b>Next step</b>. Each step shows the working, and the line underneath explains <b>why</b>. The table beside it fills in as you go. The exam tip appears at the end.</p></div>` + c.worked.map((w,i) => `<div class="card" data-worked="${i}"><span class="eyebrow">Example ${i+1}</span><p class="q">${w.q}</p>${w.intro ? `<p class="intro"><b>Key idea:</b> ${fmt(w.intro)}</p>` : ''}
      ${w.board0 ? '<div class="wk-split"><div class="board"><span class="eyebrow">Working table</span><div class="board-in">' + w.board0() + '</div></div>' : ''}<ol class="steps">${w.s.map((st,j) => `<li ${j===w.s.length-1?'class="final"':''} hidden><span class="sl">${st[0]}</span><span class="st${w.prose?' prose':''}">${fmt(st[1])}</span>${st[2] ? `<span class="why2">${fmt(st[2])}</span>` : ''}</li>`).join('')}</ol>${w.board0 ? '</div>' : ''}
      ${w.tip ? `<p class="tip" hidden><b>Exam tip:</b> ${fmt(w.tip)}</p>` : ''}
      <div class="row"><button class="btn primary" data-next>Next step</button><button class="btn ghost" data-all>Show all</button><button class="btn ghost" data-hide>Hide</button></div></div>`).join('');
  if (sub_ === 'drill') body = `<div class="card" id="drill"></div>`;
  if (sub_ === 'quiz') body = `<div class="card"><div class="scorebar"><div><h3>Quick quiz</h3><p class="note">Tap an answer. Best score is saved.</p></div><div class="big-score"><span id="qs">0</span>/${c.quiz.length}</div></div><div class="row"><button class="btn ghost" data-reset>Start again</button></div></div>`
    + c.quiz.map((q,i) => `<div class="card" data-quiz="${i}"><span class="eyebrow">Q${i+1}</span><p class="q">${q.q}</p><div class="opts">${q.o.map((o,j) => `<button class="opt" data-o="${j}">${o}</button>`).join('')}</div><p class="why" hidden>${fmt(q.w)}</p></div>`).join('');
  if (sub_ === 'exam') { const [g,t] = examScore(k, c.exam);
    body = `<div class="card"><div class="scorebar"><div><h3>Exam-style questions</h3><p class="note">Answer on paper first. Then open the mark scheme and tick each point you wrote. Each tick = 1 mark.</p></div><div class="big-score" id="exscore">${g}/${t}</div></div></div>` + c.exam.map((q,i) => examCard(k+'-'+i, q, i)).join(''); }
  return `<div class="chhead fadein"><span class="eyebrow">${c.code} · Chemistry</span><h2>${c.name}</h2><p class="lede">${c.lede}</p></div>
  <nav class="sub" role="tablist">${subs.map(([s,n]) => `<button class="subtab" role="tab" aria-selected="${s===sub_}" data-sub="${s}">${n}</button>`).join('')}</nav>
  <div class="stack fadein">${body}</div>`;
}
function examCard(key, q, i){
  const ticks = store.ticks[key] || []; const open = store.ticks['open-'+key];
  return `<div class="card" data-exam="${key}" data-max="${q.m}"><div class="qhead"><span class="eyebrow">Question ${i+1}</span><span class="marks">[${q.m} mark${q.m>1?'s':''}]</span></div>
    <p class="q">${q.q}</p>
    <div class="row"><button class="btn primary" data-ms>${open?'Hide mark scheme':'Show mark scheme'}</button><span class="got">${ticks.length?Math.min(ticks.length,q.m)+'/'+q.m:''}</span></div>
    <div class="ms" ${open?'':'hidden'}><p class="ms-intro">Tap each point you included${q.p.length>q.m?` (any ${q.m} of these ${q.p.length} points)`:''}:</p>
    ${q.p.map((p,j) => `<button class="point" aria-pressed="${ticks.includes(j)}" data-pt="${j}"><span class="box">✓</span><span>${fmt(p)}</span></button>`).join('')}</div></div>`;
}
let timer = null, left = 40*60;
const fmtTime = s => String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0');
function renderMock(){
  const list = MOCK.map(([k,i]) => CH[k].exam[i]); const [g,t] = examScore('mock', list);
  return `<div class="chhead fadein"><span class="eyebrow">All four chapters</span><h2>Mini mock</h2>
    <p class="lede">${t} marks of structured questions, like your school paper. Set the timer, answer on paper, then mark yourself.</p></div>
    <div class="stack" style="margin-top:20px">
    <div class="card"><div class="scorebar"><div class="timer" id="clock">${fmtTime(left)}</div><div class="big-score" id="exscore">${g}/${t}</div></div>
      <div class="row"><button class="btn primary" id="tgo">${timer?'Pause':'Start timer'}</button><button class="btn ghost" id="treset">Reset timer</button><button class="btn ghost" id="mnew">New mock (different questions)</button><button class="btn ghost" id="mclear">Clear my marks</button></div>
      <p class="note">40 minutes. About 1 minute per mark, plus time to check.</p></div>
    ${list.map((q,i) => examCard('mock-'+i, q, i)).join('')}</div>`;
}
let quizScore = 0;
function bindView(){
  quizScore = 0;
  if (cur !== 'start' && cur !== 'mock' && sub_ === 'drill') newDrill();
  if (cur === 'mock') {
    document.getElementById('tgo').onclick = () => {
      if (timer) { clearInterval(timer); timer = null; document.getElementById('tgo').textContent = 'Resume'; return; }
      document.getElementById('tgo').textContent = 'Pause';
      timer = setInterval(() => { left = Math.max(0, left-1); const c = document.getElementById('clock');
        if (c) { c.textContent = left ? fmtTime(left) : 'Time up'; c.classList.toggle('low', left < 300); }
        if (!left) { clearInterval(timer); timer = null; } }, 1000);
    };
    document.getElementById('treset').onclick = () => { clearInterval(timer); timer = null; left = 40*60; render(); };
    document.getElementById('mnew').onclick = () => { clearInterval(timer); timer = null; Object.keys(store.ticks).forEach(k => { if (k.includes('mock-')) delete store.ticks[k]; }); drawMock(); render(); };
    document.getElementById('mclear').onclick = () => { Object.keys(store.ticks).forEach(k => { if (k.includes('mock-')) delete store.ticks[k]; }); save(); render(); };
  }
}
document.getElementById('view').addEventListener('click', e => {
  const t = e.target;
  const st = t.closest('[data-sub]'); if (st) { sub_ = st.dataset.sub; render(); return; }
  const wk = t.closest('[data-worked]');
  if (wk) { const items = [...wk.querySelectorAll('.steps li')];
    if (t.closest('[data-next]')) { const n = items.find(li => li.hidden); if (n) n.hidden = false; }
    if (t.closest('[data-all]')) items.forEach(li => li.hidden = false);
    if (t.closest('[data-hide]')) items.forEach(li => li.hidden = true);
    wk.querySelector('[data-next]').disabled = !items.some(li => li.hidden); const tp = wk.querySelector('.tip'); if (tp) tp.hidden = items.some(li => li.hidden); updateBoard(wk, items); return; }
  const qz = t.closest('[data-quiz]');
  if (qz && t.closest('[data-o]') && !qz.dataset.done) {
    const q = CH[cur].quiz[+qz.dataset.quiz]; const j = +t.closest('[data-o]').dataset.o; qz.dataset.done = '1';
    qz.querySelectorAll('.opt').forEach((b,bi) => { b.disabled = true; if (bi === q.a) b.classList.add('right'); else if (bi === j) b.classList.add('wrong'); });
    qz.querySelector('.why').hidden = false; if (j === q.a) quizScore++;
    document.getElementById('qs').textContent = quizScore;
    if (quizScore > (store.quiz[cur] || 0)) { store.quiz[cur] = quizScore; save(); } return; }
  if (t.closest('[data-reset]')) { render(); return; }
  const ex = t.closest('[data-exam]');
  if (ex) { const key = ex.dataset.exam, max = +ex.dataset.max;
    if (t.closest('[data-ms]')) { const ms = ex.querySelector('.ms'); ms.hidden = !ms.hidden; store.ticks['open-'+key] = !ms.hidden; save(); t.closest('[data-ms]').textContent = ms.hidden ? 'Show mark scheme' : 'Hide mark scheme'; return; }
    const pt = t.closest('[data-pt]');
    if (pt) { const j = +pt.dataset.pt; let arr = store.ticks[key] || []; arr = arr.includes(j) ? arr.filter(x => x !== j) : [...arr, j];
      store.ticks[key] = arr; save(); pt.setAttribute('aria-pressed', arr.includes(j));
      ex.querySelector('.got').textContent = arr.length ? Math.min(arr.length, max) + '/' + max : '';
      const list = cur === 'mock' ? MOCK.map(([k,i]) => CH[k].exam[i]) : CH[cur].exam;
      const [g,tt] = examScore(cur === 'mock' ? 'mock' : cur, list); const sc = document.getElementById('exscore'); if (sc) sc.textContent = g + '/' + tt; } }
});

/* ---------- drill engine ---------- */
let drillCur = null, streak = 0;
function judge(raw){
  const d = drillCur;
  if (d.kind === 'num') { const x = parseFloat(raw.replace(',', '.')); if (isNaN(x)) return null; return { ok: Math.abs(x - d.ans) <= (d.tol != null ? d.tol : Math.abs(d.ans)*0.02) + 1e-9 }; }
  if (d.kind === 'config') { const m = raw.match(/\d+/g); if (!m) return null; return { ok: m.join(',') === d.ans }; }
  if (d.kind === 'formula') { const r = unsub(raw.replace(/\s+/g, '')); if (!r) return null;
    if (r === d.ans) return { ok:true }; if (r.toLowerCase() === d.ans.toLowerCase()) return { ok:true, note:`Watch the capital letters: ${sub(d.ans)}` }; return { ok:false }; }
  return null;
}
const answerText = d => d.kind === 'choice' ? d.choices[d.ans] : d.kind === 'formula' ? sub(d.ans) : d.kind === 'num' ? num(d.ans) : d.ans;
function showResult(ok, note){
  streak = ok ? streak + 1 : 0;
  if (streak > (store.drill[cur] || 0)) { store.drill[cur] = streak; save(); }
  const d = drillCur;
  document.getElementById('dfb').innerHTML = `<div class="fb ${ok?'ok':'no'}"><span class="verdict">${ok ? 'Correct!' : 'Not quite. The answer is ' + answerText(d) + '.'}${note ? ' ' + note : ''}</span>
    <ol class="steps">${d.s.map((s,j)=>`<li ${j===d.s.length-1?'class="final"':''}><span class="sl">${s[0]}</span><span class="st">${s[1]}</span></li>`).join('')}</ol>
    <div class="row"><button class="btn primary" type="button" id="dnext">Next question</button></div></div>`;
  document.getElementById('dnext').onclick = newDrill;
  document.querySelector('#drill .stat').textContent = `streak ${streak} · best ${store.drill[cur] || 0}`;
}
function newDrill(){
  const box = document.getElementById('drill'); if (!box) return;
  drillCur = pick(DRILLS[CH[cur].drill])();
  const d = drillCur;
  const input = d.kind === 'choice'
    ? `<div class="opts" id="dch">${d.choices.map((o,j) => `<button class="opt" type="button" data-dc="${j}">${o}</button>`).join('')}</div>`
    : `<form class="answer" id="dform"><label for="dans" class="note">Your answer</label><input id="dans" autocomplete="off" autocapitalize="off" spellcheck="false" ${d.kind==='num'?'inputmode="decimal"':''} placeholder="${d.kind==='config'?'2,8,1':d.kind==='formula'?'e.g. MgCl2':'number'}"><button class="btn primary" type="submit">Check</button></form>`;
  box.innerHTML = `<div class="scorebar"><span class="eyebrow">Practice drill</span><span class="stat">streak ${streak} · best ${store.drill[cur] || 0}</span></div>
    <p class="drillq">${d.q}</p>${input}<div id="dfb"></div>
    <div class="row"><button class="btn ghost" type="button" id="dskip">Skip to a new question</button></div>`;
  if (d.kind === 'choice') {
    document.getElementById('dch').onclick = ev => { const b = ev.target.closest('[data-dc]'); if (!b || d.done) return; d.done = true; const j = +b.dataset.dc;
      document.querySelectorAll('#dch .opt').forEach((o,oi) => { o.disabled = true; if (oi === d.ans) o.classList.add('right'); else if (oi === j) o.classList.add('wrong'); });
      showResult(j === d.ans); };
  } else {
    document.getElementById('dform').onsubmit = ev => { ev.preventDefault(); if (d.done) return;
      const r = judge(document.getElementById('dans').value.trim());
      if (!r) { document.getElementById('dfb').innerHTML = `<div class="fb no"><span class="verdict">Type an answer first.</span></div>`; return; }
      d.done = true; showResult(r.ok, r.note); };
  }
  document.getElementById('dskip').onclick = () => { streak = 0; newDrill(); };
}
renderTabs(); render();

/* chapter tabs: arrow buttons, mouse wheel and keep the selected tab in view (for screens without touch) */
(function(){
  const nav = document.getElementById('tabs'), L = document.getElementById('tabL'), R = document.getElementById('tabR');
  const upd = () => { const m = nav.scrollWidth - nav.clientWidth; L.hidden = nav.scrollLeft <= 2; R.hidden = nav.scrollLeft >= m - 2; };
  L.onclick = () => nav.scrollBy({ left: -nav.clientWidth * .7, behavior: 'smooth' });
  R.onclick = () => nav.scrollBy({ left: nav.clientWidth * .7, behavior: 'smooth' });
  nav.addEventListener('scroll', upd); window.addEventListener('resize', upd);
  nav.addEventListener('wheel', e => { if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) { nav.scrollLeft += e.deltaY; e.preventDefault(); } }, { passive: false });
  new MutationObserver(() => { const a = nav.querySelector('[aria-selected="true"]'); if (a) a.scrollIntoView({ inline: 'center', block: 'nearest' }); upd(); }).observe(nav, { childList: true });
  const a = nav.querySelector('[aria-selected="true"]'); if (a) a.scrollIntoView({ inline: 'center', block: 'nearest' }); upd();
})();
</script>
