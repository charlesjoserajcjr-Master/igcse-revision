macro: {
  code: 'Topic 11', name: 'Polymers, proteins and plastics',
  lede: 'How addition and condensation polymers are made, what proteins are, and the environmental problems caused by plastics.',
  learn: [
    { h: 'Addition polymers', list: ['A ==polymer== is a ==very long molecule== made by joining many small molecules, called ==monomers==.', '==Addition polymerisation==: many ==alkene monomers (with a C=C double bond)== join. The double bond opens. ==Only one product== is made: the polymer.', 'Ethene → ==poly(ethene)==; propene → ==poly(propene)==; chloroethene → ==poly(chloroethene) (PVC)==.', 'The ==repeat unit== of poly(ethene) is –CH₂–CH₂–. It has ==no C=C== in the polymer, so it is ==saturated==.'] },
    { h: 'Condensation polymers', list: ['==Condensation polymerisation==: two different monomers join and a ==small molecule, usually water==, is lost at each link.', '==Nylon== is made from a ==diamine== and a ==dicarboxylic acid==. The link is an ==amide link (–CONH–)==. Nylon is a ==polyamide==.', '==PET (polyester)== is made from a ==diol== and a ==dicarboxylic acid==. The link is an ==ester link (–COO–)==.', '==Difference==: addition makes ==only the polymer==; condensation makes ==a polymer plus water== (or another small molecule).'] },
    { h: 'Proteins', list: ['==Proteins== are ==natural polymers== (polyamides) made from ==amino acids==.', 'An ==amino acid== has an ==amino group (–NH₂)== and a ==carboxylic acid group (–COOH)==. Glycine is NH₂CH₂COOH. Alanine is NH₂CH(CH₃)COOH.', 'Amino acids join by ==condensation polymerisation==, losing ==water== at each link. The link is an ==amide (peptide) link==.', 'In digestion, ==enzymes break protein down== (hydrolysis) into ==amino acids==.'] },
    { h: 'Plastics and the environment', list: ['Most plastics are ==not biodegradable==: ==bacteria cannot break them down==.', 'Problems: ==landfill sites fill up==, ==litter harms animals==, plastics in the sea harm ==marine life==.', '==Burning plastics== makes ==carbon dioxide== (greenhouse gas) and ==toxic gases== such as carbon monoxide, and hydrogen chloride from PVC.', 'Solutions: ==recycling==, ==reusing==, ==biodegradable plastics==, using fewer plastic items.'] }
  ],
  mistakes: ['Saying ==addition polymers lose water==. Only condensation polymers do.', 'Drawing the repeat unit ==with the C=C double bond==. It becomes a single bond.', 'Saying ==plastics rot==. Most are not biodegradable.', 'Mixing up the ==amide link== (nylon, proteins) and the ==ester link== (PET).', 'Saying ==proteins are made from fatty acids==. They are made from amino acids.'],
  diagrams: [{ svg: svgPoly, cap: '==Addition polymerisation==: ethene molecules join to make poly(ethene).' }],
  worked: [
    W('Explain what happens when ethene forms poly(ethene). Name the type of polymerisation.', 'Think about the ==double bond== and the number of ==products==.', 'The double bond opens.', 'many monomers → one polymer',
      [['Monomer', 'Ethene, CH₂=CH₂, has a C=C double bond.', ''], ['The bond opens', 'The double bond opens and each ethene molecule joins to the next.', ''], ['Product', 'A very long chain, poly(ethene), with repeat unit –CH₂–CH₂–.', 'Only one product is made.'], ['Type', 'Addition polymerisation.', '']],
      [['Monomer', 'ethene', 0], ['C=C', 'opens', 1], ['Product', 'poly(ethene)', 2], ['Type', 'addition', 3]], true),
    W('State two differences between addition polymerisation and condensation polymerisation.', 'Compare the ==monomers== and the ==products==.', 'Use pairs.', 'one product v two',
      [['Monomers', 'Addition: one type of monomer with a C=C bond. Condensation: usually two different monomers, each with two functional groups.', ''], ['Products', 'Addition: only the polymer. Condensation: the polymer and a small molecule such as water.', '']],
      [['Monomers', 'alkene v two types', 0], ['Products', 'polymer only v + water', 1]], true),
    W('Draw or describe the structure of alanine, NH₂CH(CH₃)COOH, and state what happens when amino acids form a protein.', 'Name the ==two functional groups==.', 'Mention water.', '–NH₂ and –COOH',
      [['Functional groups', 'An amino group (–NH₂) at one end and a carboxylic acid group (–COOH) at the other.', ''], ['Joining', 'The –NH₂ of one amino acid reacts with the –COOH of the next.', ''], ['Loss', 'A molecule of water is lost at each link.', 'Condensation polymerisation.'], ['Link', 'An amide (peptide) link –CONH– forms.', '']],
      [['Groups', '–NH₂ and –COOH', 0], ['Joining', 'NH₂ with COOH', 1], ['Lost', 'water', 2], ['Link', 'amide', 3]], true),
    W('Describe two environmental problems caused by the disposal of plastics.', 'Think about ==what plastics do== in the ground and the sea.', 'Give a problem and a reason.', 'not biodegradable',
      [['Landfill', 'Plastics are not biodegradable, so they stay in landfill for hundreds of years.', ''], ['Pollution of the sea', 'Plastic litter harms marine animals that swallow it or become trapped.', ''], ['Burning', 'Burning plastics gives carbon dioxide and toxic gases.', '']],
      [['Problem 1', 'landfill, not biodegradable', 0], ['Problem 2', 'harms marine life', 1]], true)
  ],
  drill: 'macro',
  quiz: [
    { q: 'Which monomer forms poly(ethene)?', o: ['ethane', 'ethene', 'ethanol', 'ethanoic acid'], a: 1, w: '==Ethene==.' },
    { q: 'Addition polymerisation makes…', o: ['a polymer and water', 'only a polymer', 'two polymers', 'a monomer'], a: 1, w: '==Only the polymer==.' },
    { q: 'The link in nylon is…', o: ['an ester link', 'an amide link', 'a C=C link', 'an ionic link'], a: 1, w: 'An ==amide link==.' },
    { q: 'Proteins are polymers of…', o: ['sugars', 'amino acids', 'fatty acids', 'alkenes'], a: 1, w: '==Amino acids==.' },
    { q: 'Which small molecule is lost in condensation polymerisation?', o: ['carbon dioxide', 'water', 'hydrogen', 'oxygen'], a: 1, w: '==Water==.' },
    { q: 'A problem with most plastics is that they are…', o: ['soluble', 'not biodegradable', 'too light', 'too soft'], a: 1, w: 'They are ==not biodegradable==.' }
  ],
  exam: [
    { q: 'Describe how poly(propene) is made from propene.', m: 3,
      p: ['many ==propene molecules== (monomers) join together', 'the ==C=C double bond opens== / breaks', 'forms a ==long chain== (addition polymerisation); no other product'] },
    { q: 'Explain how a protein is formed from amino acids.', m: 4,
      p: ['amino acids have an ==–NH₂== group and a ==–COOH== group', 'the –NH₂ of one reacts with the –COOH of another', '==water is lost== (condensation polymerisation)', 'forming an ==amide (peptide) link== in a long chain'] },
    { q: 'State two environmental problems caused by the disposal of plastics.', m: 2,
      p: ['plastics are ==not biodegradable== / stay in landfill', 'litter / ==harm to marine animals== / burning releases toxic gases or CO₂'] }
  ]
}

      <li>The ==Periodic Table== is printed in the paper. One mole of any gas occupies ==24 dm³== at room temperature and pressure.</li>
      <li>That is about ${perMin} minutes per mark.</li></ul>
      <details><summary><b>Periodic Table</b></summary><div style="overflow-x:auto;margin-top:8px">${periodicFull()}</div></details></div>
    <div class="card"><div class="scorebar"><div class="timer" id="clock">${fmtTime(left)}</div><div class="big-score" id="exscore">${g}/${t}</div></div>
      <div class="row"><button class="btn primary" id="tgo">${timer?'Pause':'Start timer'}</button><button class="btn ghost" id="treset">Reset timer</button><button class="btn ghost" id="mnew">New paper (different questions)</button><button class="btn ghost" id="mclear">Clear my marks</button></div></div>
    ${cards}</div>`.replace(/==(.+?)==/g,'<mark class="kw">$1</mark>');
}
let quizScore = 0;
function bindView(){
  quizScore = 0;
  if (cur !== 'start' && cur !== 'mock' && cur !== 'mc' && sub_ === 'drill') newDrill();
  if (cur === 'mc') bindMC();
  if (cur === 'mock') {
    document.getElementById('tgo').onclick = () => {
      if (timer) { clearInterval(timer); timer = null; document.getElementById('tgo').textContent = 'Resume'; return; }
      document.getElementById('tgo').textContent = 'Pause';
      timer = setInterval(() => { left = Math.max(0, left-1); const c = document.getElementById('clock');
        if (c) { c.textContent = left ? fmtTime(left) : 'Time up'; c.classList.toggle('low', left < 300); }
        if (!left) { clearInterval(timer); timer = null; } }, 1000);
    };
    document.getElementById('treset').onclick = () => { clearInterval(timer); timer = null; left = TH_PAPERS[store.thtype].mins*60; render(); };
    document.getElementById('mnew').onclick = () => { clearInterval(timer); timer = null; drawTheory(store.thtype); render(); };
    document.getElementById('view').querySelectorAll('[data-ptype]').forEach(b => b.onclick = () => { clearInterval(timer); timer = null; drawTheory(b.dataset.ptype); render(); });
    document.getElementById('mclear').onclick = () => { Object.keys(store.ticks).forEach(k => { if (k.includes('mock-')) delete store.ticks[k]; }); save(); render(); };
  }
}
document.getElementById('view').addEventListener('click', e => {
  const t = e.target;
  const st = t.closest('[data-sub]'); if (st) { sub_ = st.dataset.sub; render(); return; }
  const wk = t.closest('[data-worked]');
  if (wk) { const items = [...wk.querySelectorAll('.steps li')];
    if (t.closest('[data-next]')) { const n = items.find(li => li.hidden); if (n) n.hidden = false; }
    if (t.closest('[data-all]')) items.forEach(li => li.hidden = false);
    if (t.closest('[data-hide]')) items.forEach(li => li.hidden = true);
    wk.querySelector('[data-next]').disabled = !items.some(li => li.hidden); const tp = wk.querySelector('.tip'); if (tp) tp.hidden = items.some(li => li.hidden); updateBoard(wk, items); return; }
  const qz = t.closest('[data-quiz]');
  if (qz && t.closest('[data-o]') && !qz.dataset.done) {
    const q = CH[cur].quiz[+qz.dataset.quiz]; const j = +t.closest('[data-o]').dataset.o; qz.dataset.done = '1';
    qz.querySelectorAll('.opt').forEach((b,bi) => { b.disabled = true; if (bi === q.a) b.classList.add('right'); else if (bi === j) b.classList.add('wrong'); });
    qz.querySelector('.why').hidden = false; if (j === q.a) quizScore++;
    document.getElementById('qs').textContent = quizScore;
    if (quizScore > (store.quiz[cur] || 0)) { store.quiz[cur] = quizScore; save(); } return; }
  if (t.closest('[data-reset]')) { render(); return; }
  const ex = t.closest('[data-exam]');
  if (ex) { const key = ex.dataset.exam, max = +ex.dataset.max;
    if (t.closest('[data-ms]')) { const ms = ex.querySelector('.ms'); ms.hidden = !ms.hidden; store.ticks['open-'+key] = !ms.hidden; save(); t.closest('[data-ms]').textContent = ms.hidden ? 'Show mark scheme' : 'Hide mark scheme'; return; }
    const pt = t.closest('[data-pt]');
    if (pt) { const j = +pt.dataset.pt; let arr = store.ticks[key] || []; arr = arr.includes(j) ? arr.filter(x => x !== j) : [...arr, j];
      store.ticks[key] = arr; save(); pt.setAttribute('aria-pressed', arr.includes(j));
      ex.querySelector('.got').textContent = arr.length ? Math.min(arr.length, max) + '/' + max : '';
      const list = cur === 'mock' ? THQ : CH[cur].exam;
      const [g,tt] = examScore(cur === 'mock' ? 'mock' : cur, list); const sc = document.getElementById('exscore'); if (sc) sc.textContent = g + '/' + tt; } }
});

/* ---------- drill engine ---------- */
let drillCur = null, streak = 0;
function judge(raw){
  const d = drillCur;
  if (d.kind === 'num') { const x = parseFloat(raw.replace(',', '.')); if (isNaN(x)) return null; return { ok: Math.abs(x - d.ans) <= (d.tol != null ? d.tol : Math.abs(d.ans)*0.02) + 1e-9 }; }
  if (d.kind === 'config') { const m = raw.match(/\d+/g); if (!m) return null; return { ok: m.join(',') === d.ans }; }
  if (d.kind === 'formula') { const r = unsub(raw.replace(/\s+/g, '')); if (!r) return null;
    if (r === d.ans) return { ok:true }; if (r.toLowerCase() === d.ans.toLowerCase()) return { ok:true, note:`Watch the capital letters: ${sub(d.ans)}` }; return { ok:false }; }
  return null;
}
const answerText = d => d.kind === 'choice' ? d.choices[d.ans] : d.kind === 'formula' ? sub(d.ans) : d.kind === 'num' ? num(d.ans) : d.ans;
function showResult(ok, note){
  streak = ok ? streak + 1 : 0;
  if (streak > (store.drill[cur] || 0)) { store.drill[cur] = streak; save(); }
  const d = drillCur;
  document.getElementById('dfb').innerHTML = `<div class="fb ${ok?'ok':'no'}"><span class="verdict">${ok ? 'Correct!' : 'Not quite. The answer is ' + answerText(d) + '.'}${note ? ' ' + note : ''}</span>
    <ol class="steps">${d.s.map((s,j)=>`<li ${j===d.s.length-1?'class="final"':''}><span class="sl">${s[0]}</span><span class="st">${s[1]}</span></li>`).join('')}</ol>
    <div class="row"><button class="btn primary" type="button" id="dnext">Next question</button></div></div>`;
  document.getElementById('dnext').onclick = newDrill;
  document.querySelector('#drill .stat').textContent = `streak ${streak} · best ${store.drill[cur] || 0}`;
}
function newDrill(){
  const box = document.getElementById('drill'); if (!box) return;
  drillCur = pick(DRILLS[CH[cur].drill])();
  const d = drillCur;
  const input = d.kind === 'choice'
    ? `<div class="opts" id="dch">${d.choices.map((o,j) => `<button class="opt" type="button" data-dc="${j}">${o}</button>`).join('')}</div>`
    : `<form class="answer" id="dform"><label for="dans" class="note">Your answer</label><input id="dans" autocomplete="off" autocapitalize="off" spellcheck="false" ${d.kind==='num'?'inputmode="decimal"':''} placeholder="${d.kind==='config'?'2,8,1':d.kind==='formula'?'e.g. MgCl2':'number'}"><button class="btn primary" type="submit">Check</button></form>`;
  box.innerHTML = `<div class="scorebar"><span class="eyebrow">Practice drill</span><span class="stat">streak ${streak} · best ${store.drill[cur] || 0}</span></div>
    <p class="drillq">${d.q}</p>${input}<div id="dfb"></div>
    <div class="row"><button class="btn ghost" type="button" id="dskip">Skip to a new question</button></div>`;
  if (d.kind === 'choice') {
    document.getElementById('dch').onclick = ev => { const b = ev.target.closest('[data-dc]'); if (!b || d.done) return; d.done = true; const j = +b.dataset.dc;
      document.querySelectorAll('#dch .opt').forEach((o,oi) => { o.disabled = true; if (oi === d.ans) o.classList.add('right'); else if (oi === j) o.classList.add('wrong'); });
      showResult(j === d.ans); };
  } else {
    document.getElementById('dform').onsubmit = ev => { ev.preventDefault(); if (d.done) return;
      const r = judge(document.getElementById('dans').value.trim());
      if (!r) { document.getElementById('dfb').innerHTML = `<div class="fb no"><span class="verdict">Type an answer first.</span></div>`; return; }
      d.done = true; showResult(r.ok, r.note); };
  }
  document.getElementById('dskip').onclick = () => { streak = 0; newDrill(); };
}
renderTabs(); render();

/* chapter tabs: arrow buttons, mouse wheel and keep the selected tab in view (for screens without touch) */
(function(){
  const nav = document.getElementById('tabs'), L = document.getElementById('tabL'), R = document.getElementById('tabR');
  const upd = () => { const m = nav.scrollWidth - nav.clientWidth; L.hidden = nav.scrollLeft <= 2; R.hidden = nav.scrollLeft >= m - 2; };
  L.onclick = () => nav.scrollBy({ left: -nav.clientWidth * .7, behavior: 'smooth' });
  R.onclick = () => nav.scrollBy({ left: nav.clientWidth * .7, behavior: 'smooth' });
  nav.addEventListener('scroll', upd); window.addEventListener('resize', upd);
  nav.addEventListener('wheel', e => { if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) { nav.scrollLeft += e.deltaY; e.preventDefault(); } }, { passive: false });
  new MutationObserver(() => { const a = nav.querySelector('[aria-selected="true"]'); if (a) a.scrollIntoView({ inline: 'center', block: 'nearest' }); upd(); }).observe(nav, { childList: true });
  const a = nav.querySelector('[aria-selected="true"]'); if (a) a.scrollIntoView({ inline: 'center', block: 'nearest' }); upd();
})();
</script>
