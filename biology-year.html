inherit: {
  code: 'Topic 16', name: 'Inheritance',
  lede: 'How genes pass from parents to children, what the words mean, and how to work out the results of a genetic cross.',
  learn: [
    { h: 'Genes, chromosomes and cell division', list: ['==Chromosomes== are made of ==DNA== and are found in the ==nucleus==. A ==gene== is a length of DNA that codes for a ==protein==. An ==allele== is a ==version of a gene==.', 'Human body cells have ==46 chromosomes== (23 pairs): they are ==diploid==. ==Gametes== have ==23== chromosomes: they are ==haploid==.', '==Mitosis== makes two cells that are ==genetically identical== to the parent cell, with the same number of chromosomes. It is used for ==growth==, ==repair== and ==asexual reproduction==.', '==Meiosis== makes ==gametes== with ==half== the number of chromosomes and ==genetic variation==. Fertilisation restores the full number (46).', 'The ==sex chromosomes== are ==XX== in females and ==XY== in males. Each child has a ==50 %== chance of being a boy or a girl.'] },
    { h: 'Key words for crosses', table: [['Word', 'Meaning'], ['==genotype==', 'the combination of alleles, such as ==Tt=='], ['==phenotype==', 'the observable feature, such as ==tall=='], ['==dominant==', 'allele that shows when ==present once== (capital letter, T)'], ['==recessive==', 'allele that shows only when ==two copies== are present (small letter, t)'], ['==homozygous==', '==two identical== alleles (TT or tt)'], ['==heterozygous==', '==two different== alleles (Tt)'], ['==carrier==', 'heterozygous for a recessive disease allele; shows no symptoms']] },
    { h: 'Monohybrid crosses', list: ['1. Choose letters (capital for dominant). 2. Write the parents’ ==genotypes==. 3. Write the ==gametes== (one allele each). 4. Fill in a ==Punnett square==. 5. Read the ==genotypes== and ==phenotypes==. 6. Give a ==ratio or probability==.', 'Tt × Tt gives ==TT : Tt : tt = 1 : 2 : 1== so ==3 dominant : 1 recessive==.', 'Tt × tt gives ==1 Tt : 1 tt== so ==1 : 1==. This is a ==test cross== to find out if a dominant parent is TT or Tt.', 'An example of an inherited disorder: ==sickle cell anaemia== (recessive). ==Cystic fibrosis== is also recessive.'], f: ['probability = number of squares ÷ total squares', 'a cross of two heterozygous parents: 25 % show the recessive feature'] }
  ],
  mistakes: ['Saying ==an allele is the same as a gene==. It is a version of the gene.', 'Writing ==gametes with two alleles== (each gamete has one).', 'Mixing up ==genotype and phenotype==.', 'Saying a ==recessive allele is weaker or rarer== (it just needs two copies).', 'Using ==different letters== for the same gene (use T and t).'],
  diagrams: [{ svg: svgPunnett, cap: 'A ==Punnett square== for ==Tt × Tt==.' }],
  worked: [
    W('Two heterozygous tall plants (Tt) are crossed. Tall (T) is dominant over short (t). Work out the probability of a short plant.', 'Gametes first. Then ==fill the Punnett square==.', 'Write the genotype of the short plant.', 'Tt × Tt → 1 TT : 2 Tt : 1 tt',
      [['Parents', 'Tt × Tt', 'Both are tall but carry t.'], ['Gametes', 'T or t from each parent', 'Each gamete has one allele.'], ['Square', 'TT, Tt, Tt, tt', 'Combine each gamete from the top with each from the side.'], ['Short plants', 'tt is 1 square out of 4', 'Short needs two recessive alleles.'], ['Answer', 'probability = 1/4 = 25 %', '']],
      [['Parents', 'Tt × Tt', 0], ['Gametes', 'T, t', 1], ['Offspring', 'TT Tt Tt tt', 2], ['Short', '1 in 4', 3], ['Probability', '25 %', 4]]),
    W('A black cat (B dominant) is crossed with a white cat (bb). Half the kittens are white. What is the genotype of the black cat?', 'White needs ==bb==. Work backwards.', 'Show the cross to prove it.', 'White kitten = bb, so both parents carry b',
      [['White parent', 'bb, gametes b and b', ''], ['White kittens', 'bb, so each got a b from the black parent', ''], ['Black parent', 'must carry b, and is black, so Bb', 'BB would give no white kittens.'], ['Check', 'Bb × bb → 1 Bb : 1 bb = 1 black : 1 white', 'Half are white ✓.']],
      [['White parent', 'bb', 0], ['Black parent', 'Bb', 2], ['Cross', 'Bb × bb', 3], ['Kittens', '1 black : 1 white', 3]]),
    W('State the difference between mitosis and meiosis.', 'Compare ==number of cells==, ==chromosome number== and ==variation==.', 'Three pairs of statements.', 'Identical v varied',
      [['Offspring cells', 'Mitosis: two identical cells. Meiosis: four different cells.', ''], ['Chromosome number', 'Mitosis: stays the same (46). Meiosis: halved (23).', ''], ['Use', 'Mitosis: growth, repair, asexual reproduction. Meiosis: makes gametes.', '']],
      [['Cells', 'identical v different', 0], ['Chromosomes', '46 v 23', 1], ['Use', 'growth v gametes', 2]], true),
    W('Explain why the chance of having a daughter is 50 %.', 'Draw the ==sex chromosome== square.', 'Use XX and XY.', 'XX × XY',
      [['Parents', 'Mother XX, father XY.', ''], ['Gametes', 'Eggs all carry X. Sperm carry X or Y.', ''], ['Square', 'XX, XX, XY, XY', ''], ['Answer', 'Half the offspring are XX (girls). The chance is 50 %.', 'It is decided by the sperm.']],
      [['Mother', 'XX', 0], ['Father', 'XY', 0], ['Offspring', 'XX XX XY XY', 2], ['Girl chance', '50 %', 3]], true)
  ],
  drill: 'inherit',
  quiz: [
    { q: 'A person with genotype Tt is…', o: ['homozygous dominant', 'homozygous recessive', 'heterozygous', 'a carrier only'], a: 2, w: '==Heterozygous== (two different alleles).' },
    { q: 'How many chromosomes in a human gamete?', o: ['23', '46', '92', '2'], a: 0, w: '==23==.' },
    { q: 'Mitosis makes cells that are…', o: ['genetically different', 'genetically identical', 'haploid', 'gametes'], a: 1, w: '==Genetically identical==.' },
    { q: 'Tt × tt: what fraction show the recessive trait?', o: ['0', '1/4', '1/2', '3/4'], a: 2, w: '==1/2==.' },
    { q: 'Which sex chromosomes does a male have?', o: ['XX', 'XY', 'YY', 'X'], a: 1, w: '==XY==.' },
    { q: 'The observable feature is the…', o: ['genotype', 'phenotype', 'allele', 'chromosome'], a: 1, w: 'The ==phenotype==.' }
  ],
  exam: [
    { q: 'Define the terms gene and allele.', m: 2,
      p: ['gene: a length of ==DNA== that codes for a ==protein==', 'allele: a ==version== of a gene'] },
    { q: 'In cats, long hair (l) is recessive to short hair (L). Two short-haired cats (Ll) have kittens. Draw a Punnett square and state the probability of a long-haired kitten.', m: 4,
      p: ['gametes ==L and l== from each parent', 'correct square: ==LL, Ll, Ll, ll==', 'long hair = ==ll==', 'probability ==1/4 (25 %)=='] },
    { q: 'State two differences between mitosis and meiosis.', m: 2,
      p: ['mitosis: ==identical== cells; meiosis: ==genetically different== cells', 'mitosis keeps the chromosome number; meiosis ==halves== it'] },
    { q: 'Describe how sex is inherited in humans.', m: 3,
      p: ['females are ==XX==, males are ==XY==', 'eggs carry ==X==; sperm carry ==X or Y==', 'if a ==Y sperm== fertilises the egg, the baby is a boy (50 % chance)'] }
  ]
},
select: {
  code: 'Topic 17', name: 'Variation and selection',
  lede: 'Why individuals differ, how natural selection changes populations, and how humans use selective breeding.',
  learn: [
    { h: 'Variation', list: ['==Variation== is the ==differences== between individuals of the same species.', '==Continuous variation== has a ==range== of values: height and mass. It is caused by ==genes and the environment==. A graph is a ==bell-shaped curve==.', '==Discontinuous variation== has ==distinct categories==: blood group, ability to roll the tongue. It is caused by ==genes only==. A graph is a ==bar chart==.', '==Mutation== is a ==random, spontaneous change in a gene or chromosome==. It can be caused by ==ionising radiation== (X-rays, UV) and some ==chemicals== (in tobacco smoke). Most mutations are ==harmful== or have no effect; some give a useful new allele.', '==Sickle cell anaemia== is caused by a mutation. People with one copy (carriers) are ==resistant to malaria==.'] },
    { h: 'Natural selection', list: ['Organisms ==show variation==. They ==produce more offspring than can survive==. There is a ==struggle for survival==.', 'Those with ==alleles that suit the environment== are ==better adapted==, ==survive== and ==reproduce==, passing on those ==alleles==.', 'Over generations the ==frequency of the helpful allele increases==. This is ==evolution by natural selection==.', 'An ==adaptive feature== helps an organism ==survive and reproduce== in its environment (thick fur in Arctic fox, long roots in desert plants).', 'Antibiotic resistance in bacteria is an example. So is ==pesticide resistance== in insects.'] },
    { h: 'Selective breeding', list: ['==Selective breeding== (artificial selection) is humans choosing individuals with ==useful features== to breed together.', 'Steps: ==select== the best parents, ==breed== them, ==select the best offspring==, and ==repeat for many generations==.', 'Examples: ==cows== for milk, ==wheat== for high yield and disease resistance, dogs.', 'Disadvantages: ==less variation== (a new disease can kill the whole population) and ==inbreeding== can bring harmful recessive alleles.', 'It is different from natural selection because ==humans choose==, not the environment.'] }
  ],
  mistakes: ['Saying ==organisms choose to adapt==. Variation exists first; selection acts on it.', 'Saying ==individuals evolve==. Populations evolve over generations.', 'Saying ==the strongest survive==. The best adapted survive.', 'Saying ==mutations are always harmful==.', 'Saying ==the environment causes mutations== only: it is random, radiation and chemicals increase the rate.'],
  diagrams: [{ svg: svgSelect, cap: 'The steps of ==natural selection==.' }],
  worked: [
    W('Explain how bacteria become resistant to an antibiotic.', 'Use the steps of ==natural selection==.', 'Name the ==selection pressure==.', 'Variation → survive → reproduce',
      [['Variation', 'Bacteria vary. A random mutation gives a few bacteria resistance.', ''], ['Selection pressure', 'The antibiotic kills the non-resistant bacteria.', ''], ['Survive', 'The resistant bacteria survive.', ''], ['Reproduce', 'They reproduce and pass on the resistance allele.', ''], ['Result', 'The population is now mostly resistant.', 'The allele frequency has increased.']],
      [['Variation', 'mutation', 0], ['Pressure', 'antibiotic', 1], ['Survive', 'resistant', 2], ['Reproduce', 'pass on allele', 3], ['Result', 'resistant population', 4]], true),
    W('Compare continuous and discontinuous variation.', 'Compare ==range==, ==cause== and ==graph==.', 'Give an example of each.', 'Range v categories',
      [['Values', 'Continuous: a range, e.g. height. Discontinuous: distinct categories, e.g. blood group.', ''], ['Cause', 'Continuous: genes and environment. Discontinuous: genes only.', ''], ['Graph', 'Continuous: bell curve. Discontinuous: bar chart.', '']],
      [['Values', 'range v categories', 0], ['Cause', 'both v genes', 1], ['Graph', 'curve v bars', 2]], true),
    W('The heights of 5 plants are 12, 14, 15, 17 and 22 cm. Calculate the mean height and the range.', 'Mean = ==sum ÷ number==. Range = ==largest − smallest==.', 'Show both calculations.', 'mean = total ÷ n',
      [['Total', '12 + 14 + 15 + 17 + 22 = 80 cm', ''], ['Mean', '80 ÷ 5 = 16 cm', ''], ['Range', '22 − 12 = 10 cm', '']],
      [['Heights', '12, 14, 15, 17, 22', -1], ['Total', '80 cm', 0], ['Mean', '16 cm', 1], ['Range', '10 cm', 2]]),
    W('Describe how selective breeding could be used to produce cows that give more milk.', 'Give the ==steps in order==.', 'Use the word generations.', 'Select, breed, repeat',
      [['Select', 'Choose the cows with the highest milk yield and bulls from high-yielding mothers.', ''], ['Breed', 'Breed them together.', ''], ['Select again', 'Choose the offspring with the highest yield.', ''], ['Repeat', 'Continue for many generations.', 'Milk yield rises each time.']],
      [['Select', 'best milk cows', 0], ['Breed', 'together', 1], ['Choose', 'best offspring', 2], ['Repeat', 'many generations', 3]], true)
  ],
  drill: 'select',
  quiz: [
    { q: 'Blood group is an example of…', o: ['continuous variation', 'discontinuous variation', 'mutation', 'adaptation'], a: 1, w: '==Discontinuous== variation.' },
    { q: 'A mutation is…', o: ['planned change', 'random change in a gene', 'selective breeding', 'an adaptation'], a: 1, w: 'A ==random change== in a gene.' },
    { q: 'Natural selection acts on…', o: ['variation', 'a single organism', 'only the strong', 'the environment'], a: 0, w: 'On ==variation==.' },
    { q: 'Which can cause mutations?', o: ['oxygen', 'ionising radiation', 'vitamins', 'water'], a: 1, w: '==Ionising radiation==.' },
    { q: 'One disadvantage of selective breeding is…', o: ['higher yield', 'less variation', 'more variation', 'faster growth'], a: 1, w: '==Less variation==.' },
    { q: 'Height shows…', o: ['discontinuous variation', 'continuous variation', 'no variation', 'mutation only'], a: 1, w: '==Continuous== variation.' }
  ],
  exam: [
    { q: 'Define natural selection.', m: 3,
      p: ['individuals with ==alleles suited to the environment== survive better', '==reproduce== and pass on those alleles', 'so the ==frequency of the allele increases== in the next generation'] },
    { q: 'State two causes of mutations.', m: 2,
      p: ['==ionising radiation== (X-rays / UV)', '==chemicals== / mutagens (for example in tobacco smoke)'] },
    { q: 'Describe two differences between natural selection and selective breeding.', m: 2,
      p: ['natural selection is by the ==environment==; selective breeding is chosen by ==humans==', 'natural selection is for ==survival==; selective breeding is for ==useful features==, and is faster'] },
    { q: 'Explain why a new disease could wipe out a population of selectively bred wheat.', m: 2,
      p: ['the plants are ==genetically similar== (little variation)', 'so ==none may be resistant== to the disease'] }

},
ecosys: {
  code: 'Topic 18', name: 'Organisms and their environment',
  lede: 'How energy flows through food chains and webs, and how carbon is recycled in the carbon cycle.',
  learn: [
    { h: 'Energy flow', list: ['The ==Sun== is the source of energy for most food chains. ==Producers== (green plants) trap light by ==photosynthesis==.', 'A ==food chain== shows the ==transfer of energy== from one organism to the next. The ==arrow means “is eaten by”==.', 'A ==food web== is a network of linked food chains.', '==Trophic levels==: ==producer== → ==primary consumer== (herbivore) → ==secondary consumer== (carnivore) → ==tertiary consumer==. ==Decomposers== break down dead material.', 'Only about ==10 %== of energy passes on at each level. The rest is lost as ==heat== (respiration), in ==movement==, in ==waste== and in parts not eaten. So food chains are ==short==.', 'A ==pyramid of numbers== shows the number of organisms at each level. A ==pyramid of biomass== shows the mass.'], f: ['% energy transferred = energy passed on ÷ energy received × 100'] },
    { h: 'Carbon cycle', list: ['==Photosynthesis== removes CO₂ from the air. ==Respiration== (plants, animals, decomposers), ==decomposition== and ==combustion== of fossil fuels and wood put CO₂ back.', '==Feeding== passes carbon along the food chain. ==Death and waste== are broken down by ==decomposers==.', '==Fossil fuels== formed from dead organisms over millions of years. Burning them adds extra CO₂ faster than plants remove it.', '==Nutrient cycling==: decomposers return ==nitrates== to the soil for plants.'] },
    { h: 'Populations and communities', list: ['A ==population== is a group of organisms of ==one species== in an area. A ==community== is all the populations in an area. An ==ecosystem== is the community plus the ==non-living environment==. A ==habitat== is where an organism lives.', 'A population grows in four phases: ==lag==, ==exponential (fast growth)==, ==stationary== (stable) and ==death==.', 'Population size is limited by ==food==, ==water==, ==predators==, ==disease==, ==competition== and space.', '==Competition== is when organisms need the same limited resource. ==Predator and prey== numbers rise and fall in linked cycles.'] }

  mistakes: ['Writing the ==arrow the wrong way round== in a food chain.', 'Saying ==energy is lost== when it is transferred as heat (energy is not destroyed).', 'Saying ==all energy passes along== the chain. Only about 10 %.', 'Saying ==plants only take in carbon== and do not respire.', 'Saying ==a decomposer is a consumer== in the pyramid (it is its own group).'],
  diagrams: [{ svg: svgFoodWeb, cap: 'A ==food web==. Arrows show the direction of ==energy flow==.' }, { svg: svgCarbon, cap: 'The ==carbon cycle==.' }],
  worked: [

      [['Energy in', '20 000 kJ', -1], ['Energy out', '2000 kJ', -1], ['Percentage', '10 %', 2]]),
    W('Explain why food chains rarely have more than five trophic levels.', 'Energy is lost at every ==transfer==.', 'Give three ways energy is lost.', 'About 10 % passes on',
      [['Transfer', 'Only about 10 % of the energy passes to the next level.', ''], ['Losses', 'Energy is lost as heat from respiration, in movement and in waste and uneaten parts.', ''], ['Result', 'After four or five levels there is too little energy to support another.', '']],
      [['Passed on', 'about 10 %', 0], ['Lost as', 'heat, movement, waste', 1], ['Result', 'short chains', 2]], true),
    W('Describe how carbon dioxide is removed from and returned to the atmosphere.', 'Give ==two processes== for each direction.', 'Name the organisms.', 'Photosynthesis out; respiration, combustion in',
      [['Removed', 'Plants take CO₂ in by photosynthesis.', 'Making glucose.'], ['Returned: respiration', 'Plants, animals and decomposers release CO₂ by respiration.', ''], ['Returned: combustion', 'Burning fossil fuels and wood releases CO₂.', ''], ['Returned: decay', 'Decomposers break down dead matter, releasing CO₂.', '']],
      [['Out of air', 'photosynthesis', 0], ['Into air', 'respiration', 1], ['Into air', 'combustion', 2], ['Into air', 'decay', 3]], true),
    W('From the food web: grass → rabbit → fox, and grass → grasshopper → frog. Name the producer, a primary consumer, a secondary consumer, and say what happens to the fox population if rabbits die.', 'Read ==arrows as “is eaten by”==.', 'Say what the fox eats.', 'Trophic levels',
      [['Producer', 'Grass.', ''], ['Primary consumer', 'Rabbit (or grasshopper).', 'Eats the producer.'], ['Secondary consumer', 'Fox (or frog).', 'Eats a primary consumer.'], ['If rabbits die', 'The fox has less food, so its numbers fall unless it eats something else.', '']],
      [['Producer', 'grass', 0], ['Primary', 'rabbit', 1], ['Secondary', 'fox', 2], ['Fox numbers', 'fall', 3]], true)
  ],
  drill: 'ecosys',

    <li>Answer with ==the number of points== the marks suggest: 3 marks needs 3 points.</li></ul></div>
  <div class="card"><h3>Real past papers</h3><p>After finishing a topic, try real Cambridge questions from the Biology 0610 papers and check the mark schemes:
    <a href="https://pastpapers.papacambridge.com/papers/caie/igcse-biology-0610" target="_blank" rel="noopener">PapaCambridge 0610</a> ·
    <a href="https://pastpapersacademy.com/past-papers/" target="_blank" rel="noopener">Past Papers Academy</a>.</p></div>
  </div>`.replace(/==(.+?)==/g,'<mark class="kw">$1</mark>');
}
function cardHTML(card){
  const tbl = card.table ? `<div class="tbl"><table><thead><tr>${card.table[0].map(h => `<th>${h}</th>`).join('')}</tr></thead><tbody>${card.table.slice(1).map(r => `<tr>${r.map(c => `<td>${fmt(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>` : '';
  return `<div class="card"><h3>${card.h}</h3>${(card.p||[]).map(p=>`<p>${fmt(p)}</p>`).join('')}${card.f?`<div class="formula">${card.f.map(x=>`<span>${x}</span>`).join('')}</div>`:''}${card.list?`<ul>${card.list.map(l=>`<li>${fmt(l)}</li>`).join('')}</ul>`:''}${tbl}</div>`;
}
/* ---------- explanatory worked examples: Key idea, why lines, exam tip, live working table ---------- */
/* e.r rows: [label, value, step]. step -1 = given in the question; otherwise the step at which the row fills in. */
function wkBoard(e, k){
  const rows = e.r.map(([lab, val, at]) => { const on = at <= k;
    return `<tr class="${at === k && k >= 0 ? 'cur' : ''}"><th>${lab}</th><td class="${on ? (at >= 0 ? 'fill' : '') : 'q'}">${on ? fmt(val) : '?'}</td></tr>`; }).join('');
  return `<table class="wb">${rows}</table>${e.f ? `<p class="bnote">${fmt(e.f)}</p>` : ''}`;
}
function updateBoard(wk, items){
  const bi = wk.querySelector('.board-in'); if (!bi) return;
  const w = CH[cur].worked[+wk.dataset.worked]; let html = w.board0();
  items.forEach((li, j) => { if (!li.hidden && w.s[j][3]) html = w.s[j][3](); });
  bi.innerHTML = html;
  items.forEach(li => li.classList.remove('now')); const vis = items.filter(li => !li.hidden); if (vis.length) vis[vis.length-1].classList.add('now');
}

function renderChapter(k){
  const c = CH[k];
  const subs = [['learn','Learn'],['diagrams','Diagrams'],['worked','Worked'],...(c.drill?[['drill','Drill']]:[]),['quiz','Quiz'],['exam','Exam Qs']];
  let body = '';
  if (sub_ === 'learn') body = c.learn.map(cardHTML).join('') + `<div class="card mistakes"><h3>Mistakes that lose marks</h3><ul>${c.mistakes.map(l=>`<li>${fmt(l)}</li>`).join('')}</ul></div>`;
  if (sub_ === 'diagrams') body = c.diagrams.map(d => `<figure><div class="svgbox">${d.svg()}</div><figcaption>${fmt(d.cap)}</figcaption></figure>`).join('');
  if (sub_ === 'worked') body = `<div class="card"><h3>How to use these</h3><p class="note">Read the question and try it on paper. Then tap <b>Next step</b>. Each step shows the working, and the line underneath explains <b>why</b>. The table beside it fills in as you go. The exam tip appears at the end.</p></div>` + c.worked.map((w,i) => `<div class="card" data-worked="${i}"><span class="eyebrow">Example ${i+1}</span><p class="q">${w.q}</p>${w.intro ? `<p class="intro"><b>Key idea:</b> ${fmt(w.intro)}</p>` : ''}
      ${w.board0 ? '<div class="wk-split"><div class="board"><span class="eyebrow">Working table</span><div class="board-in">' + w.board0() + '</div></div>' : ''}<ol class="steps">${w.s.map((st,j) => `<li ${j===w.s.length-1?'class="final"':''} hidden><span class="sl">${st[0]}</span><span class="st${w.prose?' prose':''}">${fmt(st[1])}</span>${st[2] ? `<span class="why2">${fmt(st[2])}</span>` : ''}</li>`).join('')}</ol>${w.board0 ? '</div>' : ''}
      ${w.tip ? `<p class="tip" hidden><b>Exam tip:</b> ${fmt(w.tip)}</p>` : ''}
      <div class="row"><button class="btn primary" data-next>Next step</button><button class="btn ghost" data-all>Show all</button><button class="btn ghost" data-hide>Hide</button></div></div>`).join('');
  if (sub_ === 'drill') body = `<div class="card" id="drill"></div>`;
  if (sub_ === 'quiz') body = `<div class="card"><div class="scorebar"><div><h3>Quick quiz</h3><p class="note">Tap an answer. Best score is saved.</p></div><div class="big-score"><span id="qs">0</span>/${c.quiz.length}</div></div><div class="row"><button class="btn ghost" data-reset>Start again</button></div></div>`
    + c.quiz.map((q,i) => `<div class="card" data-quiz="${i}"><span class="eyebrow">Q${i+1}</span><p class="q">${q.q}</p><div class="opts">${q.o.map((o,j) => `<button class="opt" data-o="${j}">${o}</button>`).join('')}</div><p class="why" hidden>${fmt(q.w)}</p></div>`).join('');
  if (sub_ === 'exam') { const [g,t] = examScore(k, c.exam);
    body = `<div class="card"><div class="scorebar"><div><h3>Exam-style questions</h3><p class="note">Answer on paper first. Then open the mark scheme and tick each point you wrote. Each tick = 1 mark.</p></div><div class="big-score" id="exscore">${g}/${t}</div></div></div>` + c.exam.map((q,i) => examCard(k+'-'+i, q, i)).join(''); }
  return `<div class="chhead fadein"><span class="eyebrow">${c.code} · Biology</span><h2>${c.name}</h2><p class="lede">${c.lede}</p></div>
  <nav class="sub" role="tablist">${subs.map(([s,n]) => `<button class="subtab" role="tab" aria-selected="${s===sub_}" data-sub="${s}">${n}</button>`).join('')}</nav>
  <div class="stack fadein">${body}</div>`;
}
function examCard(key, q, i){
  const ticks = store.ticks[key] || []; const open = store.ticks['open-'+key];
  return `<div class="card" data-exam="${key}" data-max="${q.m}"><div class="qhead"><span class="eyebrow">Question ${q.lbl || (i+1)}</span><span class="marks">[${q.m} mark${q.m>1?'s':''}]</span></div>
    <p class="q">${q.q}</p>
    <div class="row"><button class="btn primary" data-ms>${open?'Hide mark scheme':'Show mark scheme'}</button><span class="got">${ticks.length?Math.min(ticks.length,q.m)+'/'+q.m:''}</span></div>
    <div class="ms" ${open?'':'hidden'}><p class="ms-intro">Tap each point you included${q.p.length>q.m?` (any ${q.m} of these ${q.p.length} points)`:''}:</p>
    ${q.p.map((p,j) => `<button class="point" aria-pressed="${ticks.includes(j)}" data-pt="${j}"><span class="box">✓</span><span>${fmt(p)}</span></button>`).join('')}</div></div>`;
}
let timer = null, left = 75*60;
const fmtTime = s => String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0');
function renderMock(){
  if (!THQ.length) drawTheory(store.thtype || 'core');
  const P = TH_PAPERS[store.thtype], list = THQ, [g,t] = examScore('mock', list), perMin = (P.mins / t).toFixed(2);
  let last = 0; const cards = list.map((q, i) => { let h = ''; if (q.qn !== last) { last = q.qn; const names = [...new Set(list.filter(x => x.qn === q.qn).map(x => CH[x.ch].name))].join(', '); h = `<h3 class="qgroup">Question ${q.qn} <span class="pm">[${q.qm} marks]</span><small>${names}</small></h3>`; } return h + examCard('mock-' + i, q, i); }).join('');
  return `<div class="chhead fadein"><span class="eyebrow">Cambridge 0610 pattern</span><h2>Theory paper</h2>
    <p class="lede">${P.name} style, ${P.title}: ${t} marks, ${P.mins} minutes, ${list[list.length-1].qn} questions with parts, in the order of the syllabus, like the real paper.</p></div>
    <div class="stack" style="margin-top:20px">
    <div class="card"><h3>Instructions</h3><ul>
      <li>Time allowed: ==1 hour 15 minutes==. Total: ==${t} marks==.</li>
      <li>Answer ==all== the questions on paper. The marks for each part are shown in brackets.</li>
      <li>You ==may use a calculator==. ==Show all your working== and use the ==correct units==.</li>
      <li>That is about ${perMin} minutes per mark.</li>
      <li>This pack covers the ==Core== course. The real Paper 3 is the Core theory paper.</li></ul></div>
    <div class="card"><div class="scorebar"><div class="timer" id="clock">${fmtTime(left)}</div><div class="big-score" id="exscore">${g}/${t}</div></div>
      <div class="row"><button class="btn primary" id="tgo">${timer?'Pause':'Start timer'}</button><button class="btn ghost" id="treset">Reset timer</button><button class="btn ghost" id="mnew">New paper (different questions)</button><button class="btn ghost" id="mclear">Clear my marks</button></div></div>
    ${cards}</div>`.replace(/==(.+?)==/g,'<mark class="kw">$1</mark>');
}
let quizScore = 0;
function bindView(){
  quizScore = 0;
  if (cur !== 'start' && cur !== 'mock' && cur !== 'mc' && sub_ === 'drill') newDrill();
  if (cur === 'mc') bindMC();
  if (cur === 'mock') {
    document.getElementById('tgo').onclick = () => {
      if (timer) { clearInterval(timer); timer = null; document.getElementById('tgo').textContent = 'Resume'; return; }
      document.getElementById('tgo').textContent = 'Pause';
      timer = setInterval(() => { left = Math.max(0, left-1); const c = document.getElementById('clock');
        if (c) { c.textContent = left ? fmtTime(left) : 'Time up'; c.classList.toggle('low', left < 300); }
        if (!left) { clearInterval(timer); timer = null; } }, 1000);
    };
    document.getElementById('treset').onclick = () => { clearInterval(timer); timer = null; left = TH_PAPERS[store.thtype].mins*60; render(); };
    document.getElementById('mnew').onclick = () => { clearInterval(timer); timer = null; drawTheory(store.thtype); render(); };
    document.getElementById('mclear').onclick = () => { Object.keys(store.ticks).forEach(k => { if (k.includes('mock-')) delete store.ticks[k]; }); save(); render(); };
  }
}
document.getElementById('view').addEventListener('click', e => {
  const t = e.target;
  const st = t.closest('[data-sub]'); if (st) { sub_ = st.dataset.sub; render(); return; }
  const wk = t.closest('[data-worked]');
  if (wk) { const items = [...wk.querySelectorAll('.steps li')];
    if (t.closest('[data-next]')) { const n = items.find(li => li.hidden); if (n) n.hidden = false; }
    if (t.closest('[data-all]')) items.forEach(li => li.hidden = false);
    if (t.closest('[data-hide]')) items.forEach(li => li.hidden = true);
    wk.querySelector('[data-next]').disabled = !items.some(li => li.hidden); const tp = wk.querySelector('.tip'); if (tp) tp.hidden = items.some(li => li.hidden); updateBoard(wk, items); return; }
  const qz = t.closest('[data-quiz]');
  if (qz && t.closest('[data-o]') && !qz.dataset.done) {
    const q = CH[cur].quiz[+qz.dataset.quiz]; const j = +t.closest('[data-o]').dataset.o; qz.dataset.done = '1';
    qz.querySelectorAll('.opt').forEach((b,bi) => { b.disabled = true; if (bi === q.a) b.classList.add('right'); else if (bi === j) b.classList.add('wrong'); });
    qz.querySelector('.why').hidden = false; if (j === q.a) quizScore++;
    document.getElementById('qs').textContent = quizScore;
    if (quizScore > (store.quiz[cur] || 0)) { store.quiz[cur] = quizScore; save(); } return; }
  if (t.closest('[data-reset]')) { render(); return; }
  const ex = t.closest('[data-exam]');
  if (ex) { const key = ex.dataset.exam, max = +ex.dataset.max;
    if (t.closest('[data-ms]')) { const ms = ex.querySelector('.ms'); ms.hidden = !ms.hidden; store.ticks['open-'+key] = !ms.hidden; save(); t.closest('[data-ms]').textContent = ms.hidden ? 'Show mark scheme' : 'Hide mark scheme'; return; }
    const pt = t.closest('[data-pt]');
    if (pt) { const j = +pt.dataset.pt; let arr = store.ticks[key] || []; arr = arr.includes(j) ? arr.filter(x => x !== j) : [...arr, j];
      store.ticks[key] = arr; save(); pt.setAttribute('aria-pressed', arr.includes(j));
      ex.querySelector('.got').textContent = arr.length ? Math.min(arr.length, max) + '/' + max : '';
      const list = cur === 'mock' ? THQ : CH[cur].exam;
      const [g,tt] = examScore(cur === 'mock' ? 'mock' : cur, list); const sc = document.getElementById('exscore'); if (sc) sc.textContent = g + '/' + tt; } }
});

/* ---------- drill engine ---------- */
let drillCur = null, streak = 0;
function judge(raw){
  const d = drillCur;
  if (d.kind === 'num') { const x = parseFloat(raw.replace(',', '.')); if (isNaN(x)) return null; return { ok: Math.abs(x - d.ans) <= (d.tol != null ? d.tol : Math.abs(d.ans)*0.02) + 1e-9 }; }
  if (d.kind === 'pf') { const sp = x => x.replace(/²/g, '^2').replace(/³/g, '^3'); const out = []; let m; const re = /(\d+)(?:\^(\d+))?/g; const r = sp(Array.isArray(raw) ? raw.join('*') : String(raw));
    while ((m = re.exec(r))) { const e = m[2] ? +m[2] : 1; for (let i = 0; i < e; i++) out.push(+m[1]); } if (!out.length) return null;
    return { ok: out.slice().sort((a, b) => a - b).join(',') === d.ans.join(',') }; }
  if (d.kind === 'pair') { const v = (Array.isArray(raw) ? raw.join(',') : String(raw)).replace(/−/g, '-').match(/-?\d+(?:\.\d+)?/g); if (!v) return null; if (v.length !== 2) return { ok:false, note:'Type two numbers like 3,5.' };
    return { ok: Math.abs(+v[0] - d.ans[0]) < 1e-9 && Math.abs(+v[1] - d.ans[1]) < 1e-9 }; }
  if (d.kind === 'text') { const n = s => s.replace(/\s+/g, '').replace(/[−–]/g, '-').toLowerCase(); const r = n(raw); if (!r) return null; return { ok: r === n(d.ans) }; }
  if (d.kind === 'frac') { const P = s => { const m = s.replace(/\s+/g, '').match(/^(-?\d+)(?:\/(\d+))?$/); return m ? [+m[1], m[2] ? +m[2] : 1] : null; };
    const x = P(raw), y = P(d.ans); if (!x) return raw.trim() ? { ok:false, note:'Write it like 7/12.' } : null; if (!x[1]) return { ok:false };
    if (x[0] * y[1] !== y[0] * x[1]) return { ok:false };
    const g = (a, b) => b ? g(b, a % b) : Math.abs(a); return g(x[0], x[1]) === 1 ? { ok:true } : { ok:false, note:'Right value, but simplify it.' }; }
  if (d.kind === 'config') { const m = raw.match(/\d+/g); if (!m) return null; return { ok: m.join(',') === d.ans }; }
  if (d.kind === 'formula') { const r = unsub(raw.replace(/\s+/g, '')); if (!r) return null;
    if (r === d.ans) return { ok:true }; if (r.toLowerCase() === d.ans.toLowerCase()) return { ok:true, note:`Watch the capital letters: ${sub(d.ans)}` }; return { ok:false }; }
  return null;
}
const answerText = d => d.kind === 'choice' ? d.choices[d.ans] : d.kind === 'num' ? num(d.ans) : d.kind === 'pf' ? d.ans.join(' × ') : d.kind === 'pair' ? '(' + d.ans.join(', ') + ')' : d.ans;
function showResult(ok, note){
  streak = ok ? streak + 1 : 0;
  if (streak > (store.drill[cur] || 0)) { store.drill[cur] = streak; save(); }
  const d = drillCur;
  document.getElementById('dfb').innerHTML = `<div class="fb ${ok?'ok':'no'}"><span class="verdict">${ok ? 'Correct!' : 'Not quite. The answer is ' + answerText(d) + '.'}${note ? ' ' + note : ''}</span>
    <ol class="steps">${d.s.map((s,j)=>`<li ${j===d.s.length-1?'class="final"':''}><span class="sl">${s[0]}</span><span class="st">${s[1]}</span></li>`).join('')}</ol>
    <div class="row"><button class="btn primary" type="button" id="dnext">Next question</button></div></div>`;
  document.getElementById('dnext').onclick = newDrill;
  document.querySelector('#drill .stat').textContent = `streak ${streak} · best ${store.drill[cur] || 0}`;
}
function newDrill(){
  const box = document.getElementById('drill'); if (!box) return;
  drillCur = pick(DRILLS[CH[cur].drill])();
  const d = drillCur;
  const input = d.kind === 'choice'
    ? `<div class="opts" id="dch">${d.choices.map((o,j) => `<button class="opt" type="button" data-dc="${j}">${o}</button>`).join('')}</div>`
    : `<form class="answer" id="dform"><label for="dans" class="note">Your answer</label><input id="dans" autocomplete="off" autocapitalize="off" spellcheck="false" ${d.kind==='num'?'inputmode="decimal"':''} placeholder="${d.kind==='pair'?'e.g. 3,5':d.kind==='pf'?'e.g. 2*2*3':d.kind==='text'?'type your answer':d.kind==='frac'?'e.g. 7/12':'number'}"><button class="btn primary" type="submit">Check</button></form>`;
  box.innerHTML = `<div class="scorebar"><span class="eyebrow">Practice drill</span><span class="stat">streak ${streak} · best ${store.drill[cur] || 0}</span></div>
    <p class="drillq">${d.q}</p>${input}<div id="dfb"></div>
    <div class="row"><button class="btn ghost" type="button" id="dskip">Skip to a new question</button></div>`;
  if (d.kind === 'choice') {
    document.getElementById('dch').onclick = ev => { const b = ev.target.closest('[data-dc]'); if (!b || d.done) return; d.done = true; const j = +b.dataset.dc;
      document.querySelectorAll('#dch .opt').forEach((o,oi) => { o.disabled = true; if (oi === d.ans) o.classList.add('right'); else if (oi === j) o.classList.add('wrong'); });
      showResult(j === d.ans); };
  } else {
    document.getElementById('dform').onsubmit = ev => { ev.preventDefault(); if (d.done) return;
      const r = judge(document.getElementById('dans').value.trim());
      if (!r) { document.getElementById('dfb').innerHTML = `<div class="fb no"><span class="verdict">Type an answer first.</span></div>`; return; }
      d.done = true; showResult(r.ok, r.note); };
  }
  document.getElementById('dskip').onclick = () => { streak = 0; newDrill(); };
}
renderTabs(); render();

/* chapter tabs: arrow buttons, mouse wheel and keep the selected tab in view (for screens without touch) */
(function(){
  const nav = document.getElementById('tabs'), L = document.getElementById('tabL'), R = document.getElementById('tabR');
  const upd = () => { const m = nav.scrollWidth - nav.clientWidth; L.hidden = nav.scrollLeft <= 2; R.hidden = nav.scrollLeft >= m - 2; };
  L.onclick = () => nav.scrollBy({ left: -nav.clientWidth * .7, behavior: 'smooth' });
  R.onclick = () => nav.scrollBy({ left: nav.clientWidth * .7, behavior: 'smooth' });
  nav.addEventListener('scroll', upd); window.addEventListener('resize', upd);
  nav.addEventListener('wheel', e => { if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) { nav.scrollLeft += e.deltaY; e.preventDefault(); } }, { passive: false });
  new MutationObserver(() => { const a = nav.querySelector('[aria-selected="true"]'); if (a) a.scrollIntoView({ inline: 'center', block: 'nearest' }); upd(); }).observe(nav, { childList: true });
  const a = nav.querySelector('[aria-selected="true"]'); if (a) a.scrollIntoView({ inline: 'center', block: 'nearest' }); upd();
})();
</script>
