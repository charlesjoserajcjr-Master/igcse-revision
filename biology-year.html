<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Biology Full-Year Pack</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: lab-notebook study app — sticky chapter bar, one column of working cards on a faint graph-paper ground (shared with the Physics pack) */
:root{
  --paper:#EEF3F6; --card:#FFFFFF; --ink:#132235; --muted:#56687C; --line:#D3DDE6; --grid:rgba(19,34,53,.045);
  --accent:#0A6C96; --accent-soft:#E1F0F7; --hot:#D2470E; --hot-soft:#FCE9E0;
  --kw-bg:#FFE45C; --kw-ink:#132235;
  --good:#2B8A3E; --good-soft:#E3F4E6; --bad:#C92A2A; --bad-soft:#FBE4E4;
  --water:#DCEEF6; --cu:#4A9BD8; --copper:#B4602B; --zinc:#A3ADB8; --ppt:#F2E6A0; --noble:#E6F2E0;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root{
  --paper:#0E1620; --card:#16212D; --ink:#E5EDF4; --muted:#93A4B6; --line:#2A3949; --grid:rgba(229,237,244,.035);
  --accent:#5DB8E2; --accent-soft:#16344A; --hot:#FF8C55; --hot-soft:#3E2216;
  --kw-bg:#6B5A00; --kw-ink:#FFF3B0;
  --good:#69DB7C; --good-soft:#173322; --bad:#FF8787; --bad-soft:#3D1C1C;
  --water:#1B3A4D; --cu:#2F7DBA; --copper:#D07A40; --zinc:#6C7884; --ppt:#6B6232; --noble:#1D3322; color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px}
.wrap{max-width:900px;margin:0 auto;padding-inline:16px;padding-block:0 64px}
h1,h2,h3{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0}
h2{font-size:1.6rem;font-weight:800}
h3{font-size:1.15rem;font-weight:600}
p{margin:0}
mark.kw{background:var(--kw-bg);color:var(--kw-ink);padding:0 .2em;border-radius:3px;font-weight:700;box-decoration-break:clone;-webkit-box-decoration-break:clone}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.top{position:sticky;top:0;z-index:10;background:var(--paper);border-bottom:1px solid var(--line)}
.top .wrap{padding-block:12px 10px;display:flex;flex-direction:column;gap:10px}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand h1{font-size:1.35rem;font-weight:800;letter-spacing:-.01em}
.brand h1 span{color:var(--accent)}
.examdate{font-family:var(--mono);font-size:.78rem;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;text-decoration:none}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 16px;font-weight:700;font-size:.95rem}
.tab small{font-family:var(--mono);font-weight:400;color:var(--muted);margin-right:6px;font-size:.75rem}
.tab[aria-selected="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tab[aria-selected="true"] small{color:inherit;opacity:.7}
.sub{display:flex;gap:4px;flex-wrap:wrap;margin-block:20px 18px;border-bottom:2px solid var(--line)}
.subtab{border:0;background:none;padding:10px 12px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px}
.subtab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.chhead{display:flex;flex-direction:column;gap:6px;margin-top:22px}
.eyebrow{font-family:var(--mono);font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.lede{color:var(--muted);max-width:62ch}
.stack{display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px 20px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px}
.formula{font-family:var(--mono);font-size:1.05rem;font-weight:600;background:var(--accent-soft);color:var(--ink);border-radius:8px;padding:10px 14px;align-self:flex-start;max-width:100%;overflow-x:auto;display:flex;flex-direction:column;gap:4px}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;font-size:.95rem;min-width:100%}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:7px 12px 7px 0;text-align:left;vertical-align:top}
.tbl th{font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.mistakes{background:var(--hot-soft);border-color:transparent}
.mistakes h3{color:var(--hot)}
figure{margin:0;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px}
figure .svgbox{overflow-x:auto}
figure svg{display:block;width:100%;min-width:440px;height:auto}
figcaption{font-size:.95rem}
svg .ln{stroke:var(--ink);stroke-width:2;fill:none}
svg .thin{stroke:var(--muted);stroke-width:1;fill:none}
svg .glass{stroke:var(--ink);stroke-width:2;fill:none}
svg .acc{stroke:var(--accent);stroke-width:2.5;fill:none}
svg .hotl{stroke:var(--hot);stroke-width:2.5;fill:none}
svg .accf{fill:var(--accent)}
svg .hotf{fill:var(--hot)}
svg .inkf{fill:var(--ink)}
svg .cardf{fill:var(--card)}
svg .shell{fill:none;stroke:var(--muted);stroke-width:1.4}
svg .atom{fill:var(--card);stroke:var(--ink);stroke-width:1.8}
svg .nuc{fill:var(--accent-soft);stroke:var(--ink);stroke-width:1.4}
svg .cross{stroke:var(--hot);stroke-width:2.4}
svg .metal{fill:var(--accent-soft);stroke:var(--line)}
svg .nonmetal{fill:var(--card);stroke:var(--line)}
svg .noble{fill:var(--noble);stroke:var(--line)}
svg .cuf{fill:var(--cu)}
svg .waterf{fill:var(--water)}
svg .copperf{fill:var(--copper)}
svg .zincf{fill:var(--zinc);stroke:var(--ink);stroke-width:1.2}
svg .pptf{fill:var(--ppt);stroke:var(--ink);stroke-width:1}
svg text{fill:var(--ink);font-family:var(--body);font-size:13px}
svg .lbl{font-weight:700}
svg .sym{font-family:var(--display);font-weight:800;font-size:22px;text-anchor:middle}
svg .mid{text-anchor:middle}
svg .end{text-anchor:end}
svg .mut{fill:var(--muted)}
svg .acct{fill:var(--accent);font-weight:700}
svg .hott{fill:var(--hot);font-weight:700}
svg .mono{font-family:var(--mono)}
.q{font-weight:700}
.steps{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px;counter-reset:s}
.steps li{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:baseline;counter-increment:s}
.steps li::before{content:counter(s);font-family:var(--mono);font-size:.8rem;font-weight:600;width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--card);display:grid;place-items:center;grid-row:span 2}
.steps .sl{font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.steps .st{font-family:var(--mono);font-size:1rem;min-width:0;overflow-wrap:anywhere}
.steps li.final .st{font-weight:700;color:var(--good)}
.steps .prose{font-family:var(--body)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:9px 16px;font-weight:700}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--card)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:default}
.drillq{font-size:1.1rem}
.answer{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.answer input{font:inherit;font-family:var(--mono);font-size:1.1rem;padding:9px 12px;border:2px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);width:12ch}
.unit{font-family:var(--mono);color:var(--muted)}
.fb{border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.fb.ok{background:var(--good-soft)}
.fb.no{background:var(--bad-soft)}
.fb .verdict{font-weight:700}
.fb.ok .verdict{color:var(--good)}
.fb.no .verdict{color:var(--bad)}
.stat{font-family:var(--mono);font-size:.85rem;color:var(--muted)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:8px}
.opt{text-align:left;border:2px solid var(--line);background:var(--paper);border-radius:8px;padding:10px 14px;font-weight:400}
.opt.right{border-color:var(--good);background:var(--good-soft);font-weight:700}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.why{font-size:.95rem;border-left:3px solid var(--accent);padding-left:12px}
.scorebar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.big-score{font-family:var(--display);font-size:1.8rem;font-weight:800}
.qhead{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.marks{font-family:var(--mono);font-size:.85rem;color:var(--muted);white-space:nowrap}
.ms{display:flex;flex-direction:column;gap:6px}
.ms-intro{font-size:.9rem;color:var(--muted)}
.point{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:10px 12px;font-weight:400}
.point .box{width:24px;height:24px;border:2px solid var(--muted);border-radius:6px;display:grid;place-items:center;font-weight:700;color:var(--card)}
.point[aria-pressed="true"]{border-color:var(--good)}
.point[aria-pressed="true"] .box{background:var(--good);border-color:var(--good)}
.got{font-family:var(--mono);font-weight:600}
.note{font-size:.9rem;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:14px}
.prog{display:flex;flex-direction:column;gap:6px}
.bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.bar > i{display:block;height:100%;background:var(--accent);border-radius:5px}
.pl{display:flex;justify-content:space-between;font-size:.9rem;gap:8px}
.pl span:last-child{font-family:var(--mono);color:var(--muted);white-space:nowrap}
.cw{display:grid;grid-template-columns:auto 1fr;gap:6px 14px}
.cw dt{font-weight:700;color:var(--accent)}
.cw dd{margin:0}
.plan{display:flex;flex-direction:column;border-left:2px solid var(--line);margin-left:6px}
.plan div{position:relative;padding:0 0 12px 18px}
.plan div::before{content:"";position:absolute;left:-7px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--card);border:2px solid var(--accent)}
.plan b{font-family:var(--mono);font-size:.82rem;color:var(--muted);display:block;font-weight:600}
.timer{font-family:var(--mono);font-size:2.2rem;font-weight:600;font-variant-numeric:tabular-nums}
.timer.low{color:var(--hot)}
a{color:var(--accent)}
@media (prefers-reduced-motion: no-preference){.fadein{animation:fi .25s ease-out}@keyframes fi{from{transform:translateY(4px)}to{transform:none}}}
.intro{background:var(--accent-soft);border-radius:8px;padding:10px 14px;font-size:.98rem;margin:0}
.steps .why2{grid-column:2;font-family:var(--body);font-size:.93rem;color:var(--muted);border-left:3px solid var(--line);padding-left:10px}
.steps li.now .st{color:var(--ink)}
.tip{background:var(--kw-bg);color:var(--kw-ink);border-radius:8px;padding:10px 14px;font-size:.95rem;margin:0}
.tip mark.kw{background:transparent;padding:0;text-decoration:underline}
.wk-split{display:grid;grid-template-columns:minmax(0,1fr) minmax(250px,330px);grid-template-areas:"steps board";gap:18px;align-items:start}
.wk-split .steps{grid-area:steps}
.wk-split .board{grid-area:board;position:sticky;top:150px;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0;overflow-x:auto}
@media (max-width:700px){.wk-split{grid-template-columns:minmax(0,1fr);grid-template-areas:"board" "steps"}.wk-split .board{top:118px;z-index:2}}
.wb{border-collapse:collapse;font-size:.88rem;width:100%}
.wb th,.wb td{border:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top;background:var(--card)}
.wb th{color:var(--muted);font-weight:400;white-space:nowrap;width:1%}
.wb td{font-family:var(--mono);overflow-wrap:anywhere}
.wb td.q{color:var(--muted);font-weight:400}
.wb td.fill{background:var(--good-soft);color:var(--good);font-weight:700}
.wb tr.cur th,.wb tr.cur td{outline:2px solid var(--hot);outline-offset:-2px}
.bnote{font-size:.9rem;margin:0}
.tabwrap{display:flex;align-items:center;gap:6px;min-width:0}
.tabwrap .tabs{flex:1;min-width:0;scroll-behavior:smooth}
.tabarrow{flex:0 0 auto;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:1.3rem;line-height:1;display:grid;place-items:center;padding:0 0 3px;cursor:pointer}
.tabarrow:hover{border-color:var(--accent);color:var(--accent)}
.tabarrow[hidden]{display:none}
.opt.sel{border-color:var(--accent);background:var(--accent-soft);font-weight:700}
.pm{color:var(--muted);font-family:var(--mono);font-size:.85em;white-space:nowrap}
.qgroup{margin:18px 0 -6px;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline}
.qgroup small{color:var(--muted);font-family:var(--body);font-weight:400;font-size:.85rem}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand">
      <h1>Biology <span>Full-Year</span> Pack</h1>
      <a href="./" class="examdate">← All subjects</a>
      <div class="examdate">Grade 8 · Whole syllabus</div>
    </div>
    <div class="tabwrap"><button class="tabarrow" id="tabL" type="button" aria-label="Scroll chapters left" hidden>&#8249;</button><nav class="tabs" role="tablist" id="tabs"></nav><button class="tabarrow" id="tabR" type="button" aria-label="Scroll chapters right">&#8250;</button></div>
  </div>
</header>
<main class="wrap" id="view"></main>

<script>
/* ---------- helpers ---------- */
const fmt = s => String(s).replace(/==(.+?)==/g,'<mark class="kw">$1</mark>').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
const pick = a => a[Math.floor(Math.random()*a.length)];
const rint = (a,b) => a + Math.floor(Math.random()*(b-a+1));
const shuffle = a => { const b = a.slice(); for (let i = b.length-1; i > 0; i--) { const j = Math.floor(Math.random()*(i+1)); [b[i],b[j]] = [b[j],b[i]]; } return b; };
const num = x => String(Math.round(x*100)/100);
let store = {};
try { store = JSON.parse(localStorage.getItem('biopack-v1') || '{}') || {}; } catch(e) { store = {}; }
store.ticks = store.ticks || {}; store.quiz = store.quiz || {}; store.drill = store.drill || {};
const save = () => { try { localStorage.setItem('biopack-v1', JSON.stringify(store)); } catch(e) {} };
/* ---------- diagrams ---------- */
function arrowDefs(id){
  return `<defs><marker id="a-${id}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="inkf"/></marker>
  <marker id="b-${id}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="accf"/></marker>
  <marker id="h-${id}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="hotf"/></marker></defs>`;
}
const T = (x, y, s, cls = '') => `<text x="${x}" y="${y}" class="${cls}">${s}</text>`;
const W = (q, intro, tip, f, s, r, prose) => ({ q, intro, tip, f, s, r, prose });
function svgKey(){
  const b = (x, y, w, t, cls = 'metal') => `<rect x="${x}" y="${y}" width="${w}" height="40" rx="8" class="${cls}" style="stroke:var(--ink);stroke-width:1.5"/>${T(x + w / 2, y + 25, t, 'mid')}`;
  return `<svg viewBox="0 0 860 300" role="img" aria-label="A dichotomous key as a branching diagram">${arrowDefs('k')}
  ${b(300, 10, 260, 'Does it have a backbone?')}
  <line x1="360" y1="50" x2="200" y2="90" class="ln" marker-end="url(#a-k)"/><line x1="500" y1="50" x2="660" y2="90" class="ln" marker-end="url(#a-k)"/>${T(260, 66, 'yes', 'mid acct')}${T(600, 66, 'no', 'mid hott')}
  ${b(100, 92, 200, 'Has feathers?')}${b(560, 92, 200, 'Has six legs?')}
  <line x1="150" y1="132" x2="80" y2="180" class="ln" marker-end="url(#a-k)"/><line x1="250" y1="132" x2="320" y2="180" class="ln" marker-end="url(#a-k)"/><line x1="610" y1="132" x2="540" y2="180" class="ln" marker-end="url(#a-k)"/><line x1="710" y1="132" x2="780" y2="180" class="ln" marker-end="url(#a-k)"/>
  ${b(20, 182, 120, 'bird', 'nonmetal')}${b(260, 182, 120, 'other vertebrate', 'nonmetal')}${b(480, 182, 120, 'insect', 'nonmetal')}${b(720, 182, 120, 'other invertebrate', 'nonmetal')}
  ${T(430, 258, 'A dichotomous key uses yes / no questions with TWO choices at every step.', 'mid lbl')}${T(430, 280, 'Binomial name = Genus (capital) + species (small): Homo sapiens.', 'mid mut')}</svg>`;
}
function svgCellsBio(){
  const cell = (x, plant) => `${plant ? `<rect x="${x}" y="30" width="230" height="190" rx="10" class="metal" style="stroke:var(--ink);stroke-width:4"/><rect x="${x + 8}" y="38" width="214" height="174" rx="8" class="nonmetal" style="stroke:var(--accent);stroke-width:1.6"/>` : `<ellipse cx="${x + 115}" cy="125" rx="115" ry="95" class="nonmetal" style="stroke:var(--accent);stroke-width:2.5"/>`}
  <circle cx="${x + 100}" cy="110" r="26" class="metal" style="stroke:var(--ink);stroke-width:1.6"/><circle cx="${x + 100}" cy="110" r="7" class="inkf"/>
  <ellipse cx="${x + 170}" cy="160" rx="18" ry="9" class="hotf" style="fill-opacity:.35;stroke:var(--hot);stroke-width:1.6"/>
  ${plant ? `<ellipse cx="${x + 70}" cy="170" rx="22" ry="11" class="accf" style="fill-opacity:.4;stroke:var(--accent);stroke-width:1.6"/><ellipse cx="${x + 160}" cy="75" rx="22" ry="11" class="accf" style="fill-opacity:.4;stroke:var(--accent);stroke-width:1.6"/><rect x="${x + 135}" y="95" width="62" height="48" rx="14" class="cardf" style="stroke:var(--muted);stroke-width:1.4"/>` : ''}`;
  return `<svg viewBox="0 0 980 300" role="img" aria-label="Animal and plant cells">
  ${cell(30, false)}${cell(330, true)}${T(145, 250, 'Animal cell', 'mid lbl')}${T(445, 250, 'Plant cell', 'mid lbl')}
  ${T(145, 274, 'nucleus, mitochondria, ribosomes', 'mid mut')}
  ${T(640, 50, 'Plant cells ALSO have:', 'lbl')}${T(640, 76, 'cell wall (cellulose)', 'acct')}${T(640, 98, 'chloroplasts (photosynthesis)', 'acct')}${T(640, 120, 'large permanent vacuole', 'acct')}${T(640, 142, '(cell sap)', 'mut')}
  ${T(640, 184, 'Nucleus: controls the cell, holds DNA', 'mut')}${T(640, 206, 'Mitochondria: aerobic respiration', 'mut')}${T(640, 228, 'Ribosomes: make proteins', 'mut')}</svg>`;
}
function svgOsmosis(){
  const cellp = (x, cls, label, sub) => `<ellipse cx="${x}" cy="110" rx="${cls}" ry="${cls}" class="metal" style="stroke:var(--ink);stroke-width:2"/>${T(x, 208, label, 'mid lbl')}${T(x, 228, sub, 'mid mut')}`;
  return `<svg viewBox="0 0 860 280" role="img" aria-label="Osmosis in animal cells in different solutions">${arrowDefs('o')}
  ${cellp(140, 56, 'in pure water', 'water enters: cell swells and bursts')}${cellp(430, 44, 'in same concentration', 'no net movement: no change')}${cellp(720, 32, 'in concentrated solution', 'water leaves: cell shrinks')}
  <line x1="60" y1="110" x2="86" y2="110" class="acc" marker-end="url(#b-o)"/><line x1="220" y1="110" x2="194" y2="110" class="acc" marker-end="url(#b-o)"/>
  <line x1="780" y1="110" x2="806" y2="110" class="hotl" marker-end="url(#h-o)"/>

    { h: 'What enzymes do', list: ['Enzymes are ==proteins== that act as ==biological catalysts==. They ==speed up chemical reactions== and are ==not used up==.', 'Each enzyme has an ==active site== of a particular shape. Only its ==substrate== fits. This is why enzymes are ==specific==.', 'Substrate binds to the active site, reacts, and the ==products== leave. This is the ==lock and key model==.'] },
    { h: 'Temperature and pH', list: ['Rate ==increases with temperature== up to the ==optimum== (about 37 °C in humans) because particles have more ==kinetic energy== and collide more often.', 'Above the optimum the enzyme is ==denatured==: the ==active site changes shape== and the substrate no longer fits. This is ==permanent==.', 'Each enzyme has an ==optimum pH==. Too acid or alkaline also denatures it. Pepsin works at ==pH 2== (stomach), amylase at about pH 7.', 'At ==low temperature== enzymes are slow but not denatured.'] },
    { h: 'Digestive enzymes', table: [['Enzyme', 'Substrate', 'Products'], ['==amylase==', 'starch', 'maltose (then glucose)'], ['==protease==', 'protein', 'amino acids'], ['==lipase==', 'fats / lipids', 'fatty acids and glycerol'], ['==catalase==', 'hydrogen peroxide', 'water and oxygen']], f: ['rate = volume of product ÷ time', 'or rate = 1 ÷ time'] }

    { h: 'The leaf and mineral ions', list: ['The leaf is ==thin== (short diffusion distance) and ==broad== (large surface area to catch light).', '==Palisade mesophyll== has lots of chloroplasts. ==Spongy mesophyll== has air spaces. ==Stomata== let CO₂ in; ==guard cells== open and close them.', '==Xylem== brings water and mineral ions up. ==Phloem== carries sugars away.', '==Nitrate== ions make ==amino acids== and proteins: lack gives ==stunted growth== and yellow older leaves.', '==Magnesium== ions make ==chlorophyll==: lack gives ==yellow leaves== (chlorosis).'] }

  lede: 'A balanced diet, what happens in each part of the alimentary canal, and how digested food is absorbed.',
  learn: [
    { h: 'A balanced diet', table: [['Nutrient', 'Source', 'Use', 'Lack causes'], ['==carbohydrate==', 'rice, bread, potato', 'energy', 'tiredness, weight loss'], ['==protein==', 'meat, fish, eggs, beans', 'growth and repair', '==kwashiorkor==, slow growth'], ['==fat==', 'butter, oil, nuts', 'energy store, insulation', 'weight loss'], ['==vitamin C==', 'citrus fruits', 'healthy skin and gums', '==scurvy== (bleeding gums)'], ['==vitamin D==', 'oily fish, sunlight', 'calcium absorption, strong bones', '==rickets=='], ['==calcium==', 'milk, cheese', 'bones and teeth', 'weak bones and teeth'], ['==iron==', 'red meat, spinach', 'makes haemoglobin', '==anaemia== (tired, pale)'], ['==fibre==', 'vegetables, wholegrain', 'helps ==peristalsis==', 'constipation'], ['water', 'drinks, food', 'solvent, transport', 'dehydration']] },
    { h: 'Digestion', list: ['==Ingestion== is taking food in. ==Digestion== breaks large insoluble molecules into small soluble ones. ==Absorption== moves them into the blood. ==Egestion== removes undigested food (faeces).', '==Mechanical digestion== (teeth, churning of the stomach) breaks food into smaller pieces and increases ==surface area== for enzymes.', '==Chemical digestion== uses enzymes. Starch → ==maltose== (amylase) → glucose. Protein → ==amino acids== (protease). Fat → ==fatty acids and glycerol== (lipase).', '==Peristalsis== is waves of muscle contraction that push food along the gut.', 'The ==stomach== makes ==hydrochloric acid==: kills bacteria and gives the ==low pH== for protease (pepsin).', '==Bile== (made in the ==liver==, stored in the ==gall bladder==) ==neutralises acid== and ==emulsifies fat==, giving it a larger surface area for lipase.'] },
    { h: 'Absorption and teeth', list: ['Most absorption happens in the ==small intestine==. Its lining has ==villi== with a large surface area, thin walls (one cell thick), a good blood supply and a ==lacteal== for fats.', 'The ==large intestine== absorbs ==water==.', 'Teeth: ==incisors== cut, ==canines== tear, ==premolars and molars== grind. Tooth structure: ==enamel== (hard), ==dentine==, ==pulp== (nerves and blood).', '==Tooth decay==: bacteria in plaque change sugar to acid, which dissolves enamel. Prevent by brushing, less sugar, fluoride.'] }
  ],
  mistakes: ['Saying ==bile is an enzyme==. It has no enzymes: it emulsifies fat.', 'Saying ==digestion and absorption are the same==. Digestion is breaking down; absorption is moving into the blood.', 'Saying ==egestion is excretion==. Egestion is undigested food; excretion is metabolic waste.', 'Saying the ==stomach absorbs food== (little is absorbed there).', 'Saying villi ==increase digestion==. They increase the surface area for ==absorption==.'],
  diagrams: [{ svg: svgGut, cap: 'The ==alimentary canal==: ingestion to egestion.' }],
  worked: [
    W('Explain how the small intestine is adapted for absorption.', 'Link each ==feature== to a ==reason==.', 'Use villi, thin wall and blood supply.', 'Feature + because',
      [['Villi', 'The lining has many villi. This gives a large surface area.', 'More area means more absorption.'], ['Thin wall', 'The wall is one cell thick. This gives a short diffusion distance.', ''], ['Blood supply', 'Each villus has a network of capillaries. The blood carries absorbed food away, keeping a steep concentration gradient.', ''], ['Length', 'The small intestine is long, so there is time to absorb.', '']],
      [['Villi', 'large surface area', 0], ['Thin wall', 'short distance', 1], ['Capillaries', 'steep gradient', 2]], true),
    W('Describe the roles of bile in digestion.', 'Bile has ==two jobs==.', 'Remember: it contains no enzymes.', 'Neutralise + emulsify',
      [['Where', 'Made in the liver, stored in the gall bladder, released into the small intestine.', ''], ['Job 1', 'It neutralises stomach acid.', 'Enzymes in the small intestine need an alkaline pH.'], ['Job 2', 'It emulsifies fat into small droplets.', 'A larger surface area for lipase.']],
      [['Where', 'liver, gall bladder', 0], ['Job 1', 'neutralises acid', 1], ['Job 2', 'emulsifies fat', 2]], true),
    W('A child eats few vegetables or red meat and is often tired and pale. Suggest a deficiency and explain.', 'Link ==tired and pale== to ==iron==.', 'Name the nutrient, the condition and the reason.', 'Iron → haemoglobin',
      [['Nutrient', 'Iron is missing.', ''], ['Condition', 'The child has anaemia.', ''], ['Reason', 'Iron is needed to make haemoglobin in red blood cells.', ''], ['Result', 'Less oxygen is carried, so the child feels tired and looks pale.', '']],
      [['Missing', 'iron', 0], ['Condition', 'anaemia', 1], ['Iron makes', 'haemoglobin', 2], ['Effect', 'less oxygen carried', 3]], true),
    W('Describe what happens to a piece of bread from the mouth to the small intestine.', 'Follow the ==order==: mouth, stomach, small intestine.', 'Name the enzyme and the product at each stage.', 'Mouth → stomach → small intestine',
      [['Mouth', 'Teeth chew the bread (mechanical digestion). Amylase in saliva breaks starch into maltose.', ''], ['Oesophagus', 'Peristalsis pushes the food to the stomach.', ''], ['Stomach', 'It is churned. Acid kills bacteria. Protease works on any protein.', ''], ['Small intestine', 'Enzymes complete digestion: maltose to glucose. Glucose is absorbed into the blood.', '']],
      [['Mouth', 'starch → maltose', 0], ['Gullet', 'peristalsis', 1], ['Stomach', 'churning, acid', 2], ['Intestine', 'glucose absorbed', 3]], true)
  ],

  quiz: [

    { q: 'What does bile do?', o: ['digests protein', 'emulsifies fat', 'makes acid', 'absorbs water'], a: 1, w: 'It ==emulsifies fat== and neutralises acid.' },
    { q: 'Where is most food absorbed?', o: ['stomach', 'mouth', 'small intestine', 'large intestine'], a: 2, w: 'The ==small intestine==.' },
    { q: 'Peristalsis is…', o: ['chewing', 'muscle waves moving food along', 'enzyme action', 'absorption'], a: 1, w: '==Waves of muscle contraction==.' },
    { q: 'Lack of vitamin C causes…', o: ['rickets', 'scurvy', 'anaemia', 'kwashiorkor'], a: 1, w: '==Scurvy==.' },
    { q: 'The large intestine absorbs mainly…', o: ['water', 'protein', 'fat', 'starch'], a: 0, w: '==Water==.' }
  ],
  exam: [
    { q: 'Describe the function of the stomach in digestion.', m: 3,
      p: ['muscles ==churn== the food (mechanical digestion)', '==hydrochloric acid== kills bacteria', 'provides the correct ==pH for protease== to digest protein'] },
    { q: 'Explain why digestion is necessary.', m: 2,
      p: ['food molecules are ==large and insoluble==', 'so they must be broken into ==small soluble molecules== that can be absorbed into the blood'] },

    { q: 'Describe how tooth decay is caused and how it can be prevented.', m: 3,
      p: ['bacteria in ==plaque== feed on sugar and make ==acid==', 'the acid dissolves the ==enamel==', 'prevent by ==brushing==, less sugar, fluoride'] }
  ]
},
transp: {
  code: 'Topic 8', name: 'Transport in plants',
  lede: 'How water and sugars move through a plant, and what makes a plant lose water faster or slower.',
  learn: [
    { h: 'Water uptake and the transpiration stream', list: ['==Root hair cells== take up water by ==osmosis== and mineral ions by ==active transport==.', '==Xylem== vessels are long, hollow tubes with ==lignin== walls. They carry water and mineral ions ==upwards== from roots to leaves, and give ==support==.', '==Transpiration== is the loss of ==water vapour== from leaves, by evaporation from the mesophyll cells and diffusion out through the ==stomata==.', 'Water evaporating from the leaf ==pulls== more water up the xylem: the ==transpiration stream==.', 'Transpiration brings ==water and ions==, supplies water for ==photosynthesis== and ==cools the leaf==.'] },
    { h: 'Factors affecting transpiration', table: [['Factor', 'Effect on rate', 'Reason'], ['==temperature== up', 'faster', 'more evaporation, more kinetic energy'], ['==light intensity== up', 'faster', 'stomata open wider'], ['==wind== up', 'faster', 'removes humid air from the leaf, keeps the gradient steep'], ['==humidity== up', 'slower', 'smaller concentration gradient']], list: ['When transpiration is faster than uptake, cells lose ==turgor== and the plant ==wilts==.', 'A ==potometer== measures water uptake: the movement of an ==air bubble== in a capillary tube.'], f: ['rate = distance moved by bubble ÷ time', 'volume = π r² × distance'] },
    { h: 'Translocation', list: ['==Phloem== carries ==sucrose== and ==amino acids== (made in leaves) to the rest of the plant: to growing parts and storage organs. This is ==translocation==.', 'It can go ==up and down== the plant, in both directions.', 'Phloem is made of living cells (==sieve tubes==); xylem is dead.', 'The ==source== is the part that makes the sugars (leaf). The ==sink== is where they are used or stored (root, fruit).'] }
  ],
  mistakes: ['Saying ==water moves up the phloem==. Water goes up the xylem.', 'Saying ==translocation only goes upwards==. Phloem moves sucrose in both directions.', 'Saying transpiration is ==water leaving the roots==. It is water vapour leaving the leaves.', 'Saying ==wind slows transpiration== because it cools the plant. Wind speeds it up.', 'Mixing up ==osmosis in roots== with ==active transport of ions==.'],
  diagrams: [{ svg: svgTranspire, cap: '==Transpiration stream==: soil, xylem, leaf, stomata.' }],
  worked: [
    W('In a potometer an air bubble moves 36 mm in 12 minutes. Calculate the rate of water uptake in mm per minute.', '==Distance ÷ time==.', 'Include the unit mm/min.', 'rate = distance ÷ time',
      [['Formula', 'rate = distance ÷ time', ''], ['Substitute', '36 ÷ 12', ''], ['Answer', '3 mm/min', 'The bubble moves 3 mm every minute.']],
      [['Distance', '36 mm', -1], ['Time', '12 min', -1], ['Rate', '3 mm/min', 2]]),
    W('Explain why a plant wilts on a hot, dry, windy day.', 'Say what ==speeds up transpiration== and what happens to the ==cells==.', 'Use the word turgid or turgor.', 'Fast transpiration → water loss → flaccid',
      [['Conditions', 'High temperature, dry air and wind all increase the transpiration rate.', ''], ['Water loss', 'Water is lost from the leaves faster than the roots can replace it.', ''], ['Cells', 'The cells lose water and become flaccid (lose turgor).', ''], ['Result', 'The leaves and stem are no longer firm, so the plant wilts.', '']],
      [['Weather', 'transpiration up', 0], ['Water', 'lost faster than gained', 1], ['Cells', 'flaccid', 2], ['Result', 'wilts', 3]], true),
    W('Compare xylem and phloem.', 'Compare ==what they carry==, ==direction== and ==structure==.', 'Give a point for each, side by side.', 'Water up v sugar both ways',
      [['Carries', 'Xylem: water and mineral ions. Phloem: sucrose and amino acids.', ''], ['Direction', 'Xylem: upwards only. Phloem: up and down.', ''], ['Structure', 'Xylem: dead, hollow, lignin walls. Phloem: living cells, sieve tubes.', '']],
      [['Carries', 'water v sucrose', 0], ['Direction', 'up v both', 1], ['Structure', 'dead v living', 2]], true),
    W('Describe how you would show that transpiration is faster in light than in the dark using a potometer.', 'Keep one ==variable== different, the rest the same.', 'Say what you measure and how.', 'Light v dark, measure the bubble',
      [['Set up', 'Cut a shoot underwater and fit it to a potometer with no air bubbles.', ''], ['Light', 'Place it in bright light and time the bubble over 10 minutes.', ''], ['Dark', 'Repeat in the dark with the same shoot, temperature and air movement.', 'Control the other variables.'], ['Result', 'The bubble moves further in the light, so transpiration is faster.', 'Stomata open wider in the light.']],
      [['Set up', 'potometer', 0], ['Measure', 'bubble distance ÷ time', 1], ['Control', 'same temperature, wind', 2]], true)
  ],
  drill: 'transp',
  quiz: [
    { q: 'Which tissue carries water up the plant?', o: ['phloem', 'xylem', 'palisade', 'epidermis'], a: 1, w: '==Xylem==.' },
    { q: 'Which carries sucrose?', o: ['xylem', 'phloem', 'root hair', 'stomata'], a: 1, w: '==Phloem==.' },
    { q: 'What speeds up transpiration?', o: ['humid air', 'darkness', 'wind', 'cold'], a: 2, w: '==Wind== removes humid air.' },
    { q: 'Root hair cells take up mineral ions by…', o: ['osmosis', 'diffusion only', 'active transport', 'evaporation'], a: 2, w: '==Active transport==.' },
    { q: 'Water leaves the leaf through the…', o: ['stomata', 'xylem', 'cuticle only', 'roots'], a: 0, w: 'Through the ==stomata==.' },
    { q: 'Moving sucrose around the plant is…', o: ['transpiration', 'translocation', 'osmosis', 'respiration'], a: 1, w: '==Translocation==.' }
  ],
  exam: [
    { q: 'Define transpiration.', m: 2,
      p: ['loss of ==water vapour== from the plant', '==by evaporation== from the leaves (through the stomata)'] },
    { q: 'State two ways that transpiration is useful to the plant.', m: 2,
      p: ['==transports water and mineral ions== up the plant', '==cools the leaf== / supplies water for photosynthesis / keeps cells turgid'] },
    { q: 'Explain why transpiration is faster on a windy day.', m: 3,
      p: ['wind ==removes water vapour== from around the leaf', 'this keeps the ==concentration gradient steep==', 'so ==more diffusion== of water vapour out of the stomata'] },
    { q: 'A bubble moves 45 mm in 15 minutes. Calculate the mean rate.', m: 2,
      p: ['rate = ==distance ÷ time== = 45 ÷ 15', '==3 mm/min=='] }
  ]
},
blood: {
  code: 'Topic 9', name: 'Transport in animals',
  lede: 'The heart, blood vessels and blood: how the circulatory system carries oxygen and food around the body.',
  learn: [
    { h: 'The heart and the double circulation', list: ['Humans have a ==double circulation==: blood passes through the heart ==twice== on each full circuit. One loop goes to the ==lungs== and one to the ==body==.', 'The ==right side== pumps ==deoxygenated== blood to the lungs. The ==left side== pumps ==oxygenated== blood to the body.', 'The ==left ventricle== has a ==thicker wall== because it pumps blood all around the body at high pressure.', '==Valves== stop blood flowing backwards. ==Atria== receive blood; ==ventricles== pump it out.', 'Heart rate: ==pulse rate== is the number of beats per minute. ==Exercise== raises it so muscles get more oxygen and glucose, and carbon dioxide is removed faster.'] },
    { h: 'Blood vessels', table: [['Vessel', 'Carries', 'Structure'], ['==artery==', 'blood ==away from== the heart, high pressure', '==thick muscular wall==, narrow lumen, elastic'], ['==vein==', 'blood ==to== the heart, low pressure', 'thinner wall, ==wide lumen==, ==valves=='], ['==capillary==', 'blood between arteries and veins; exchange with cells', 'wall ==one cell thick==, very narrow']], list: ['Arteries carry oxygenated blood, except the ==pulmonary artery==.', 'The ==coronary arteries== supply the heart muscle. A ==blockage== causes a ==heart attack==.', 'Risk factors for ==coronary heart disease==: ==smoking==, ==high fat diet==, ==lack of exercise==, stress and genetic factors.'] },
    { h: 'Blood', table: [['Part', 'Function'], ['==red blood cells==', 'carry oxygen using ==haemoglobin== (bi-concave, no nucleus)'], ['==white blood cells==', 'fight pathogens: ==phagocytes== engulf them; ==lymphocytes== make antibodies'], ['==platelets==', 'help the blood ==clot== at a wound (fragments of cells)'], ['==plasma==', 'carries ==dissolved substances==: CO₂, glucose, urea, hormones, heat']], list: ['Clotting ==seals wounds== and prevents ==entry of pathogens== and loss of blood.'], f: ['pulse rate = beats ÷ time in minutes', 'beats in 15 s × 4 = beats per minute'] }
  ],
  mistakes: ['Saying ==all arteries carry oxygenated blood==. The pulmonary artery carries deoxygenated blood.', 'Saying the ==heart is divided into top and bottom== but forgetting the ==left and right==.', 'Writing ==veins have thick walls==. Arteries do.', 'Saying ==red blood cells fight infection==. White blood cells do.', 'Saying ==the right side of the heart is thicker==. The left is.'],
  diagrams: [{ svg: svgHeart, cap: 'The ==double circulation==. Blood passes through the heart twice per circuit.' }],
  worked: [
    W('A student counts 19 pulse beats in 15 seconds at rest and 33 beats in 15 seconds after exercise. Calculate both pulse rates.', 'Convert 15 s to ==1 minute== by multiplying by 4.', 'Include the unit beats per minute.', 'beats × 4',
      [['At rest', '19 × 4 = 76 beats per minute', '15 s × 4 = 60 s.'], ['After exercise', '33 × 4 = 132 beats per minute', ''], ['Comment', 'Heart rate rose by 56 beats per minute.', '132 − 76 = 56.']],
      [['Rest', '19 beats / 15 s', -1], ['Exercise', '33 beats / 15 s', -1], ['Rest rate', '76 per min', 0], ['Exercise rate', '132 per min', 1]]),
    W('Explain why the heart rate increases during exercise.', 'Link ==muscles== to ==oxygen==.', 'Say what is delivered and what is removed.', 'More respiration → more blood needed',
      [['Muscles', 'The muscles respire faster and need more energy.', ''], ['Needs', 'They need more oxygen and glucose.', ''], ['Heart rate', 'The heart beats faster to deliver them faster.', ''], ['Removal', 'It also removes carbon dioxide faster.', '']],
      [['Muscles', 'more respiration', 0], ['Need', 'O₂ and glucose', 1], ['Heart', 'beats faster', 2]], true),
    W('Compare the structure of an artery and a vein.', 'Compare ==wall==, ==lumen== and ==valves==.', 'Give each point as a pair.', 'Wall, lumen, valves',
      [['Wall', 'Artery: thick and muscular. Vein: thin.', 'Arteries carry blood at high pressure.'], ['Lumen', 'Artery: narrow. Vein: wide.', ''], ['Valves', 'Artery: none. Vein: has valves.', 'They stop backflow at low pressure.']],
      [['Wall', 'thick v thin', 0], ['Lumen', 'narrow v wide', 1], ['Valves', 'no v yes', 2]], true),
    W('Describe the pathway of blood from the body, through the heart and to the lungs.', 'Use the ==order of the chambers==.', 'Name each vessel and chamber.', 'vena cava → RA → RV → pulmonary artery',
      [['Body to heart', 'Deoxygenated blood returns in the vena cava.', ''], ['Right atrium', 'It enters the right atrium.', ''], ['Right ventricle', 'It passes through a valve into the right ventricle.', ''], ['To the lungs', 'The right ventricle pumps it out in the pulmonary artery.', 'Oxygen is added in the lungs.']],
      [['Vessel in', 'vena cava', 0], ['Chamber 1', 'right atrium', 1], ['Chamber 2', 'right ventricle', 2], ['Vessel out', 'pulmonary artery', 3]], true)
  ],
  drill: 'blood',
  quiz: [
    { q: 'Which chamber pumps blood to the whole body?', o: ['right atrium', 'right ventricle', 'left atrium', 'left ventricle'], a: 3, w: 'The ==left ventricle==.' },
    { q: 'Which vessel has valves?', o: ['artery', 'vein', 'capillary', 'aorta'], a: 1, w: '==Veins==.' },
    { q: 'Which blood cells make antibodies?', o: ['red cells', 'platelets', 'lymphocytes', 'plasma'], a: 2, w: '==Lymphocytes==.' },
    { q: 'Platelets help…', o: ['carry oxygen', 'clot blood', 'engulf bacteria', 'carry CO₂'], a: 1, w: 'They help the blood ==clot==.' },
    { q: 'The pulmonary vein carries…', o: ['deoxygenated blood to the lungs', 'oxygenated blood from the lungs', 'blood to the body', 'blood to the kidney'], a: 1, w: '==Oxygenated blood from the lungs==.' },
    { q: 'Which is a risk factor for coronary heart disease?', o: ['exercise', 'smoking', 'fibre', 'water'], a: 1, w: '==Smoking==.' }
  ],
  exam: [
    { q: 'Describe the function of (a) red blood cells (b) platelets (c) plasma.', m: 3,
      p: ['red cells: ==transport oxygen== (haemoglobin)', 'platelets: help the blood ==clot==', 'plasma: ==transports== dissolved substances, such as glucose, CO₂, urea'] },
    { q: 'Explain why the wall of the left ventricle is thicker than the right.', m: 2,
      p: ['the left ventricle pumps blood ==around the whole body== (further)', 'so it needs ==more force / higher pressure=='] },
    { q: 'Describe two ways in which a capillary is adapted for exchange.', m: 2,
      p: ['wall is ==one cell thick== so short diffusion distance', '==narrow / permeable / large surface area / slow flow== so more time to exchange'] },
    { q: 'Describe how a heart attack happens and give two risk factors.', m: 3,
      p: ['a ==coronary artery is blocked==', 'the heart muscle gets no oxygen / glucose and ==dies==', 'risk factors: ==smoking / high fat diet / lack of exercise== (any two)'] }
  ]
},
disease: {
  code: 'Topic 10', name: 'Diseases and immunity',
  lede: 'What causes disease, how pathogens spread, how the body defends itself, and how vaccination protects us.',
  learn: [
    { h: 'Pathogens and transmission', list: ['A ==pathogen== is a ==disease-causing organism==. ==Bacteria==, ==viruses==, ==fungi== and ==protoctists== can all be pathogens.', 'A ==transmissible disease== is one that can be passed from one host to another.', 'Spread by ==direct contact== (touching, blood, sexual contact), ==indirect contact== (contaminated food or water, ==vectors== such as mosquitoes) and ==droplets== (coughs and sneezes).', 'Examples: ==cholera== (bacteria, dirty water), ==malaria== (protoctist, spread by the ==mosquito== vector), ==HIV/AIDS== (virus, attacks white blood cells).'], table: [['Control measure', 'How it helps'], ['==clean water and sewage treatment==', 'stops cholera spreading'], ['==hygiene==, handwashing', 'removes pathogens'], ['==vaccination==', 'gives immunity'], ['==mosquito nets and insecticide==', 'stop malaria vectors'], ['==antibiotics==', 'kill bacteria, but do not work on viruses']] },
    { h: 'Body defences', list: ['==Skin== is a physical barrier. ==Mucus== and ==hairs== in the nose and trachea trap pathogens. ==Stomach acid== kills them.', '==Phagocytes== (white blood cells) ==engulf and digest== pathogens (phagocytosis).', '==Lymphocytes== make ==antibodies== that bind to ==antigens== on the pathogen and destroy it. Antibodies are ==specific==.', 'After infection, ==memory cells== remain. If the same pathogen returns, antibodies are made ==faster and in greater number==: ==immunity==.'] },
    { h: 'Vaccination and antibiotics', list: ['A ==vaccine== contains ==weakened, killed or part of== a pathogen. It has ==antigens== but does not cause the disease.', 'It makes lymphocytes ==produce antibodies== and ==memory cells==, so you are protected later.', '==Herd immunity==: if most people are vaccinated, the pathogen is less likely to spread to those who are not.', '==Antibiotic resistance==: bacteria with a ==mutation== survive and reproduce when antibiotics are overused. Use antibiotics ==only when needed== and finish the course.'] }
  ],
  mistakes: ['Saying ==antibiotics kill viruses==. They do not.', 'Saying a ==vaccine gives you the disease==. It contains a weakened or dead pathogen.', 'Saying ==antibodies are the same for every pathogen==. Each is specific to one antigen.', 'Saying ==people become resistant to antibiotics==. The bacteria become resistant.', 'Saying ==the mosquito causes malaria==. The pathogen is a protoctist; the mosquito is the vector.'],
  diagrams: [{ svg: svgVacc, cap: 'How a ==vaccine== leads to ==immunity==.' }],
  worked: [
    W('Explain how a vaccine protects against a disease.', 'Follow the order: ==antigen → antibodies → memory cells==.', 'Name the cells and the result.', 'Weakened pathogen → memory cells',
      [['Vaccine', 'It contains a weakened or dead pathogen with its antigens.', 'It cannot cause the disease.'], ['Response', 'Lymphocytes recognise the antigens and make antibodies.', ''], ['Memory', 'Memory cells stay in the blood.', ''], ['Later infection', 'The same pathogen is quickly recognised, so many antibodies are made fast.', 'The person does not get ill.']],
      [['Contains', 'weakened pathogen', 0], ['Lymphocytes', 'make antibodies', 1], ['Memory cells', 'remain', 2], ['Later', 'fast response', 3]], true),
    W('Explain why antibiotics do not cure influenza.', 'Say what ==influenza is caused by==.', 'Link the cause to how antibiotics work.', 'Virus, not bacteria',
      [['Cause', 'Influenza is caused by a virus.', ''], ['Antibiotics', 'They kill bacteria, for example by damaging their cell walls.', ''], ['Conclusion', 'Viruses are not cells, so antibiotics have no effect on them.', '']],
      [['Cause', 'virus', 0], ['Antibiotics', 'act on bacteria', 1], ['Result', 'no effect', 2]], true),
    W('In a town of 8000 people, 6800 are immune to a disease. Calculate the percentage immune.', 'Fraction × 100.', 'Always show the working.', '% = part ÷ whole × 100',
      [['Formula', 'percentage = number immune ÷ total × 100', ''], ['Substitute', '6800 ÷ 8000 × 100', ''], ['Answer', '85 %', 'Most people are immune, so the pathogen finds it hard to spread.']],
      [['Immune', '6800', -1], ['Total', '8000', -1], ['Percentage', '85 %', 2]]),
    W('Explain how antibiotic resistance develops.', 'Use the words ==mutation== and ==survive==.', 'Tell it as a story in order.', 'Mutation → survive → reproduce',
      [['Mutation', 'Some bacteria have a mutation that makes them resistant.', ''], ['Treatment', 'The antibiotic kills the non-resistant bacteria.', ''], ['Survival', 'The resistant bacteria survive and reproduce.', ''], ['Result', 'The population is now resistant, so the antibiotic no longer works.', 'Overuse makes this worse.']],
      [['Mutation', 'resistant bacteria', 0], ['Antibiotic', 'kills others', 1], ['Survive', 'reproduce', 2], ['Result', 'population resistant', 3]], true)
  ],
  drill: 'disease',
  quiz: [
    { q: 'Which pathogen causes cholera?', o: ['virus', 'bacterium', 'fungus', 'protoctist'], a: 1, w: 'A ==bacterium==.' },
    { q: 'The vector of malaria is the…', o: ['fly', 'rat', 'mosquito', 'tick'], a: 2, w: 'The ==mosquito==.' },
    { q: 'Antibodies are made by…', o: ['phagocytes', 'lymphocytes', 'platelets', 'red cells'], a: 1, w: '==Lymphocytes==.' },
    { q: 'A vaccine contains…', o: ['antibiotic', 'antibodies', 'weakened pathogen', 'plasma'], a: 2, w: 'A ==weakened or dead pathogen==.' },
    { q: 'Antibiotics are effective against…', o: ['bacteria', 'viruses', 'both', 'neither'], a: 0, w: '==Bacteria== only.' },
    { q: 'Phagocytes…', o: ['make antibodies', 'engulf pathogens', 'clot blood', 'carry oxygen'], a: 1, w: '==Engulf and digest== pathogens.' }
  ],
  exam: [
    { q: 'State what is meant by a pathogen and a transmissible disease.', m: 2,
      p: ['pathogen: a ==disease-causing organism==', 'transmissible disease: can be ==passed from one host to another=='] },
    { q: 'Describe how the body defends itself against pathogens.', m: 4,
      p: ['==skin== is a barrier / mucus traps pathogens', '==stomach acid== kills pathogens', '==phagocytes engulf== pathogens', '==lymphocytes== make ==antibodies=='] },
    { q: 'Explain why a person vaccinated against measles does not get measles when later infected.', m: 3,
      p: ['vaccine caused ==antibody production== and ==memory cells==', 'the memory cells make antibodies ==faster and in larger numbers==', 'the pathogen is destroyed before symptoms'] },
    { q: 'Describe two ways that the spread of cholera can be controlled.', m: 2,

resp: {
  code: 'Topic 11', name: 'Gas exchange and respiration',
  lede: 'How air gets into the lungs, how oxygen reaches the blood, and how cells release energy with and without oxygen.',
  learn: [
    { h: 'The gas exchange system', list: ['Air passes through the ==trachea==, the ==bronchi== and ==bronchioles== to the ==alveoli==.', 'The trachea has ==C-shaped rings of cartilage== to keep it open, ==ciliated cells== that sweep mucus up, and ==goblet cells== that make ==mucus== to trap dust and bacteria.', 'The ==alveoli== are the gas exchange surface. They have a ==large surface area==, ==walls one cell thick==, a ==moist lining==, and a ==rich blood supply==. Breathing keeps a ==steep concentration gradient==.', '==Oxygen== diffuses from the alveolus into the blood. ==Carbon dioxide== diffuses from the blood into the alveolus.'] },
    { h: 'Breathing', table: [['', 'Breathing in', 'Breathing out'], ['==ribs==', 'move ==up and out==', 'move ==down and in=='], ['==intercostal muscles==', 'external contract', 'internal contract (forced); external relax'], ['==diaphragm==', '==contracts==, flattens', '==relaxes==, domes up'], ['chest ==volume==', '==increases==', '==decreases=='], ['==pressure== in the lungs', 'decreases (below outside)', 'increases (above outside)'], ['air', 'moves ==in==', 'moves ==out==']], list: ['Air always moves from ==high to low pressure==.'], f: ['ventilation rate = breathing rate × tidal volume', 'breathing rate = breaths per minute'] },
    { h: 'Inspired and expired air', table: [['Gas', 'Inspired (in)', 'Expired (out)'], ['==oxygen==', 'about 21 %', 'about 16 %'], ['==carbon dioxide==', 'about 0.04 %', 'about 4 %'], ['nitrogen', 'about 78 %', 'about 78 %'], ['==water vapour==', 'variable', '==more==']], list: ['==Limewater== turns ==cloudy== (milky) with carbon dioxide. ==Hydrogencarbonate indicator== turns from red to ==yellow== in more CO₂.', 'During ==exercise== you breathe ==faster and deeper== to get more oxygen and remove more CO₂.'] },
    { h: 'Respiration', list: ['==Respiration== is the chemical reactions in cells that ==break down nutrient molecules== (glucose) to ==release energy==. It happens all the time in ==all living cells==.', '==Aerobic respiration== uses oxygen. ==Anaerobic== does not, and releases ==less energy==.', 'In human muscles, anaerobic respiration makes ==lactic acid==. After hard exercise you must repay the ==oxygen debt== by breathing hard.', 'In ==yeast==, anaerobic respiration makes ==ethanol== and ==carbon dioxide== (fermentation, used in baking and brewing).', 'Energy is used for ==muscle contraction==, ==protein synthesis==, ==growth==, active transport and keeping ==body temperature== constant.'], f: ['aerobic: glucose + oxygen → carbon dioxide + water', 'C₆H₁₂O₆ + 6O₂ → 6CO₂ + 6H₂O', 'anaerobic (muscle): glucose → lactic acid', 'anaerobic (yeast): glucose → ethanol + carbon dioxide'] }
  ],
  mistakes: ['Saying ==respiration is breathing==. Breathing is moving air; respiration is a chemical reaction.', 'Saying ==plants only respire at night==. All living cells respire all the time.', 'Saying the ==diaphragm relaxes when breathing in==. It contracts and flattens.', 'Saying ==anaerobic respiration makes no energy==. It makes less.', 'Saying ==we breathe out only CO₂==. Breathed-out air still contains about 16 % oxygen.'],
  diagrams: [{ svg: svgBreath, cap: '==Breathing in== and ==breathing out==: diaphragm and ribs.' }, { svg: svgAlveolus, cap: '==Gas exchange== at an alveolus.' }],
  worked: [
    W('A student breathes 15 times per minute. Each breath moves 500 cm³ of air. Calculate the volume of air breathed each minute.', 'Multiply ==breaths per minute== by ==volume per breath==.', 'Show the unit cm³ per minute.', 'ventilation = rate × tidal volume',
      [['Formula', 'ventilation = breathing rate × tidal volume', ''], ['Substitute', '15 × 500', ''], ['Answer', '7500 cm³ per minute', 'About 7.5 dm³ every minute.']],
      [['Breathing rate', '15 per min', -1], ['Tidal volume', '500 cm³', -1], ['Ventilation', '7500 cm³/min', 2]]),
    W('Explain how the alveoli are adapted for gas exchange.', 'Link each ==feature== to ==diffusion==.', 'Four features, four reasons.', 'Feature + because',
      [['Many alveoli', 'This gives a very large surface area.', ''], ['Thin walls', 'The wall is one cell thick, so there is a short diffusion distance.', ''], ['Capillaries', 'A rich blood supply takes oxygen away, keeping a steep concentration gradient.', ''], ['Ventilation', 'Breathing brings in fresh air and removes CO₂, keeping the gradient steep.', '']],
      [['Many', 'large surface area', 0], ['Thin', 'short distance', 1], ['Blood', 'steep gradient', 2], ['Breathing', 'steep gradient', 3]], true),
    W('Describe how air is drawn into the lungs when you breathe in.', 'Follow the order: ==muscles → volume → pressure → air==.', 'Always say pressure is lower than outside.', 'Contract → volume up → pressure down',
      [['Muscles', 'The diaphragm contracts and flattens. The external intercostal muscles contract and raise the ribs up and out.', ''], ['Volume', 'The volume of the chest increases.', ''], ['Pressure', 'The pressure in the lungs falls below atmospheric pressure.', ''], ['Air', 'Air moves in down the pressure gradient.', '']],
      [['Muscles', 'diaphragm, ribs', 0], ['Volume', 'increases', 1], ['Pressure', 'decreases', 2], ['Air', 'in', 3]], true),
    W('Explain why a sprinter breathes heavily for several minutes after the race.', 'Think ==anaerobic respiration== and ==lactic acid==.', 'Use the words oxygen debt.', 'Lactic acid → oxygen debt',
      [['In the race', 'The muscles needed energy faster than oxygen could be supplied, so they respired anaerobically.', ''], ['Product', 'Lactic acid was made.', ''], ['After', 'Extra oxygen is needed to break down the lactic acid. This is the oxygen debt.', ''], ['Result', 'The runner keeps breathing fast and deep until it is repaid.', '']],
      [['Race', 'anaerobic', 0], ['Made', 'lactic acid', 1], ['Debt', 'extra O₂ needed', 2]], true)
  ],
  drill: 'resp',
  quiz: [
    { q: 'When you breathe in, the diaphragm…', o: ['relaxes and domes up', 'contracts and flattens', 'moves sideways', 'stays still'], a: 1, w: '==Contracts and flattens==.' },
    { q: 'Which gas turns limewater cloudy?', o: ['oxygen', 'nitrogen', 'carbon dioxide', 'hydrogen'], a: 2, w: '==Carbon dioxide==.' },
    { q: 'Anaerobic respiration in muscles produces…', o: ['ethanol', 'lactic acid', 'water only', 'oxygen'], a: 1, w: '==Lactic acid==.' },
    { q: 'The balanced equation for aerobic respiration has how many CO₂?', o: ['1', '2', '6', '12'], a: 2, w: '==6CO₂==.' },
    { q: 'Mucus in the trachea…', o: ['absorbs oxygen', 'traps dust and bacteria', 'warms blood', 'makes cartilage'], a: 1, w: 'It ==traps dust and bacteria==.' },
    { q: 'About how much oxygen is in expired air?', o: ['21 %', '16 %', '4 %', '0 %'], a: 1, w: 'About ==16 %==.' }
  ],
  exam: [
    { q: 'State the word equation for aerobic respiration.', m: 2,
      p: ['==glucose + oxygen==', '→ ==carbon dioxide + water=='] },
    { q: 'Describe the differences between inspired air and expired air.', m: 3,
      p: ['expired air has ==less oxygen==', 'expired air has ==more carbon dioxide==', 'expired air has ==more water vapour=='] },
    { q: 'Explain why breathing rate and heart rate both increase during exercise.', m: 3,
      p: ['muscles respire ==faster==, needing more oxygen and glucose', 'more ==CO₂== must be removed', 'faster breathing and heartbeat ==deliver oxygen and remove CO₂ faster=='] },
    { q: 'Compare aerobic and anaerobic respiration in humans.', m: 3,
      p: ['aerobic uses ==oxygen==, anaerobic does not', 'aerobic releases ==more energy==', 'anaerobic produces ==lactic acid==, aerobic produces CO₂ and water'] }
  ]
},
excr: {
  code: 'Topic 12', name: 'Excretion in humans',
  lede: 'How the body gets rid of toxic waste: the lungs, skin and kidneys, and what happens when the kidneys fail.',
  learn: [
    { h: 'Excretion and the organs involved', list: ['==Excretion== is the removal of ==toxic materials== and ==waste products of metabolism== from the body. Egestion (faeces) is different.', '==Lungs== excrete ==carbon dioxide== and water vapour.', '==Kidneys== excrete ==urea==, excess water and excess salts in ==urine==.', '==Skin== loses water, salts and a little urea in ==sweat==, mainly to cool the body.', 'The ==liver== breaks down excess ==amino acids== (==deamination==) making ==urea==. The urea travels in the blood to the kidneys.'] },
    { h: 'The kidney', list: ['The kidneys ==filter the blood== and make urine. Blood arrives in the ==renal artery== and leaves in the ==renal vein==, with less urea.', 'Urine travels down the ==ureter== to the ==bladder== (stores it) and leaves through the ==urethra==.', 'Small molecules (==urea, water, glucose, salts==) are ==filtered== out of the blood. The body then ==reabsorbs== all the glucose and the water and salts it needs.', 'Urine contains ==urea, excess water and excess salts==. It should contain ==no glucose== and no protein.', 'If you drink little water, the urine is ==dark and concentrated==. If you drink a lot, it is ==pale and dilute==.'] },
    { h: 'Kidney failure', list: ['Failed kidneys cannot remove ==urea== and excess water. Treatment: ==dialysis== or a ==kidney transplant==.', 'In a ==dialysis machine== the blood flows past a ==partially permeable membrane== with ==dialysis fluid== on the other side. ==Urea diffuses out== of the blood. The fluid has normal levels of glucose and salts so those are ==not lost==.', 'Dialysis: lifelong, several hours, three times a week, but no waiting. Transplant: a ==matching donor== is needed, risk of ==rejection==, lifelong drugs, but a normal life.'] }
  ],
  mistakes: ['Saying ==urea is made in the kidney==. It is made in the liver.', 'Mixing up ==excretion and egestion==.', 'Saying ==glucose is found in urine== of a healthy person. It is all reabsorbed.', 'Saying the ==ureter takes urine out of the body==. That is the urethra.', 'Saying the ==dialysis fluid has no glucose==. It matches blood so none is lost.'],
  diagrams: [{ svg: svgUrinary, cap: 'The ==urinary system==: liver, kidney, ureter, bladder, urethra.' }],
  worked: [
    W('Of 150 dm³ of fluid filtered by the kidneys in a day, 3 dm³ leaves as urine. Calculate the percentage reabsorbed.', 'First find ==how much== was reabsorbed.', 'Divide by the amount filtered.', '% = reabsorbed ÷ filtered × 100',
      [['Reabsorbed', '150 − 3 = 147 dm³', 'What was filtered but not lost.'], ['Fraction', '147 ÷ 150', ''], ['Answer', '× 100 = 98 %', 'The kidneys reabsorb nearly all the water.']],
      [['Filtered', '150 dm³', -1], ['Urine', '3 dm³', -1], ['Reabsorbed', '147 dm³', 0], ['Percentage', '98 %', 2]]),
    W('Explain the difference between excretion and egestion, with an example of each.', 'One is about ==metabolism==; one is about ==undigested food==.', 'Give an example of each.', 'Waste of cells v waste food',
      [['Excretion', 'Removal of toxic waste made by the body’s cells.', 'Example: urea in urine.'], ['Egestion', 'Removal of undigested food from the gut.', 'Example: faeces.'], ['Key point', 'Faeces were never inside the body’s cells.', 'They never entered the blood.']],
      [['Excretion', 'metabolic waste', 0], ['Egestion', 'undigested food', 1]], true),
    W('Explain why dialysis fluid contains glucose.', 'Think about ==concentration gradients==.', 'Use diffusion.', 'No gradient = no loss',
      [['Aim', 'Urea must be removed, but glucose must stay in the blood.', ''], ['Dialysis fluid', 'It has the same glucose concentration as normal blood.', ''], ['Result', 'There is no concentration gradient for glucose, so none diffuses out.', ''], ['Urea', 'The fluid has no urea, so urea diffuses out of the blood.', '']],
      [['Aim', 'keep glucose', 0], ['Fluid', 'same glucose', 1], ['Result', 'no diffusion', 2], ['Urea', 'diffuses out', 3]], true),
    W('Describe the role of the liver and the kidney in dealing with excess protein in the diet.', 'Follow the ==path of the urea==.', 'Say what happens at each organ.', 'Liver → blood → kidney → urine',
      [['Liver', 'Excess amino acids are broken down (deamination) to make urea.', ''], ['Blood', 'Urea is carried in the blood plasma to the kidneys.', ''], ['Kidney', 'It filters out the urea.', ''], ['Urine', 'Urea leaves in the urine via the ureter, bladder and urethra.', '']],
      [['Liver', 'makes urea', 0], ['Blood', 'carries it', 1], ['Kidney', 'filters it', 2], ['Out', 'urine', 3]], true)
  ],
  drill: 'excr',
  quiz: [
    { q: 'Where is urea made?', o: ['kidney', 'bladder', 'liver', 'skin'], a: 2, w: 'In the ==liver==.' },
    { q: 'Which tube carries urine from the kidney to the bladder?', o: ['urethra', 'ureter', 'renal vein', 'aorta'], a: 1, w: 'The ==ureter==.' },
    { q: 'Which is NOT normally found in urine?', o: ['urea', 'water', 'salts', 'glucose'], a: 3, w: '==Glucose== is fully reabsorbed.' },
    { q: 'The lungs excrete…', o: ['urea', 'carbon dioxide', 'bile', 'faeces'], a: 1, w: '==Carbon dioxide==.' },
    { q: 'In dialysis, urea leaves the blood by…', o: ['osmosis', 'active transport', 'diffusion', 'filtration only'], a: 2, w: '==Diffusion== across the membrane.' },
    { q: 'One disadvantage of a kidney transplant is…', o: ['lifelong dialysis', 'risk of rejection', 'no urea removal', 'low water'], a: 1, w: 'The body may ==reject== it.' }
  ],
  exam: [
    { q: 'State two organs that excrete waste, and name the waste each removes.', m: 4,
      p: ['==lungs==', '==carbon dioxide==', '==kidneys==', '==urea== (water, salts)'] },
    { q: 'Explain how urea is formed.', m: 2,
      p: ['excess ==amino acids== are broken down in the ==liver==', 'the nitrogen part is made into ==urea=='] },
    { q: 'Describe how a kidney dialysis machine works.', m: 3,
      p: ['blood flows past a ==partially permeable membrane==', '==dialysis fluid== on the other side contains normal glucose and salt levels', '==urea diffuses out== of the blood into the fluid'] },
    { q: 'Give one advantage and one disadvantage of a kidney transplant compared with dialysis.', m: 2,
      p: ['advantage: ==normal life== / no regular dialysis sessions', 'disadvantage: ==rejection== / need for lifelong drugs / need a matching donor'] }
  ]
},
coord: {
  code: 'Topic 13', name: 'Coordination and response',
  lede: 'How the nervous system and hormones control the body, how the eye responds to light, and how plants respond to their surroundings.',
  learn: [
    { h: 'The nervous system and reflexes', list: ['The ==central nervous system (CNS)== is the ==brain== and ==spinal cord==. ==Nerves== carry electrical ==impulses==.', '==Sensory neurones== carry impulses from ==receptors== to the CNS. ==Relay neurones== are inside the CNS. ==Motor neurones== carry impulses to ==effectors== (muscles or glands).', 'A ==reflex arc==: stimulus → ==receptor== → ==sensory neurone== → ==relay neurone== → ==motor neurone== → ==effector== → response.', 'A ==reflex action== is ==fast==, ==automatic== and ==protective==, and does not involve conscious thought.', 'A ==synapse== is a gap between two neurones. A ==chemical (neurotransmitter)== diffuses across the gap and starts an impulse in the next neurone.'] },
    { h: 'Hormones and homeostasis', table: [['', 'Nervous system', 'Hormones'], ['carried by', 'electrical impulses along neurones', 'chemicals in the ==blood=='], ['speed', '==very fast==', 'slower'], ['duration', 'short', 'longer lasting'], ['target', 'precise (muscle or gland)', 'target organs']], list: ['A ==hormone== is a chemical made by a ==gland==, carried by the ==blood== to a ==target organ==, where it changes activity.', '==Adrenaline== (fight or flight): ==heart rate up==, ==pupils wider==, more ==glucose== released, more blood to muscles.', '==Insulin== lowers blood glucose. In ==diabetes== the body does not control glucose well.', '==Homeostasis== is keeping the internal environment constant, using ==negative feedback==.', 'When hot: ==sweating==, ==vasodilation== (skin capillaries widen). When cold: ==shivering==, ==vasoconstriction==, hairs stand up.'] },
    { h: 'The eye and plant responses', list: ['==Cornea== and ==lens== focus light on the ==retina==, which has light receptors. The ==optic nerve== carries impulses to the brain. The ==iris== controls the ==pupil==.', '==Bright light==: pupil ==gets smaller==. ==Dim light==: pupil ==gets larger==.', 'Plants respond to stimuli. ==Phototropism== is growth towards or away from ==light==. ==Gravitropism== is growth in response to ==gravity==.', 'Shoots show ==positive phototropism== and ==negative gravitropism==. Roots show ==positive gravitropism==.', '==Auxin== is a plant hormone made in the shoot tip. It makes cells on the ==shaded side== elongate more, so the shoot bends towards the light.'] }
  ],
  mistakes: ['Saying ==hormones travel in nerves==. They travel in the blood.', 'Saying a ==reflex involves the brain thinking==. It is automatic.', 'Saying ==sensory neurones carry impulses from the CNS==. They carry them to the CNS.', 'Saying the ==pupil gets bigger in bright light==. It gets smaller.', 'Saying ==auxin makes the lit side grow==. It builds up on the shaded side.'],
  diagrams: [{ svg: svgReflex, cap: 'A ==reflex arc==: from stimulus to response.' }, { svg: svgPupil, cap: 'The ==pupil reflex== in bright and dim light.' }],
  worked: [
    W('Describe the pathway when a person touches a hot object and pulls their hand away.', 'Follow the ==six boxes== of the reflex arc.', 'Name each part in order.', 'Receptor → sensory → relay → motor → effector',
      [['Stimulus', 'The hot object.', ''], ['Receptor', 'Temperature receptors in the skin detect it.', ''], ['Sensory neurone', 'Impulses travel to the spinal cord.', ''], ['Relay neurone', 'It passes the impulse to a motor neurone in the spinal cord.', ''], ['Motor neurone', 'Impulses travel to the muscle.', ''], ['Effector', 'The muscle in the arm contracts and pulls the hand away.', 'This is the response.']],
      [['Receptor', 'skin', 1], ['Sensory', 'to spinal cord', 2], ['Relay', 'spinal cord', 3], ['Motor', 'to muscle', 4], ['Effector', 'muscle contracts', 5]], true),
    W('Compare the nervous system and hormones as methods of coordination.', 'Compare ==what carries it==, ==speed== and ==duration==.', 'Use pairs.', 'Impulses v chemicals',
      [['Carried by', 'Nerves: electrical impulses. Hormones: chemicals in the blood.', ''], ['Speed', 'Nerves: very fast. Hormones: slower.', ''], ['Duration', 'Nerves: short. Hormones: longer lasting.', '']],
      [['Carried', 'impulse v blood', 0], ['Speed', 'fast v slow', 1], ['Effect', 'short v long', 2]], true),
    W('Explain how the body responds when it gets too hot.', 'Use ==sweating== and ==vasodilation==.', 'Say how each cools the body.', 'Lose heat',
      [['Detect', 'The brain detects a rise in blood temperature.', ''], ['Sweat', 'Sweat glands release sweat. Evaporation of the sweat takes heat from the skin.', ''], ['Vasodilation', 'Skin capillaries widen, so more blood flows near the surface and more heat is lost.', ''], ['Result', 'Body temperature falls back to normal (negative feedback).', '']],
      [['Detect', 'brain', 0], ['Sweat', 'evaporation cools', 1], ['Capillaries', 'vasodilation', 2], ['Result', 'normal temperature', 3]], true),
    W('Explain why a shoot grows towards light.', 'Name the hormone and where it ==builds up==.', 'Put it in order.', 'Auxin on the shaded side',
      [['Light', 'Light comes from one side.', ''], ['Auxin', 'Auxin moves to the shaded side of the shoot.', ''], ['Growth', 'Cells on the shaded side elongate more.', ''], ['Result', 'The shoot bends towards the light (positive phototropism).', '']],
      [['Light', 'one side', 0], ['Auxin', 'shaded side', 1], ['Cells', 'elongate more', 2], ['Result', 'bends to light', 3]], true)
  ],
  drill: 'coord',
  quiz: [
    { q: 'Which neurone carries impulses to a muscle?', o: ['sensory', 'relay', 'motor', 'receptor'], a: 2, w: 'The ==motor neurone==.' },
    { q: 'Hormones travel in the…', o: ['nerves', 'blood', 'xylem', 'bile'], a: 1, w: 'The ==blood==.' },
    { q: 'In bright light the pupil…', o: ['gets larger', 'gets smaller', 'stays the same', 'closes completely'], a: 1, w: '==Gets smaller==.' },
    { q: 'Adrenaline causes…', o: ['slower heart rate', 'faster heart rate', 'smaller pupils', 'lower blood glucose'], a: 1, w: 'A ==faster heart rate==.' },
    { q: 'Shoots show…', o: ['negative phototropism', 'positive phototropism', 'positive gravitropism', 'no response'], a: 1, w: '==Positive phototropism==.' },
    { q: 'A synapse is…', o: ['a muscle', 'a gap between neurones', 'a hormone', 'a gland'], a: 1, w: 'A ==gap between two neurones==.' }
  ],
  exam: [
    { q: 'Define the term reflex action.', m: 2,
      p: ['a ==fast / automatic== response', 'to a stimulus, ==protective==, does not involve the brain thinking'] },
    { q: 'Describe how the pupil changes when a person moves from a dark room into bright sunlight, and explain why.', m: 3,
      p: ['the pupil gets ==smaller==', 'by ==circular muscles contracting== in the iris', 'to ==protect the retina== from damage'] },
    { q: 'State what is meant by a hormone and give one example of its effect.', m: 3,
      p: ['a ==chemical== made by a gland', 'carried by the ==blood== to a target organ', 'example: adrenaline increases heart rate / insulin lowers blood glucose'] },
    { q: 'Explain how the body prevents a fall in body temperature in cold weather.', m: 3,
      p: ['==shivering== produces heat from respiration in muscles', '==vasoconstriction==: skin capillaries narrow, less heat lost', 'hairs stand up / less sweat'] }
  ]
},
drugs: {
  code: 'Topic 14', name: 'Drugs',
  lede: 'What drugs are, how medicines and misused drugs affect the body, and the harm done by tobacco and alcohol.',
  learn: [
    { h: 'What is a drug?', list: ['A ==drug== is any substance taken into the body that ==modifies or affects chemical reactions== in the body.', '==Antibiotics== (for example penicillin) ==kill bacteria== but do not work against ==viruses==. Overuse leads to ==resistance==.', '==Painkillers== reduce pain. Many drugs are ==addictive==: the user feels they cannot do without them.', '==Withdrawal symptoms== happen when someone dependent stops taking a drug.'] },
    { h: 'Misused drugs', table: [['Drug', 'Type', 'Effects'], ['==heroin==', 'depressant', 'slows brain activity; ==addiction==; risk of infection from shared needles (HIV); overdose can stop breathing'], ['==alcohol==', 'depressant', 'slower reactions, ==reduced self-control==, ==liver damage== (cirrhosis), addiction'], ['==nicotine==', 'stimulant', '==addictive==; raises heart rate and blood pressure'], ['==caffeine==', 'stimulant', 'increases alertness and heart rate']], list: ['A ==depressant== slows down the activity of the nervous system, so reactions are ==slower==.', 'Alcohol is a risk for road accidents because of slower reactions.'] },
    { h: 'Tobacco smoke', list: ['==Nicotine== is addictive. ==Tar== is a ==carcinogen== (causes cancer) and damages the ==cilia==. ==Carbon monoxide== combines with ==haemoglobin==, reducing the oxygen carried by the blood.', 'Smoking causes ==lung cancer==, ==chronic bronchitis== (inflamed airways) and ==emphysema== (alveoli damaged), and raises the risk of ==coronary heart disease==.', 'Smoking in pregnancy reduces oxygen to the ==foetus== and can cause ==low birth mass==.', 'Cilia damaged by tar can no longer sweep mucus out, so ==mucus builds up== and causes ==smoker’s cough== and infections.'] }
  ],
  mistakes: ['Saying ==antibiotics treat all diseases==. They treat bacterial infections only.', 'Saying ==nicotine causes lung cancer==. Tar causes it.', 'Saying ==carbon monoxide blocks the trachea==. It binds to haemoglobin.', 'Saying ==alcohol is a stimulant==. It is a depressant.', 'Saying drugs are ==always harmful==. Medicines help; misuse harms.'],
  diagrams: [{ svg: svgSmoke, cap: 'The ==harmful substances== in tobacco smoke.' }],
  worked: [
    W('In a study, 450 of 3000 smokers and 90 of 3000 non-smokers developed lung disease. Calculate the percentage in each group and compare.', 'Use ==part ÷ whole × 100== for each group.', 'Then say how many times bigger.', '% = part ÷ whole × 100',
      [['Smokers', '450 ÷ 3000 × 100 = 15 %', ''], ['Non-smokers', '90 ÷ 3000 × 100 = 3 %', ''], ['Compare', '15 ÷ 3 = 5', 'Smokers were 5 times more likely.']],
      [['Smokers', '15 %', 0], ['Non-smokers', '3 %', 1], ['Ratio', '5 times', 2]]),
    W('Explain why smoking reduces the amount of oxygen carried in the blood.', 'Name the ==gas== and the ==molecule== it joins.', 'Link to the effect on the body.', 'CO + haemoglobin',
      [['Gas', 'Tobacco smoke contains carbon monoxide.', ''], ['Joins', 'It binds to haemoglobin in red blood cells more strongly than oxygen does.', ''], ['Result', 'Less oxygen is carried.', ''], ['Effect', 'The heart works harder. A foetus gets less oxygen and may have a low birth mass.', '']],
      [['Gas', 'carbon monoxide', 0], ['Binds to', 'haemoglobin', 1], ['Result', 'less O₂ carried', 2]], true),
    W('Describe the effects of alcohol on the body.', 'Give effects on the ==brain==, ==liver== and ==behaviour==.', 'At least three points.', 'Depressant, liver, addiction',
      [['Nervous system', 'Alcohol is a depressant. It slows reactions and reduces self-control.', 'It increases the risk of accidents.'], ['Liver', 'Long-term use damages the liver (cirrhosis).', ''], ['Dependence', 'It is addictive.', 'Withdrawal symptoms follow when stopping.']],
      [['Brain', 'slower reactions', 0], ['Liver', 'cirrhosis', 1], ['Addiction', 'yes', 2]], true),
    W('Explain why smokers often have a persistent cough.', 'Follow what ==tar== does to the ==cilia==.', 'Use mucus.', 'Cilia damaged → mucus builds up',
      [['Normal', 'Cilia sweep mucus with trapped dust and bacteria out of the airways.', ''], ['Smoking', 'Tar damages and paralyses the cilia.', ''], ['Result', 'Mucus builds up and infections develop. The smoker coughs to clear it.', '']],
      [['Normal', 'cilia clear mucus', 0], ['Tar', 'damages cilia', 1], ['Result', 'mucus builds, cough', 2]], true)
  ],
  drill: 'drugs',
  quiz: [
    { q: 'Which part of tobacco smoke causes cancer?', o: ['nicotine', 'tar', 'carbon monoxide', 'oxygen'], a: 1, w: '==Tar==.' },
    { q: 'Carbon monoxide binds to…', o: ['plasma', 'haemoglobin', 'platelets', 'cilia'], a: 1, w: '==Haemoglobin==.' },
    { q: 'Alcohol is a…', o: ['stimulant', 'depressant', 'antibiotic', 'vitamin'], a: 1, w: 'A ==depressant==.' },
    { q: 'Antibiotics work against…', o: ['viruses', 'bacteria', 'all pathogens', 'cancer'], a: 1, w: '==Bacteria==.' },
    { q: 'Which is addictive in tobacco?', o: ['tar', 'nicotine', 'carbon monoxide', 'particles'], a: 1, w: '==Nicotine==.' },
    { q: 'Heavy drinking over many years damages the…', o: ['kidney only', 'liver', 'lungs', 'skin'], a: 1, w: 'The ==liver==.' }
  ],
  exam: [
    { q: 'Define the term drug.', m: 2,
      p: ['a substance taken into the body', 'that ==modifies or affects chemical reactions== in the body'] },
    { q: 'Describe the effects of tobacco smoke on the gas exchange system.', m: 4,

repro: {
  code: 'Topic 15', name: 'Reproduction',
  lede: 'Asexual and sexual reproduction, how a flower makes seeds, and how a human baby develops.',
  learn: [
    { h: 'Asexual and sexual reproduction', table: [['', 'Asexual', 'Sexual'], ['parents', '==one== parent', '==two== parents'], ['gametes', 'none; no fertilisation', '==male and female gametes== fuse'], ['offspring', '==genetically identical== (clones)', '==genetically different== (variation)'], ['advantage', 'fast; only one parent; no mate needed', 'variation: some survive changes in the environment'], ['disadvantage', 'no variation: a disease can kill all', 'slower; needs a mate']], list: ['==Asexual reproduction== makes ==genetically identical== offspring from one parent. Example: bacteria dividing, plants from runners or tubers.', '==Sexual reproduction== is the ==fusion of the nuclei of two gametes== to form a ==zygote==, giving ==genetic variation==.'] },
    { h: 'Flowering plants', list: ['The ==stamen== (male) is the ==anther== (makes ==pollen==) and the ==filament==. The ==carpel== (female) is the ==stigma==, ==style== and ==ovary== (with ==ovules==).', '==Pollination== is the ==transfer of pollen== from an anther to a stigma. ==Fertilisation== is when the male nucleus fuses with the ==female nucleus== in the ovule. The ovule becomes the ==seed== and the ovary becomes the ==fruit==.', '==Insect-pollinated== flowers: ==large, brightly coloured petals==, ==scent==, ==nectar==, sticky or spiky pollen, anthers inside the flower.', '==Wind-pollinated== flowers: ==small dull petals==, ==no nectar or scent==, ==long, feathery stigma==, anthers hang outside, ==light smooth pollen== in large amounts.', '==Self-pollination== (same plant) gives less variation; ==cross-pollination== (different plant) gives more.', '==Germination== needs ==water==, ==oxygen== and a suitable ==temperature== (warmth). Light is not needed.'] },
    { h: 'Human reproduction', list: ['The ==testes== make ==sperm== (and testosterone). Sperm travel along the ==sperm duct== and out through the ==urethra== in the ==penis==.', 'The ==ovaries== make ==egg cells== (ova). The egg passes down the ==oviduct== (where fertilisation occurs) to the ==uterus==, where the embryo ==implants== in the lining.', '==Sperm== have a ==tail== (swim), ==many mitochondria== and ==enzymes in the head==. The ==egg== is large, with a food store and a jelly coat.', 'The ==placenta== lets ==oxygen, glucose and amino acids== pass to the foetus and ==carbon dioxide and urea== pass away. The ==umbilical cord== joins them. The ==amniotic fluid== protects the foetus.', '==HIV== is a virus that damages white blood cells. It is passed on by ==unprotected sexual intercourse==, blood and from mother to baby. A ==condom== reduces the risk.'] }
