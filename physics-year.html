<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}.intro{background:var(--accent-soft);border-radius:8px;padding:10px 14px;font-size:.98rem;margin:0}
.steps .why2{grid-column:2;font-family:var(--body);font-size:.93rem;color:var(--muted);border-left:3px solid var(--line);padding-left:10px}
.steps li.now .st{color:var(--ink)}
.tip{background:var(--kw-bg);color:var(--kw-ink);border-radius:8px;padding:10px 14px;font-size:.95rem;margin:0}
.tip mark.kw{background:transparent;padding:0;text-decoration:underline}
.wk-split{display:grid;grid-template-columns:minmax(0,1fr) minmax(250px,330px);grid-template-areas:"steps board";gap:18px;align-items:start}
.wk-split .steps{grid-area:steps}
.wk-split .board{grid-area:board;position:sticky;top:150px;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0;overflow-x:auto}
@media (max-width:700px){.wk-split{grid-template-columns:minmax(0,1fr);grid-template-areas:"board" "steps"}.wk-split .board{top:118px;z-index:2}}
.wb{border-collapse:collapse;font-size:.88rem;width:100%}
.wb th,.wb td{border:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top;background:var(--card)}
.wb th{color:var(--muted);font-weight:400;white-space:nowrap;width:1%}
.wb td{font-family:var(--mono);overflow-wrap:anywhere}
.wb td.q{color:var(--muted);font-weight:400}
.wb td.fill{background:var(--good-soft);color:var(--good);font-weight:700}
.wb tr.cur th,.wb tr.cur td{outline:2px solid var(--hot);outline-offset:-2px}
.bnote{font-size:.9rem;margin:0}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;font-size:.95rem;min-width:100%}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:7px 12px 7px 0;text-align:left;vertical-align:top}
.tbl th{font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
svg .mono{font-family:var(--mono)}
</style>
<title>Physics Full-Year Pack</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: lab-notebook study app — sticky chapter bar, one column of working cards on a faint graph-paper ground */
:root{
  --paper:#EEF3F6; --card:#FFFFFF; --ink:#132235; --muted:#56687C; --line:#D3DDE6; --grid:rgba(19,34,53,.045);
  --accent:#0A6C96; --accent-soft:#E1F0F7; --hot:#D2470E; --hot-soft:#FCE9E0;
  --kw-bg:#FFE45C; --kw-ink:#132235;
  --good:#2B8A3E; --good-soft:#E3F4E6; --bad:#C92A2A; --bad-soft:#FBE4E4;
  --water:#BFE0F0; --stone:#9AA6B2;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0E1620; --card:#16212D; --ink:#E5EDF4; --muted:#93A4B6; --line:#2A3949; --grid:rgba(229,237,244,.035);
  --accent:#5DB8E2; --accent-soft:#16344A; --hot:#FF8C55; --hot-soft:#3E2216;
  --kw-bg:#6B5A00; --kw-ink:#FFF3B0;
  --good:#69DB7C; --good-soft:#173322; --bad:#FF8787; --bad-soft:#3D1C1C;
  --water:#1E4B66; --stone:#6C7A88; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0E1620; --card:#16212D; --ink:#E5EDF4; --muted:#93A4B6; --line:#2A3949; --grid:rgba(229,237,244,.035);
  --accent:#5DB8E2; --accent-soft:#16344A; --hot:#FF8C55; --hot-soft:#3E2216;
  --kw-bg:#6B5A00; --kw-ink:#FFF3B0;
  --good:#69DB7C; --good-soft:#173322; --bad:#FF8787; --bad-soft:#3D1C1C;
  --water:#1E4B66; --stone:#6C7A88; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px}
.wrap{max-width:900px;margin:0 auto;padding-inline:16px;padding-block:0 64px}
h1,h2,h3{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0}
h2{font-size:1.6rem;font-weight:800}
h3{font-size:1.15rem;font-weight:600}
p{margin:0}
mark.kw{background:var(--kw-bg);color:var(--kw-ink);padding:0 .2em;border-radius:3px;font-weight:700;box-decoration-break:clone;-webkit-box-decoration-break:clone}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--paper);border-bottom:1px solid var(--line)}
.top .wrap{padding-block:12px 10px;display:flex;flex-direction:column;gap:10px}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand h1{font-size:1.35rem;font-weight:800;letter-spacing:-.01em}
.brand h1 span{color:var(--accent)}
.examdate{font-family:var(--mono);font-size:.78rem;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 16px;font-weight:700;font-size:.95rem}
.tab small{font-family:var(--mono);font-weight:400;color:var(--muted);margin-right:6px;font-size:.75rem}
.tab[aria-selected="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tab[aria-selected="true"] small{color:inherit;opacity:.7}

.sub{display:flex;gap:4px;flex-wrap:wrap;margin-block:20px 18px;border-bottom:2px solid var(--line)}
.subtab{border:0;background:none;padding:10px 12px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px}
.subtab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}

.chhead{display:flex;flex-direction:column;gap:6px;margin-top:22px}
.eyebrow{font-family:var(--mono);font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.lede{color:var(--muted);max-width:62ch}

.stack{display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px 20px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px}
.formula{font-family:var(--mono);font-size:1.15rem;font-weight:600;background:var(--accent-soft);color:var(--ink);border-radius:8px;padding:10px 14px;align-self:flex-start;max-width:100%;overflow-x:auto}
.mistakes{background:var(--hot-soft);border-color:transparent}
.mistakes h3{color:var(--hot)}
.legend{display:flex;gap:10px;align-items:center;font-size:.9rem;color:var(--muted);flex-wrap:wrap}

figure{margin:0;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px}
figure .svgbox{overflow-x:auto}
figure svg{display:block;width:100%;min-width:420px;height:auto}
figcaption{font-size:.95rem;color:var(--ink)}
svg .ln{stroke:var(--ink);stroke-width:2;fill:none}
svg .thin{stroke:var(--muted);stroke-width:1}
svg .tick{stroke:var(--muted);stroke-width:1.2}
svg .glass{stroke:var(--ink);stroke-width:2;fill:none}
svg .water{fill:var(--water)}
svg .stone{fill:var(--stone);stroke:var(--ink);stroke-width:1.5}
svg .acc{stroke:var(--accent);stroke-width:2.5;fill:none}
svg .hotl{stroke:var(--hot);stroke-width:2.5;fill:none}
svg .accf{fill:var(--accent)}
svg .hotf{fill:var(--hot)}
svg .inkf{fill:var(--ink)}
svg .cardf{fill:var(--card)}
svg .part{fill:var(--card);stroke:var(--ink);stroke-width:1.6}
svg .halo{fill:none;stroke:var(--hot);stroke-width:1;stroke-dasharray:2 3}
svg text{fill:var(--ink);font-family:var(--body);font-size:13px}
svg .lbl{font-weight:700}
svg .big{font-family:var(--display);font-size:42px;font-weight:800;text-anchor:middle}
svg .mid{text-anchor:middle}
svg .end{text-anchor:end}
svg .mut{fill:var(--muted)}
svg .acct{fill:var(--accent);font-weight:700}
svg .hott{fill:var(--hot);font-weight:700}
svg .scr{fill:var(--accent-soft);stroke:var(--line)}

/* worked examples */
.q{font-weight:700}
.steps{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px;counter-reset:s}
.steps li{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:baseline;counter-increment:s}
.steps li::before{content:counter(s);font-family:var(--mono);font-size:.8rem;font-weight:600;width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--card);display:grid;place-items:center;grid-row:span 2}
.steps .sl{font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.steps .st{font-family:var(--mono);font-size:1rem;min-width:0;overflow-wrap:anywhere}
.steps li.final .st{font-weight:700;color:var(--good)}
.steps .prose{font-family:var(--body)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:9px 16px;font-weight:700}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--card)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:default}

/* drill */
.drillq{font-size:1.1rem}
.answer{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.answer input{font:inherit;font-family:var(--mono);font-size:1.1rem;padding:9px 12px;border:2px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);width:11ch}
.unit{font-family:var(--mono);color:var(--muted)}
.fb{border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.fb.ok{background:var(--good-soft)}
.fb.no{background:var(--bad-soft)}
.fb .verdict{font-weight:700}
.fb.ok .verdict{color:var(--good)}
.fb.no .verdict{color:var(--bad)}
.stat{font-family:var(--mono);font-size:.85rem;color:var(--muted)}

/* quiz */
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:8px}
.opt{text-align:left;border:2px solid var(--line);background:var(--paper);border-radius:8px;padding:10px 14px;font-weight:400}
.opt.right{border-color:var(--good);background:var(--good-soft);font-weight:700}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.why{font-size:.95rem;border-left:3px solid var(--accent);padding-left:12px}
.scorebar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.big-score{font-family:var(--display);font-size:1.8rem;font-weight:800}

/* exam */
.qhead{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.marks{font-family:var(--mono);font-size:.85rem;color:var(--muted);white-space:nowrap}
.ms{display:flex;flex-direction:column;gap:6px}
.ms-intro{font-size:.9rem;color:var(--muted)}
.point{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:10px 12px;font-weight:400}
.point .box{width:24px;height:24px;border:2px solid var(--muted);border-radius:6px;display:grid;place-items:center;font-weight:700;color:var(--card)}
.point[aria-pressed="true"]{border-color:var(--good)}
.point[aria-pressed="true"] .box{background:var(--good);border-color:var(--good)}
.got{font-family:var(--mono);font-weight:600}
.note{font-size:.9rem;color:var(--muted)}

/* start */
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:14px}
.prog{display:flex;flex-direction:column;gap:8px}
.bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.bar > i{display:block;height:100%;background:var(--accent);border-radius:5px}
.pl{display:flex;justify-content:space-between;font-size:.9rem}
.pl span:last-child{font-family:var(--mono);color:var(--muted)}
.cw{display:grid;grid-template-columns:auto 1fr;gap:6px 14px}
.cw dt{font-weight:700;color:var(--accent)}
.cw dd{margin:0}
.plan{display:flex;flex-direction:column;gap:0;border-left:2px solid var(--line);margin-left:6px}
.plan div{position:relative;padding:0 0 12px 18px}
.plan div::before{content:"";position:absolute;left:-7px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--card);border:2px solid var(--accent)}
.plan b{font-family:var(--mono);font-size:.82rem;color:var(--muted);display:block;font-weight:600}

.timer{font-family:var(--mono);font-size:2.2rem;font-weight:600;font-variant-numeric:tabular-nums}
.timer.low{color:var(--hot)}
a{color:var(--accent)}
@media (prefers-reduced-motion: no-preference){.fadein{animation:fi .25s ease-out}@keyframes fi{from{transform:translateY(4px)}to{transform:none}}}
</style>

</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand">
      <h1>Physics <span>Full-Year</span> Pack</h1>
      <a href="./" class="examdate" style="text-decoration:none">← All subjects</a>
      <div class="examdate">Grade 8 · Whole syllabus</div>
    </div>
    <nav class="tabs" role="tablist" id="tabs"></nav>
  </div>
</header>
<main class="wrap" id="view"></main>

<script>
/* ---------- helpers ---------- */
const fmt = s => String(s).replace(/==(.+?)==/g,'<mark class="kw">$1</mark>').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
const pick = a => a[Math.floor(Math.random()*a.length)];
const rint = (a,b) => a + Math.floor(Math.random()*(b-a+1));
const num = x => { const r = Math.round(x*100)/100; return String(r); };
let store = {};
try { store = JSON.parse(localStorage.getItem('physyear-v1') || '{}') || {}; } catch(e) { store = {}; }
store.ticks = store.ticks || {}; store.quiz = store.quiz || {}; store.drill = store.drill || {};
const save = () => { try { localStorage.setItem('physyear-v1', JSON.stringify(store)); } catch(e) {} };

/* ---------- diagrams ---------- */
function arrowDefs(id){
  return `<defs>
  <marker id="a-${id}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="inkf"/></marker>
  <marker id="b-${id}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="accf"/></marker>
  <marker id="h-${id}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="hotf"/></marker></defs>`;
}
function svgTriangle(){
  return `<svg viewBox="0 0 460 210" role="img" aria-label="Formula triangle for density">
  <polygon points="150,12 278,190 22,190" class="ln"/>
  <line x1="78" y1="112" x2="222" y2="112" class="ln"/><line x1="150" y1="112" x2="150" y2="190" class="ln"/>
  <text x="150" y="95" class="big">m</text><text x="104" y="172" class="big">ρ</text><text x="196" y="172" class="big">V</text>
  <text x="300" y="60" class="lbl">Cover what you want:</text>
  <text x="300" y="92" style="font-family:var(--mono)">ρ = m ÷ V</text>
  <text x="300" y="122" style="font-family:var(--mono)">m = ρ × V</text>
  <text x="300" y="152" style="font-family:var(--mono)">V = m ÷ ρ</text></svg>`;
}
function svgDisplacement(){
  const cyl = (x, level, stone) => {
    let s = `<rect x="${x+2}" y="${level}" width="66" height="${226-level}" class="water"/>`;
    s += `<path d="M${x+2} ${level-5} Q${x+35} ${level+7} ${x+68} ${level-5}" class="acc"/>`;
    for (let y = 56; y <= 216; y += 16) s += `<line x1="${x}" y1="${y}" x2="${x+(y%32===24?18:10)}" y2="${y}" class="tick"/>`;
    s += `<path d="M${x} 40 V228 Q${x} 232 ${x+4} 232 H${x+66} Q${x+70} 232 ${x+70} 228 V40" class="glass"/>`;
    if (stone) s += `<line x1="${x+35}" y1="20" x2="${x+35}" y2="206" class="thin"/><path d="M${x+16} 224 q4 -24 22 -20 q18 4 12 20 z" class="stone"/>`;
    return s;
  };
  return `<svg viewBox="0 0 470 300" role="img" aria-label="Displacement method with a measuring cylinder">${arrowDefs('d')}
  ${cyl(70,130,false)}${cyl(300,96,true)}
  <line x1="152" y1="130" x2="200" y2="130" stroke-dasharray="4 4" class="thin"/>
  <text x="156" y="152" class="mut">eye level with</text><text x="156" y="168" class="mut">bottom of meniscus</text>
  <path d="M170 70 C 220 40, 260 40, 290 64" class="ln" marker-end="url(#a-d)"/>
  <text x="230" y="36" class="mid lbl">lower stone in gently</text>
  <text x="105" y="256" class="mid lbl">Initial</text><text x="105" y="274" class="mid" style="font-family:var(--mono)">50 cm³</text>
  <text x="335" y="256" class="mid lbl">Final</text><text x="335" y="274" class="mid" style="font-family:var(--mono)">72 cm³</text>
  <text x="235" y="296" class="mid acct">Volume of stone = 72 − 50 = 22 cm³</text></svg>`;
}
function svgEureka(){
  return `<svg viewBox="0 0 570 250" role="img" aria-label="Displacement can">${arrowDefs('e')}
  <rect x="62" y="90" width="136" height="128" class="water"/>
  <path d="M60 50 V220 H200 V50" class="glass"/>
  <path d="M200 88 L262 108" class="glass"/><path d="M200 98 L258 116" class="glass"/>
  <path d="M262 112 Q 268 140 272 168" class="acc" stroke-dasharray="3 5"/>
  <rect x="250" y="${168+14}" width="48" height="${226-182}" class="water"/>
  <path d="M248 160 V226 H300 V160" class="glass"/>
  <line x1="130" y1="10" x2="130" y2="160" class="thin"/><path d="M110 178 q4 -24 22 -20 q18 4 12 20 z" class="stone"/>
  <text x="130" y="244" class="mid lbl">displacement (eureka) can</text>
  <text x="318" y="190">overflow water</text><text x="318" y="206">collected and measured</text>
  <text x="318" y="236" class="acct">volume of water = volume of object</text></svg>`;
}
function svgConduction(){
  let s = `<svg viewBox="0 0 480 230" role="img" aria-label="Conduction in a metal bar">${arrowDefs('c')}
  <rect x="60" y="40" width="380" height="120" rx="6" class="ln"/>`;
  for (let r = 0; r < 3; r++) for (let c = 0; c < 10; c++) {
    const x = 84 + c*37, y = 68 + r*32;
    if (c < 5) s += `<circle cx="${x}" cy="${y}" r="${10 + (5-c)*1.6}" class="halo"/>`;
    s += `<circle cx="${x}" cy="${y}" r="8" class="part"/>`;
  }
  [[110,84],[190,116],[260,84],[330,116],[400,84]].forEach(([x,y]) => {
    s += `<line x1="${x-16}" y1="${y}" x2="${x+10}" y2="${y}" class="acc" marker-end="url(#b-c)"/><circle cx="${x-18}" cy="${y}" r="3.5" class="accf"/>`;
  });
  s += `<path d="M20 175 q10 -30 20 -40 q-2 18 8 22 q4 -12 2 -22 q14 14 12 40 q-6 14 -22 14 q-20 0 -20 -14z" class="hotf"/>
  <text x="60" y="28" class="hott">HOT end</text><text x="440" y="28" class="end acct">cold end</text>
  <text x="60" y="186">dashed rings: particles vibrate more, pass energy on by collisions</text>
  <circle cx="66" cy="208" r="3.5" class="accf"/><text x="76" y="212">free electrons carry energy along fast (metals only)</text></svg>`;
  return s;
}
function svgConvection(){
  return `<svg viewBox="0 0 480 300" role="img" aria-label="Convection current in a beaker">${arrowDefs('v')}
  <rect x="142" y="70" width="196" height="178" class="water"/>
  <path d="M140 40 V250 H340 V40" class="glass"/>
  <path d="M175 226 C 165 180, 165 140, 180 108" class="hotl" marker-end="url(#h-v)"/>
  <path d="M195 92 C 230 82, 270 82, 296 96" class="hotl" marker-end="url(#h-v)"/>
  <path d="M310 112 C 322 150, 322 190, 306 220" class="acc" marker-end="url(#b-v)"/>
  <path d="M288 232 C 250 240, 220 240, 190 234" class="acc" marker-end="url(#b-v)"/>
  <path d="M168 290 q8 -26 16 -34 q-1 14 6 18 q3 -10 1 -18 q12 12 10 34z" class="hotf"/>

    { q: 'To find the mass of 200 cm³ of a liquid of density 1.2 g/cm³ you calculate…', o: ['200 ÷ 1.2', '1.2 ÷ 200', '1.2 × 200', '200 − 1.2'], a: 2, w: '==m = ρ × V== = 1.2 × 200 = 240 g.' }
  ],
  exam: [
    { q: 'Describe how a student could find the density of an irregularly shaped stone. Name the apparatus used.', m: 4,
      p: ['Measure the mass of the stone using a ==balance==.', 'Part-fill a ==measuring cylinder== with water and record the ==initial volume==.', 'Lower the stone in until fully submerged; record the ==final volume==.', 'Volume of stone = ==final − initial== volume.', 'Density = ==mass ÷ volume==.'] },
    { q: 'A metal cube has sides of 3.0 cm and a mass of 243 g. (a) Calculate its volume. [1] (b) Calculate its density. [2]', m: 3,
      p: ['V = 3.0 × 3.0 × 3.0 = ==27 cm³==', '==ρ = m ÷ V== = 243 ÷ 27', '= ==9.0 g/cm³== (unit needed)'] },
    { q: 'Ice has a density of 0.92 g/cm³ and water 1.00 g/cm³. Explain why ice floats on water. Then state which liquid forms the top layer when oil (0.80 g/cm³) and water are mixed.', m: 3,
      p: ['Ice is ==less dense== than water (0.92 < 1.00).', 'Objects ==less dense than the liquid float==.', '==Oil== is on top because it is ==less dense== than water.'] },
    { q: 'An empty beaker has a mass of 92 g. When 50 cm³ of liquid is added the mass is 132 g. Calculate the density of the liquid in g/cm³ and in kg/m³.', m: 4,
      p: ['Mass of liquid = 132 − 92 = ==40 g==', '==ρ = m ÷ V== = 40 ÷ 50', '= ==0.80 g/cm³==', '= ==800 kg/m³=='] }
  ]
},

thermal: {
  code: 'Ch 10', name: 'Thermal energy transfer',
  lede: 'Mostly explanation questions. Marks go to the right keywords in the right order, so learn the chains.',
  learn: [
    { h: 'Three ways energy is transferred', p: ['Thermal energy always flows from ==hotter== to ==colder== places by ==conduction==, ==convection== or ==radiation==.'] },
    { h: 'Conduction (mainly solids)', list: ['Particles at the hot end gain energy and ==vibrate more==.', 'They pass energy to neighbouring particles by ==collisions==.', 'In metals, ==free (delocalised) electrons== gain kinetic energy, ==move through the metal== and transfer energy quickly.', 'So ==metals are good conductors==. Plastic, wood, glass, water and air are ==poor conductors (insulators)==.', 'Gases are the worst conductors because their particles are ==far apart==.'] },
    { h: 'Convection (liquids and gases only)', p: ['Learn this chain word for word:'], list: ['Fluid near the heater is heated and ==expands==.', 'It becomes ==less dense== and ==rises==.', 'Cooler, ==denser== fluid ==sinks== to take its place.', 'This sets up a ==convection current==.', 'Convection ==cannot happen in solids==: their particles cannot move from place to place.'] },
    { h: 'Radiation (infrared)', list: ['Energy carried by ==infrared (IR) radiation==, an ==electromagnetic wave==.', '==Needs no medium==: it can travel through a ==vacuum==. This is how the Sun heats the Earth.', 'All objects emit IR; ==hotter objects emit more==.', 'Rate of emission also increases with a ==larger surface area==.'] },
    { h: 'Surfaces and radiation', list: ['==Dull (matt) black==: ==good absorber== and ==good emitter== of IR.', '==Shiny / white / silver==: ==poor absorber==, ==poor emitter==, ==good reflector==.', 'Examples: solar panels and car radiators painted black; houses in hot countries painted white; silver emergency blankets.'] },
    { h: 'Everyday uses to learn', list: ['==Saucepan==: metal base conducts; plastic or wooden handle insulates.', '==Radiator==: heats the air next to it, setting up a convection current round the room.', '==Freezer compartment at the top== of a fridge: cold air is denser and sinks.', '==Kettle element at the bottom==: hot water rises, so all the water is heated by convection.', '==Insulation== (cavity foam, loft wool, double glazing, feathers, fur) works by ==trapping air==, a poor conductor, which also cannot form convection currents.', '==Sea breeze== in the day: land heats faster, warm air above it rises, cooler air moves in from the sea.'] },
    { h: 'Experiments that come up', list: ['==Leslie cube==: a cube of hot water with different-coloured faces. An IR detector shows the ==matt black face emits most==, the shiny face least.', '==Ice at the bottom of a test tube==, water boiled at the top: the ice does not melt, showing ==water is a poor conductor==.', '==Purple crystal (potassium manganate(VII))== in water heated at one side: the colour traces the ==convection current==.', '==Rods with wax==: the wax on the ==copper== rod melts first, as copper is the best conductor.'] }
  ],
  mistakes: ['Saying “heat rises”. Say the ==hot fluid expands, becomes less dense and rises==.', 'Saying convection happens in solids. It is ==only in liquids and gases==.', 'Saying “cold travels in”. Energy moves from hot to cold; cold does not move.', 'Saying black “attracts” heat. Say ==black is a good absorber of infrared radiation==.', 'Forgetting the vacuum stops ==both== conduction and convection.'],
  diagrams: [
    { svg: svgConduction, cap: 'Conduction in a metal: vibrating particles plus fast-moving free electrons.' },
    { svg: svgConvection, cap: 'Convection current in a beaker heated at one side.' },
    { svg: svgFlask, cap: 'Vacuum flask. Every feature reduces one or more of the three transfers.' }
  ],
  worked: [
    { q: 'Explain why a metal spoon in hot tea feels hot much sooner than a plastic spoon.', prose: true,
      s: [['Point 1','Metals contain ==free electrons==.'],['Point 2','The electrons gain kinetic energy and ==move through the metal==, carrying energy quickly to the handle.'],['Point 3','Plastic has no free electrons, so energy passes only by ==vibrating particles==, which is slow.'],['Conclusion','Metal is a ==good conductor==; plastic is an ==insulator==.']] },
    { q: 'Explain how a radiator on one wall heats the whole room.', prose: true,
      s: [['Point 1','Air next to the radiator is heated and ==expands==.'],['Point 2','It becomes ==less dense== and ==rises==.'],['Point 3','Cooler, ==denser== air ==sinks== and moves towards the radiator.'],['Conclusion','A ==convection current== carries warm air around the room.']] },
    { q: 'Explain how a vacuum flask keeps a drink hot.', prose: true,
      s: [['Vacuum','There are ==no particles==, so there is ==no conduction or convection== across the gap.'],['Silvered walls','They ==reflect infrared==, which ==reduces radiation==.'],['Stopper','It is an ==insulator== and stops ==convection== (and evaporation) out of the top.'],['Support and case','Made of ==poor conductors== to reduce conduction.']] },
    { q: 'Why are houses in hot countries often painted white?', prose: true,
      s: [['Point 1','White is a ==poor absorber== and a ==good reflector== of ==infrared radiation==.'],['Point 2','Less energy from the Sun is ==absorbed== by the walls.'],['Conclusion','The inside of the house stays ==cooler==.']] }
  ],
  quiz: [
    { q: 'How does energy from the Sun reach the Earth?', o: ['conduction', 'convection', 'radiation', 'all three'], a: 2, w: 'Space is a ==vacuum==. Only ==radiation== needs no medium.' },
    { q: 'Convection can take place in…', o: ['solids only', 'liquids and gases', 'solids and liquids', 'a vacuum'], a: 1, w: 'Convection needs particles that can ==move from place to place==: only in ==fluids==.' },
    { q: 'Which surface is the best absorber of infrared radiation?', o: ['shiny silver', 'gloss white', 'dull black', 'shiny black'], a: 2, w: '==Dull (matt) black== is the best absorber and the best emitter.' },
    { q: 'Metals are good conductors mainly because they have…', o: ['free electrons', 'large particles', 'high density', 'shiny surfaces'], a: 0, w: '==Free (delocalised) electrons== move through the metal and carry energy quickly.' },
    { q: 'Warm air rises because it is…', o: ['lighter than heat', 'less dense', 'more dense', 'made of hot particles'], a: 1, w: 'Heated air ==expands==, becomes ==less dense== and rises.' },
    { q: 'Why is the freezer compartment at the TOP of a fridge?', o: ['Cold air rises', 'Cold air is denser and sinks', 'To save space', 'Radiation goes down'], a: 1, w: 'Cold air is ==denser== and ==sinks==, setting up a ==convection current== that cools the whole fridge.' },
    { q: 'Which is the poorest conductor of thermal energy?', o: ['copper', 'steel', 'glass', 'air'], a: 3, w: '==Air== (a gas): its particles are ==far apart==. This is why trapped air is used for insulation.' },
    { q: 'In a vacuum flask, the silvered surfaces reduce…', o: ['conduction', 'convection', 'radiation', 'evaporation'], a: 2, w: 'Shiny surfaces ==reflect infrared==, reducing ==radiation==.' },
    { q: 'A Leslie cube is filled with hot water. Which face gives the highest reading on an IR detector?', o: ['shiny silver', 'matt black', 'matt white', 'all the same'], a: 1, w: '==Matt black== is the ==best emitter==.' }
  ],
  exam: [
    { q: 'Explain, in terms of particles, how thermal energy is conducted along a metal rod that is heated at one end.', m: 3,
      p: ['Particles at the hot end gain energy and ==vibrate more==.', 'Vibrations are passed to ==neighbouring particles== (collisions).', '==Free electrons== gain kinetic energy and ==move along the rod==.', 'The electrons ==collide== with particles further along and transfer energy.'] },
    { q: 'The heating element of an electric kettle is at the bottom. Explain why.', m: 3,
      p: ['Water near the element is heated, ==expands== and becomes ==less dense==.', 'The hot water ==rises==.', 'Cooler, ==denser== water ==sinks== to the element.', 'A ==convection current== heats all of the water.'] },
    { q: 'A vacuum flask keeps soup hot. Explain how the vacuum, the silvered surfaces and the stopper each reduce energy loss.', m: 4,
      p: ['Vacuum: ==no particles== so ==no conduction==.', 'Vacuum: ==no convection== across the gap.', 'Silvered surfaces ==reflect infrared==, reducing ==radiation==.', 'Stopper is an ==insulator==: reduces ==convection== / conduction out of the top.'] },
    { q: 'Two identical cans, one dull black and one shiny silver, are filled with water at 80 °C. State which cools faster and explain why. Give one thing that must be kept the same for a fair test.', m: 3,
      p: ['The ==dull black== can cools faster.', 'Dull black is a ==better emitter== of ==infrared radiation==.', 'Fair test: same ==volume== of water / same ==starting temperature== / same surroundings.'] },
    { q: 'Birds fluff up their feathers on cold days. Suggest why this keeps them warm.', m: 2,
      p: ['Fluffed feathers ==trap more air==.', 'Air is a ==poor conductor (insulator)==, so less energy is lost.'] }
  ]
},

sound: {
  code: 'Ch 11', name: 'Sound',
  lede: 'A mix of facts and echo calculations. The most common trap: forgetting to halve the distance in echo questions.',
  learn: [
    { h: 'What sound is', list: ['Sound is produced by ==vibrating== objects.', 'Sound is a ==longitudinal wave==: particles vibrate ==parallel to the direction== the wave travels.', 'It is made of ==compressions== (particles close together, higher pressure) and ==rarefactions== (particles spread out, lower pressure).'] },
    { h: 'Sound needs a medium', list: ['Sound travels through ==solids, liquids and gases==.', 'It ==cannot travel through a vacuum==: there are no particles to pass on the vibrations.', '==Bell jar experiment==: as air is pumped out, the bell is still seen vibrating but the sound becomes ==fainter and fades==.'] },
    { h: 'Speed of sound', list: ['In air: about ==330–350 m/s== (use the value given in the question).', 'In water: about 1500 m/s. In steel: about 5000 m/s.', 'Fastest in ==solids==, then liquids, slowest in ==gases==.', 'Light (3 × 10⁸ m/s) is much faster, so we ==see lightning before we hear thunder==.'], f: 'speed = distance ÷ time   v = s ÷ t' },
    { h: 'Pitch and loudness', list: ['==Frequency== = number of vibrations (waves) ==per second==, in ==hertz (Hz)==.', 'Higher ==frequency== → higher ==pitch==.', 'Larger ==amplitude== → ==louder== sound.'], f: 'wave speed = frequency × wavelength   v = f × λ' },
    { h: 'Hearing and ultrasound', list: ['Human hearing range: ==20 Hz to 20 000 Hz== (20 kHz).', '==Ultrasound== = sound with frequency ==above 20 000 Hz==; humans cannot hear it.', 'Uses: ==sonar / echo sounding== (depth of sea), ==prenatal (baby) scanning==, finding ==cracks in metal==, cleaning.'] },
    { h: 'Echoes', list: ['An ==echo== is a ==reflected sound wave==. Hard, flat surfaces reflect best.', 'The sound goes ==there and back==, so:'], f: 'distance to wall = (speed × time) ÷ 2' },
    { h: 'Measuring the speed of sound in air', list: ['Measure a ==large distance== (e.g. 200 m) with a ==trundle wheel== or long tape.', 'One person makes a loud sound with a ==visible action== (bangs two blocks / fires a starting pistol).', 'The other ==starts the stopwatch on seeing== the action and ==stops it on hearing== the sound.', '==speed = distance ÷ time==.', '==Repeat and take an average==.', 'Echo method: stand about 50 m from a wall and clap; speed = ==2 × distance ÷ time==.'] }
  ],
  mistakes: ['Not ==halving== (or doubling) the distance in echo questions.', 'Mixing kHz and Hz: ==20 kHz = 20 000 Hz==.', 'Saying sound is transverse. It is ==longitudinal==.', 'Saying “pitch depends on amplitude”. Pitch ↔ ==frequency==; loudness ↔ ==amplitude==.', 'Saying “sound waves vibrate”. It is the ==particles== of the medium that vibrate.'],
  diagrams: [
    { svg: svgWave, cap: 'A sound wave: compressions (C) and rarefactions (R). Wavelength = distance from one compression to the next.' },
    { svg: svgScope, cap: 'Oscilloscope traces. Taller wave = larger amplitude = louder. More waves across the screen = higher frequency = higher pitch.' },
    { svg: svgSonar, cap: 'Sonar (echo sounding). The pulse travels to the seabed and back.' },
    { svg: svgSpeed, cap: 'Measuring the speed of sound with two people, a stopwatch and a measured distance.' }
  ],
  worked: [
    { q: 'A girl stands 170 m from a wall and claps. She hears the echo 1.0 s later. Calculate the speed of sound.',
      s: [['Total distance (there and back)','d = 2 × 170 = 340 m'],['Write the formula','v = d ÷ t'],['Substitute','v = 340 ÷ 1.0'],['Answer with unit','v = 340 m/s']] },
    { q: 'A ship sends a sound pulse to the seabed. The echo returns after 0.40 s. The speed of sound in water is 1500 m/s. Calculate the depth of the sea.',
      s: [['Write the formula','d = v × t'],['Total distance','d = 1500 × 0.40 = 600 m'],['Halve it (down and back)','depth = 600 ÷ 2'],['Answer with unit','depth = 300 m']] },
    { q: 'Thunder is heard 3.0 s after the lightning is seen. The speed of sound is 340 m/s. How far away is the storm?',
      s: [['Light arrives almost instantly','so the time is just for the sound'],['Write the formula','d = v × t'],['Substitute','d = 340 × 3.0'],['Answer with unit','d = 1020 m (about 1 km)']] },
    { q: 'A sound has a frequency of 680 Hz. The speed of sound is 340 m/s. Calculate the wavelength.',
      s: [['Write the formula','v = f × λ  so  λ = v ÷ f'],['Substitute','λ = 340 ÷ 680'],['Answer with unit','λ = 0.50 m']] },
    { q: 'On an oscilloscope, one complete wave covers 4 squares. The time-base is 1 ms per square. Calculate the frequency.',
      s: [['Time for one wave (period)','T = 4 × 1 ms = 4 ms = 0.004 s'],['Frequency = 1 ÷ period','f = 1 ÷ 0.004'],['Answer with unit','f = 250 Hz']] },
    { q: 'A dog whistle produces a sound of 25 kHz. Can a person hear it?',
      s: [['Convert units','25 kHz = 25 000 Hz'],['Compare with hearing range','25 000 Hz > 20 000 Hz'],['Conclusion','No. It is ULTRASOUND, above the human hearing range']] }
  ],
  drill: 'sound',
  quiz: [
    { q: 'Sound waves are…', o: ['transverse', 'longitudinal', 'electromagnetic', 'stationary'], a: 1, w: 'Particles vibrate ==parallel== to the direction of travel: ==longitudinal==.' },
    { q: 'Sound cannot travel through…', o: ['water', 'steel', 'a vacuum', 'air'], a: 2, w: 'Sound needs a ==medium==; a vacuum has ==no particles==.' },
    { q: 'The range of human hearing is…', o: ['2 Hz – 2000 Hz', '20 Hz – 20 000 Hz', '200 Hz – 200 000 Hz', '20 kHz – 200 kHz'], a: 1, w: '==20 Hz to 20 000 Hz==.' },
    { q: 'A louder sound has a larger…', o: ['frequency', 'wavelength', 'amplitude', 'speed'], a: 2, w: 'Loudness ↔ ==amplitude==.' },
    { q: 'A higher-pitched sound has a higher…', o: ['amplitude', 'frequency', 'speed', 'volume'], a: 1, w: 'Pitch ↔ ==frequency==.' },
    { q: 'Sound travels fastest through…', o: ['air', 'water', 'steel', 'a vacuum'], a: 2, w: 'Fastest in ==solids==: particles are close together.' },
    { q: 'Ultrasound has a frequency…', o: ['below 20 Hz', 'between 20 Hz and 20 kHz', 'above 20 kHz', 'of exactly 20 kHz'], a: 2, w: 'Ultrasound is ==above 20 000 Hz==.' },
    { q: 'A boy is 330 m from a cliff. He hears his echo 2.0 s after shouting. The speed of sound is…', o: ['165 m/s', '330 m/s', '660 m/s', '1320 m/s'], a: 1, w: 'Total distance = 2 × 330 = 660 m. v = 660 ÷ 2.0 = ==330 m/s==.' },
    { q: 'In a sound wave, a region where particles are squashed close together is a…', o: ['rarefaction', 'compression', 'crest', 'trough'], a: 1, w: '==Compression==. Spread-out regions are rarefactions. Crest and trough are for transverse waves.' }
  ],
  exam: [
    { q: 'Describe an experiment to measure the speed of sound in air. Include the measurements taken and how the speed is calculated.', m: 4,
      p: ['Measure a ==large distance== (e.g. 100 m or more) with a ==trundle wheel== / tape.', 'One person makes a loud sound with a ==visible action== (bangs blocks / starting pistol).', 'Other person ==starts stopwatch on seeing==, ==stops on hearing==.', '==speed = distance ÷ time==.', '==Repeat and average==.'] },
    { q: 'A ship uses sonar. A pulse returns 0.60 s after it is sent. Sound travels at 1500 m/s in water. Calculate the depth of the sea.', m: 3,
      p: ['==d = v × t== = 1500 × 0.60 = 900 m', 'Divide by 2: sound travels ==down and back==', 'Depth = ==450 m=='] },
    { q: 'An electric bell rings inside a glass jar. Air is pumped out of the jar. Describe and explain what is heard.', m: 3,
      p: ['The sound becomes ==quieter / fades== and may stop.', 'The bell can ==still be seen vibrating==.', 'Sound ==needs a medium==; it ==cannot travel through a vacuum==.'] },
    { q: 'A note has a frequency of 500 Hz and a wavelength of 0.68 m. Calculate the speed of sound.', m: 3,
      p: ['==v = f × λ==', '= 500 × 0.68', '= ==340 m/s=='] },
    { q: 'Sound B has the same amplitude as sound A but twice the frequency. Compare how the two sounds are heard.', m: 2,
      p: ['B has a ==higher pitch== (higher frequency).', 'Both are ==equally loud== (same amplitude).'] },
    { q: 'What is ultrasound? Give one use of ultrasound.', m: 2,
      p: ['Sound with frequency ==above 20 000 Hz== (above the human hearing range).', 'Use: ==sonar / prenatal scanning / crack detection== (any one).'] },
    { q: 'During a storm, lightning is seen before the thunder is heard. Explain why.', m: 2,
      p: ['==Light travels much faster== than sound.', 'Light ≈ 3 × 10⁸ m/s; sound ≈ 340 m/s.'] }
  ]
},
motion: {
  code: 'Topic 1', name: 'Motion',
  lede: 'Speed, acceleration and the two graphs. Learn what the gradient and the area mean on each graph.',
  learn: [
    { h: 'Speed, velocity and acceleration', list: ['==Speed== = ==distance ÷ time==. ==Average speed== = ==total distance ÷ total time==.', '==Velocity== is speed ==in a given direction==.', '==Acceleration== = ==change in velocity ÷ time taken== = (v − u) ÷ t. Unit: ==m/s²==.', 'A negative acceleration means the object is ==slowing down== (deceleration).'], f: 'a = (v − u) ÷ t     speed = distance ÷ time' },
    { h: 'Distance–time graphs', list: ['The ==gradient== is the ==speed==.', 'A ==horizontal== line means ==stationary==.', 'A ==straight sloping== line means ==constant speed==. ==Steeper== means ==faster==.', 'A ==curve== means the speed is ==changing==.'] },
    { h: 'Speed–time graphs', list: ['The ==gradient== is the ==acceleration==.', 'A ==horizontal== line means ==constant speed== (zero acceleration).', 'A line sloping ==down== means ==deceleration==.', 'The ==area under the graph== is the ==distance travelled==. Split it into rectangles and triangles.'] },
    { h: 'Free fall', list: ['Near the Earth’s surface all falling objects accelerate at about ==10 m/s²== (g = 10 N/kg).', 'Air resistance increases with speed. When it equals the weight, the resultant force is ==zero== and the object falls at a ==constant (terminal) velocity==.'] }
  ],
  mistakes: ['Mixing up the ==two graphs==: a flat line is ==stationary== on a distance–time graph but ==constant speed== on a speed–time graph.', 'Using the ==wrong units== (km/h with seconds). Convert first.', 'Forgetting the ==½== when finding the area of a triangle.', 'Reading the ==gradient== as the area.', 'Writing deceleration as a ==positive== number in v = u + at.'],
  diagrams: [
    { svg: svgDT, cap: 'Distance–time graph: ==gradient = speed==. Flat = ==stationary==.' },
    { svg: svgST, cap: 'Speed–time graph: ==gradient = acceleration==, ==area = distance==.' }
  ],
  worked: [
    W('A cyclist travels 600 m in 40 s. Calculate her average speed.', '==Speed = distance ÷ time==. Keep the units matched: metres and seconds give m/s.', 'Always write the unit.', 'speed = distance ÷ time',
      [['Write the formula', 'speed = distance ÷ time', ''], ['Substitute', 'speed = 600 ÷ 40', 'Distance in metres, time in seconds.'], ['Answer with unit', 'speed = 15 m/s', '600 ÷ 40 = 15.']],
      [['Distance', '600 m', -1], ['Time', '40 s', -1], ['Speed', '15 m/s', 2]]),
    W('A car accelerates from 5 m/s to 25 m/s in 8 s. Calculate its acceleration.', '==Acceleration = change in speed ÷ time==. The change is the final speed minus the starting speed.', 'The unit is m/s², metres per second per second.', 'a = (v − u) ÷ t',
      [['Write the formula', 'a = (v − u) ÷ t', 'v is the final speed and u the starting speed.'], ['Find the change in speed', 'v − u = 25 − 5 = 20 m/s', ''], ['Substitute', 'a = 20 ÷ 8', ''], ['Answer with unit', 'a = 2.5 m/s²', '']],
      [['u, v, t', '5, 25, 8 s', -1], ['Change', '20 m/s', 1], ['a', '2.5 m/s²', 3]]),
    W('A distance–time graph shows: 0–10 s the object moves 20 m; 10–20 s it does not move; 20–30 s it moves a further 40 m. Find its speed in each part and its average speed.', 'On a ==distance–time== graph the ==gradient is the speed==. A flat line means stationary.', 'Average speed uses the ==whole== distance and ==whole== time.', 'speed = gradient',
      [['First 10 s', '20 ÷ 10 = 2 m/s', 'Distance moved ÷ time taken.'], ['Next 10 s', 'stationary, speed 0', 'Flat line: the distance does not change.'], ['Last 10 s', '40 ÷ 10 = 4 m/s', 'A steeper line, so faster.'], ['Average speed', 'total distance 60 m ÷ total time 30 s = 2 m/s', 'Include the time when it was stationary.']],
      [['Part 1', '2 m/s', 0], ['Part 2', '0 (stationary)', 1], ['Part 3', '4 m/s', 2], ['Average', '60 ÷ 30 = 2 m/s', 3]]),
    W('A train’s speed rises steadily from 0 to 20 m/s in 10 s, stays at 20 m/s for 30 s, then falls steadily to 0 in 20 s. Find the total distance.', 'On a ==speed–time== graph, ==distance = area under the graph==. Split it into a triangle, a rectangle and a triangle.', 'Triangles need the ==½==.', 'distance = area',
      [['First triangle', '½ × 10 × 20 = 100 m', 'Speeding up.'], ['Rectangle', '30 × 20 = 600 m', 'Constant speed.'], ['Second triangle', '½ × 20 × 20 = 200 m', 'Slowing down.'], ['Total distance', '100 + 600 + 200 = 900 m', 'Total time is 60 s, so average speed = 15 m/s.']],
      [['Triangle 1', '100 m', 0], ['Rectangle', '600 m', 1], ['Triangle 2', '200 m', 2], ['Total', '900 m', 3]]),
    W('A stone is dropped from rest. Taking g = 10 m/s², find its speed after 3 s and the distance it falls.', 'Free fall is ==acceleration of 10 m/s²==. Start from rest, so u = 0.', 'Use the graph area for the distance: a triangle.', 'v = u + at',
      [['Write the formula', 'v = u + at', ''], ['Substitute', 'v = 0 + 10 × 3', 'u = 0 because it starts from rest.'], ['Speed', 'v = 30 m/s', ''], ['Distance = area of the triangle', '½ × 3 × 30 = 45 m', 'Speed–time graph: a straight line from 0 to 30 m/s over 3 s.']],
      [['Speed after 3 s', '30 m/s', 2], ['Area', '½ × 3 × 30', 3], ['Distance', '45 m', 3]]),
    W('A cyclist slows from 12 m/s to rest in 4 s. Find the acceleration.', 'Slowing down gives a ==negative acceleration== (deceleration).', 'The negative sign is the direction of the change.', 'a = (v − u) ÷ t',
      [['Write the formula', 'a = (v − u) ÷ t', ''], ['Substitute', 'a = (0 − 12) ÷ 4', 'It ends at rest, so v = 0.'], ['Answer with unit', 'a = −3 m/s²', 'The deceleration is 3 m/s².']],
      [['u, v, t', '12, 0, 4 s', -1], ['v − u', '−12', 1], ['a', '−3 m/s²', 2]])
  ],
  drill: 'motion',
  quiz: [
    { q: 'The gradient of a distance–time graph gives…', o: ['acceleration', 'speed', 'distance', 'time'], a: 1, w: '==Speed==.' },
    { q: 'A horizontal line on a distance–time graph means the object is…', o: ['accelerating', 'moving at constant speed', 'stationary', 'slowing down'], a: 2, w: '==Stationary==. The distance is not changing.' },

function wkBoard(e, k){
  const rows = e.r.map(([lab, val, at]) => { const on = at <= k;
    return `<tr class="${at === k && k >= 0 ? 'cur' : ''}"><th>${lab}</th><td class="${on ? (at >= 0 ? 'fill' : '') : 'q'}">${on ? fmt(val) : '?'}</td></tr>`; }).join('');
  return `<table class="wb">${rows}</table>${e.f ? `<p class="bnote">${fmt(e.f)}</p>` : ''}`;
}
function enhance(ENH){
  for (const key in ENH) CH[key].worked.forEach((w, i) => { const e = ENH[key][i];
    if (!e || e.why.length !== w.s.length) throw new Error('worked note mismatch: ' + key + ' ' + i);
    w.intro = e.intro; w.tip = e.tip; w.board0 = () => wkBoard(e, -1);
    w.s.forEach((st, j) => { st[2] = e.why[j]; st[3] = () => wkBoard(e, j); }); });
}

}

const fmtTime = s => String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0');

/* ---------- binding ---------- */
let quizScore = 0;
function bindView(){
  const v = document.getElementById('view');
  quizScore = 0;
  if (cur !== 'start' && cur !== 'mock' && sub === 'drill') newDrill();
  if (cur === 'mock') {
    document.getElementById('tgo').onclick = () => {

        if (c) { c.textContent = left ? fmtTime(left) : 'Time up'; c.classList.toggle('low', left < 300); }
        if (!left) { clearInterval(timer); timer = null; } }, 1000);
    };

    document.getElementById('mnew').onclick = () => { clearInterval(timer); timer = null; Object.keys(store.ticks).forEach(k => { if (k.includes('mock-')) delete store.ticks[k]; }); drawMock(); render(); };
    document.getElementById('mclear').onclick = () => { Object.keys(store.ticks).forEach(k => { if (k.includes('mock-')) delete store.ticks[k]; }); save(); render(); };

document.getElementById('view').addEventListener('click', e => {
  const t = e.target;
  const st = t.closest('[data-sub]'); if (st) { sub = st.dataset.sub; render(); return; }

  if (wk) {
    const items = [...wk.querySelectorAll('.steps li')];
    if (t.closest('[data-next]')) { const n = items.find(li => li.hidden); if (n) n.hidden = false; }
    if (t.closest('[data-all]')) items.forEach(li => li.hidden = false);
    if (t.closest('[data-hide]')) items.forEach(li => li.hidden = true);
    const nb = wk.querySelector('[data-next]'); nb.disabled = !items.some(li => li.hidden); const tp = wk.querySelector('.tip'); if (tp) tp.hidden = items.some(li => li.hidden); updateBoard(wk, items);
    return;
  }

  const qz = t.closest('[data-quiz]');
  if (qz && t.closest('[data-o]') && !qz.dataset.done) {
    const q = CH[cur].quiz[+qz.dataset.quiz]; const j = +t.closest('[data-o]').dataset.o;
    qz.dataset.done = '1';

  const ex = t.closest('[data-exam]');

      const sc = document.getElementById('exscore'); if (sc) sc.textContent = g + '/' + tt;
    }
  }

    const raw = document.getElementById('dans').value.replace(',', '.').trim();
    const x = parseFloat(raw); if (isNaN(x)) { document.getElementById('dfb').innerHTML = `<div class="fb no"><span class="verdict">Type a number first.</span></div>`; return; }
    const ok = Math.abs(x - drillCur.ans) <= Math.abs(drillCur.ans)*0.02 + 1e-9;
    streak = ok ? streak + 1 : 0;
    if (streak > (store.drill[cur] || 0)) { store.drill[cur] = streak; save(); }
    document.getElementById('dfb').innerHTML = `<div class="fb ${ok?'ok':'no'}"><span class="verdict">${ok ? 'Correct!' : 'Not quite. The answer is ' + num(drillCur.ans) + ' ' + drillCur.unit + '.'}</span>
      <ol class="steps">${drillCur.s.map((s,j)=>`<li ${j===drillCur.s.length-1?'class="final"':''}><span class="sl">${s[0]}</span><span class="st">${s[1]}</span></li>`).join('')}</ol>
      <div class="row"><button class="btn primary" type="button" id="dnext">Next question</button></div></div>`;
    document.getElementById('dnext').onclick = newDrill;
    box.querySelector('.stat').textContent = `streak ${streak} · best ${store.drill[cur] || 0}`;
  };
  document.getElementById('dskip').onclick = () => { streak = 0; newDrill(); };
}

renderTabs(); render();
</script>

</body>
</html>
